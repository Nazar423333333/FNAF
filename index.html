<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
    font-family:inherit;
}

/* =========================
   MENU
========================= */

#menu,
#nightMenu{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(circle,#202020,#050505 65%,#000);
}

#menu h1{
    font-size:clamp(44px,7vw,95px);
    letter-spacing:4px;

    text-shadow:
        0 0 8px white,
        0 0 25px #d71920,
        0 0 60px #d71920;
}

#menu p{
    margin-top:15px;
    color:#aaa;
    font-size:20px;
}

.menuBtn{
    margin-top:25px;
    min-width:260px;

    padding:16px 28px;

    border:1px solid #555;
    border-radius:12px;

    background:#111;
    color:white;

    font-size:18px;
    font-weight:bold;

    transition:.2s;
}

.menuBtn:hover{
    transform:scale(1.04);
    background:#292929;
}

#playBtn{
    background:#086cff;
}

#playBtn:hover{
    background:#2580ff;
}

/* =========================
   NIGHT SELECT
========================= */

#nightMenu h2{
    font-size:46px;
    margin-bottom:30px;
}

.nightButtons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

.nightBtn{
    width:115px;
    height:90px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:white;

    font-size:17px;
    font-weight:bold;
}

.nightBtn:hover:not(:disabled){
    background:#086cff;
}

.nightBtn.locked{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================
   GAME
========================= */

#game{
    position:fixed;
    inset:0;

    overflow:hidden;

    background:#050505;
}

/* =========================
   TOP BAR
========================= */

#topbar{
    position:absolute;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:120;

    width:min(900px,94%);

    padding:14px 22px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,.88);

    border:1px solid #444;
    border-radius:14px;

    box-shadow:0 0 30px black;

    font-size:19px;
    font-weight:bold;
}

/* =========================
   OFFICE
========================= */

#office{
    position:absolute;
    inset:0;

    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.95) 0%,
            rgba(0,0,0,.45) 12%,
            transparent 23%,
            transparent 77%,
            rgba(0,0,0,.45) 88%,
            rgba(0,0,0,.95) 100%
        ),
        radial-gradient(
            circle at 50% 58%,
            rgba(95,105,115,.24),
            transparent 34%
        ),
        linear-gradient(
            180deg,
            #06090b,
            #101518 55%,
            #040506
        );
}

#office::before{
    content:"";

    position:absolute;

    left:50%;
    bottom:-12%;

    transform:translateX(-50%);

    width:62%;
    height:37%;

    z-index:4;

    border-radius:50% 50% 0 0;

    background:
        linear-gradient(
            180deg,
            #2c3032,
            #111315 32%,
            #050606
        );

    border-top:3px solid #34383b;

    box-shadow:
        0 -15px 60px black,
        inset 0 10px 25px rgba(255,255,255,.04);
}

#office::after{
    content:"АТБ • НІЧНА ОХОРОНА";

    position:absolute;

    left:50%;
    top:18%;

    transform:translateX(-50%);

    z-index:15;

    padding:9px 24px;

    border:1px solid #30363a;
    border-radius:7px;

    background:#080a0b;
    color:#8b969d;

    font-size:14px;
    letter-spacing:5px;

    box-shadow:0 0 30px black;
}

/* =========================
   TITLE
========================= */

#title{
    position:absolute;

    z-index:18;

    top:36%;
    left:50%;

    transform:translate(-50%,-50%);

    width:58%;

    text-align:center;

    pointer-events:none;
}

#title h1{
    font-size:clamp(34px,4.5vw,68px);

    line-height:1.05;
    letter-spacing:2px;

    white-space:nowrap;

    text-shadow:
        0 0 8px white,
        0 0 25px #d71920,
        0 0 55px rgba(215,25,32,.55);
}

#status{
    margin-top:26px;

    color:#b5bcc0;

    font-size:18px;
}

/* =========================
   DOOR FRAME
========================= */

.doorFrame{
    position:absolute;

    top:155px;

    width:15.5%;
    height:calc(100% - 155px);

    z-index:22;

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            #151515,
            #060606
        );

    border:5px solid #303030;

    box-shadow:
        inset 0 0 45px black,
        0 0 30px black;
}

#leftDoorFrame{
    left:0;
    border-right:7px solid #444;
}

#rightDoorFrame{
    right:0;
    border-left:7px solid #444;
}

/* =========================
   DOORS
========================= */

.door{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:30;

    background:
        repeating-linear-gradient(
            0deg,
            #151515 0px,
            #151515 32px,
            #444 33px,
            #777 36px,
            #252525 40px
        );

    border:3px solid #555;

    box-shadow:
        inset 0 0 30px black,
        0 0 40px black;

    transform:translateY(-102%);

    transition:transform .36s ease;
}

.door::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 48px,
            rgba(255,255,255,.07) 49px 51px
        );
}

.door::after{
    content:"";

    position:absolute;

    left:50%;
    top:8%;

    width:60%;
    height:5px;

    transform:translateX(-50%);

    background:#858585;

    box-shadow:
        0 70px #858585,
        0 140px #858585,
        0 210px #858585,
        0 280px #858585,
        0 350px #858585;
}

.door.closed{
    transform:translateY(0);
}

/* =========================
   LIGHT
========================= */

.lightEffect{
    position:absolute;

    top:0;

    width:40%;
    height:100%;

    z-index:14;

    opacity:0;

    pointer-events:none;

    transition:opacity .15s;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at left center,
            rgba(255,250,200,.95),
            rgba(255,220,70,.30) 35%,
            rgba(255,200,40,.08) 58%,
            transparent 80%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at right center,
            rgba(255,250,200,.95),
            rgba(255,220,70,.30) 35%,
            rgba(255,200,40,.08) 58%,
            transparent 80%
        );
}

.lightEffect.on{
    opacity:1;
}

/* =========================
   DOOR ENEMIES
========================= */

.doorEnemy{
    position:absolute;

    top:53%;

    z-index:26;

    font-size:100px;

    opacity:0;

    pointer-events:none;

    transform:
        translateY(-50%)
        scale(.7);

    transition:
        opacity .12s,
        transform .12s;

    filter:
        drop-shadow(0 0 15px red)
        drop-shadow(0 0 35px black);
}

#leftDoorEnemy{
    left:5%;
}

#rightDoorEnemy{
    right:5%;
}

.doorEnemy.visible{
    opacity:1;

    transform:
        translateY(-50%)
        scale(1);
}

/* =========================
   CONTROLS
========================= */

.sideControls{
    position:absolute;

    top:48%;

    z-index:100;

    display:flex;
    flex-direction:column;

    gap:12px;
}

#leftControls{
    left:17%;
}

#rightControls{
    right:17%;
}

.controlBtn{
    width:180px;

    padding:15px;

    border:1px solid #555;
    border-radius:12px;

    background:rgba(15,15,15,.95);

    color:white;

    font-weight:bold;
    font-size:16px;

    box-shadow:0 0 20px black;

    transition:.15s;
}

.controlBtn:hover{
    background:#303030;
}

.controlBtn.lightOn{
    background:#ffd84a;
    color:#111;

    border-color:white;

    box-shadow:
        0 0 15px white,
        0 0 35px #ffd84a;
}

.controlBtn.doorOn{
    background:#b51414;

    border-color:#ff5555;

    box-shadow:
        0 0 15px red,
        0 0 35px rgba(255,0,0,.65);
}

/* =========================
   CAMERA BUTTON
========================= */

#cameraBtn{
    position:absolute;

    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    z-index:100;

    padding:18px 36px;

    border:0;
    border-radius:14px;

    background:#086cff;

    color:white;

    font-size:18px;
    font-weight:bold;

    box-shadow:
        0 0 25px rgba(0,100,255,.55);

    transition:.2s;
}

#cameraBtn:hover{
    background:#2780ff;
    transform:translateX(-50%) scale(1.04);
}

/* =========================
   USAGE
========================= */

#usage{
    position:absolute;

    right:25px;
    top:90px;

    z-index:110;

    padding:10px 13px;

    background:rgba(0,0,0,.75);

    border:1px solid #333;
    border-radius:8px;
}

.usageBar{
    display:inline-block;

    width:17px;
    height:11px;

    margin-left:3px;

    border:1px solid #555;

    background:#111;
}

.usageBar.on{
    background:#63ff4d;

    box-shadow:0 0 8px #63ff4d;
}

/* =========================
   SOUND
========================= */

#soundBtn{
    position:absolute;

    top:88px;
    left:25px;

    z-index:110;

    padding:10px 14px;

    border:1px solid #555;
    border-radius:9px;

    background:rgba(0,0,0,.75);

    color:white;

    font-weight:bold;
}

/* =========================
   CAMERA PANEL
========================= */

#cameraPanel{
    position:absolute;

    inset:0;

    z-index:200;

    padding:20px;

    background:#020202;
}

.cameraHeader{
    height:65px;

    display:flex;

    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid #333;
}

.cameraHeader h2{
    letter-spacing:2px;
}

#closeCameraBtn{
    padding:12px 18px;

    border:0;
    border-radius:10px;

    background:#a00;

    color:white;

    font-weight:bold;
}

/* =========================
   CAMERA VIEW
========================= */

#cameraView{
    position:relative;

    height:calc(100vh - 105px);

    margin-top:14px;

    overflow:hidden;

    border:3px solid #333;
    border-radius:10px;

    background:
        radial-gradient(
            circle at center,
            #3a3d3f,
            #111 58%,
            #020202
        );
}

#cameraView::before{
    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:14;

    background:
        linear-gradient(
            rgba(255,255,255,.025),
            rgba(0,0,0,.35)
        );
}

#cameraView::after{
    content:"";

    position:absolute;

    inset:0;

    z-index:15;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.05) 4px
        );

    animation:cameraNoise .15s infinite;
}

@keyframes cameraNoise{
    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(2px);
    }

    100%{
        transform:translateY(-1px);
    }
}

#cameraScene{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding-bottom:120px;

    color:#aeb5b9;

    opacity:.42;

    font-size:clamp(24px,4vw,55px);

    letter-spacing:8px;

    text-align:center;
}

#cameraRoomIcon{
    position:absolute;

    left:50%;
    top:43%;

    transform:translate(-50%,-50%);

    font-size:155px;

    opacity:.2;
}

/* =========================
   CAMERA ENEMIES
========================= */

.enemy{
    position:absolute;

    top:47%;

    z-index:10;

    font-size:130px;

    opacity:0;

    transition:
        opacity .15s,
        transform .15s;

    filter:
        drop-shadow(0 0 25px red);
}

.enemy.visible{
    opacity:1;
}

#enemy1{
    left:22%;
}

#enemy2{
    right:22%;
}

#enemy3{
    left:50%;

    transform:translateX(-50%);
}

/* =========================
   CAMERA INFO
========================= */

#cameraInfo{
    position:absolute;

    left:25px;
    bottom:25px;

    z-index:30;

    min-width:280px;

    padding:15px;

    border:1px solid #333;
    border-radius:10px;

    background:rgba(0,0,0,.78);
}

#cameraInfo h2{
    font-size:26px;
}

#cameraInfo p{
    margin-top:8px;
    color:#aaa;
}

/* =========================
   CAMERA MAP
========================= */

#cameraMap{
    position:absolute;

    right:25px;
    bottom:25px;

    z-index:30;

    width:290px;
    height:230px;

    background:rgba(0,0,0,.9);

    border:1px solid #555;
    border-radius:12px;

    box-shadow:0 0 30px black;
}

.camBtn{
    position:absolute;

    width:78px;

    padding:9px;

    border:1px solid #666;
    border-radius:7px;

    background:#151515;

    color:white;

    font-weight:bold;
}

.camBtn:hover{
    background:#333;
}

.camBtn.active{
    background:#086cff;

    box-shadow:
        0 0 15px #086cff;
}

.camBtn[data-cam="0"]{
    top:25px;
    left:106px;
}

.camBtn[data-cam="1"]{
    top:78px;
    left:20px;
}

.camBtn[data-cam="2"]{
    top:78px;
    right:20px;
}

.camBtn[data-cam="3"]{
    top:132px;
    left:20px;
}

.camBtn[data-cam="4"]{
    top:132px;
    right:20px;
}

.camBtn[data-cam="5"]{
    bottom:15px;
    left:106px;
}

/* =========================
   WARNING
========================= */

#warning{
    position:absolute;

    inset:0;

    z-index:400;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    background:rgba(90,0,0,.95);

    animation:
        warningFlash .15s infinite;
}

#warningIcon{
    font-size:170px;
}

#warning h2{
    margin-top:20px;

    font-size:50px;
}

@keyframes warningFlash{
    50%{
        background:#000;
    }
}

/* =========================
   JUMPSCARE
========================= */

#jumpscare{
    position:fixed;

    inset:0;

    z-index:99999;

    display:none;

    align-items:center;
    justify-content:center;
    flex-direction:column;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #690000 0%,
            #1a0000 45%,
            #000 85%
        );
}

#jumpscare.active{
    display:flex;

    animation:
        scareFlash .065s infinite,
        scareShake .055s infinite;
}

#jumpscareFace{
    font-size:min(53vw,520px);

    line-height:1;

    filter:
        drop-shadow(0 0 30px red)
        drop-shadow(0 0 65px white);

    animation:
        scareZoom .55s forwards;
}

#jumpscareText{
    position:absolute;

    bottom:7%;

    font-size:clamp(35px,7vw,95px);

    font-weight:900;

    color:white;

    letter-spacing:8px;

    text-shadow:
        0 0 15px red,
        0 0 40px red;
}

@keyframes scareZoom{
    0%{
        transform:
            scale(.1)
            rotate(-10deg);
    }

    35%{
        transform:
            scale(1.55)
            rotate(8deg);
    }

    55%{
        transform:
            scale(.9)
            rotate(-5deg);
    }

    75%{
        transform:
            scale(1.4)
            rotate(5deg);
    }

    100%{
        transform:
            scale(1.15)
            rotate(0deg);
    }
}

@keyframes scareShake{
    0%{
        transform:translate(0,0);
    }

    25%{
        transform:translate(-14px,7px);
    }

    50%{
        transform:translate(12px,-8px);
    }

    75%{
        transform:translate(-8px,-6px);
    }

    100%{
        transform:translate(0,0);
    }
}

@keyframes scareFlash{
    0%{
        filter:brightness(.8);
    }

    50%{
        filter:brightness(2.5);
    }

    100%{
        filter:brightness(.5);
    }
}

/* =========================
   END SCREEN
========================= */

#endScreen{
    position:absolute;

    inset:0;

    z-index:500;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    background:#000;

    text-align:center;
}

#endTitle{
    font-size:clamp(60px,10vw,140px);

    text-shadow:
        0 0 20px red,
        0 0 50px red;
}

#endText{
    margin-top:20px;

    color:#aaa;

    font-size:21px;
}

.endButtons{
    display:flex;

    gap:12px;

    margin-top:30px;
}

.endBtn{
    padding:16px 25px;

    border:0;
    border-radius:10px;

    background:#086cff;

    color:white;

    font-weight:bold;
    font-size:16px;
}

.endBtn.gray{
    background:#222;

    border:1px solid #555;
}

/* =========================
   MOBILE
========================= */

@media(max-width:1000px){

    .doorFrame{
        width:18%;
    }

    #leftControls{
        left:19%;
    }

    #rightControls{
        right:19%;
    }

    .controlBtn{
        width:145px;
        padding:11px;
        font-size:13px;
    }

    #title{
        width:58%;
    }

    #title h1{
        white-space:normal;
        font-size:clamp(30px,5vw,55px);
    }
}

@media(max-width:650px){

    .doorFrame{
        width:22%;
    }

    #leftControls{
        left:23%;
    }

    #rightControls{
        right:23%;
    }

    .controlBtn{
        width:105px;
        padding:9px;
        font-size:10px;
    }

    #topbar{
        font-size:12px;
    }

    #usage{
        right:6px;
    }

    #soundBtn{
        left:6px;
    }

    #cameraMap{
        transform:scale(.8);
        transform-origin:right bottom;
    }
}
</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<section id="menu">

    <h1>
        П'ЯТЬ НОЧЕЙ В АТБ
    </h1>

    <p>
        Переживи п'ять нічних змін
    </p>

    <button
        id="playBtn"
        class="menuBtn"
    >
        ▶ ГРАТИ
    </button>

    <button
        id="resetProgressBtn"
        class="menuBtn"
    >
        ♻ СКИНУТИ ПРОГРЕС
    </button>

</section>

<!-- =========================
     NIGHT SELECT
========================= -->

<section
    id="nightMenu"
    class="hidden"
>

    <h2>
        ОБЕРИ НІЧ
    </h2>

    <div class="nightButtons">

        <button
            class="nightBtn"
            data-night="1"
        >
            🌙 Ніч 1
        </button>

        <button
            class="nightBtn"
            data-night="2"
        >
            🌙 Ніч 2
        </button>

        <button
            class="nightBtn"
            data-night="3"
        >
            🌙 Ніч 3
        </button>

        <button
            class="nightBtn"
            data-night="4"
        >
            🌙 Ніч 4
        </button>

        <button
            class="nightBtn"
            data-night="5"
        >
            🌙 Ніч 5
        </button>

    </div>

    <button
        id="backBtn"
        class="menuBtn"
    >
        ← НАЗАД
    </button>

</section>

<!-- =========================
     GAME
========================= -->

<section
    id="game"
    class="hidden"
>

    <div id="topbar">

        <div>
            🌙 Ніч:
            <span id="nightLabel">1</span>
        </div>

        <div>
            🕛
            <span id="timeLabel">12 AM</span>
        </div>

        <div>
            ⚡
            <span id="powerLabel">100</span>%
        </div>

    </div>

    <button id="soundBtn">
        🔊 ЗВУК
    </button>

    <div id="usage">

        Використання:

        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>

    </div>

    <!-- OFFICE -->

    <main id="office">

        <div
            id="leftLightEffect"
            class="lightEffect"
        ></div>

        <div
            id="rightLightEffect"
            class="lightEffect"
        ></div>

        <div
            id="leftDoorEnemy"
            class="doorEnemy"
        >
            👀
        </div>

        <div
            id="rightDoorEnemy"
            class="doorEnemy"
        >
            🐺
        </div>

        <!-- LEFT DOOR -->

        <div
            id="leftDoorFrame"
            class="doorFrame"
        >

            <div
                id="leftDoor"
                class="door"

function getAudioContext(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        audioContext =
            new AudioCtx();
    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }

    return audioContext;
}


function beep(
    frequency = 400,
    duration = 100,
    volume = .08,
    type = "square"
){

    if(!soundEnabled){
        return;
    }

    try{

        const ctx =
            getAudioContext();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type =
            type;

        oscillator.frequency.setValueAtTime(
            frequency,
            ctx.currentTime
        );

        gain.gain.setValueAtTime(
            volume,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime +
            duration / 1000
        );

        oscillator.connect(
            gain
        );

        gain.connect(
            ctx.destination
        );

        oscillator.start();

        oscillator.stop(
            ctx.currentTime +
            duration / 1000
        );

    }catch(error){

        console.log(
            "Sound error:",
            error
        );
    }
}

        oscillator.type =

        oscillator.frequency.setValueAtTime(

        oscillator.frequency.exponentialRampToValueAtTime(
            850,

        );

        );

}


/* =========================
   CAMERA 2.0
========================= */

function renderCamera(){

    cameraTitle.textContent =
        cameraNames[
            selectedCamera
        ];


    cameraRoomIcon.textContent =
        cameraIcons[
            selectedCamera
        ];


    cameraScene.textContent =
        cameraScenes[
            selectedCamera
        ];


    enemy1El.classList.remove(
        "visible"
    );


    enemy2El.classList.remove(
        "visible"
    );


    enemy3El.classList.remove(
        "visible"
    );


    let amount =
        0;


    if(
        enemy1Position() ===
        selectedCamera
    ){

        enemy1El.classList.add(
            "visible"
        );

        amount++;
    }


    if(
        enemy2Position() ===
        selectedCamera
    ){

        enemy2El.classList.add(
            "visible"
        );

        amount++;
    }


    if(
        enemy3Position() ===
        selectedCamera
    ){

        enemy3El.classList.add(
            "visible"
        );

        amount++;
    }


    if(
        amount === 0
    ){

        cameraText.textContent =
            "Нікого не видно...";

    }else if(
        amount === 1
    ){

        cameraText.textContent =
            "⚠️ ВОРОГ НА КАМЕРІ!";

    }else if(
        amount === 2
    ){

        cameraText.textContent =
            "🚨 ДВА ВОРОГИ НА КАМЕРІ!";

    }else{

        cameraText.textContent =
            "🚨 ВСІ ВОРОГИ ТУТ!";
    }
}


/* =========================
   MOVE ENEMIES
========================= */

function moveEnemies(){

    if(!running){
        return;
    }


    const chance =
        .20 +
        currentNight *
        .055;


    if(
        Math.random() <
        chance &&

        enemy1Step <
        enemy1Route.length - 1
    ){

        enemy1Step++;
    }


    if(
        Math.random() <
        chance &&

        enemy2Step <
        enemy2Route.length - 1
    ){

        enemy2Step++;
    }


    if(
        Math.random() <
        chance * .82 &&

        enemy3Step <
        enemy3Route.length - 1
    ){

        enemy3Step++;
    }


    checkEnemyAttack();


    updateDoorEnemies();


    if(camerasOpen){

        renderCamera();
    }
}


/* =========================
   ATTACK CHECK
========================= */

function checkEnemyAttack(){

    if(
        !running
    ){

        return;
    }


    if(
        enemy1Position() ===
        "left"
    ){

        attemptAttack(
            "left",
            "👀",
            1
        );
    }


    if(
        !running
    ){

        return;
    }


    if(
        enemy2Position() ===
        "right"
    ){

        attemptAttack(
            "right",
            "🐺",
            2
        );
    }


    if(
        !running
    ){

        return;
    }


    if(
        enemy3Position() ===
        enemy3Side
    ){

        attemptAttack(
            enemy3Side,
            "🦆",
            3
        );
    }
}


/* =========================
   ATTACK
========================= */

function attemptAttack(
    side,
    icon,
    enemyNumber
){

    if(
        !running
    ){

        return;
    }


    const closed =
        side === "left"
            ? leftDoorClosed
            : rightDoorClosed;


    if(closed){

        hitSound();


        statusText.textContent =
            side === "left"
                ? "💥 ВОРОГ УДАРИВ У ЛІВІ ДВЕРІ!"
                : "💥 ВОРОГ УДАРИВ У ПРАВІ ДВЕРІ!";


        resetEnemy(
            enemyNumber
        );


        return;
    }


    showJumpscare(
        icon,
        side
    );
}


/* =========================
   RESET ENEMY
========================= */

function resetEnemy(number){

    if(
        number === 1
    ){

        enemy1Step =
            0;
    }


    if(
        number === 2
    ){

        enemy2Step =
            0;
    }


    if(
        number === 3
    ){

        enemy3Step =
            0;


        enemy3Side =
            Math.random() < .5
                ? "left"
                : "right";


        createDuckRoute();
    }


    updateDoorEnemies();


    if(camerasOpen){

        renderCamera();
    }
}


/* =========================
   JUMPSCARE
========================= */

function showJumpscare(
    icon,
    side
){

    if(
        scareRunning
    ){

        return;
    }


    scareRunning =
        true;


    running =
        false;


    stopTimers();


    camerasOpen =
        false;


    cameraPanel.classList.add(
        "hidden"
    );


    warning.classList.add(
        "hidden"
    );


    jumpscareFace.textContent =
        icon;


    jumpscare.classList.add(
        "active"
    );


    jumpscareSound();


    setTimeout(
        function(){

            jumpscare.classList.remove(
                "active"
            );


            showGameOver(
                side === "left"
                    ? "Ти не закрив ліві двері."
                    : "Ти не закрив праві двері."
            );


            scareRunning =
                false;

        },
        1200
    );
}


/* =========================
   USAGE
========================= */

function updateUsage(){

    let usage =
        1;


    if(leftDoorClosed){

        usage++;
    }


    if(rightDoorClosed){

        usage++;
    }


    if(leftLightOn){

        usage++;
    }


    if(rightLightOn){

        usage++;
    }


    if(camerasOpen){

        usage++;
    }


    usageBars.forEach(
        function(bar,index){

            bar.classList.toggle(
                "on",

                index <
                usage
            );
        }
    );
}


/* =========================
   POWER
========================= */

function updatePower(){

    if(!running){

        return;
    }


    let drain =
        .006;


    if(leftDoorClosed){

        drain +=
            .011;
    }


    if(rightDoorClosed){

        drain +=
            .011;
    }


    if(leftLightOn){

        drain +=
            .008;
    }


    if(rightLightOn){

        drain +=
            .008;
    }


    if(camerasOpen){

        drain +=
            .009;
    }


    power -=
        drain;


    if(
        power <= 0
    ){

        power =
            0;


        powerLabel.textContent =
            "0";


        powerOut();


        return;
    }


    powerLabel.textContent =
        Math.floor(
            power
        );


    if(
        power <= 20
    ){

        powerLabel.style.color =
            "red";

    }else if(
        power <= 40
    ){

        powerLabel.style.color =
            "yellow";

    }else{

        powerLabel.style.color =
            "white";
    }
}


/* =========================
   POWER OUT
========================= */

function powerOut(){

    if(!running){

        return;
    }


    leftDoorClosed =
        false;


    rightDoorClosed =
        false;


    leftLightOn =
        false;


    rightLightOn =
        false;


    resetOffice();


    closeCamera();


    statusText.textContent =
        "⚡ ЕНЕРГІЯ ЗАКІНЧИЛАСЯ...";


    setTimeout(
        function(){

            if(running){

                showJumpscare(
                    "👀",
                    "left"
                );
            }

        },
        2200
    );
}


/* =========================
   TIME
========================= */

function advanceTime(){

    if(!running){

        return;
    }


    hour++;


    if(
        hour >= 6
    ){

        hour =
            6;


        timeLabel.textContent =
            "6 AM";


        winGame();


        return;
    }


    timeLabel.textContent =
        hour +
        " AM";


    if(
        hour === 5
    ){

        statusText.textContent =
            "🕔 МАЙЖЕ 6 AM!";
    }
}


/* =========================
   WIN
========================= */

function winGame(){

    if(!running){

        return;
    }


    running =
        false;


    stopTimers();


    closeCamera();


    winSound();


    endScreen.classList.remove(
        "hidden"
    );


    endTitle.textContent =
        "🎉 6 AM";


    if(
        currentNight <
        5
    ){

        const nextNight =
            currentNight +
            1;


        if(
            nextNight >
            unlockedNight
        ){

            unlockedNight =
                nextNight;


            localStorage.setItem(
                "atbNight",
                String(
                    unlockedNight
                )
            );
        }


        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! Відкрито Ніч " +
            nextNight +
            ".";

    }else{

        endText.textContent =
            "🏆 ТИ ПЕРЕЖИВ УСІ П'ЯТЬ НОЧЕЙ В АТБ!";
    }


    updateNightButtons();
}


/* =========================
   GAME OVER
========================= */

function showGameOver(reason){

    endScreen.classList.remove(
        "hidden"
    );


    endTitle.textContent =
        "GAME OVER";


    endText.textContent =
        reason;
}


/* =========================
   RESTART
========================= */

restartBtn.addEventListener(
    "click",
    function(){

        startGame(
            currentNight
        );
    }
);


/* =========================
   MENU BUTTON
========================= */

menuBtn.addEventListener(
    "click",
    function(){

        stopTimers();


        running =
            false;


        scareRunning =
            false;


        jumpscare.classList.remove(
            "active"
        );


        game.classList.add(
            "hidden"
        );


        endScreen.classList.add(
            "hidden"
        );


        cameraPanel.classList.add(
            "hidden"
        );


        menu.classList.remove(
            "hidden"
        );
    }
);


/* =========================
   TIMERS
========================= */

function startTimers(){

    powerTimer =
        setInterval(
            updatePower,
            100
        );


    timeTimer =
        setInterval(
            advanceTime,
            20000
        );


    enemyTimer =
        setInterval(
            moveEnemies,

            Math.max(
                2300,

                5900 -
                currentNight *
                500
            )
        );
}


function stopTimers(){

    clearInterval(
        powerTimer
    );


    clearInterval(
        timeTimer
    );


    clearInterval(
        enemyTimer
    );


    powerTimer =
        null;


    timeTimer =
        null;


    enemyTimer =
        null;
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            !running
        ){

            return;
        }


        const key =
            event.key.toLowerCase();


        /*
        Q = ЛІВІ ДВЕРІ
        E = ПРАВІ ДВЕРІ

        A = ЛІВЕ СВІТЛО
        D = ПРАВЕ СВІТЛО

        C = КАМЕРИ
        ESC = ЗАКРИТИ КАМЕРИ
        */


        if(
            key === "q"
        ){

            leftDoorBtn.click();
        }


        if(
            key === "e"
        ){

            rightDoorBtn.click();
        }


        if(
            key === "a"
        ){

            leftLightBtn.click();
        }


        if(
            key === "d"
        ){

            rightLightBtn.click();
        }


        if(
            key === "c"
        ){

            if(camerasOpen){

                closeCamera();

            }else{

                cameraBtn.click();
            }
        }


        if(
            event.key ===
            "Escape" &&

            camerasOpen
        ){

            closeCamera();
        }
    }
);


/* =========================
   START
========================= */

updateNightButtons();


console.log(
    "П'ЯТЬ НОЧЕЙ В АТБ — CAMERAS 2.0 + JUMPSCARE"
);

</script>
