<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

button{
    font-family:inherit;
}

.hidden{
    display:none !important;
}

/* =========================
   MENU
========================= */

#menu{
    position:absolute;
    inset:0;
    z-index:1000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(circle at center,#202020 0%,#0b0b0b 50%,#000 100%);
}

#menu::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.025) 4px
        );
}

.menu-title{
    position:relative;
    z-index:2;

    font-size:clamp(42px,7vw,100px);
    letter-spacing:6px;

    text-shadow:
        0 0 10px #fff,
        0 0 25px red,
        0 0 80px rgba(255,0,0,.4);
}

.menu-subtitle{
    position:relative;
    z-index:2;

    margin-top:15px;
    color:#aaa;
    font-size:18px;
}

.menu-buttons{
    position:relative;
    z-index:2;

    display:flex;
    flex-direction:column;
    gap:14px;

    margin-top:45px;
}

.menu-button{
    min-width:260px;
    padding:16px 28px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:#fff;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.menu-button:hover{
    transform:scale(1.05);
    background:#262626;
}

.menu-button.primary{
    background:linear-gradient(135deg,#0b74ff,#003c9b);
    border-color:#428fff;
    box-shadow:0 0 25px rgba(0,100,255,.35);
}

/* =========================
   NIGHT SELECT
========================= */

#nightSelect{
    position:absolute;
    inset:0;
    z-index:1100;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle,#191919,#050505 70%);
}

#nightSelect h2{
    font-size:48px;
    margin-bottom:30px;
}

.night-grid{
    display:grid;
    grid-template-columns:repeat(5,110px);
    gap:15px;
}

.night-button{
    height:95px;

    border:1px solid #555;
    border-radius:12px;

    background:#141414;
    color:#fff;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

.night-button:hover{
    background:#252525;
}

.night-button.locked{
    opacity:.35;
    cursor:not-allowed;
}

#backToMenu{
    margin-top:30px;
}

/* =========================
   GAME
========================= */

#game{
    position:absolute;
    inset:0;

    background:
        radial-gradient(circle at center,#282828 0%,#111 48%,#030303 100%);

    overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

#topbar{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);

    z-index:50;

    width:min(960px,94%);

    display:flex;
    justify-content:space-between;
    gap:12px;

    padding:14px 22px;

    background:rgba(0,0,0,.82);
    border:1px solid #444;
    border-radius:14px;

    box-shadow:0 0 30px #000;

    font-size:19px;
}

/* =========================
   OFFICE
========================= */

#office{
    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.014) 0,
            rgba(255,255,255,.014) 2px,
            transparent 2px,
            transparent 7px
        );
}

.office-center{
    position:absolute;
    top:38%;
    left:50%;

    transform:translate(-50%,-50%);
    width:76%;

    text-align:center;
}

.office-center h1{
    font-size:clamp(38px,6vw,85px);
    letter-spacing:5px;

    text-shadow:
        0 0 8px white,
        0 0 28px red,
        0 0 70px rgba(255,0,0,.35);
}

#status{
    margin-top:22px;
    color:#bbb;
    font-size:19px;
}

#usage{
    position:absolute;
    top:92px;
    right:30px;

    z-index:45;

    color:#ccc;
    font-size:15px;
}

.usage-bar{
    display:inline-block;
    width:18px;
    height:10px;

    margin-left:3px;

    border:1px solid #555;
    background:#111;
}

.usage-bar.active{
    background:#7dff5d;
}

/* =========================
   DOORS
========================= */

.door{
    position:absolute;
    top:0;

    width:18%;
    height:100%;

    z-index:20;

    background:
        repeating-linear-gradient(
            0deg,
            #171717 0,
            #171717 35px,
            #444 36px,
            #242424 40px
        );

    border:4px solid #555;
    box-shadow:0 0 45px #000;

    transition:transform .32s ease;
}

.left-door{
    left:0;
    transform:translateY(-100%);
}

.right-door{
    right:0;
    transform:translateY(-100%);
}

.door.closed{
    transform:translateY(0);
}

/* =========================
   CONTROLS
========================= */

.left-controls,
.right-controls{
    position:absolute;
    top:42%;

    z-index:40;

    display:flex;
    flex-direction:column;
    gap:14px;
}

.left-controls{
    left:25px;
}

.right-controls{
    right:25px;
}

.control{
    width:190px;
    padding:15px;

    border:1px solid #555;
    border-radius:12px;

    background:#161616;
    color:#fff;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:.16s;
}

.control:hover{
    transform:scale(1.04);
    background:#292929;
}

.control.light-active{
    background:#ffd64d;
    color:#111;

    box-shadow:0 0 30px rgba(255,215,77,.75);
}

.control.door-active{
    background:#a51515;

    box-shadow:0 0 28px rgba(255,0,0,.45);
}

/* =========================
   CAMERA OPEN BUTTON
========================= */

#cameraBtn{
    position:absolute;
    bottom:32px;
    left:50%;

    transform:translateX(-50%);

    z-index:45;

    padding:17px 34px;

    border:none;
    border-radius:14px;

    background:linear-gradient(135deg,#147dff,#003aa0);
    color:#fff;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 0 30px rgba(0,100,255,.4);
}

#cameraBtn:hover{
    transform:translateX(-50%) scale(1.05);
}

/* =========================
   CAMERA PANEL
========================= */

#cameraPanel{
    position:absolute;
    inset:0;

    z-index:100;

    padding:20px;

    background:#020202;
}

.camera-header{
    height:65px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid #333;
}

.camera-header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.record-dot{
    width:12px;
    height:12px;

    border-radius:50%;
    background:red;

    box-shadow:0 0 14px red;

    animation:recordBlink 1s infinite;
}

@keyframes recordBlink{
    50%{
        opacity:.2;
    }
}

#closeCameraBtn{
    padding:12px 18px;

    border:none;
    border-radius:9px;

    background:#9f1010;
    color:#fff;

    font-weight:bold;
    cursor:pointer;
}

/* =========================
   CAMERA VIEW
========================= */

#cameraView{
    position:relative;

    height:calc(100vh - 205px);

    margin-top:14px;

    overflow:hidden;

    border:3px solid #333;
    border-radius:10px;

    background:
        radial-gradient(circle at center,#292929 0%,#101010 52%,#020202 100%);

    display:flex;
    justify-content:center;
    align-items:center;
}

.scanlines{
    position:absolute;
    inset:0;

    z-index:20;
    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.035) 4px
        );
}

.noise{
    position:absolute;
    inset:-20px;

    opacity:.06;
    pointer-events:none;

    background:
        repeating-radial-gradient(
            circle,
            white 0,
            transparent 1px,
            black 2px
        );

    animation:noiseMove .13s infinite;
}

@keyframes noiseMove{
    0%{transform:translate(0,0)}
    25%{transform:translate(4px,-5px)}
    50%{transform:translate(-4px,5px)}
    75%{transform:translate(6px,2px)}
}

.camera-info{
    position:absolute;
    left:25px;
    bottom:25px;

    z-index:25;
}

#cameraTitle{
    font-size:28px;
}

#cameraText{
    margin-top:6px;
    color:#aaa;
}

/* =========================
   CAMERA MAP
========================= */

#cameraMap{
    position:absolute;
    right:35px;
    bottom:30px;

    z-index:25;

    width:260px;
    height:200px;

    background:rgba(0,0,0,.74);
    border:1px solid #555;
    border-radius:12px;

    padding:15px;
}

.map-room{
    position:absolute;

    min-width:70px;
    padding:8px 10px;

    border:1px solid #777;
    border-radius:6px;

    background:#151515;
    color:#fff;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;
}

.map-room.active{
    background:#0877ff;
    border-color:#6bb1ff;
}

.map-room[data-camera="0"]{
    top:15px;
    left:85px;
}

.map-room[data-camera="1"]{
    top:60px;
    left:20px;
}

.map-room[data-camera="2"]{
    top:60px;
    right:20px;
}

.map-room[data-camera="3"]{
    top:108px;
    left:20px;
}

.map-room[data-camera="4"]{
    top:108px;
    right:20px;
}

.map-room[data-camera="5"]{
    bottom:12px;
    left:85px;
}

/* =========================
   ENEMIES
========================= */

.enemy{
    position:absolute;

    font-size:130px;

    opacity:0;

    transform:scale(.55);

    filter:drop-shadow(0 0 26px rgba(255,0,0,.8));

    transition:.22s;
}

.enemy.visible{
    opacity:1;
    transform:scale(1);
}

#enemy1{
    left:28%;
}

#enemy2{
    right:28%;
}

#enemy3{
    top:21%;
}

/* =========================
   WARNING
========================= */

#warning{
    position:absolute;
    inset:0;

    z-index:300;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(90,0,0,.95);

    animation:warningFlash .15s infinite;
}

#warning .warning-icon{
    font-size:150px;
}

#warning h2{
    margin-top:20px;
    font-size:50px;
}

@keyframes warningFlash{
    50%{
        background:#000;
    }
}

/* =========================
   END SCREEN
========================= */

#endScreen{
    position:absolute;
    inset:0;

    z-index:500;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:rgba(0,0,0,.98);
}

#endTitle{
    font-size:clamp(60px,10vw,145px);

    text-shadow:0 0 35px red;
}

#endText{
    margin-top:25px;

    color:#aaa;
    font-size:22px;
}

.end-buttons{
    display:flex;
    gap:14px;

    margin-top:35px;
}

.end-button{
    padding:16px 28px;

    border:none;
    border-radius:12px;

    background:#1479ff;
    color:#fff;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
}

.end-button.secondary{
    background:#222;
    border:1px solid #555;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

    #topbar{
        font-size:13px;
        padding:11px;
    }

    #usage{
        top:80px;
        right:10px;
        font-size:12px;
    }

    .control{
        width:125px;
        padding:10px;

        font-size:12px;
    }

    .left-controls{
        left:7px;
    }

    .right-controls{
        right:7px;
    }

    .door{
        width:26%;
    }

    #cameraMap{
        width:220px;
        right:10px;
        bottom:15px;
    }

    .night-grid{
        grid-template-columns:repeat(2,120px);
    }
}
</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<section id="menu">

    <h1 class="menu-title">
        П'ЯТЬ НОЧЕЙ В АТБ
    </h1>

    <p class="menu-subtitle">
        Переживи п'ять нічних змін
    </p>

    <div class="menu-buttons">

        <button
            id="playBtn"
            class="menu-button primary"
        >
            ▶ ГРАТИ
        </button>

        <button
            id="resetProgressBtn"
            class="menu-button"
        >
            ♻ Скинути прогрес
        </button>

    </div>

</section>


<!-- =========================
     NIGHT SELECT
========================= -->

<section
    id="nightSelect"
    class="hidden"
>

    <h2>
        ОБЕРИ НІЧ
    </h2>

    <div class="night-grid">

        <button
            class="night-button"
            data-night="1"
        >
            🌙 Ніч 1
        </button>

        <button
            class="night-button"
            data-night="2"
        >
            🌙 Ніч 2
        </button>

        <button
            class="night-button"
            data-night="3"
        >
            🌙 Ніч 3
        </button>

        <button
            class="night-button"
            data-night="4"
        >
            🌙 Ніч 4
        </button>

        <button
            class="night-button"
            data-night="5"
        >
            🌙 Ніч 5
        </button>

    </div>

    <button
        id="backToMenu"
        class="menu-button"
    >
        ← Назад
    </button>

</section>


<!-- =========================
     GAME
========================= -->

<section
    id="game"
    class="hidden"
>

    <div id="topbar">

        <div>
            🌙 Ніч:
            <span id="night">1</span>
        </div>

        <div>
            🕛 Час:
            <span id="time">12 AM</span>
        </div>

        <div>
            ⚡ Енергія:
            <span id="power">100</span>%
        </div>

    </div>


    <div id="usage">

        Використання:

        <span class="usage-bar"></span>
        <span class="usage-bar"></span>
        <span class="usage-bar"></span>
        <span class="usage-bar"></span>
        <span class="usage-bar"></span>

    </div>


    <!-- OFFICE -->

    <main id="office">

        <div
            id="leftDoor"
            class="door left-door"
        ></div>

        <div
            id="rightDoor"
            class="door right-door"
        ></div>


        <div class="office-center">

            <h1>
                П'ЯТЬ НОЧЕЙ В АТБ
            </h1>

            <p id="status">
                Перевіряй камери та бережи енергію...
            </p>

        </div>


        <div class="left-controls">

            <button
                id="leftLightBtn"
                class="control"
            >
                💡 Ліве світло
            </button>

            <button
                id="leftDoorBtn"
                class="control"
            >
                🚪 Ліві двері
            </button>

        </div>


        <div class="right-controls">

            <button
                id="rightLightBtn"
                class="control"
            >
                💡 Праве світло
            </button>

            <button
                id="rightDoorBtn"
                class="control"
            >
                🚪 Праві двері
            </button>

        </div>


        <button id="cameraBtn">
            📹 ВІДКРИТИ КАМЕРИ
        </button>

    </main>


    <!-- CAMERAS -->

    <section
        id="cameraPanel"
        class="hidden"
    >

        <div class="camera-header">

            <div class="camera-header-left">

                <div class="record-dot"></div>

                <h2>
                    SECURITY CAMERAS
                </h2>

            </div>


            <button id="closeCameraBtn">
                ✖ ЗАКРИТИ
            </button>

        </div>


        <div id="cameraView">

            <div class="noise"></div>

            <div class="scanlines"></div>


            <div
                id="enemy1"
                class="enemy"
            >
                👀
            </div>

            <div
                id="enemy2"
                class="enemy"
            >
                🐺
            </div>

            <div
                id="enemy3"
                class="enemy"
            >
                🦆
            </div>


            <div class="camera-info">

                <h2 id="cameraTitle">
                    CAM 1 — Вхід
                </h2>

                <p id="cameraText">
                    Нікого не видно...
                </p>

            </div>


            <div id="cameraMap">

                <button
                    class="map-room active"
                    data-camera="0"
                >
                    CAM 1
                </button>

                <button
                    class="map-room"
                    data-camera="1"
                >
                    CAM 2
                </button>

                <button
                    class="map-room"
                    data-camera="2"
                >
                    CAM 3
                </button>

                <button
                    class="map-room"
                    data-camera="3"
                >
                    CAM 4
                </button>

                <button
                    class="map-room"
                    data-camera="4"
                >
                    CAM 5
                </button>

                <button
                    class="map-room"
                    data-camera="5"
                >
                    CAM 6
                </button>

            </div>

        </div>

    </section>


    <!-- WARNING -->

    <section
        id="warning"
        class="hidden"
    >

        <div class="warning-icon">
            👀
        </div>

        <h2>
            ЩОСЬ ПОРУЧ...
        </h2>

    </section>


    <!-- END SCREEN -->

    <section
        id="endScreen"
        class="hidden"
    >

        <h1 id="endTitle">
            GAME OVER
        </h1>

        <p id="endText"></p>


        <div class="end-buttons">

            <button
                id="restartNightBtn"
                class="end-button"
            >
                🔄 ЩЕ РАЗ
            </button>

            <button
                id="menuBtn"
                class="end-button secondary"
            >
                🏠 МЕНЮ
            </button>

        </div>

    </section>

</section>

<!-- ЧАСТИНУ 2 ВСТАВИМО СЮД -->

</body>
</html>
