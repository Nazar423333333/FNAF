<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
    user-select:none;
    font-family:inherit;
}

/* =========================================================
   MENU
========================================================= */

#menu,
#nightMenu{
    position:fixed;
    inset:0;
    z-index:5000;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            #262626 0%,
            #080808 58%,
            #000 100%
        );
}

#menu h1{
    font-size:clamp(42px,7vw,95px);
    letter-spacing:4px;

    text-shadow:
        0 0 10px #fff,
        0 0 30px #d71920,
        0 0 70px #d71920;
}

#menu p{
    margin-top:16px;
    color:#aaa;
    font-size:20px;
}

.menuBtn{
    min-width:280px;
    margin-top:24px;
    padding:17px 30px;

    border:1px solid #555;
    border-radius:12px;

    background:#111;
    color:#fff;

    font-size:18px;
    font-weight:700;

    transition:.18s;
}

.menuBtn:hover{
    transform:scale(1.04);
    background:#292929;
}

#playBtn{
    background:#086cff;
}

#playBtn:hover{
    background:#2780ff;
}

/* =========================================================
   NIGHT MENU
========================================================= */

#nightMenu h2{
    margin-bottom:12px;
    font-size:46px;
}

#nightInfo{
    margin-bottom:28px;
    color:#aaa;
    font-size:17px;
}

.nightButtons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

.nightBtn{
    width:135px;
    height:105px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:#fff;

    font-size:16px;
    font-weight:700;

    transition:.15s;
}

.nightBtn span{
    display:block;
    margin-top:8px;
    color:#999;
    font-size:12px;
}

.nightBtn:hover:not(:disabled){
    transform:translateY(-2px);
    background:#086cff;
}

.nightBtn:hover:not(:disabled) span{
    color:#fff;
}

.nightBtn.locked{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================================================
   GAME
========================================================= */

#game{
    position:fixed;
    inset:0;

    overflow:hidden;

    background:#000;
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar{
    position:absolute;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:700;

    width:min(900px,94%);

    padding:14px 22px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,.88);

    border:1px solid #555;
    border-radius:14px;

    box-shadow:0 0 25px #000;

    font-size:19px;
    font-weight:700;
}

#powerLabel.medium{
    color:#ffd43b;
}

#powerLabel.low{
    color:#ff3030;

    text-shadow:
        0 0 10px red;
}

/* =========================================================
   OFFICE
========================================================= */

#office{
    position:absolute;
    inset:0;

    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(0,0,0,.02),
            rgba(0,0,0,.05)
        ),
        url("office.png");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    background-color:#050505;
}

/* =========================================================
   STATUS
========================================================= */

#statusBox{
    position:absolute;

    top:25%;
    left:50%;

    transform:translateX(-50%);

    z-index:500;

    width:min(620px,55%);

    padding:9px 16px;

    background:rgba(0,0,0,.68);

    border:1px solid rgba(255,255,255,.14);
    border-radius:10px;

    box-shadow:0 0 18px #000;

    text-align:center;

    color:#ddd;

    font-size:16px;
}

/* =========================================================
   PHONE CALL
========================================================= */

#phoneCall{
    position:absolute;

    top:95px;
    left:50%;

    transform:translateX(-50%);

    z-index:2500;

    width:min(560px,92%);

    padding:18px;

    background:
        linear-gradient(
            180deg,
            rgba(18,18,18,.97),
            rgba(2,2,2,.97)
        );

    border:2px solid #4cff79;
    border-radius:17px;

    box-shadow:
        0 0 20px rgba(76,255,121,.4),
        0 0 50px #000;
}

#phoneCall.ringing{
    animation:
        phoneRing .25s infinite alternate;
}

@keyframes phoneRing{
    from{
        transform:
            translateX(-50%)
            rotate(-1deg);
    }

    to{
        transform:
            translateX(-50%)
            rotate(1deg);
    }
}

.phoneTop{
    display:flex;
    align-items:center;
    gap:13px;
}

.phoneIcon{
    width:55px;
    height:55px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:#159447;

    font-size:31px;

    box-shadow:
        0 0 20px rgba(50,255,120,.5);
}

.phoneInfo{
    flex:1;
}

.phoneName{
    font-size:19px;
    font-weight:800;
}

.phoneState{
    margin-top:4px;

    color:#7dff9e;

    font-size:13px;
}

#phoneText{
    max-height:145px;

    overflow:auto;

    margin-top:15px;

    padding:12px;

    background:#090909;

    border:1px solid #333;
    border-radius:9px;

    color:#ddd;

    line-height:1.45;

    font-size:14px;
}

.phoneButtons{
    display:flex;
    gap:9px;

    margin-top:14px;
}

.phoneBtn{
    flex:1;

    padding:12px 10px;

    border:0;
    border-radius:10px;

    color:#fff;

    font-weight:800;

    font-size:14px;
}

#answerPhoneBtn{
    background:#159447;
}

#answerPhoneBtn:hover{
    background:#1ab455;
}

#hangPhoneBtn{
    background:#a51414;
}

#hangPhoneBtn:hover{
    background:#cf1d1d;
}

#skipSpeechBtn{
    background:#353535;
}

#skipSpeechBtn:hover{
    background:#555;
}

/* =========================================================
   DOOR FRAME
========================================================= */

.doorFrame{
    position:absolute;

    top:21%;

    width:11.5%;
    height:56%;

    z-index:160;

    overflow:hidden;

    background:transparent;
}

#leftDoorFrame{
    left:7.2%;
}

#rightDoorFrame{
    right:7.5%;
}

/* =========================================================
   DOOR LIGHT
========================================================= */

.doorLight{
    position:absolute;
    inset:0;

    z-index:5;

    opacity:0;

    pointer-events:none;

    transition:opacity .12s;

    background:
        radial-gradient(
            ellipse at 50% 52%,
            rgba(255,255,225,.96) 0%,
            rgba(255,240,155,.82) 20%,
            rgba(255,210,65,.56) 44%,
            rgba(255,160,20,.20) 70%,
            transparent 96%
        );
}

.doorFrame.lightOn .doorLight{
    opacity:1;
}

/* =========================================================
   DOOR ENEMIES
========================================================= */

.doorEnemy{
    position:absolute;

    left:50%;
    top:52%;

    z-index:10;

    opacity:0;

    pointer-events:none;

    font-size:clamp(65px,7vw,115px);

    transform:
        translate(-50%,-50%)
        scale(.72);

    transition:
        opacity .1s,
        transform .1s;

    filter:
        drop-shadow(0 0 8px #fff)
        drop-shadow(0 0 22px red)
        drop-shadow(0 0 35px #000);
}

.doorEnemy.visible{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

/* =========================================================
   METAL DOORS
========================================================= */

.door{
    position:absolute;
    inset:0;

    z-index:30;

    width:100%;
    height:100%;

    background:
        repeating-linear-gradient(
            0deg,
            #111 0px,
            #111 26px,
            #454545 27px,
            #8a8a8a 30px,
            #242424 35px
        );

    border:2px solid #666;

    box-shadow:
        inset 0 0 30px #000;

    transform:
        translateY(-105%);

    transition:
        transform .35s ease;
}

.door::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 42px,
            rgba(255,255,255,.06) 43px 46px
        );
}

.door.closed{
    transform:
        translateY(0);
}

/* =========================================================
   LIGHT EFFECT
========================================================= */

.lightEffect{
    position:absolute;

    top:0;

    width:35%;
    height:100%;

    z-index:100;

    opacity:0;

    pointer-events:none;

    transition:opacity .12s;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at 9% 50%,
            rgba(255,245,175,.42),
            rgba(255,215,65,.12) 38%,
            transparent 75%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at 91% 50%,
            rgba(255,245,175,.42),
            rgba(255,215,65,.12) 38%,
            transparent 75%
        );
}

.lightEffect.on{
    opacity:1;
}

/* =========================================================
   SIDE CONTROLS
========================================================= */

.sideControls{
    position:absolute;

    top:47%;

    z-index:550;

    display:flex;
    flex-direction:column;

    gap:11px;
}

#leftControls{
    left:22%;
}

#rightControls{
    right:22%;
}

.controlBtn{
    width:170px;

    padding:14px 10px;

    border:1px solid #666;
    border-radius:11px;

    background:rgba(8,8,8,.92);

    color:#fff;

    font-size:15px;
    font-weight:700;

    box-shadow:
        0 0 18px #000;

    transition:.15s;
}

.controlBtn:hover{
    transform:scale(1.03);
    background:#303030;
}

.controlBtn.lightOn{
    background:#ffd84a;
    color:#111;

    border-color:#fff;

    box-shadow:
        0 0 12px #fff,
        0 0 30px #ffd84a;
}

.controlBtn.doorOn{
    background:#b51414;

    border-color:#ff5555;

    box-shadow:
        0 0 15px red,
        0 0 30px rgba(255,0,0,.6);
}

/* =========================================================
   CAMERA BUTTON
========================================================= */

#cameraBtn{
    position:absolute;

    left:50%;
    bottom:24px;

    transform:translateX(-50%);

    z-index:600;

    padding:17px 35px;

    border:0;
    border-radius:14px;

    background:#086cff;
    color:#fff;

    font-size:18px;
    font-weight:700;

    box-shadow:
        0 0 28px rgba(0,100,255,.55);
}

/* =========================================================
   SOUND BUTTON
========================================================= */

#soundBtn{
    position:absolute;

    top:88px;
    left:22px;

    z-index:700;

    padding:10px 14px;

    border:1px solid #555;
    border-radius:9px;

    background:rgba(0,0,0,.80);

    color:#fff;

    font-weight:700;
}

/* =========================================================
   USAGE
========================================================= */

#usage{
    position:absolute;

    top:88px;
    right:22px;

    z-index:700;

    padding:10px 13px;

    border:1px solid #444;
    border-radius:8px;

    background:rgba(0,0,0,.80);

    font-size:14px;
}

.usageBar{
    display:inline-block;

    width:17px;
    height:11px;

    margin-left:3px;

    border:1px solid #555;

    background:#111;
}

.usageBar.on{
    background:#63ff4d;

    box-shadow:
        0 0 8px #63ff4d;
}

/* =========================================================
   CAMERA PANEL
========================================================= */

#cameraPanel{
    position:absolute;
    inset:0;

    z-index:1500;

    padding:20px;

    background:#020202;
}

.cameraHeader{
    height:65px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:
        1px solid #333;
}

#closeCameraBtn{
    padding:12px 18px;

    border:0;
    border-radius:10px;

    background:#a00;
    color:#fff;

    font-weight:700;
}

#cameraView{
    position:relative;

    height:
        calc(100vh - 105px);

    margin-top:14px;

    overflow:hidden;

    border:3px solid #333;
    border-radius:10px;

    background:
        radial-gradient(
            circle,
            #3d4143,
            #161819 55%,
            #020202
        );
}

#cameraView::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:50;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.05) 4px
        );
}

#cameraScene{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding-bottom:130px;

    color:#acb4b8;

    opacity:.4;

    text-align:center;

    font-size:clamp(24px,4vw,55px);

    letter-spacing:7px;
}

#cameraRoomIcon{
    position:absolute;

    top:43%;
    left:50%;

    transform:
        translate(-50%,-50%);

    font-size:155px;

    opacity:.18;
}

.enemy{
    position:absolute;

    top:46%;

    z-index:25;

    font-size:135px;

    opacity:0;

    filter:
        drop-shadow(0 0 20px red)
        drop-shadow(0 0 35px #000);
}

.enemy.visible{
    opacity:1;
}

#enemy1{
    left:22%;
}

#enemy2{
    right:22%;
}

#enemy3{
    left:50%;

    transform:
        translateX(-50%);
}

#cameraInfo{
    position:absolute;

    left:25px;
    bottom:25px;

    z-index:80;

    min-width:290px;

    padding:15px;

    background:rgba(0,0,0,.84);

    border:1px solid #444;
    border-radius:10px;
}

#cameraInfo p{
    margin-top:8px;

    color:#aaa;
}

#cameraMap{
    position:absolute;

    right:25px;
    bottom:25px;

    z-index:80;

    width:290px;
    height:230px;

    background:rgba(0,0,0,.92);

    border:1px solid #555;
    border-radius:12px;
}

.camBtn{
    position:absolute;

    width:78px;

    padding:9px;

    border:1px solid #666;
    border-radius:7px;

    background:#151515;
    color:#fff;

    font-weight:700;
}

.camBtn.active{
    background:#086cff;
}

.camBtn[data-cam="0"]{
    top:25px;
    left:106px;
}

.camBtn[data-cam="1"]{
    top:78px;
    left:20px;
}

.camBtn[data-cam="2"]{
    top:78px;
    right:20px;
}

.camBtn[data-cam="3"]{
    top:132px;
    left:20px;
}

.camBtn[data-cam="4"]{
    top:132px;
    right:20px;
}

.camBtn[data-cam="5"]{
    bottom:15px;
    left:106px;
}

/* =========================================================
   JUMPSCARE
========================================================= */

#jumpscare{
    position:fixed;
    inset:0;

    z-index:99999;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle,
            #5e0000,
            #170000 45%,
            #000 85%
        );
}

#jumpscare.active{
    display:flex;

    animation:
        scareFlash .08s infinite;
}

#jumpscareFace{
    font-size:min(52vw,500px);

    animation:
        scareZoom .55s forwards;
}

#jumpscareText{
    position:absolute;

    bottom:7%;

    font-size:clamp(35px,7vw,90px);

    font-weight:900;

    letter-spacing:8px;
}

@keyframes scareZoom{
    from{
        transform:scale(.15);
    }

    to{
        transform:scale(1.2);
    }
}

@keyframes scareFlash{
    0%{
        filter:brightness(.6);
    }

    50%{
        filter:brightness(2);
    }

    100%{
        filter:brightness(.7);
    }
}

/* =========================================================
   END SCREEN
========================================================= */

#endScreen{
    position:absolute;
    inset:0;

    z-index:3000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#000;

    text-align:center;
}

#endTitle{
    font-size:
        clamp(60px,10vw,135px);
}

#endText{
    margin-top:18px;

    color:#aaa;

    font-size:21px;
}

.endButtons{
    display:flex;

    gap:12px;

    margin-top:30px;
}

.endBtn{
    padding:16px 24px;

    border:0;
    border-radius:10px;

    background:#086cff;
    color:#fff;

    font-size:16px;
    font-weight:700;
}

.endBtn.gray{
    background:#222;

    border:
        1px solid #555;
}

/* =========================================================
   PHONE / MOBILE
========================================================= */

@media(max-width:750px){

    #topbar{
        top:6px;

        padding:10px;

        font-size:12px;
    }

    #soundBtn{
        top:60px;
        left:6px;

        padding:7px;

        font-size:10px;
    }

    #usage{
        display:none;
    }

    #phoneCall{
        top:58px;

        width:95%;

        padding:12px;
    }

    .phoneIcon{
        width:42px;
        height:42px;

        font-size:24px;
    }

    .phoneName{
        font-size:15px;
    }

    #phoneText{
        max-height:100px;

        font-size:12px;
    }

    .phoneBtn{
        padding:10px 5px;

        font-size:11px;
    }

    .doorFrame{
        width:18%;
    }

    #leftDoorFrame{
        left:1%;
    }

    #rightDoorFrame{
        right:1%;
    }

    #leftControls{
        left:20%;
    }

    #rightControls{
        right:20%;
    }

    .controlBtn{
        width:105px;

        padding:10px 5px;

        font-size:10px;
    }

    #statusBox{
        top:26%;

        width:48%;

        font-size:11px;
    }

    #cameraBtn{
        bottom:8px;

        padding:12px 18px;

        font-size:12px;
    }
}
</style>
</head>

<body>

<!-- ======================================================
     MENU
====================================================== -->

<section id="menu">

    <h1>
        П'ЯТЬ НОЧЕЙ В АТБ
    </h1>

    <p>
        Переживи п'ять нічних змін
    </p>

    <button
        id="playBtn"
        class="menuBtn"
    >
        ▶ ГРАТИ
    </button>

    <button
        id="resetProgressBtn"
        class="menuBtn"
    >
        ♻ СКИНУТИ ПРОГРЕС
    </button>

</section>

<!-- ======================================================
     NIGHT MENU
====================================================== -->

<section
    id="nightMenu"
    class="hidden"
>

    <h2>
        ОБЕРИ НІЧ
    </h2>

    <p id="nightInfo">
        Кожна наступна ніч довша і складніша
    </p>

    <div class="nightButtons">

        <button
            class="nightBtn"
            data-night="1"
        ></button>

        <button
            class="nightBtn"
            data-night="2"
        ></button>

        <button
            class="nightBtn"
            data-night="3"
        ></button>

        <button
            class="nightBtn"
            data-night="4"
        ></button>

        <button
            class="nightBtn"
            data-night="5"
        ></button>

    </div>

    <button
        id="backBtn"
        class="menuBtn"
    >
        ← НАЗАД
    </button>

</section>

<!-- ======================================================
     GAME
====================================================== -->

<section
    id="game"
    class="hidden"
>

    <div id="topbar">

        <div>
            🌙 Ніч:
            <span id="nightLabel">1</span>
        </div>

        <div>
            🕛
            <span id="timeLabel">
                12 AM
            </span>
        </div>

        <div>
            ⚡
            <span id="powerLabel">
                100
            </span>%
        </div>

    </div>

    <button id="soundBtn">
        🔊 ЗВУК
    </button>

    <div id="usage">

        Використання:

        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>

    </div>

    <!-- ==================================================
         PHONE
    ================================================== -->

    <div
        id="phoneCall"
        class="hidden"
    >

        <div class="phoneTop">

            <div class="phoneIcon">
                📞
            </div>

            <div class="phoneInfo">

                <div class="phoneName">
                    Охоронець АТБ
                </div>

                <div
                    id="phoneState"
                    class="phoneState"
                >
                    Вхідний дзвінок...
                </div>

            </div>

        </div>

        <div
            id="phoneText"
            class="hidden"
        ></div>

        <div class="phoneButtons">

            <button
                id="answerPhoneBtn"
                class="phoneBtn"
            >
                ✅ ВІДПОВІСТИ
            </button>

            <button
                id="skipSpeechBtn"
                class="phoneBtn hidden"
            >
                ⏭ ПРОПУСТИТИ
            </button>

            <button
                id="hangPhoneBtn"
                class="phoneBtn"
            >
                ❌ СКИНУТИ
            </button>

        </div>

    </div>

    <!-- ==================================================
         OFFICE
    ================================================== -->

    <main id="office">

        <div id="statusBox">

            <span id="status">
                Перевіряй камери та бережи енергію...
            </span>

        </div>

function getAudioContext(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        audioContext =
            new AudioCtx();
    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }

    return audioContext;
}

function beep(
    frequency = 400,
    duration = 100,
    volume = .07,
    type = "square"
){

    if(!soundEnabled){
        return;
    }

    try{

        const ctx =
            getAudioContext();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type =
            type;

        osc.frequency.value =
            frequency;

        gain.gain.value =
            volume;

        osc.connect(
            gain
        );

        gain.connect(
            ctx.destination
        );

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime +
            duration / 1000
        );

        osc.stop(
            ctx.currentTime +
            duration / 1000
        );

    }catch(error){

        console.log(error);
    }
}

    window.speechSynthesis.cancel();

    const message =

            phoneMessages[
                currentNight

    message.lang =
        "uk-UA";

    message.rate =

    message.pitch =
        0.88;

    message.volume =
        soundEnabled
        ? 0.85
        : 0;

    const voices =
        speechSynthesis.getVoices();

    const ukrainianVoice =
        voices.find(
            voice =>
                voice.lang
                .toLowerCase()
                .startsWith("uk")
        );

    if(ukrainianVoice){

        message.voice =
            ukrainianVoice;

    message.onend =

    );

    updateDoorEnemies();

    updateUsage();
};

rightLightBtn.onclick =
function(){

    if(
        !running ||
        power <= 0 ||
        powerOutActive
    ){
        return;
    }

    rightLightOn =
        !rightLightOn;

    lightSound();

    rightLightBtn.classList.toggle(
        "lightOn",
        rightLightOn
    );

    rightLightEffect.classList.toggle(
        "on",
        rightLightOn
    );

    rightDoorFrame.classList.toggle(
        "lightOn",
        rightLightOn
    );

    updateDoorEnemies();

    updateUsage();
};

/* =========================================================
   ENEMY POSITION
========================================================= */

function enemy1Position(){

    return enemy1Route[
        enemy1Step
    ];
}

function enemy2Position(){

    return enemy2Route[
        enemy2Step
    ];
}

function enemy3Position(){

    return enemy3Route[
        enemy3Step
    ];
}

/* =========================================================
   DOOR ENEMY
========================================================= */

function updateDoorEnemies(){

    const e1 =
        enemy1Position();

    const e2 =
        enemy2Position();

    const e3 =
        enemy3Position();

    const leftEnemy =
        e1 === "left" ||
        e3 === "left";

    const rightEnemy =
        e2 === "right" ||
        e3 === "right";

    leftDoorEnemy.textContent =
        e3 === "left"
        ? "🦆"
        : "👀";

    rightDoorEnemy.textContent =
        e3 === "right"
        ? "🦆"
        : "🐺";

    leftDoorEnemy.classList.toggle(
        "visible",

        leftEnemy &&
        leftLightOn &&
        !leftDoorClosed
    );

    rightDoorEnemy.classList.toggle(
        "visible",

        rightEnemy &&
        rightLightOn &&
        !rightDoorClosed
    );

    if(
        leftLightOn &&
        leftEnemy &&
        !leftDoorClosed
    ){

        statusText.textContent =
            "🚨 МОБ У ЛІВИХ ДВЕРЯХ!";
    }

    if(
        rightLightOn &&
        rightEnemy &&
        !rightDoorClosed
    ){

        statusText.textContent =
            "🚨 МОБ У ПРАВИХ ДВЕРЯХ!";
    }
}

/* =========================================================
   CAMERA DATA
========================================================= */

const cameraNames = [
    "CAM 1 — Вхід",
    "CAM 2 — Торговий зал",
    "CAM 3 — Склад",
    "CAM 4 — Лівий коридор",
    "CAM 5 — Правий коридор",
    "CAM 6 — Біля офісу"
];

const cameraIcons = [
    "🚪",
    "🛒",
    "📦",
    "⬅️",
    "➡️",
    "🚨"
];

const cameraScenes = [
    "🚪 ВХІД",
    "🛒 ТОРГОВИЙ ЗАЛ",
    "📦 СКЛАД",
    "⬅️ ЛІВИЙ КОРИДОР",
    "➡️ ПРАВИЙ КОРИДОР",
    "🚨 БІЛЯ ОФІСУ"
];

/* =========================================================
   CAMERA
========================================================= */

cameraBtn.onclick =
function(){

    if(
        !running ||
        power <= 0 ||
        powerOutActive
    ){
        return;
    }

    camerasOpen =
        true;

    cameraSound();

    cameraPanel.classList.remove(
        "hidden"
    );

    renderCamera();

    updateUsage();
};

closeCameraBtn.onclick =
function(){

    closeCamera();
};

function closeCamera(){

    camerasOpen =
        false;

    cameraPanel.classList.add(
        "hidden"
    );

    updateUsage();
}

cameraButtons.forEach(
    function(button){

        button.onclick =
        function(){

            selectCamera(
                Number(
                    button.dataset.cam
                )
            );
        };
    }
);

function selectCamera(cam){

    selectedCamera =
        cam;

    cameraButtons.forEach(
        function(button){

            button.classList.toggle(
                "active",

                Number(
                    button.dataset.cam
                ) ===
                selectedCamera
            );
        }
    );

    renderCamera();
}

function renderCamera(){

    cameraTitle.textContent =
        cameraNames[
            selectedCamera
        ];

    cameraRoomIcon.textContent =
        cameraIcons[
            selectedCamera
        ];

    cameraScene.textContent =
        cameraScenes[
            selectedCamera
        ];

    enemy1El.classList.remove(
        "visible"
    );

    enemy2El.classList.remove(
        "visible"
    );

    enemy3El.classList.remove(
        "visible"
    );

    let amount =
        0;

    if(
        enemy1Position() ===
        selectedCamera
    ){

        enemy1El.classList.add(
            "visible"
        );

        amount++;
    }

    if(
        enemy2Position() ===
        selectedCamera
    ){

        enemy2El.classList.add(
            "visible"
        );

        amount++;
    }

    if(
        enemy3Position() ===
        selectedCamera
    ){

        enemy3El.classList.add(
            "visible"
        );

        amount++;
    }

    cameraText.textContent =
        amount === 0
        ? "Нікого не видно..."
        : "⚠️ ВОРОГ НА КАМЕРІ!";
}

/* =========================================================
   MOVE ENEMIES
========================================================= */

function moveEnemies(){

    if(
        !running ||
        powerOutActive
    ){
        return;
    }

    const chance =
        .16 +
        currentNight *
        .04;

    if(
        Math.random() < chance &&
        enemy1Step <
        enemy1Route.length - 1
    ){

        enemy1Step++;
    }

    if(
        Math.random() < chance &&
        enemy2Step <
        enemy2Route.length - 1
    ){

        enemy2Step++;
    }

    if(
        Math.random() <
        chance * .78 &&

        enemy3Step <
        enemy3Route.length - 1
    ){

        enemy3Step++;
    }

    updateDoorEnemies();

    checkEnemyAttack();

    if(camerasOpen){

        renderCamera();
    }
}

/* =========================================================
   ATTACK
========================================================= */

function checkEnemyAttack(){

    if(
        enemy1Position() ===
        "left" &&

        !enemy1AttackTimer
    ){

        enemy1AttackTimer =
            setTimeout(
                function(){

                    enemy1AttackTimer =
                        null;

                    if(
                        running &&
                        enemy1Position() ===
                        "left"
                    ){

                        attemptAttack(
                            "left",
                            "👀",
                            1
                        );
                    }

                },
                ENEMY_ATTACK_DELAY[
                    currentNight
                ]
            );
    }

    if(
        enemy2Position() ===
        "right" &&

        !enemy2AttackTimer
    ){

        enemy2AttackTimer =
            setTimeout(
                function(){

                    enemy2AttackTimer =
                        null;

                    if(
                        running &&
                        enemy2Position() ===
                        "right"
                    ){

                        attemptAttack(
                            "right",
                            "🐺",
                            2
                        );
                    }

                },
                ENEMY_ATTACK_DELAY[
                    currentNight
                ]
            );
    }

    if(
        enemy3Position() ===
        enemy3Side &&

        !enemy3AttackTimer
    ){

        enemy3AttackTimer =
            setTimeout(
                function(){

                    enemy3AttackTimer =
                        null;

                    if(
                        running &&
                        enemy3Position() ===
                        enemy3Side
                    ){

                        attemptAttack(
                            enemy3Side,
                            "🦆",
                            3
                        );
                    }

                },
                ENEMY_ATTACK_DELAY[
                    currentNight
                ]
            );
    }
}

function attemptAttack(
    side,
    icon,
    number
){

    const doorClosed =
        side === "left"
        ? leftDoorClosed
        : rightDoorClosed;

    if(doorClosed){

        hitSound();

        resetEnemy(
            number
        );

        return;
    }

    showJumpscare(
        icon,
        side
    );
}

function resetEnemy(number){

    if(number === 1){

        enemy1Step =
            0;
    }

    if(number === 2){

        enemy2Step =
            0;
    }

    if(number === 3){

        enemy3Step =
            0;

        enemy3Side =
            Math.random() < .5
            ? "left"
            : "right";

        createDuckRoute();
    }

    updateDoorEnemies();
}

/* =========================================================
   POWER
========================================================= */

function getEnergyDrainPerTick(percent){

    const ticks =
        getNightDurationMs() /
        100;

    return (
        percent /
        ticks
    );
}

function updatePower(){

    if(
        !running ||
        powerOutActive
    ){
        return;
    }

    let drain =
        getEnergyDrainPerTick(
            40
        );

    if(leftDoorClosed){

        drain +=
            getEnergyDrainPerTick(
                34
            );
    }

    if(rightDoorClosed){

        drain +=
            getEnergyDrainPerTick(
                34
            );
    }

    if(leftLightOn){

        drain +=
            getEnergyDrainPerTick(
                21
            );
    }

    if(rightLightOn){

        drain +=
            getEnergyDrainPerTick(
                21
            );
    }

    if(camerasOpen){

        drain +=
            getEnergyDrainPerTick(
                20
            );
    }

    power -=
        drain;

    if(power <= 0){

        power =
            0;

        powerLabel.textContent =
            "0";

        powerOut();

        return;
    }

    powerLabel.textContent =
        Math.floor(
            power
        );

    powerLabel.classList.remove(
        "medium",
        "low"
    );

    if(power <= 20){

        powerLabel.classList.add(
            "low"
        );

    }else if(power <= 40){

        powerLabel.classList.add(
            "medium"
        );
    }
}

function updateUsage(){

    let usage =
        1;

    if(leftDoorClosed){
        usage++;
    }

    if(rightDoorClosed){
        usage++;
    }

    if(leftLightOn){
        usage++;
    }

    if(rightLightOn){
        usage++;
    }

    if(camerasOpen){
        usage++;
    }

    usageBars.forEach(
        function(bar,index){

            bar.classList.toggle(
                "on",
                index < usage
            );
        }
    );
}

function powerOut(){

    powerOutActive =
        true;

    stopPhoneCall();

    leftDoorClosed =
        false;

    rightDoorClosed =
        false;

    leftDoor.classList.remove(
        "closed"
    );

    rightDoor.classList.remove(
        "closed"
    );

    cameraPanel.classList.add(
        "hidden"
    );

    camerasOpen =
        false;

    statusText.textContent =
        "⚡ ЕНЕРГІЯ ЗАКІНЧИЛАСЯ...";

    setTimeout(
        function(){

            if(running){

                showJumpscare(
                    "👀",
                    "left"
                );
            }

        },
        2800
    );
}

/* =========================================================
   TIME
========================================================= */

function advanceTime(){

    if(!running){
        return;
    }

    hour++;

    if(hour >= 6){

        hour =
            6;

        timeLabel.textContent =
            "6 AM";

        winGame();

        return;
    }

    timeLabel.textContent =
        hour +
        " AM";
}

/* =========================================================
   JUMPSCARE
========================================================= */

function showJumpscare(
    icon,
    side
){

    if(scareRunning){
        return;
    }

    scareRunning =
        true;

    running =
        false;

    stopTimers();

    stopPhoneCall();

    jumpscareFace.textContent =
        icon;

    jumpscare.classList.add(
        "active"
    );

    jumpscareSound();

    setTimeout(
        function(){

            jumpscare.classList.remove(
                "active"
            );

            showGameOver(
                side === "left"
                ? "Ти не закрив ліві двері."
                : "Ти не закрив праві двері."
            );

        },
        1200
    );
}

/* =========================================================
   WIN
========================================================= */

function winGame(){

    running =
        false;

    stopTimers();

    stopPhoneCall();

    cameraPanel.classList.add(
        "hidden"
    );

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "🎉 6 AM";

    if(currentNight < 5){

        const nextNight =
            currentNight + 1;

        if(
            nextNight >
            unlockedNight
        ){

            unlockedNight =
                nextNight;

            localStorage.setItem(
                "atbNight",
                String(
                    unlockedNight
                )
            );
        }

        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! Відкрито Ніч " +
            nextNight +
            ".";

    }else{

        endText.textContent =
            "🏆 ТИ ПЕРЕЖИВ УСІ 5 НОЧЕЙ В АТБ!";
    }

    updateNightButtons();
}

function showGameOver(reason){

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "GAME OVER";

    endText.textContent =
        reason;
}

/* =========================================================
   END BUTTONS
========================================================= */

restartBtn.onclick =
function(){

    startGame(
        currentNight
    );
};

menuBtn.onclick =
function(){

    stopTimers();

    stopPhoneCall();

    running =
        false;

    game.classList.add(
        "hidden"
    );

    endScreen.classList.add(
        "hidden"
    );

    menu.classList.remove(
        "hidden"
    );
};

/* =========================================================
   TIMERS
========================================================= */

function startTimers(){

    powerTimer =
        setInterval(
            updatePower,
            100
        );

    timeTimer =
        setInterval(
            advanceTime,
            getHourDuration()
        );

    enemyTimer =
        setInterval(
            moveEnemies,
            ENEMY_MOVE_TIME[
                currentNight
            ]
        );
}

function stopTimers(){

    clearInterval(
        powerTimer
    );

    clearInterval(
        timeTimer
    );

    clearInterval(
        enemyTimer
    );

    clearTimeout(
        enemy1AttackTimer
    );

    clearTimeout(
        enemy2AttackTimer
    );

    clearTimeout(
        enemy3AttackTimer
    );

    powerTimer =
        null;

    timeTimer =
        null;

    enemyTimer =
        null;

    enemy1AttackTimer =
        null;

    enemy2AttackTimer =
        null;

    enemy3AttackTimer =
        null;
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(!running){
            return;
        }

        const key =
            event.key.toLowerCase();

        if(key === "a"){

            leftLightBtn.click();
        }

        if(key === "d"){

            rightLightBtn.click();
        }

        if(key === "q"){

            leftDoorBtn.click();
        }

        if(key === "e"){

            rightDoorBtn.click();
        }

        if(key === "c"){

            if(camerasOpen){

                closeCamera();

            }else{

                cameraBtn.click();
            }
        }

        if(
            event.key ===
            "Escape" &&
            camerasOpen
        ){

            closeCamera();
        }
    }
);

/* =========================================================
   INIT
========================================================= */

updateNightButtons();

console.log(
    "П'ЯТЬ НОЧЕЙ В АТБ — PHONE GUARD VERSION"
);
</script>
