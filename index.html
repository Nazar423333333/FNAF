<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
    font-family:inherit;
}

/* =========================
   ГОЛОВНЕ МЕНЮ
========================= */

#menu,
#nightMenu{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle,#202020,#050505 65%,#000);

    text-align:center;
}

#menu h1{
    font-size:clamp(45px,7vw,100px);
    letter-spacing:5px;
    text-shadow:
        0 0 10px white,
        0 0 25px red,
        0 0 70px red;
}

#menu p{
    margin-top:15px;
    color:#aaa;
    font-size:20px;
}

.menuBtn{
    margin-top:25px;

    min-width:270px;

    padding:17px 30px;

    border:1px solid #555;
    border-radius:12px;

    background:#111;
    color:white;

    font-size:18px;
    font-weight:bold;

    transition:.2s;
}

.menuBtn:hover{
    background:#292929;
    transform:scale(1.04);
}

#playBtn{
    background:#086cff;
}

#playBtn:hover{
    background:#2580ff;
}

/* =========================
   ВИБІР НОЧІ
========================= */

#nightMenu h2{
    font-size:45px;
    margin-bottom:30px;
}

.nightButtons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
}

.nightBtn{
    width:120px;
    height:95px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:white;

    font-size:17px;
    font-weight:bold;

    transition:.2s;
}

.nightBtn:hover:not(:disabled){
    background:#086cff;
    transform:scale(1.05);
}

.nightBtn.locked{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================
   ГРА
========================= */

#game{
    position:fixed;
    inset:0;

    overflow:hidden;

    background:#050505;
}

/* =========================
   ВЕРХНЯ ПАНЕЛЬ
========================= */

#topbar{
    position:absolute;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:100;

    width:min(900px,94%);

    padding:14px 22px;

    display:flex;
    justify-content:space-between;

    background:rgba(0,0,0,.88);

    border:1px solid #444;
    border-radius:14px;

    font-size:19px;

    box-shadow:0 0 25px black;
}

/* =========================
   ОФІС
========================= */

#office{
    position:absolute;
    inset:0;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 55%,
            rgba(100,110,120,.22),
            transparent 30%
        ),

        linear-gradient(
            90deg,
            rgba(0,0,0,.92) 0 15%,
            transparent 15% 85%,
            rgba(0,0,0,.92) 85%
        ),

        linear-gradient(
            180deg,
            #050708 0%,
            #101315 50%,
            #030405 100%
        );
}

#office::before{
    content:"";

    position:absolute;

    left:50%;
    bottom:-8%;

    transform:translateX(-50%);

    width:65%;
    height:35%;

    z-index:4;

    border-radius:50% 50% 0 0;

    background:
        linear-gradient(
            180deg,
            #292c2f,
            #0d0f10 30%,
            #050606
        );

    border-top:3px solid #34383b;

    box-shadow:
        0 -15px 60px black,
        inset 0 10px 25px rgba(255,255,255,.04);
}

#office::after{
    content:"АТБ • НІЧНА ОХОРОНА";

    position:absolute;

    left:50%;
    top:19%;

    transform:translateX(-50%);

    z-index:8;

    padding:10px 25px;

    border:1px solid #333;
    border-radius:7px;

    background:#080a0b;

    color:#999;

    font-size:14px;
    letter-spacing:5px;

    box-shadow:0 0 30px black;
}

/* =========================
   НАЗВА В ОФІСІ
========================= */

#title{
    position:absolute;

    top:34%;
    left:50%;

    transform:translate(-50%,-50%);

    z-index:12;

    width:70%;

    text-align:center;
}

#title h1{
    font-size:clamp(38px,5vw,75px);

    letter-spacing:4px;

    text-shadow:
        0 0 8px white,
        0 0 25px #d71920,
        0 0 60px rgba(215,25,32,.5);
}

#status{
    margin-top:20px;

    color:#bbb;

    font-size:18px;

    text-shadow:0 0 10px black;
}

/* =========================
   СВІТЛО
========================= */

.lightEffect{
    position:absolute;

    top:0;

    width:48%;
    height:100%;

    opacity:0;

    pointer-events:none;

    transition:opacity .15s;

    z-index:15;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at left center,
            rgba(255,250,200,.95),
            rgba(255,220,70,.32) 35%,
            rgba(255,200,40,.08) 58%,
            transparent 78%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at right center,
            rgba(255,250,200,.95),
            rgba(255,220,70,.32) 35%,
            rgba(255,200,40,.08) 58%,
            transparent 78%
        );
}

.lightEffect.on{
    opacity:1;
}

/* =========================
   ВЕЛИКІ ДВЕРІ
========================= */

.door{
    position:absolute;

    top:0;

    /* ВЕЛИКІ ДВЕРІ */
    width:35%;
    height:100%;

    z-index:40;

    background:
        repeating-linear-gradient(
            0deg,
            #141414 0px,
            #141414 30px,
            #3e3e3e 31px,
            #666 34px,
            #222 38px
        );

    border:7px solid #555;

    box-shadow:
        0 0 60px black,
        inset 0 0 30px black;

    transform:translateY(-101%);

    transition:
        transform .38s ease;
}

.door::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 65px,
            rgba(255,255,255,.08) 66px 68px
        );
}

.door::after{
    content:"🚪";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:80px;

    opacity:.12;
}

#leftDoor{
    left:0;

    border-right:10px solid #777;
}

#rightDoor{
    right:0;

    border-left:10px solid #777;
}

.door.closed{
    transform:translateY(0);
}

/* =========================
   ВОРОГ БІЛЯ ДВЕРЕЙ
========================= */

.doorEnemy{
    position:absolute;

    top:50%;

    z-index:25;

    font-size:125px;

    opacity:0;

    pointer-events:none;

    transform:
        translateY(-50%)
        scale(.65);

    transition:
        opacity .12s,
        transform .12s;

    filter:
        drop-shadow(0 0 15px red)
        drop-shadow(0 0 35px black);
}

#leftDoorEnemy{
    left:16%;
}

#rightDoorEnemy{
    right:16%;
}

.doorEnemy.visible{
    opacity:1;

    transform:
        translateY(-50%)
        scale(1);
}

/* =========================
   КНОПКИ ДВЕРЕЙ
========================= */

.sideControls{
    position:absolute;

    top:40%;

    z-index:80;

    display:flex;
    flex-direction:column;

    gap:12px;
}

#leftControls{
    left:22px;
}

#rightControls{
    right:22px;
}

.controlBtn{
    width:190px;

    padding:16px;

    border:2px solid #555;
    border-radius:12px;

    background:rgba(15,15,15,.95);

    color:white;

    font-weight:bold;
    font-size:16px;

    box-shadow:0 0 20px black;

    transition:.15s;
}

.controlBtn:hover{
    background:#303030;
}

.controlBtn.lightOn{
    background:#ffd84a;

    color:#111;

    border-color:white;

    box-shadow:
        0 0 15px white,
        0 0 35px #ffd84a;
}

.controlBtn.doorOn{
    background:#aa1515;

    border-color:#ff5555;

    box-shadow:
        0 0 15px red,
        0 0 35px rgba(255,0,0,.6);
}

/* =========================
   КАМЕРИ КНОПКА
========================= */

#cameraBtn{
    position:absolute;

    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    z-index:90;

    padding:18px 35px;

    border:0;
    border-radius:14px;

    background:#086cff;

    color:white;

    font-size:18px;
    font-weight:bold;

    box-shadow:0 0 30px rgba(0,100,255,.5);

    transition:.2s;
}

#cameraBtn:hover{
    background:#2780ff;

    transform:
        translateX(-50%)
        scale(1.04);
}

/* =========================
   ENERGY USAGE
========================= */

#usage{
    position:absolute;

    right:25px;
    top:90px;

    z-index:90;

    padding:10px 13px;

    background:rgba(0,0,0,.72);

    border:1px solid #333;
    border-radius:8px;
}

.usageBar{
    display:inline-block;

    width:17px;
    height:11px;

    border:1px solid #555;

    background:#111;

    margin-left:3px;
}

.usageBar.on{
    background:#63ff4d;

    box-shadow:0 0 8px #63ff4d;
}

/* =========================
   SOUND
========================= */

#soundBtn{
    position:absolute;

    top:88px;
    left:25px;

    z-index:90;

    padding:10px 14px;

    border:1px solid #555;
    border-radius:9px;

    background:rgba(0,0,0,.75);

    color:white;

    font-weight:bold;
}

/* =========================
   CAMERA PANEL
========================= */

#cameraPanel{
    position:absolute;

    inset:0;

    z-index:200;

    background:#020202;

    padding:20px;
}

.cameraHeader{
    display:flex;

    justify-content:space-between;
    align-items:center;

    height:65px;

    border-bottom:1px solid #333;
}

.cameraHeader h2{
    color:#ddd;

    letter-spacing:2px;
}

#closeCameraBtn{
    padding:12px 20px;

    border:0;
    border-radius:10px;

    background:#a00;

    color:white;

    font-weight:bold;
    font-size:15px;
}

#cameraView{
    position:relative;

    height:calc(100vh - 105px);

    margin-top:14px;

    border:3px solid #333;
    border-radius:10px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #3a3d3f,
            #111 58%,
            #020202
        );
}

#cameraView::before{
    content:"";

    position:absolute;

    inset:0;

    z-index:10;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.05) 4px
        );
}

#cameraScene{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding-bottom:100px;

    font-size:clamp(25px,4vw,55px);

    letter-spacing:8px;

    color:#aeb5b9;

    opacity:.42;

    text-align:center;
}

#cameraRoomIcon{
    position:absolute;

    left:50%;
    top:43%;

    transform:translate(-50%,-50%);

    font-size:160px;

    opacity:.2;
}

.enemy{
    position:absolute;

    top:48%;

    z-index:8;

    font-size:135px;

    opacity:0;

    transition:.2s;

    filter:
        drop-shadow(0 0 25px red);
}

.enemy.visible{
    opacity:1;
}

#enemy1{
    left:23%;
}

#enemy2{
    right:23%;
}

#enemy3{
    left:50%;

    transform:translateX(-50%);
}

/* =========================
   CAMERA INFO
========================= */

#cameraInfo{
    position:absolute;

    left:25px;
    bottom:25px;

    z-index:20;

    padding:15px;

    background:rgba(0,0,0,.75);

    border-radius:10px;
}

#cameraInfo h2{
    font-size:27px;
}

#cameraInfo p{
    margin-top:8px;

    color:#aaa;
}

/* =========================
   CAMERA MAP
========================= */

#cameraMap{
    position:absolute;

    right:25px;
    bottom:25px;

    z-index:20;

    width:290px;
    height:230px;

    background:rgba(0,0,0,.9);

    border:1px solid #555;
    border-radius:12px;

    box-shadow:0 0 30px black;
}

.camBtn{
    position:absolute;

    width:78px;

    padding:9px;

    border:1px solid #666;
    border-radius:7px;

    background:#151515;

    color:white;

    font-weight:bold;
}

.camBtn:hover{
    background:#333;
}

.camBtn.active{
    background:#086cff;

    box-shadow:0 0 14px #086cff;
}

.camBtn[data-cam="0"]{
    top:25px;
    left:106px;
}

.camBtn[data-cam="1"]{
    top:78px;
    left:20px;
}

.camBtn[data-cam="2"]{
    top:78px;
    right:20px;
}

.camBtn[data-cam="3"]{
    top:132px;
    left:20px;
}

.camBtn[data-cam="4"]{
    top:132px;
    right:20px;
}

.camBtn[data-cam="5"]{
    bottom:15px;
    left:106px;
}

/* =========================
   WARNING
========================= */

#warning{
    position:absolute;

    inset:0;

    z-index:400;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(90,0,0,.95);

    animation:warningFlash .15s infinite;
}

#warningIcon{
    font-size:180px;
}

#warning h2{
    margin-top:20px;

    font-size:50px;
}

@keyframes warningFlash{
    50%{
        background:#000;
    }
}

/* =========================
   GAME OVER
========================= */

#endScreen{
    position:absolute;

    inset:0;

    z-index:500;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#000;

    text-align:center;
}

#endTitle{
    font-size:clamp(60px,10vw,140px);

    text-shadow:
        0 0 20px red,
        0 0 50px red;
}

#endText{
    margin-top:20px;

    color:#aaa;

    font-size:21px;
}

.endButtons{
    display:flex;

    gap:12px;

    margin-top:30px;
}

.endBtn{
    padding:16px 25px;

    border:0;
    border-radius:10px;

    background:#086cff;

    color:white;

    font-weight:bold;
    font-size:16px;
}

.endBtn.gray{
    background:#222;

    border:1px solid #555;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .door{
        width:42%;
    }

    .controlBtn{
        width:130px;

        padding:11px;

        font-size:12px;
    }

    #leftControls{
        left:6px;
    }

    #rightControls{
        right:6px;
    }

    #topbar{
        font-size:13px;
    }

    #usage{
        right:8px;
    }

    #soundBtn{
        left:8px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<section id="menu">

    <h1>П'ЯТЬ НОЧЕЙ В АТБ</h1>

    <p>
        Переживи п'ять нічних змін
    </p>

    <button
        id="playBtn"
        class="menuBtn"
    >
        ▶ ГРАТИ
    </button>

    <button
        id="resetProgressBtn"
        class="menuBtn"
    >
        ♻ СКИНУТИ ПРОГРЕС
    </button>

</section>


<!-- =========================
     NIGHT MENU
========================= -->

<section
    id="nightMenu"
    class="hidden"
>

    <h2>
        ОБЕРИ НІЧ
    </h2>

    <div class="nightButtons">

        <button
            class="nightBtn"
            data-night="1"
        >
            🌙 Ніч 1
        </button>

        <button
            class="nightBtn"
            data-night="2"
        >
            🌙 Ніч 2
        </button>

        <button
            class="nightBtn"
            data-night="3"
        >
            🌙 Ніч 3
        </button>

        <button
            class="nightBtn"
            data-night="4"
        >
            🌙 Ніч 4
        </button>

        <button
            class="nightBtn"
            data-night="5"
        >
            🌙 Ніч 5
        </button>

    </div>

    <button
        id="backBtn"
        class="menuBtn"
    >
        ← НАЗАД
    </button>

</section>


<!-- =========================
     GAME
========================= -->

<section
    id="game"
    class="hidden"
>

    <div id="topbar">

        <div>
            🌙 Ніч:
            <span id="nightLabel">1</span>
        </div>

        <div>
            🕛
            <span id="timeLabel">12 AM</span>
        </div>

        <div>
            ⚡
            <span id="powerLabel">100</span>%
        </div>

    </div>


    <button id="soundBtn">
        🔊 ЗВУК
    </button>


    <div id="usage">

        Використання:

        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>

    </div>


    <!-- OFFICE -->

    <main id="office">

        <div
            id="leftLightEffect"
            class="lightEffect"
        ></div>

        <div
            id="rightLightEffect"
            class="lightEffect"
        ></div>


        <div
            id="leftDoorEnemy"
            class="doorEnemy"
        >
            👀
        </div>

        <div
            id="rightDoorEnemy"
            class="doorEnemy"
        >
            🐺
        </div>


        <div
            id="leftDoor"
            class="door"
        ></div>

        <div
            id="rightDoor"
            class="door"
        ></div>


        <div id="title">

            <h1>
                П'ЯТЬ НОЧЕЙ В АТБ
            </h1>

            <p id="status">
                Перевіряй камери та бережи енергію...
            </p>

        </div>


        <!-- LEFT CONTROLS -->

        <div
            id="leftControls"
            class="sideControls"
        >

            <button
                id="leftLightBtn"
                class="controlBtn"
            >
                💡 Ліве світло
            </button>

            <button
                id="leftDoorBtn"
                class="controlBtn"
            >
                🚪 Ліві двері
            </button>

        </div>


        <!-- RIGHT CONTROLS -->

        <div
            id="rightControls"
            class="sideControls"
        >

            <button
                id="rightLightBtn"
                class="controlBtn"
            >
                💡 Праве світло
            </button>

            <button
                id="rightDoorBtn"
                class="controlBtn"
            >
                🚪 Праві двері
            </button>

        </div>


        <button id="cameraBtn">
            📹 ВІДКРИТИ КАМЕРИ
        </button>

    </main>


    <!-- =========================
         CAMERAS
    ========================= -->

    <section
        id="cameraPanel"
        class="hidden"
    >

        <div class="cameraHeader">

            <h2>
                🔴 SECURITY CAMERAS
            </h2>

            <button id="closeCameraBtn">
                ✖ ЗАКРИТИ
            </button>

        </div>


        <div id="cameraView">

            <div id="cameraScene">
                🚪 ВХІД
            </div>

            <div id="cameraRoomIcon">
                🚪
            </div>


            <div
                id="enemy1"
                class="enemy"
            >
                👀
            </div>

            <div
                id="enemy2"
                class="enemy"
            >
                🐺
            </div>

            <div
                id="enemy3"
                class="enemy"
            >
                🦆
            </div>


            <div id="cameraInfo">

                <h2 id="cameraTitle">
                    CAM 1 — Вхід
                </h2>

                <p id="cameraText">
                    Нікого не видно...
                </p>

            </div>


            <div id="cameraMap">

                <button
                    class="camBtn active"
                    data-cam="0"
                >
                    CAM 1
                </button>

                <button
                    class="camBtn"
                    data-cam="1"
                >
                    CAM 2
                </button>

                <button
                    class="camBtn"
                    data-cam="2"
                >
                    CAM 3
                </button>

                <button
                    class="camBtn"
                    data-cam="3"
                >
                    CAM 4
                </button>

                <button
                    class="camBtn"
                    data-cam="4"
                >
                    CAM 5
                </button>

                <button
                    class="camBtn"
                    data-cam="5"
                >
                    CAM 6
                </button>

            </div>

        </div>

    </section>


    <!-- WARNING -->

    <section
        id="warning"
        class="hidden"
    >

        <div id="warningIcon">
            👀
        </div>

        <h2>
            ЩОСЬ ПОРУЧ...
        </h2>

    </section>


    <!-- END -->

    <section
        id="endScreen"
        class="hidden"
    >

        <h1 id="endTitle">
            GAME OVER
        </h1>

        <p id="endText"></p>

        <div class="endButtons">

            <button
                id="restartBtn"
                class="endBtn"
            >
                🔄 ЩЕ РАЗ
            </button>

            <button
                id="menuBtn"
                class="endBtn gray"
            >
                🏠 МЕНЮ
            </button>

        </div>

    </section>

</section>


<script>

/* =========================
   ELEMENTS
========================= */

    document.getElementById(id);

/* =========================
   SOUND
========================= */

let soundEnabled = true;

let audioContext = null;

function beep(
    frequency = 400,
    duration = 100,
    volume = .08
){

    if(!soundEnabled){
        return;
    }

    try{

        if(!audioContext){

            const Context =
                window.AudioContext ||
                window.webkitAudioContext;

            audioContext =
                new Context();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            "square";

        oscillator.frequency.value =
            frequency;

        gain.gain.value =
            volume;

        oscillator.connect(gain);
        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        setTimeout(
            function(){

                try{
                    oscillator.stop();
                }catch(e){}

            },
            duration
        );

    }catch(error){

        console.log(
            "Sound error:",
            error
        );
    }
}


function doorSound(){

    beep(
        110,
        220,
        .12
    );
}

function lightSound(){

    beep(
        650,
        70,
        .06
    );
}

function cameraSound(){

    beep(
        260,
        90,
        .07
    );
}

function hitSound(){

    beep(
        75,
        300,
        .15
    );
}

function warningSound(){

    beep(
        55,
        600,
        .18
    );
}

function winSound(){

    beep(
        800,
        500,
        .1
    );
}

function updateNightButtons(){

    nightButtons.forEach(
        function(button){

            const n =
                Number(
                    button.dataset.night
                );

            if(
                n <= unlockedNight
            ){

                button.disabled =
                    false;

                button.classList.remove(
                    "locked"
                );

                button.textContent =
                    "🌙 Ніч " + n;

            }else{

                button.disabled =
                    true;

                button.classList.add(
                    "locked"
                );

                button.textContent =
                    "🔒 Ніч " + n;
            }
        }
    );
}

========================= */

function updateDoorEnemies(){

    const leftVisible =

        leftLightOn &&

        (
            enemy1 >= 5 ||

            (
                enemy3 >= 5 &&
                enemy3Side === "left"
            )
        );


    const rightVisible =

        rightLightOn &&

        (
            enemy2 >= 5 ||

            (
                enemy3 >= 5 &&
                enemy3Side === "right"
            )
        );


    if(
        enemy3 >= 5 &&
        enemy3Side === "left"
    ){

        leftDoorEnemy.textContent =
            "🦆";

    }else{

        leftDoorEnemy.textContent =
            "👀";
    }


    if(
        enemy3 >= 5 &&
        enemy3Side === "right"
    ){

        rightDoorEnemy.textContent =
            "🦆";

    }else{

        rightDoorEnemy.textContent =
            "🐺";
    }


    leftDoorEnemy.classList.toggle(
        "visible",
        leftVisible
    );


    rightDoorEnemy.classList.toggle(
        "visible",
        rightVisible
    );
}

function selectCamera(cam){

    selectedCamera =
        cam;

    cameraButtons.forEach(
        function(button){

            button.classList.toggle(
                "active",
                Number(
                    button.dataset.cam
                ) === selectedCamera
            );
        }
    );

    renderCamera();
}


/* =========================
   RENDER CAMERA
========================= */

function renderCamera(){

    cameraTitle.textContent =
        cameraNames[
            selectedCamera
        ];

    cameraRoomIcon.textContent =
        cameraIcons[
            selectedCamera
        ];

    cameraScene.textContent =
        cameraScenes[
            selectedCamera
        ];


    enemy1El.classList.remove(
        "visible"
    );

    enemy2El.classList.remove(
        "visible"
    );

    enemy3El.classList.remove(
        "visible"
    );


    let enemiesOnCamera =
        0;


    if(
        enemy1 === selectedCamera
    ){

        enemy1El.classList.add(
            "visible"
        );

        enemiesOnCamera++;
    }


    if(
        enemy2 === selectedCamera
    ){

        enemy2El.classList.add(
            "visible"
        );

        enemiesOnCamera++;
    }


    if(
        enemy3 === selectedCamera
    ){

        enemy3El.classList.add(
            "visible"
        );

        enemiesOnCamera++;
    }


    if(
        enemiesOnCamera === 0
    ){

        cameraText.textContent =
            "Нікого не видно...";

    }else if(
        enemiesOnCamera === 1
    ){

        cameraText.textContent =
            "⚠️ На камері хтось є...";

    }else{

        cameraText.textContent =
            "🚨 ТУТ КІЛЬКА ВОРОГІВ!";
    }
}


/* =========================
   POWER USAGE
========================= */

function updateUsage(){

    let usage =
        1;

    if(leftDoorClosed){
        usage++;
    }

    if(rightDoorClosed){
        usage++;
    }

    if(leftLightOn){
        usage++;
    }

    if(rightLightOn){
        usage++;
    }

    if(camerasOpen){
        usage++;
    }


    usageBars.forEach(
        function(bar,index){

            bar.classList.toggle(
                "on",
                index < usage
            );
        }
    );
}


/* =========================
   POWER
========================= */

function updatePower(){

    if(!running){
        return;
    }

    let drain =
        .007;

    if(leftDoorClosed){

        drain +=
            .012;
    }

    if(rightDoorClosed){

        drain +=
            .012;
    }

    if(leftLightOn){

        drain +=
            .008;
    }

    if(rightLightOn){

        drain +=
            .008;
    }

    if(camerasOpen){

        drain +=
            .010;
    }


    power -=
        drain;


    if(
        power <= 0
    ){

        power =
            0;

        powerLabel.textContent =
            "0";

        powerOut();

        return;
    }


    powerLabel.textContent =
        Math.floor(
            power
        );


    if(
        power <= 20
    ){

        powerLabel.style.color =
            "red";

    }else if(
        power <= 40
    ){

        powerLabel.style.color =
            "yellow";

    }else{

        powerLabel.style.color =
            "white";
    }
}

/* =========================
   ENEMIES
========================= */

function moveEnemies(){

    if(!running){
        return;
    }


    const chance =

        .22 +

        currentNight *
        .045;


    if(
        Math.random() < chance &&
        enemy1 < 6
    ){

        enemy1++;
    }


    if(
        Math.random() < chance &&
        enemy2 < 6
    ){

        enemy2++;
    }


    if(
        Math.random() <
            chance * .75 &&

        enemy3 < 6
    ){

        enemy3++;
    }


    if(
        enemy1 >= 6
    ){

        attack(
            "left",
            "👀",
            1
        );
    }


    if(
        enemy2 >= 6
    ){

        attack(
            "right",
            "🐺",
            2
        );
    }


    if(
        enemy3 >= 6
    ){

        attack(
            enemy3Side,
            "🦆",
            3
        );
    }


    updateDoorEnemies();


    if(camerasOpen){

        renderCamera();
    }
}


/* =========================
   ATTACK
========================= */

function attack(
    side,
    icon,
    enemyNumber
){

    if(!running){
        return;
    }


    const closed =

        side === "left"
            ? leftDoorClosed
            : rightDoorClosed;


    if(closed){

        statusText.textContent =

            side === "left"

                ? "💥 ВОРОГ УДАРИВ У ЛІВІ ДВЕРІ!"

                : "💥 ВОРОГ УДАРИВ У ПРАВІ ДВЕРІ!";


        hitSound();


        if(
            enemyNumber === 1
        ){

            enemy1 =
                0;
        }


        if(
            enemyNumber === 2
        ){

            enemy2 =
                2;
        }


        if(
            enemyNumber === 3
        ){

            enemy3 =
                1;

            enemy3Side =

                Math.random() < .5

                    ? "left"

                    : "right";
        }


        updateDoorEnemies();

        return;
    }


    warningIcon.textContent =
        icon;


    warningSound();


    warning.classList.remove(
        "hidden"
    );


    setTimeout(
        function(){

            warning.classList.add(
                "hidden"
            );

        },
        650
    );


    setTimeout(
        function(){

            if(running){

                loseGame(

                    side === "left"

                        ? "Ти не закрив ліві двері."

                        : "Ти не закрив праві двері."
                );
            }

        },
        850
    );
}


/* =========================
   TIME
========================= */

function advanceTime(){

    if(!running){
        return;
    }


    hour++;


    if(
        hour >= 6
    ){

        hour =
            6;

        timeLabel.textContent =
            "6 AM";

        winGame();

        return;
    }


    timeLabel.textContent =
        hour + " AM";


    if(
        hour === 5
    ){

        statusText.textContent =
            "🕔 МАЙЖЕ 6 AM!";
    }
}


/* =========================
   WIN
========================= */

function winGame(){

    if(!running){
        return;
    }


    running =
        false;


    stopTimers();

    closeCamera();

    winSound();


    endScreen.classList.remove(
        "hidden"
    );


    endTitle.textContent =
        "🎉 6 AM";


    if(
        currentNight < 5
    ){

        const nextNight =
            currentNight + 1;


        if(
            nextNight >
            unlockedNight
        ){

            unlockedNight =
                nextNight;


            localStorage.setItem(
                "atbNight",
                String(
                    unlockedNight
                )
            );
        }


        endText.textContent =

            "Ніч " +

            currentNight +

            " пройдена! Відкрито Ніч " +

            nextNight +

            ".";

    }else{

        endText.textContent =
            "🏆 ТИ ПЕРЕЖИВ УСІ П'ЯТЬ НОЧЕЙ В АТБ!";
    }


    updateNightButtons();
}


/* =========================
   LOSE
========================= */

function loseGame(reason){

    if(!running){
        return;
    }


    running =
        false;


    stopTimers();

    closeCamera();


    warning.classList.add(
        "hidden"
    );


    endScreen.classList.remove(
        "hidden"
    );


    endTitle.textContent =
        "GAME OVER";


    endText.textContent =
        reason;


    warningSound();
}


/* =========================
   RESTART
========================= */

restartBtn.addEventListener(
    "click",
    function(){

        startGame(
            currentNight
        );
    }
);


/* =========================
   MENU BUTTON
========================= */

menuBtn.addEventListener(
    "click",
    function(){

        stopTimers();

        running =
            false;

        game.classList.add(
            "hidden"
        );

        endScreen.classList.add(
            "hidden"
        );

        menu.classList.remove(
            "hidden"
        );
    }
);


/* =========================
   TIMERS
========================= */

function startTimers(){

    powerTimer =
        setInterval(
            updatePower,
            100
        );


    timeTimer =
        setInterval(
            advanceTime,
            20000
        );


    enemyTimer =
        setInterval(
            moveEnemies,

            Math.max(
                2200,

                5200 -
                currentNight * 400
            )
        );
}


function stopTimers(){

    clearInterval(
        powerTimer
    );

    clearInterval(
        timeTimer
    );

    clearInterval(
        enemyTimer
    );


    powerTimer =
        null;

    timeTimer =
        null;

    enemyTimer =
        null;
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(!running){
            return;
        }


        const key =
            event.key.toLowerCase();


        /*
        Q = ліві двері
        E = праві двері
        A = ліве світло
        D = праве світло
        C = камери
        */


        if(
            key === "q"
        ){

            leftDoorBtn.click();
        }


        if(
            key === "e"
        ){

            rightDoorBtn.click();
        }


        if(
            key === "a"
        ){

            leftLightBtn.click();
        }


        if(
            key === "d"
        ){

            rightLightBtn.click();
        }


        if(
            key === "c"
        ){

            if(camerasOpen){

                closeCamera();

            }else{

                cameraBtn.click();
            }
        }


        if(
            event.key === "Escape" &&
            camerasOpen
        ){

            closeCamera();
        }
    }
);


/* =========================
   START
========================= */

updateNightButtons();

console.log(
    "П'ЯТЬ НОЧЕЙ В АТБ — ГОТОВО"
);

</script>
