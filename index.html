<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
    font-family:inherit;
}

/* =========================================================
   MENU
========================================================= */

#menu,
#nightMenu{
    position:fixed;
    inset:0;
    z-index:5000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(circle,#252525,#070707 60%,#000);
}

#menu h1{
    font-size:clamp(42px,7vw,95px);
    letter-spacing:4px;

    text-shadow:
        0 0 10px white,
        0 0 30px #d71920,
        0 0 70px #d71920;
}

#menu p{
    margin-top:18px;
    color:#aaa;
    font-size:20px;
}

.menuBtn{
    margin-top:24px;

    min-width:280px;

    padding:17px 30px;

    border:1px solid #555;
    border-radius:12px;

    background:#111;
    color:white;

    font-size:18px;
    font-weight:bold;

    transition:.2s;
}

.menuBtn:hover{
    transform:scale(1.05);
    background:#292929;
}

#playBtn{
    background:#086cff;
}

#playBtn:hover{
    background:#2780ff;
}

/* =========================================================
   NIGHT MENU
========================================================= */

#nightMenu h2{
    margin-bottom:30px;
    font-size:46px;
}

.nightButtons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

.nightBtn{
    width:120px;
    height:90px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:white;

    font-size:17px;
    font-weight:bold;
}

.nightBtn:hover:not(:disabled){
    background:#086cff;
}

.nightBtn.locked{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================================================
   GAME
========================================================= */

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* =========================================================
   TOPBAR
========================================================= */

#topbar{
    position:absolute;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:500;

    width:min(900px,94%);

    padding:14px 22px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,.88);

    border:1px solid #555;
    border-radius:14px;

    box-shadow:0 0 30px #000;

    font-size:19px;
    font-weight:bold;
}

/* =========================================================
   PNG OFFICE
========================================================= */

#office{
    position:absolute;
    inset:0;

    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(0,0,0,.03),
            rgba(0,0,0,.08)
        ),
        url("office.png");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    background-color:#050505;
}

/* =========================================================
   STATUS
========================================================= */

#statusBox{
    position:absolute;

    left:50%;
    top:24%;

    transform:translateX(-50%);

    z-index:110;

    width:min(620px,58%);

    padding:10px 18px;

    background:rgba(0,0,0,.72);

    border:1px solid rgba(255,255,255,.15);
    border-radius:10px;

    text-align:center;

    color:#ddd;

    font-size:17px;

    box-shadow:0 0 20px black;
}

/* =========================================================
   DOOR FRAMES
========================================================= */

.doorFrame{
    position:absolute;

    top:20%;

    width:15%;
    min-width:130px;
    max-width:230px;

    height:60%;

    z-index:120;

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at center,
            rgba(20,20,20,.88),
            rgba(0,0,0,.98)
        );

    border:4px solid rgba(70,70,70,.9);

    box-shadow:
        inset 0 0 55px black,
        0 0 25px rgba(0,0,0,.8);
}

#leftDoorFrame{
    left:5%;
}

#rightDoorFrame{
    right:5%;
}

/* =========================================================
   LIGHT INSIDE DOOR
========================================================= */

.doorFrame::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:5;

    opacity:0;

    pointer-events:none;

    transition:opacity .12s;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,230,.99) 0%,
            rgba(255,245,180,.92) 18%,
            rgba(255,220,80,.72) 38%,
            rgba(255,180,30,.38) 65%,
            transparent 95%
        );

    box-shadow:
        inset 0 0 45px rgba(255,245,180,.65),
        inset 0 0 110px rgba(255,190,40,.45);
}

.doorFrame.lightOn::after{
    opacity:1;
}

/* =========================================================
   MOB IN DOOR
========================================================= */

.doorEnemy{
    position:absolute;

    left:50%;
    top:52%;

    transform:
        translate(-50%,-50%)
        scale(.65);

    z-index:10;

    opacity:0;

    pointer-events:none;

    font-size:clamp(75px,8vw,135px);

    transition:
        opacity .1s,
        transform .1s;

    filter:
        drop-shadow(0 0 12px white)
        drop-shadow(0 0 28px red)
        drop-shadow(0 0 45px black);
}

.doorEnemy.visible{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

/* =========================================================
   METAL DOORS
========================================================= */

.door{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:20;

    background:
        repeating-linear-gradient(
            0deg,
            #111 0px,
            #111 30px,
            #3a3a3a 31px,
            #777 34px,
            #222 39px
        );

    border:3px solid #555;

    box-shadow:
        inset 0 0 35px black,
        0 0 40px black;

    transform:translateY(-103%);

    transition:transform .35s ease;
}

.door::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 44px,
            rgba(255,255,255,.08) 45px 48px
        );
}

.door::after{
    content:"";

    position:absolute;

    left:50%;
    top:8%;

    transform:translateX(-50%);

    width:65%;
    height:5px;

    background:#888;

    box-shadow:
        0 70px #888,
        0 140px #888,
        0 210px #888,
        0 280px #888,
        0 350px #888,
        0 420px #888;
}

.door.closed{
    transform:translateY(0);
}

/* =========================================================
   OFFICE LIGHT
========================================================= */

.lightEffect{
    position:absolute;

    top:0;

    width:38%;
    height:100%;

    z-index:90;

    opacity:0;

    pointer-events:none;

    transition:opacity .12s;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at left center,
            rgba(255,245,170,.55),
            rgba(255,220,60,.15) 42%,
            transparent 76%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at right center,
            rgba(255,245,170,.55),
            rgba(255,220,60,.15) 42%,
            transparent 76%
        );
}

.lightEffect.on{
    opacity:1;
}

/* =========================================================
   CONTROLS
========================================================= */

.sideControls{
    position:absolute;

    top:47%;

    z-index:300;

    display:flex;
    flex-direction:column;

    gap:12px;
}

#leftControls{
    left:21%;
}

#rightControls{
    right:21%;
}

.controlBtn{
    width:175px;

    padding:14px 12px;

    border:1px solid #666;
    border-radius:11px;

    background:rgba(10,10,10,.93);

    color:white;

    font-size:15px;
    font-weight:bold;

    box-shadow:0 0 18px black;

    transition:.15s;
}

.controlBtn:hover{
    transform:scale(1.03);
    background:#303030;
}

.controlBtn.lightOn{
    background:#ffd84a;
    color:#111;

    border-color:white;

    box-shadow:
        0 0 12px white,
        0 0 35px #ffd84a;
}

.controlBtn.doorOn{
    background:#b51515;

    color:white;

    border-color:#ff5555;

    box-shadow:
        0 0 15px red,
        0 0 35px rgba(255,0,0,.7);
}

/* =========================================================
   CAMERA BUTTON
========================================================= */

#cameraBtn{
    position:absolute;

    left:50%;
    bottom:25px;

    transform:translateX(-50%);

    z-index:350;

    padding:17px 35px;

    border:0;
    border-radius:14px;

    background:#086cff;
    color:white;

    font-size:18px;
    font-weight:bold;

    box-shadow:0 0 30px rgba(0,100,255,.55);

    transition:.2s;
}

#cameraBtn:hover{
    transform:
        translateX(-50%)
        scale(1.04);

    background:#277fff;
}

/* =========================================================
   SOUND
========================================================= */

#soundBtn{
    position:absolute;

    top:88px;
    left:22px;

    z-index:500;

    padding:10px 14px;

    border:1px solid #555;
    border-radius:9px;

    background:rgba(0,0,0,.82);

    color:white;

    font-weight:bold;
}

/* =========================================================
   USAGE
========================================================= */

#usage{
    position:absolute;

    top:88px;
    right:22px;

    z-index:500;

    padding:10px 13px;

    border:1px solid #444;
    border-radius:8px;

    background:rgba(0,0,0,.8);
}

.usageBar{
    display:inline-block;

    width:17px;
    height:11px;

    margin-left:3px;

    border:1px solid #555;

    background:#111;
}

.usageBar.on{
    background:#63ff4d;

    box-shadow:0 0 8px #63ff4d;
}

/* =========================================================
   CAMERA PANEL
========================================================= */

#cameraPanel{
    position:absolute;

    inset:0;

    z-index:1000;

    padding:20px;

    background:#020202;
}

.cameraHeader{
    height:65px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #333;
}

#closeCameraBtn{
    padding:12px 18px;

    border:0;
    border-radius:10px;

    background:#a00;

    color:white;

    font-weight:bold;
}

/* =========================================================
   CAMERA VIEW
========================================================= */

#cameraView{
    position:relative;

    height:calc(100vh - 105px);

    margin-top:14px;

    overflow:hidden;

    border:3px solid #333;
    border-radius:10px;

    background:
        radial-gradient(
            circle,
            #424242,
            #151515 55%,
            #020202
        );
}

#cameraView::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:30;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.05) 4px
        );

    animation:cameraNoise .14s infinite;
}

@keyframes cameraNoise{
    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(2px);
    }

    100%{
        transform:translateY(-1px);
    }
}

#cameraScene{
    position:absolute;

    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding-bottom:130px;

    color:#adb5b9;

    opacity:.38;

    text-align:center;

    font-size:clamp(25px,4vw,56px);

    letter-spacing:8px;
}

#cameraRoomIcon{
    position:absolute;

    top:43%;
    left:50%;

    transform:translate(-50%,-50%);

    font-size:160px;

    opacity:.18;
}

/* =========================================================
   ENEMIES ON CAMERAS
========================================================= */

.enemy{
    position:absolute;

    top:46%;

    z-index:20;

    font-size:135px;

    opacity:0;

    filter:
        drop-shadow(0 0 20px red)
        drop-shadow(0 0 35px black);
}

.enemy.visible{
    opacity:1;
}

#enemy1{
    left:22%;
}

#enemy2{
    right:22%;
}

#enemy3{
    left:50%;

    transform:translateX(-50%);
}

/* =========================================================
   CAMERA INFO
========================================================= */

#cameraInfo{
    position:absolute;

    left:25px;
    bottom:25px;

    z-index:50;

    min-width:280px;

    padding:15px;

    background:rgba(0,0,0,.82);

    border:1px solid #444;
    border-radius:10px;
}

#cameraInfo p{
    margin-top:8px;
    color:#aaa;
}

/* =========================================================
   CAMERA MAP
========================================================= */

#cameraMap{
    position:absolute;

    right:25px;
    bottom:25px;

    z-index:50;

    width:290px;
    height:230px;

    background:rgba(0,0,0,.92);

    border:1px solid #555;
    border-radius:12px;

    box-shadow:0 0 30px black;
}

.camBtn{
    position:absolute;

    width:78px;

    padding:9px;

    border:1px solid #666;
    border-radius:7px;

    background:#151515;

    color:white;

    font-weight:bold;
}

.camBtn:hover{
    background:#333;
}

.camBtn.active{
    background:#086cff;

    box-shadow:0 0 15px #086cff;
}

.camBtn[data-cam="0"]{
    top:25px;
    left:106px;
}

.camBtn[data-cam="1"]{
    top:78px;
    left:20px;
}

.camBtn[data-cam="2"]{
    top:78px;
    right:20px;
}

.camBtn[data-cam="3"]{
    top:132px;
    left:20px;
}

.camBtn[data-cam="4"]{
    top:132px;
    right:20px;
}

.camBtn[data-cam="5"]{
    bottom:15px;
    left:106px;
}

/* =========================================================
   JUMPSCARE
========================================================= */

#jumpscare{
    position:fixed;

    inset:0;

    z-index:10000;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #650000,
            #170000 45%,
            #000 85%
        );
}

#jumpscare.active{
    display:flex;

    animation:
        scareFlash .07s infinite,
        scareShake .055s infinite;
}

#jumpscareFace{
    font-size:min(53vw,520px);

    line-height:1;

    filter:
        drop-shadow(0 0 30px red)
        drop-shadow(0 0 65px white);

    animation:scareZoom .55s forwards;
}

#jumpscareText{
    position:absolute;

    bottom:7%;

    font-size:clamp(35px,7vw,95px);

    font-weight:900;

    letter-spacing:7px;

    text-shadow:
        0 0 15px red,
        0 0 40px red;
}

@keyframes scareZoom{
    0%{
        transform:
            scale(.1)
            rotate(-8deg);
    }

    40%{
        transform:
            scale(1.55)
            rotate(7deg);
    }

    65%{
        transform:
            scale(.9)
            rotate(-4deg);
    }

    100%{
        transform:
            scale(1.2)
            rotate(0);
    }
}

@keyframes scareShake{
    0%{
        transform:translate(0,0);
    }

    25%{
        transform:translate(-14px,7px);
    }

    50%{
        transform:translate(12px,-8px);
    }

    75%{
        transform:translate(-8px,-6px);
    }

    100%{
        transform:translate(0,0);
    }
}

@keyframes scareFlash{
    0%{
        filter:brightness(.8);
    }

    50%{
        filter:brightness(2.3);
    }

    100%{
        filter:brightness(.5);
    }
}

/* =========================================================
   END
========================================================= */

#endScreen{
    position:absolute;

    inset:0;

    z-index:2000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:#000;
}

#endTitle{
    font-size:clamp(60px,10vw,140px);

    text-shadow:
        0 0 20px red,
        0 0 50px red;
}

#endText{
    margin-top:20px;

    color:#aaa;

    font-size:21px;
}

.endButtons{
    display:flex;

    gap:12px;

    margin-top:30px;
}

.endBtn{
    padding:16px 25px;

    border:0;
    border-radius:10px;

    background:#086cff;

    color:white;

    font-size:16px;
    font-weight:bold;
}

.endBtn.gray{
    background:#222;

    border:1px solid #555;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .doorFrame{
        width:17%;
    }

    #leftDoorFrame{
        left:2%;
    }

    #rightDoorFrame{
        right:2%;
    }

    #leftControls{
        left:20%;
    }

    #rightControls{
        right:20%;
    }

    .controlBtn{
        width:145px;

        padding:11px;

        font-size:13px;
    }
}

@media(max-width:750px){

    #topbar{
        font-size:13px;
    }

    #usage{
        display:none;
    }

    .doorFrame{
        width:22%;
    }

    #leftDoorFrame{
        left:0;
    }

    #rightDoorFrame{
        right:0;
    }

    #leftControls{
        left:23%;
    }

    #rightControls{
        right:23%;
    }

    .controlBtn{
        width:105px;

        padding:9px;

        font-size:10px;
    }

    #statusBox{
        top:28%;

        width:55%;

        font-size:12px;
    }
}
</style>
</head>

<body>

<!-- ======================================================
     MENU
====================================================== -->

<section id="menu">

    <h1>
        П'ЯТЬ НОЧЕЙ В АТБ
    </h1>

    <p>
        Переживи п'ять нічних змін
    </p>

    <button
        id="playBtn"
        class="menuBtn"
    >
        ▶ ГРАТИ
    </button>

    <button
        id="resetProgressBtn"
        class="menuBtn"
    >
        ♻ СКИНУТИ ПРОГРЕС
    </button>

</section>

<!-- ======================================================
     NIGHT MENU
====================================================== -->

<section
    id="nightMenu"
    class="hidden"
>

    <h2>
        ОБЕРИ НІЧ
    </h2>

    <div class="nightButtons">

        <button class="nightBtn" data-night="1">
            🌙 Ніч 1
        </button>

        <button class="nightBtn" data-night="2">
            🌙 Ніч 2
        </button>

        <button class="nightBtn" data-night="3">
            🌙 Ніч 3
        </button>

        <button class="nightBtn" data-night="4">
            🌙 Ніч 4
        </button>

        <button class="nightBtn" data-night="5">
            🌙 Ніч 5
        </button>

    </div>

    <button
        id="backBtn"
        class="menuBtn"
    >
        ← НАЗАД
    </button>

</section>

<!-- ======================================================
     GAME
====================================================== -->

<section
    id="game"
    class="hidden"
>

    <div id="topbar">

        <div>
            🌙 Ніч:
            <span id="nightLabel">1</span>
        </div>

        <div>
            🕛
            <span id="timeLabel">12 AM</span>
        </div>

        <div>
            ⚡
            <span id="powerLabel">100</span>%
        </div>

    </div>

    <button id="soundBtn">
        🔊 ЗВУК
    </button>

    <div id="usage">

        Використання:

        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>

    </div>

    <!-- ==================================================
         OFFICE
    ================================================== -->

    <main id="office">

        <div id="statusBox">
            <span id="status">
                Перевіряй камери та бережи енергію...
            </span>
        </div>

        <!-- LIGHT -->

        <div
            id="leftLightEffect"
            class="lightEffect"
        ></div>

        <div
            id="rightLightEffect"
            class="lightEffect"
        ></div>

        <!-- LEFT DOOR -->

        <div
            id="leftDoorFrame"
            class="doorFrame"
        >

            <div
                id="leftDoorEnemy"
                class="doorEnemy"
            >
                👀
            </div>

            <div
                id="leftDoor"
                class="door"
            ></div>

        </div>

        <!-- RIGHT DOOR -->

        <div
            id="rightDoorFrame"
            class="doorFrame"
        >

            <div
                id="rightDoorEnemy"
                class="doorEnemy"
            >
                🐺
            </div>

            <div
                id="rightDoor"
                class="door"
            ></div>

        </div>

        <!-- LEFT CONTROLS -->

        <div
            id="leftControls"
            class="sideControls"
        >

            <button
                id="leftLightBtn"
                class="controlBtn"
            >
                💡 Ліве світло
            </button>

            <button
                id="leftDoorBtn"
                class="controlBtn"
            >
                🚪 Ліві двері
            </button>

        </div>

        <!-- RIGHT CONTROLS -->

        <div
            id="rightControls"
            class="sideControls"
        >

            <button
                id="rightLightBtn"
                class="controlBtn"
            >
                💡 Праве світло
            </button>

            <button
                id="rightDoorBtn"
                class="controlBtn"
            >
                🚪 Праві двері
            </button>

        </div>

        <button id="cameraBtn">
            📹 ВІДКРИТИ КАМЕРИ
        </button>

    </main>

    <!-- ==================================================
         CAMERAS
    ================================================== -->

    <section
        id="cameraPanel"
        class="hidden"
    >

        <div class="cameraHeader">

            <h2>
                🔴 SECURITY CAMERAS
            </h2>

            <button id="closeCameraBtn">
                ✖ ЗАКРИТИ
            </button>

        </div>

        <div id="cameraView">

            <div id="cameraScene">
                🚪 ВХІД
            </div>

let soundEnabled = true;
let audioContext = null;

function getAudioContext(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        audioContext =
            new AudioCtx();
    }

    if(
        audioContext.state ===
        "suspended"
    ){
        audioContext.resume();
    }

    return audioContext;
}

function beep(
    frequency = 400,
    duration = 100,
    volume = .07,
    type = "square"
){

    if(!soundEnabled){
        return;
    }

    try{

        const ctx =
            getAudioContext();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = type;

        osc.frequency.value =
            frequency;

        gain.gain.value =
            volume;

        osc.connect(gain);

        gain.connect(
            ctx.destination
        );

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime +
            duration / 1000
        );

        osc.stop(
            ctx.currentTime +
            duration / 1000
        );

    }catch(error){

        console.log(error);
    }
}

    const chance =
        .18 +
        currentNight *
        .05;

    if(
        Math.random() <
        chance &&

        enemy1Step <
        enemy1Route.length - 1
    ){

    }

    if(
        Math.random() <
        chance &&

        enemy2Step <

    if(
        Math.random() <
        chance * .8 &&

        enemy3Step <
        enemy3Route.length - 1

        enemy3Step++;

    updateDoorEnemies();

    checkEnemyAttack();

    if(camerasOpen){

        renderCamera();
    }

========================================================= */

function checkEnemyAttack(){

    if(!running){
        return;
    }

    /* LEFT 👀 */

    if(
        enemy1Position() === "left" &&
        !enemy1AttackTimer
    ){

        statusText.textContent =
            "⚠️ Щось біля лівих дверей...";

        enemy1AttackTimer =
            setTimeout(
                function(){

                    enemy1AttackTimer =
                        null;

                    if(
                        running &&
                        enemy1Position() === "left"
                    ){

                        attemptAttack(
                            "left",
                            "👀",
                            1
                        );
                    }

                },
                3000
            );
    }

    /* RIGHT 🐺 */

    if(
        enemy2Position() === "right" &&
        !enemy2AttackTimer
    ){

        statusText.textContent =
            "⚠️ Щось біля правих дверей...";

        enemy2AttackTimer =
            setTimeout(
                function(){

                    enemy2AttackTimer =
                        null;

                    if(
                        running &&
                        enemy2Position() === "right"
                    ){

                        attemptAttack(
                            "right",
                            "🐺",
                            2
                        );
                    }

                },
                3000
            );
    }

    /* DUCK 🦆 */

    if(
        enemy3Position() ===
        enemy3Side &&

        !enemy3AttackTimer
    ){

        statusText.textContent =
            enemy3Side === "left"
                ? "⚠️ Щось біля лівих дверей..."
                : "⚠️ Щось біля правих дверей...";

        enemy3AttackTimer =
            setTimeout(
                function(){

                    enemy3AttackTimer =
                        null;

                    if(
                        running &&
                        enemy3Position() ===
                        enemy3Side
                    ){

                        attemptAttack(
                            enemy3Side,
                            "🦆",
                            3
                        );
                    }

                },
                3000
            );
    }
}

/* =========================================================
   ATTACK
========================================================= */

function attemptAttack(
    side,
    icon,
    enemyNumber
){

    if(!running){
        return;
    }

    const closed =
        side === "left"
            ? leftDoorClosed
            : rightDoorClosed;

    if(closed){

        hitSound();

        statusText.textContent =
            side === "left"
                ? "💥 Ворог ударив у ліві двері!"
                : "💥 Ворог ударив у праві двері!";

        resetEnemy(
            enemyNumber
        );

        return;
    }

    showJumpscare(
        icon,
        side
    );
}

        clearTimeout(
            enemy2AttackTimer
        );

        enemy2AttackTimer =
            null;
    }

    if(number === 3){

        enemy3Step = 0;

        clearTimeout(
            enemy3AttackTimer
        );

        enemy3AttackTimer =
            null;

        enemy3Side =
            Math.random() < .5
                ? "left"
                : "right";

        createDuckRoute();
    }

    updateDoorEnemies();

    if(camerasOpen){

        renderCamera();
    }
}

/* =========================================================
   JUMPSCARE
========================================================= */

function showJumpscare(
    icon,
    side
){

    if(scareRunning){
        return;
    }

    scareRunning = true;

    running = false;

    stopTimers();

    camerasOpen = false;

    cameraPanel.classList.add(
        "hidden"
    );

    jumpscareFace.textContent =
        icon;

    jumpscare.classList.add(
        "active"
    );

    jumpscareSound();

    setTimeout(
        function(){

            jumpscare.classList.remove(
                "active"
            );

            showGameOver(
                side === "left"
                    ? "Ти не закрив ліві двері."
                    : "Ти не закрив праві двері."
            );

            scareRunning = false;

        },
        1200
    );
}

/* =========================================================
   USAGE
========================================================= */

function updateUsage(){

    let usage = 1;

    if(leftDoorClosed){
        usage++;
    }

    if(rightDoorClosed){
        usage++;
    }

    if(leftLightOn){
        usage++;
    }

    if(rightLightOn){
        usage++;
    }

    if(camerasOpen){
        usage++;
    }

    usageBars.forEach(
        function(bar,index){

            bar.classList.toggle(
                "on",
                index < usage
            );
        }
    );
}

/* =========================================================
   ⚡ FASTER POWER DRAIN
========================================================= */

function updatePower(){

    if(!running){
        return;
    }

    /*
        ВАЖЛИВО:

        updatePower запускається
        кожні 100 мс.

        Тепер енергія йде
        набагато швидше.
    */

    let drain = 0.045;

    /* ЛІВІ ДВЕРІ */

    if(leftDoorClosed){

        drain +=
            0.022;
    }

    /* ПРАВІ ДВЕРІ */

    if(rightDoorClosed){

        drain +=
            0.022;
    }

    /* ЛІВЕ СВІТЛО */

    if(leftLightOn){

        drain +=
            0.015;
    }

    /* ПРАВЕ СВІТЛО */

    if(rightLightOn){

        drain +=
            0.015;
    }

    /* КАМЕРИ */

    if(camerasOpen){

        drain +=
            0.018;
    }

    power -= drain;

    if(power <= 0){

        power = 0;

        powerLabel.textContent =
            "0";

        powerOut();

        return;
    }

    powerLabel.textContent =
        Math.floor(
            power
        );

    /* КОЛІР ЕНЕРГІЇ */

    if(power <= 20){

        powerLabel.style.color =
            "#ff3030";

    }else if(power <= 40){

        powerLabel.style.color =
            "#ffd43b";

    }else{

        powerLabel.style.color =
            "white";
    }
}

/* =========================================================
   POWER OUT
========================================================= */

function powerOut(){

    if(!running){
        return;
    }

    leftDoorClosed = false;
    rightDoorClosed = false;

    leftLightOn = false;
    rightLightOn = false;

    resetOffice();

    camerasOpen = false;

    cameraPanel.classList.add(
        "hidden"
    );

    statusText.textContent =
        "⚡ ЕНЕРГІЯ ЗАКІНЧИЛАСЯ...";

    setTimeout(
        function(){

            if(running){

                showJumpscare(
                    "👀",
                    "left"
                );
            }

        },
        2300
    );
}

/* =========================================================
   TIME
========================================================= */

function advanceTime(){

    if(!running){
        return;
    }

    hour++;

    if(hour >= 6){

        hour = 6;

        timeLabel.textContent =
            "6 AM";

        winGame();

        return;
    }

    timeLabel.textContent =
        hour +
        " AM";

    if(hour === 5){

        statusText.textContent =
            "🕔 МАЙЖЕ 6 AM!";
    }
}

/* =========================================================
   WIN
========================================================= */

function winGame(){

    if(!running){
        return;
    }

    running = false;

    stopTimers();

    camerasOpen = false;

    cameraPanel.classList.add(
        "hidden"
    );

    winSound();

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "🎉 6 AM";

    if(
        currentNight <
        5
    ){

        const nextNight =
            currentNight +
            1;

        if(
            nextNight >
            unlockedNight
        ){

            unlockedNight =
                nextNight;

            localStorage.setItem(
                "atbNight",
                String(
                    unlockedNight
                )
            );
        }

        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! Відкрито Ніч " +
            nextNight +
            ".";

    }else{

        endText.textContent =
            "🏆 ТИ ПЕРЕЖИВ УСІ П'ЯТЬ НОЧЕЙ В АТБ!";
    }

    updateNightButtons();
}

/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(reason){

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "GAME OVER";

    endText.textContent =
        reason;
}

/* =========================================================
   RESTART
========================================================= */

restartBtn.onclick =
function(){

    startGame(
        currentNight
    );
};

/* =========================================================
   BACK TO MENU
========================================================= */

menuBtn.onclick =
function(){

    stopTimers();

    running = false;

    scareRunning = false;

    jumpscare.classList.remove(
        "active"
    );

    game.classList.add(
        "hidden"
    );

    endScreen.classList.add(
        "hidden"
    );

    cameraPanel.classList.add(
        "hidden"
    );

    menu.classList.remove(
        "hidden"
    );
};

/* =========================================================
   TIMERS
========================================================= */

function startTimers(){

    /*
        POWER кожні 100ms
    */

    powerTimer =
        setInterval(
            updatePower,
            100
        );

    /*
        1 година = 20 секунд
        12 AM -> 6 AM = 2 хвилини
    */

    timeTimer =
        setInterval(
            advanceTime,
            20000
        );

    /*
        РУХ МОБІВ
    */

    enemyTimer =
        setInterval(
            moveEnemies,

            Math.max(
                2400,

                6200 -
                currentNight *
                500
            )
        );
}

function stopTimers(){

    clearInterval(
        powerTimer
    );

    clearInterval(
        timeTimer
    );

    clearInterval(
        enemyTimer
    );

    clearTimeout(
        enemy1AttackTimer
    );

    clearTimeout(
        enemy2AttackTimer
    );

    clearTimeout(
        enemy3AttackTimer
    );

    powerTimer = null;
    timeTimer = null;
    enemyTimer = null;

    enemy1AttackTimer = null;
    enemy2AttackTimer = null;
    enemy3AttackTimer = null;
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(!running){
            return;
        }

        const key =
            event.key.toLowerCase();

        /*
            A = ліве світло
            D = праве світло

            Q = ліві двері
            E = праві двері

            C = камери
            ESC = закрити камери
        */

        if(key === "a"){

            leftLightBtn.click();
        }

        if(key === "d"){

            rightLightBtn.click();
        }

        if(key === "q"){

            leftDoorBtn.click();
        }

        if(key === "e"){

            rightDoorBtn.click();
        }

        if(key === "c"){

            if(camerasOpen){

                closeCamera();

            }else{

                cameraBtn.click();
            }
        }

        if(
            event.key ===
            "Escape" &&

            camerasOpen
        ){

            closeCamera();
        }
    }
);

/* =========================================================
   START
========================================================= */

updateNightButtons();

console.log(
    "П'ЯТЬ НОЧЕЙ В АТБ — FAST POWER VERSION"
);

</script>
