<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
    font-family:inherit;
    user-select:none;
}

/* =========================================================
   MENU
========================================================= */

.screen{
    position:fixed;
    inset:0;
    z-index:5000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            #252525 0%,
            #070707 60%,
            #000 100%
        );
}

.title{
    font-size:clamp(42px,7vw,90px);
    letter-spacing:4px;

    text-shadow:
        0 0 10px #fff,
        0 0 30px red,
        0 0 70px red;
}

.subtitle{
    margin-top:15px;
    color:#aaa;
    font-size:18px;
}

.menuBtn{
    min-width:280px;

    margin-top:22px;
    padding:16px 26px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:#fff;

    font-size:18px;
    font-weight:bold;
}

.menuBtn:hover{
    background:#292929;
    transform:scale(1.03);
}

#playBtn{
    background:#0874ff;
}

/* =========================================================
   NIGHT MENU
========================================================= */

.nightButtons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;

    margin-top:25px;
}

.nightBtn{
    width:135px;
    height:105px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:#fff;

    font-size:16px;
    font-weight:bold;
}

.nightBtn span{
    display:block;
    margin-top:8px;
    color:#aaa;
    font-size:12px;
}

.nightBtn:hover:not(:disabled){
    background:#0874ff;
}

.nightBtn:disabled{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================================================
   GAME
========================================================= */

#game{
    position:fixed;
    inset:0;

    overflow:hidden;

    background:#000;
}

/* =========================================================
   OFFICE
========================================================= */

#office{
    position:absolute;
    inset:0;

    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(0,0,0,.02),
            rgba(0,0,0,.06)
        ),
        url("office.png");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    background-color:#050505;
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar{
    position:absolute;

    top:16px;
    left:50%;

    transform:translateX(-50%);

    z-index:800;

    width:min(900px,94%);

    padding:14px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,.88);

    border:1px solid #555;
    border-radius:12px;

    box-shadow:0 0 25px #000;

    font-size:18px;
    font-weight:bold;
}

#power.medium{
    color:#ffd43b;
}

#power.low{
    color:#ff3333;
    text-shadow:0 0 10px red;
}

/* =========================================================
   STATUS
========================================================= */

#statusBox{
    position:absolute;

    top:25%;
    left:50%;

    transform:translateX(-50%);

    z-index:550;

    width:min(600px,55%);

    padding:9px 14px;

    text-align:center;

    background:rgba(0,0,0,.72);

    border:1px solid #444;
    border-radius:9px;
}

/* =========================================================
   DOOR FRAME
========================================================= */

.doorFrame{
    position:absolute;

    top:21%;

    width:11.5%;
    height:56%;

    overflow:hidden;

    z-index:200;

    background:transparent;
}

#leftDoorFrame{
    left:7.2%;
}

#rightDoorFrame{
    right:7.5%;
}

/* =========================================================
   DOOR LIGHT
========================================================= */

.doorLight{
    position:absolute;
    inset:0;

    z-index:5;

    opacity:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,220,.98),
            rgba(255,215,80,.68) 35%,
            rgba(255,170,20,.2) 68%,
            transparent 95%
        );
}

.doorFrame.lightOn .doorLight{
    opacity:1;
}

/* =========================================================
   DOOR ENEMY
========================================================= */

.doorEnemy{
    position:absolute;

    left:50%;
    top:52%;

    transform:translate(-50%,-50%);

    z-index:10;

    opacity:0;

    font-size:clamp(65px,7vw,115px);

    pointer-events:none;

    filter:
        drop-shadow(0 0 10px #fff)
        drop-shadow(0 0 25px red)
        drop-shadow(0 0 35px #000);
}

.doorEnemy.visible{
    opacity:1;
}

/* =========================================================
   DOORS
========================================================= */

.door{
    position:absolute;
    inset:0;

    z-index:30;

    transform:translateY(-105%);

    transition:transform .35s ease;

    background:
        repeating-linear-gradient(
            0deg,
            #111 0px,
            #111 25px,
            #555 26px,
            #888 29px,
            #222 35px
        );

    border:2px solid #777;

    box-shadow:
        inset 0 0 30px #000;
}

.door.closed{
    transform:translateY(0);
}

/* =========================================================
   LIGHT EFFECT
========================================================= */

.lightEffect{
    position:absolute;

    top:0;

    width:35%;
    height:100%;

    opacity:0;

    z-index:100;

    pointer-events:none;

    transition:opacity .12s;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at left center,
            rgba(255,245,170,.38),
            transparent 70%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at right center,
            rgba(255,245,170,.38),
            transparent 70%
        );
}

.lightEffect.on{
    opacity:1;
}

/* =========================================================
   CONTROLS
========================================================= */

.sideControls{
    position:absolute;

    top:47%;

    z-index:700;

    display:flex;
    flex-direction:column;

    gap:10px;
}

#leftControls{
    left:22%;
}

#rightControls{
    right:22%;
}

.controlBtn{
    width:170px;

    padding:13px 8px;

    border:1px solid #666;
    border-radius:10px;

    background:rgba(5,5,5,.92);
    color:#fff;

    font-weight:bold;

    box-shadow:0 0 18px #000;
}

.controlBtn:hover{
    background:#303030;
}

.controlBtn.lightActive{
    background:#ffd63a;
    color:#111;

    box-shadow:
        0 0 12px #fff,
        0 0 25px #ffd63a;
}

.controlBtn.doorActive{
    background:#a40000;

    box-shadow:
        0 0 20px red;
}

/* =========================================================
   CAMERA BUTTON
========================================================= */

#cameraBtn{
    position:absolute;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    z-index:700;

    padding:15px 30px;

    border:0;
    border-radius:12px;

    background:#0874ff;
    color:#fff;

    font-size:17px;
    font-weight:bold;

    box-shadow:0 0 25px rgba(0,100,255,.55);
}

/* =========================================================
   SOUND
========================================================= */

#soundBtn{
    position:absolute;

    top:85px;
    left:20px;

    z-index:800;

    padding:9px 12px;

    border:1px solid #555;
    border-radius:8px;

    background:rgba(0,0,0,.85);
    color:#fff;

    font-weight:bold;
}

/* =========================================================
   PHONE
========================================================= */

#phone{
    position:fixed;

    top:85px;
    left:50%;

    transform:translateX(-50%);

    z-index:99990;

    width:min(620px,95vw);

    padding:18px;

    background:#050805;

    border:3px solid #42ff79;
    border-radius:18px;

    box-shadow:
        0 0 25px rgba(66,255,121,.5),
        0 0 80px #000;
}

#phone.ringing{
    animation:ring .16s infinite alternate;
}

@keyframes ring{
    from{
        transform:
            translateX(-50%)
            rotate(-1deg);
    }

    to{
        transform:
            translateX(-50%)
            rotate(1deg);
    }
}

.phoneHeader{
    display:flex;
    gap:14px;
    align-items:center;
}

.phoneIcon{
    width:65px;
    height:65px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    background:#159447;

    border-radius:50%;

    font-size:36px;

    box-shadow:
        0 0 20px #32ff70;
}

#callerName{
    font-size:21px;
    font-weight:900;
}

#phoneState{
    margin-top:5px;

    color:#74ff9a;

    font-weight:bold;
}

#phoneText{
    max-height:180px;

    margin-top:14px;
    padding:12px;

    overflow:auto;

    background:#090909;

    border:1px solid #333;
    border-radius:9px;

    color:#ddd;

    white-space:pre-line;

    line-height:1.5;
}

.phoneButtons{
    display:flex;
    flex-wrap:wrap;

    gap:9px;

    margin-top:14px;
}

.phoneBtn{
    flex:1;

    min-width:125px;

    padding:13px 7px;

    border:0;
    border-radius:9px;

    color:#fff;

    font-weight:bold;
}

#answerBtn{
    background:#159447;
}

#repeatVoiceBtn{
    background:#0b65c2;
}

#skipBtn{
    background:#444;
}

#hangBtn{
    background:#a31313;
}

/* =========================================================
   CAMERA PANEL
========================================================= */

#cameraPanel{
    position:fixed;
    inset:0;

    z-index:3000;

    padding:18px;

    background:#020202;
}

.cameraHeader{
    height:55px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #444;
}

#closeCamera{
    padding:10px 15px;

    border:0;
    border-radius:8px;

    background:#a00;
    color:#fff;

    font-weight:bold;
}

#cameraView{
    position:relative;

    height:calc(100vh - 90px);

    margin-top:12px;

    overflow:hidden;

    border:3px solid #333;

    background:
        radial-gradient(
            circle,
            #3b4042,
            #111 65%,
            #000
        );
}

#cameraView::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:60;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.06) 4px
        );
}

#cameraScene{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding-bottom:130px;

    opacity:.4;

    font-size:clamp(25px,4vw,55px);
}

.camEnemy{
    position:absolute;

    top:42%;

    z-index:30;

    opacity:0;

    font-size:130px;
}

.camEnemy.visible{
    opacity:1;
}

#camEnemy1{
    left:20%;
}

#camEnemy2{
    right:20%;
}

#camEnemy3{
    left:50%;
    transform:translateX(-50%);
}

#cameraInfo{
    position:absolute;

    left:20px;
    bottom:20px;

    z-index:100;

    padding:14px;

    background:rgba(0,0,0,.9);

    border:1px solid #555;
    border-radius:9px;
}

#cameraInfo p{
    margin-top:7px;
    color:#aaa;
}

#cameraMap{
    position:absolute;

    right:20px;
    bottom:20px;

    z-index:100;

    width:290px;
    height:215px;

    background:rgba(0,0,0,.9);

    border:1px solid #555;
    border-radius:10px;
}

.camBtn{
    position:absolute;

    width:78px;

    padding:8px;

    background:#151515;
    color:#fff;

    border:1px solid #555;
    border-radius:6px;

    font-weight:bold;
}

.camBtn.active{
    background:#0874ff;
}

.camBtn[data-cam="0"]{
    top:18px;
    left:106px;
}

.camBtn[data-cam="1"]{
    top:65px;
    left:20px;
}

.camBtn[data-cam="2"]{
    top:65px;
    right:20px;
}

.camBtn[data-cam="3"]{
    top:115px;
    left:20px;
}

.camBtn[data-cam="4"]{
    top:115px;
    right:20px;
}

.camBtn[data-cam="5"]{
    bottom:12px;
    left:106px;
}

/* =========================================================
   JUMPSCARE
========================================================= */

#jumpscare{
    position:fixed;
    inset:0;

    z-index:100000;

    display:none;

    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle,
            #620000,
            #180000 45%,
            #000
        );
}

#jumpscare.active{
    display:flex;

    animation:
        flash .08s infinite,
        shake .06s infinite;
}

#jumpscareFace{
    font-size:min(50vw,480px);

    animation:zoom .5s forwards;
}

#jumpscare h1{
    font-size:clamp(40px,8vw,100px);
}

@keyframes zoom{
    from{
        transform:scale(.15);
    }

    to{
        transform:scale(1.25);
    }
}

@keyframes flash{
    0%{
        filter:brightness(.6);
    }

    50%{
        filter:brightness(2);
    }

    100%{
        filter:brightness(.8);
    }
}

@keyframes shake{
    0%{transform:translate(0,0);}
    25%{transform:translate(-8px,5px);}
    50%{transform:translate(8px,-5px);}
    75%{transform:translate(-5px,-3px);}
    100%{transform:translate(0,0);}
}

/* =========================================================
   END
========================================================= */

#endScreen{
    position:fixed;
    inset:0;

    z-index:5000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#000;

    text-align:center;
}

#endTitle{
    font-size:clamp(55px,10vw,120px);
}

#endText{
    margin-top:15px;
    color:#aaa;
    font-size:20px;
}

.endBtns{
    display:flex;
    gap:10px;

    margin-top:25px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1100px){

    .doorFrame{
        width:13%;
    }

    #leftDoorFrame{
        left:5%;
    }

    #rightDoorFrame{
        right:5%;
    }

    #leftControls{
        left:20%;
    }

    #rightControls{
        right:20%;
    }

    .controlBtn{
        width:140px;
        font-size:13px;
    }
}

@media(max-width:750px){

    #topbar{
        top:5px;

        padding:9px;

        font-size:12px;
    }

    #soundBtn{
        top:57px;
        left:5px;

        font-size:10px;
    }

    #phone{
        top:52px;

        width:96vw;

        padding:11px;
    }

    .phoneIcon{
        width:43px;
        height:43px;

        font-size:25px;
    }

    #callerName{
        font-size:15px;
    }

    #phoneState{
        font-size:11px;
    }

    #phoneText{
        max-height:110px;

        font-size:12px;
    }

    .phoneBtn{
        min-width:100px;

        padding:10px 4px;

        font-size:10px;
    }

    #statusBox{
        width:45%;

        font-size:11px;
    }

    .doorFrame{
        width:18%;
    }

    #leftDoorFrame{
        left:1%;
    }

    #rightDoorFrame{
        right:1%;
    }

    #leftControls{
        left:20%;
    }

    #rightControls{
        right:20%;
    }

    .controlBtn{
        width:102px;

        padding:9px 4px;

        font-size:10px;
    }

    #cameraBtn{
        bottom:8px;

        padding:11px 15px;

        font-size:11px;
    }

    #cameraMap{
        width:240px;
        height:190px;

        right:8px;
        bottom:8px;
    }

    .camBtn{
        width:65px;

        font-size:10px;
    }

    .camBtn[data-cam="0"]{
        left:87px;
    }

    .camBtn[data-cam="5"]{
        left:87px;
    }

    #cameraInfo{
        left:8px;
        bottom:8px;

        max-width:160px;

        font-size:11px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     MENU
===================================================== -->

<section id="menu" class="screen">

    <h1 class="title">
        П'ЯТЬ НОЧЕЙ В АТБ
    </h1>

    <div class="subtitle">
        Переживи п'ять нічних змін
    </div>

    <button id="playBtn" class="menuBtn">
        ▶ ГРАТИ
    </button>

    <button id="resetBtn" class="menuBtn">
        ♻ СКИНУТИ ПРОГРЕС
    </button>

</section>

<!-- =====================================================
     NIGHT MENU
===================================================== -->

<section id="nightMenu" class="screen hidden">

    <h2 class="title">
        ОБЕРИ НІЧ
    </h2>

    <div class="subtitle">
        📞 На початку ночі дзвонить охоронець
    </div>

    <div class="nightButtons">

        <button class="nightBtn" data-night="1"></button>

        <button class="nightBtn" data-night="2"></button>

        <button class="nightBtn" data-night="3"></button>

        <button class="nightBtn" data-night="4"></button>

        <button class="nightBtn" data-night="5"></button>

    </div>

    <button id="backBtn" class="menuBtn">
        ← НАЗАД
    </button>

</section>

<!-- =====================================================
     GAME
===================================================== -->

<section id="game" class="hidden">

    <div id="topbar">

        <div>
            🌙 Ніч
            <span id="night">1</span>
        </div>

        <div>
            🕛
            <span id="clock">12 AM</span>
        </div>

        <div>
            ⚡
            <span id="power">100</span>%
        </div>

    </div>

    <button id="soundBtn">
        🔊 ЗВУК ON
    </button>

    <main id="office">

        <div id="statusBox">
            <span id="status">
                Ніч почалася...
            </span>
        </div>

        <div
            id="leftLightEffect"
            class="lightEffect"
        ></div>

        <div
            id="rightLightEffect"
            class="lightEffect"
        ></div>

        <!-- LEFT DOOR -->

        <div
            id="leftDoorFrame"
            class="doorFrame"
        >

            <div class="doorLight"></div>

            <div
                id="leftDoorEnemy"
                class="doorEnemy"
            >
                👀
            </div>

            <div
                id="leftDoor"
                class="door"
            ></div>

        </div>

        <!-- RIGHT DOOR -->

        <div
            id="rightDoorFrame"
            class="doorFrame"
        >

            <div class="doorLight"></div>

            <div
                id="rightDoorEnemy"
                class="doorEnemy"
            >
                🐺
            </div>

            <div
                id="rightDoor"
                class="door"
            ></div>

        </div>

        <!-- LEFT CONTROLS -->

        <div
            id="leftControls"
            class="sideControls"
        >

            <button
                id="leftLightBtn"
                class="controlBtn"
            >
                💡 Ліве світло
            </button>

            <button
                id="leftDoorBtn"
                class="controlBtn"
            >
                🚪 Ліві двері
            </button>

        </div>

        <!-- RIGHT CONTROLS -->

        <div
            id="rightControls"
            class="sideControls"
        >

            <button
                id="rightLightBtn"
                class="controlBtn"
            >
                💡 Праве світло
            </button>

            <button
                id="rightDoorBtn"
                class="controlBtn"
            >
                🚪 Праві двері
            </button>

        </div>

        <button id="cameraBtn">
            📹 ВІДКРИТИ КАМЕРИ
        </button>

    </main>

</section>

<!-- =====================================================
     PHONE
===================================================== -->

<div id="phone" class="hidden">

    <div class="phoneHeader">

        <div class="phoneIcon">
            📞
        </div>

        <div>

            <div id="callerName">
                ОХОРОНЕЦЬ АТБ
            </div>

            <div id="phoneState">
                📳 ВХІДНИЙ ДЗВІНОК
            </div>

        </div>

    </div>

    <div
        id="phoneText"
        class="hidden"
    ></div>

    <div class="phoneButtons">

        <button
            id="answerBtn"
            class="phoneBtn"
        >
            📞 ВІДПОВІСТИ
        </button>

        <button
            id="repeatVoiceBtn"
            class="phoneBtn hidden"
        >
            🔊 ПОВТОРИТИ ГОЛОС
        </button>

        <button
            id="skipBtn"
            class="phoneBtn hidden"
        >
            ⏭ ПРОПУСТИТИ
        </button>

        <button
            id="hangBtn"
            class="phoneBtn"
        >
            ❌ СКИНУТИ
        </button>

    </div>

</div>

<!-- =====================================================
     CAMERAS
===================================================== -->

<section id="cameraPanel" class="hidden">

    <div class="cameraHeader">

        <h2>
            🔴 SECURITY CAMERAS
        </h2>

        <button id="closeCamera">
            ✖ ЗАКРИТИ
        </button>

    </div>

    <div id="cameraView">

        <div id="cameraScene">
            CAM
        </div>

        <div
            id="camEnemy1"
            class="camEnemy"
        >
            👀
        </div>

        <div
            id="camEnemy2"
            class="camEnemy"
        >
            🐺
        </div>

        <div
            id="camEnemy3"
            class="camEnemy"
        >
            🦆
        </div>

        <div id="cameraInfo">

            <h2 id="cameraName">
                CAM 1
            </h2>

            <p id="cameraMessage">

function getAudioContext(){

            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContextClass){
            return null;
        }

        audioContext =
            new AudioContextClass();
    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }

    return audioContext;
}

/* =========================================================
   BASIC TONE
========================================================= */

function beep(
    frequency = 440,
    duration = 100,
    volume = .06,
    type = "square"
){

    if(!soundEnabled){
        return;
    }

    try{

        const ctx =
            getAudioContext();

        if(!ctx){
            return;
        }

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type =
            type;

        osc.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            volume,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime +
            duration / 1000
        );

        osc.connect(gain);

        gain.connect(
            ctx.destination
        );

        osc.start();

        osc.stop(
            ctx.currentTime +
            duration / 1000
        );

    }catch(error){

        console.log(
            "Audio error:",
            error
        );
    }
}

function chooseVoice(){

    const voices =
        loadVoices();

    if(!voices.length){

        return null;
    }

    let voice =
        voices.find(
            function(v){

                return (
                    v.lang &&
                    v.lang
                    .toLowerCase()
                    .startsWith("uk")
                );
            }
        );

    if(!voice){

        voice =
            voices.find(
                function(v){

                    return (
                        v.lang &&
                        v.lang
                        .toLowerCase()
                        .startsWith("ru")
                    );
                }
            );
    }

    if(!voice){

        voice =
            voices[0];
    }

    return voice;
}

/* =========================================================
   SPLIT SPEECH
========================================================= */

function makeSpeechParts(text){

    const parts =
        text
        .replace(
            /\n+/g,
            " "
        )
        .match(
            /[^.!?]+[.!?]+|[^.!?]+$/g
        );

    if(!parts){

        return [
            text
        ];
    }

    return parts
        .map(
            function(part){

                return part.trim();
            }
        )
        .filter(Boolean);
}

/* =========================================================
   SPEAK NEXT PART
========================================================= */

function speakNextPart(){

    if(
        speechStopped ||
        !soundEnabled
    ){

        return;
    }

    if(
        speechPartIndex >=
        speechParts.length
    ){

        activeUtterance = null;

        phoneState.textContent =
            "✅ РОЗМОВУ ЗАВЕРШЕНО";

        return;
    }

    const text =
        speechParts[
            speechPartIndex
        ];

    activeUtterance =
        new SpeechSynthesisUtterance(
            text
        );

    const selectedVoice =
        chooseVoice();

    if(selectedVoice){

        activeUtterance.voice =
            selectedVoice;

        activeUtterance.lang =
            selectedVoice.lang;

    }else{

        activeUtterance.lang =
            "uk-UA";
    }

    activeUtterance.rate =
        0.90;

    activeUtterance.pitch =
        0.82;

    activeUtterance.volume =
        1;

    activeUtterance.onstart =
    function(){

        phoneState.textContent =
            "🔊 ОХОРОНЕЦЬ ГОВОРИТЬ...";
    };

    activeUtterance.onend =
    function(){

        speechPartIndex++;

        setTimeout(
            speakNextPart,
            100
        );
    };

    activeUtterance.onerror =
    function(){

        speechPartIndex++;

        setTimeout(
            speakNextPart,
            150
        );
    };

    window.speechSynthesis.resume();

    window.speechSynthesis.speak(
        activeUtterance
    );
}

    rightDoorBtn.classList.toggle(
        "doorActive",
        rightDoorClosed
    );

    rightDoorBtn.textContent =
        rightDoorClosed
        ? "🔓 ВІДКРИТИ ПРАВІ"
        : "🚪 Праві двері";

    updateDoorEnemies();
};

/* =========================================================
   LEFT LIGHT
========================================================= */

leftLightBtn.onclick =
function(){

    if(
        !running ||
        power <= 0
    ){

        return;
    }

    getAudioContext();

    leftLightOn =
        !leftLightOn;

    lightSound();

    leftDoorFrame.classList.toggle(
        "lightOn",
        leftLightOn
    );

    leftLightEffect.classList.toggle(
        "on",
        leftLightOn
    );

    leftLightBtn.classList.toggle(
        "lightActive",
        leftLightOn
    );

    updateDoorEnemies();
};

/* =========================================================
   RIGHT LIGHT
========================================================= */

rightLightBtn.onclick =
function(){

    if(
        !running ||
        power <= 0
    ){

        return;
    }

    getAudioContext();

    rightLightOn =
        !rightLightOn;

    lightSound();

    rightDoorFrame.classList.toggle(
        "lightOn",
        rightLightOn
    );

    rightLightEffect.classList.toggle(
        "on",
        rightLightOn
    );

    rightLightBtn.classList.toggle(
        "lightActive",
        rightLightOn
    );

    updateDoorEnemies();
};

/* =========================================================
   DOOR ENEMIES
========================================================= */

function updateDoorEnemies(){

    const p1 =
        position1();

    const p2 =
        position2();

    const p3 =
        position3();

    const leftEnemy =
        p1 === "left" ||
        p3 === "left";

    const rightEnemy =
        p2 === "right" ||
        p3 === "right";

    leftDoorEnemy.textContent =
        p3 === "left"
        ? "🦆"
        : "👀";

    rightDoorEnemy.textContent =
        p3 === "right"
        ? "🦆"
        : "🐺";

    leftDoorEnemy.classList.toggle(
        "visible",

        leftEnemy &&
        leftLightOn &&
        !leftDoorClosed
    );

    rightDoorEnemy.classList.toggle(
        "visible",

        rightEnemy &&
        rightLightOn &&
        !rightDoorClosed
    );

    if(
        leftLightOn &&
        leftEnemy &&
        !leftDoorClosed
    ){

        statusText.textContent =
            "🚨 МОБ У ЛІВИХ ДВЕРЯХ!";
    }

    if(
        rightLightOn &&
        rightEnemy &&
        !rightDoorClosed
    ){

        statusText.textContent =
            "🚨 МОБ У ПРАВИХ ДВЕРЯХ!";
    }

    if(
        leftLightOn &&
        !leftEnemy
    ){

        statusText.textContent =
            "💡 Зліва нікого.";
    }

    if(
        rightLightOn &&
        !rightEnemy
    ){

        statusText.textContent =
            "💡 Справа нікого.";
    }
}

/* =========================================================
   CAMERA DATA
========================================================= */

const CAMERA_NAMES = [
    "CAM 1 — Вхід",
    "CAM 2 — Торговий зал",
    "CAM 3 — Склад",
    "CAM 4 — Лівий коридор",
    "CAM 5 — Правий коридор",
    "CAM 6 — Біля офісу"
];

const CAMERA_SCENES = [
    "🚪 ВХІД",
    "🛒 ТОРГОВИЙ ЗАЛ",
    "📦 СКЛАД",
    "⬅️ ЛІВИЙ КОРИДОР",
    "➡️ ПРАВИЙ КОРИДОР",
    "🚨 БІЛЯ ОФІСУ"
];

/* =========================================================
   CAMERA OPEN
========================================================= */

cameraBtn.onclick =
function(){

    if(!running){

        return;
    }

    getAudioContext();

    cameraOpenSound();

    camerasOpen = true;

    cameraPanel.classList.remove(
        "hidden"
    );

    renderCamera();
};

/* =========================================================
   CAMERA CLOSE
========================================================= */

closeCamera.onclick =
function(){

    cameraOpenSound();

    camerasOpen = false;

    cameraPanel.classList.add(
        "hidden"
    );
};

/* =========================================================
   CAMERA BUTTONS
========================================================= */

cameraButtons.forEach(
    function(button){

        button.onclick =
        function(){

            getAudioContext();

            cameraSwitchSound();

            selectedCamera =
                Number(
                    button.dataset.cam
                );

            renderCamera();
        };
    }
);

/* =========================================================
   RENDER CAMERA
========================================================= */

function renderCamera(){

    cameraButtons.forEach(
        function(button){

            button.classList.toggle(
                "active",

                Number(
                    button.dataset.cam
                ) ===
                selectedCamera
            );
        }
    );

    cameraName.textContent =
        CAMERA_NAMES[
            selectedCamera
        ];

    cameraScene.textContent =
        CAMERA_SCENES[
            selectedCamera
        ];

    camEnemy1.classList.remove(
        "visible"
    );

    camEnemy2.classList.remove(
        "visible"
    );

    camEnemy3.classList.remove(
        "visible"
    );

    let found = 0;

    if(
        position1() ===
        selectedCamera
    ){

        camEnemy1.classList.add(
            "visible"
        );

        found++;
    }

    if(
        position2() ===
        selectedCamera
    ){

        camEnemy2.classList.add(
            "visible"
        );

        found++;
    }

    if(
        position3() ===
        selectedCamera
    ){

        camEnemy3.classList.add(
            "visible"
        );

        found++;
    }

    if(found === 0){

        cameraMessage.textContent =
            "Нікого не видно...";

    }else if(found === 1){

        cameraMessage.textContent =
            "⚠️ ВОРОГ НА КАМЕРІ!";

    }else{

        cameraMessage.textContent =
            "🚨 КІЛЬКА ВОРОГІВ НА КАМЕРІ!";
    }
}

/* =========================================================
   MOVE ENEMIES
========================================================= */

function moveEnemies(){

    if(!running){

        return;
    }

    const chance =
        .16 +
        currentNight *
        .04;

    if(
        Math.random() <
        chance &&

        e1 <
        route1.length - 1
    ){

        e1++;
    }

    if(
        Math.random() <
        chance &&

        e2 <
        route2.length - 1
    ){

        e2++;
    }

    if(
        Math.random() <
        chance * .75 &&

        e3 <
        route3.length - 1
    ){

        e3++;
    }

    updateDoorEnemies();

    checkAttacks();

    if(camerasOpen){

        renderCamera();
    }
}

/* =========================================================
   ATTACK TIMERS
========================================================= */

function checkAttacks(){

    if(
        position1() === "left" &&
        !attack1
    ){

        statusText.textContent =
            "⚠️ Хтось біля ЛІВИХ дверей!";

        attack1 =
            setTimeout(
                function(){

                    attack1 = null;

                    if(
                        running &&
                        position1() === "left"
                    ){

                        attackEnemy(
                            "left",
                            "👀",
                            1
                        );
                    }

                },
                ATTACK_DELAY[
                    currentNight
                ]
            );
    }

    if(
        position2() === "right" &&
        !attack2
    ){

        statusText.textContent =
            "⚠️ Хтось біля ПРАВИХ дверей!";

        attack2 =
            setTimeout(
                function(){

                    attack2 = null;

                    if(
                        running &&
                        position2() === "right"
                    ){

                        attackEnemy(
                            "right",
                            "🐺",
                            2
                        );
                    }

                },
                ATTACK_DELAY[
                    currentNight
                ]
            );
    }

    if(
        position3() === duckSide &&
        !attack3
    ){

        statusText.textContent =
            duckSide === "left"
            ? "⚠️ Качка біля ЛІВИХ дверей!"
            : "⚠️ Качка біля ПРАВИХ дверей!";

        attack3 =
            setTimeout(
                function(){

                    attack3 = null;

                    if(
                        running &&
                        position3() === duckSide
                    ){

                        attackEnemy(
                            duckSide,
                            "🦆",
                            3
                        );
                    }

                },
                ATTACK_DELAY[
                    currentNight
                ]
            );
    }
}

/* =========================================================
   ATTACK
========================================================= */

function attackEnemy(
    side,
    icon,
    number
){

    const closed =
        side === "left"
        ? leftDoorClosed
        : rightDoorClosed;

    if(closed){

        enemyHitDoorSound();

        statusText.textContent =
            "💥 Ворог ударив у двері! Ти врятувався.";

        resetEnemy(
            number
        );

    }else{

        showJumpscare(
            icon,
            side
        );
    }
}

/* =========================================================
   RESET ENEMY
========================================================= */

function resetEnemy(number){

    if(number === 1){

        e1 = 0;

        clearTimeout(
            attack1
        );

        attack1 = null;
    }

    if(number === 2){

        e2 = 0;

        clearTimeout(
            attack2
        );

        attack2 = null;
    }

    if(number === 3){

        e3 = 0;

        clearTimeout(
            attack3
        );

        attack3 = null;

        duckSide =
            Math.random() < .5
            ? "left"
            : "right";

        createDuckRoute();
    }

    updateDoorEnemies();

    if(camerasOpen){

        renderCamera();
    }
}

/* =========================================================
   POWER
========================================================= */

function drainForNight(
    percent
){

    return (
        percent /
        (
            nightMs() /
            100
        )
    );
}

function updatePower(){

    if(!running){

        return;
    }

    let drain =
        drainForNight(
            40
        );

    if(leftDoorClosed){

        drain +=
            drainForNight(
                34
            );
    }

    if(rightDoorClosed){

        drain +=
            drainForNight(
                34
            );
    }

    if(leftLightOn){

        drain +=
            drainForNight(
                21
            );
    }

    if(rightLightOn){

        drain +=
            drainForNight(
                21
            );
    }

    if(camerasOpen){

        drain +=
            drainForNight(
                20
            );
    }

    power -= drain;

    if(power <= 0){

        power = 0;

        powerLabel.textContent =
            "0";

        powerOut();

        return;
    }

    powerLabel.textContent =
        Math.floor(
            power
        );

    powerLabel.classList.remove(
        "low",
        "medium"
    );

    if(power <= 20){

        powerLabel.classList.add(
            "low"
        );

    }else if(power <= 40){

        powerLabel.classList.add(
            "medium"
        );
    }
}

/* =========================================================
   POWER OUT
========================================================= */

function powerOut(){

    if(!running){

        return;
    }

    stopPhone();

    clearInterval(
        powerTimer
    );

    clearInterval(
        clockTimer
    );

    clearInterval(
        enemyTimer
    );

    leftDoorClosed = false;
    rightDoorClosed = false;

    leftLightOn = false;
    rightLightOn = false;

    camerasOpen = false;

    leftDoor.classList.remove(
        "closed"
    );

    rightDoor.classList.remove(
        "closed"
    );

    leftDoorFrame.classList.remove(
        "lightOn"
    );

    rightDoorFrame.classList.remove(
        "lightOn"
    );

    leftLightEffect.classList.remove(
        "on"
    );

    rightLightEffect.classList.remove(
        "on"
    );

    cameraPanel.classList.add(
        "hidden"
    );

    statusText.textContent =
        "⚡ ЕНЕРГІЯ ЗАКІНЧИЛАСЯ...";

    setTimeout(
        function(){

            if(running){

                showJumpscare(
                    "👀",
                    "left"
                );
            }

        },
        2800
    );
}

/* =========================================================
   CLOCK
========================================================= */

function advanceHour(){

    if(!running){

        return;
    }

    hour++;

    if(hour >= 6){

        hour = 6;

        clockLabel.textContent =
            "6 AM";

        winGame();

        return;
    }

    clockLabel.textContent =
        hour +
        " AM";

    if(hour === 5){

        statusText.textContent =
            "🕔 МАЙЖЕ 6 AM!";
    }
}

/* =========================================================
   JUMPSCARE
========================================================= */

function showJumpscare(
    icon,
    side
){

    if(!running){

        return;
    }

    running = false;

    stopTimers();

    stopPhone();

    cameraPanel.classList.add(
        "hidden"
    );

    jumpscareFace.textContent =
        icon;

    jumpscare.classList.add(
        "active"
    );

    jumpscareSound();

    setTimeout(
        function(){

            jumpscare.classList.remove(
                "active"
            );

            showGameOver(
                side === "left"
                ? "Ти не закрив ліві двері."
                : "Ти не закрив праві двері."
            );

        },
        1200
    );
}

/* =========================================================
   WIN
========================================================= */

function winGame(){

    running = false;

    stopTimers();

    stopPhone();

    cameraPanel.classList.add(
        "hidden"
    );

    winSound();

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "🎉 6 AM";

    if(currentNight < 5){

        const next =
            currentNight + 1;

        if(
            next >
            unlockedNight
        ){

            unlockedNight =
                next;

            localStorage.setItem(
                "atbNight",
                String(next)
            );
        }

        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! Відкрито ніч " +
            next +
            ".";

    }else{

        endText.textContent =
            "🏆 ТИ ПРОЙШОВ УСІ 5 НОЧЕЙ В АТБ!";
    }

    updateNightButtons();
}

/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(
    reason
){

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "GAME OVER";

    endText.textContent =
        reason;
}

/* =========================================================
   END BUTTONS
========================================================= */

restartBtn.onclick =
function(){

    getAudioContext();

    startGame(
        currentNight
    );
};

menuBtn.onclick =
function(){

    running = false;

    stopTimers();

    stopPhone();

    game.classList.add(
        "hidden"
    );

    endScreen.classList.add(
        "hidden"
    );

    cameraPanel.classList.add(
        "hidden"
    );

    menu.classList.remove(
        "hidden"
    );
};

/* =========================================================
   TIMERS
========================================================= */

function startTimers(){

    powerTimer =
        setInterval(
            updatePower,
            100
        );

    clockTimer =
        setInterval(
            advanceHour,
            hourMs()
        );

    enemyTimer =
        setInterval(
            moveEnemies,
            MOVE_TIME[
                currentNight
            ]
        );
}

function stopTimers(){

    clearInterval(
        powerTimer
    );

    clearInterval(
        clockTimer
    );

    clearInterval(
        enemyTimer
    );

    clearTimeout(
        attack1
    );

    clearTimeout(
        attack2
    );

    clearTimeout(
        attack3
    );

    powerTimer = null;
    clockTimer = null;
    enemyTimer = null;

    attack1 = null;
    attack2 = null;
    attack3 = null;
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(!running){

            return;
        }

        getAudioContext();

        const key =
            event.key
            .toLowerCase();

        if(key === "a"){

            leftLightBtn.click();
        }

        if(key === "d"){

            rightLightBtn.click();
        }

        if(key === "q"){

            leftDoorBtn.click();
        }

        if(key === "e"){

            rightDoorBtn.click();
        }

        if(key === "c"){

            if(camerasOpen){

                closeCamera.click();

            }else{

                cameraBtn.click();
            }
        }

        if(
            event.key === "Escape" &&
            camerasOpen
        ){

            closeCamera.click();
        }
    }
);

/* =========================================================
   INIT
========================================================= */

updateNightButtons();

loadVoices();

console.log(
    "П'ЯТЬ НОЧЕЙ В АТБ — ALL SOUNDS + PHONE VOICE"
);
</script>
