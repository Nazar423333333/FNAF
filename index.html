<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;

    background:#000;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;

    user-select:none;

    font-family:inherit;

    touch-action:manipulation;
}

/* =========================================================
   MENU
========================================================= */

.screen{
    position:fixed;

    inset:0;

    z-index:5000;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            #252525 0%,
            #070707 60%,
            #000 100%
        );
}

.title{
    font-size:
        clamp(
            40px,
            7vw,
            90px
        );

    letter-spacing:4px;

    text-shadow:
        0 0 10px #fff,
        0 0 30px #ff0000,
        0 0 70px #ff0000;
}

.subtitle{
    margin-top:15px;

    color:#aaa;

    font-size:18px;
}

.menuBtn{
    min-width:280px;

    margin-top:22px;

    padding:16px 26px;

    border:1px solid #555;

    border-radius:12px;

    background:#151515;

    color:#fff;

    font-size:18px;

    font-weight:bold;

    transition:.15s;
}

.menuBtn:hover{
    background:#292929;

    transform:scale(1.03);
}

#playBtn{
    background:#0874ff;
}

/* =========================================================
   NIGHT MENU
========================================================= */

.nightButtons{
    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:12px;

    margin-top:25px;
}

.nightBtn{
    width:135px;

    height:105px;

    border:1px solid #555;

    border-radius:12px;

    background:#151515;

    color:#fff;

    font-size:16px;

    font-weight:bold;

    transition:.15s;
}

.nightBtn span{
    display:block;

    margin-top:8px;

    color:#aaa;

    font-size:12px;
}

.nightBtn:hover:not(:disabled){
    background:#0874ff;

    transform:
        translateY(-2px);
}

.nightBtn:disabled{
    opacity:.3;

    cursor:not-allowed;
}

/* =========================================================
   GAME
========================================================= */

#game{
    position:fixed;

    inset:0;

    overflow:hidden;

    background:#000;
}

/* =========================================================
   OFFICE BACKGROUND
========================================================= */

#office{
    position:absolute;

    inset:0;

    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(0,0,0,.02),
            rgba(0,0,0,.06)
        ),
        url("office.png");

    background-size:cover;

    background-position:center center;

    background-repeat:no-repeat;

    background-color:#050505;
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar{
    position:absolute;

    top:16px;

    left:50%;

    transform:
        translateX(-50%);

    z-index:800;

    width:
        min(
            900px,
            94%
        );

    padding:14px 20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:
        rgba(
            0,
            0,
            0,
            .88
        );

    border:
        1px solid #555;

    border-radius:12px;

    box-shadow:
        0 0 25px #000;

    font-size:18px;

    font-weight:bold;
}

#power.medium{
    color:#ffd43b;
}

#power.low{
    color:#ff3333;

    text-shadow:
        0 0 10px red;
}

/* =========================================================
   STATUS
========================================================= */

#statusBox{
    position:absolute;

    top:25%;

    left:50%;

    transform:
        translateX(-50%);

    z-index:550;

    width:
        min(
            600px,
            55%
        );

    padding:9px 14px;

    text-align:center;

    background:
        rgba(
            0,
            0,
            0,
            .72
        );

    border:
        1px solid #444;

    border-radius:9px;

    box-shadow:
        0 0 15px #000;
}

/* =========================================================
   AUDIO CONTROLS
========================================================= */

#audioControls{
    position:absolute;

    top:82px;

    left:15px;

    z-index:900;

    display:flex;

    flex-direction:column;

    gap:7px;
}

.audioBtn{
    min-width:145px;

    padding:9px 10px;

    border:
        1px solid #555;

    border-radius:8px;

    background:
        rgba(
            0,
            0,
            0,
            .88
        );

    color:#fff;

    font-size:12px;

    font-weight:bold;
}

#effectsBtn.active{
    background:#123a20;

    border-color:#35cf65;

    box-shadow:
        0 0 10px
        rgba(
            53,
            207,
            101,
            .45
        );
}

#musicOnBtn.active{
    background:#126a35;

    border-color:#4cff7c;

    box-shadow:
        0 0 12px
        rgba(
            76,
            255,
            124,
            .5
        );
}

#musicOffBtn.active{
    background:#7b1717;

    border-color:#ff5050;

    box-shadow:
        0 0 12px
        rgba(
            255,
            60,
            60,
            .45
        );
}

/* =========================================================
   USAGE
========================================================= */

#usage{
    position:absolute;

    top:82px;

    right:15px;

    z-index:900;

    min-width:225px;

    padding:11px 13px;

    background:
        rgba(
            0,
            0,
            0,
            .88
        );

    border:
        1px solid #555;

    border-radius:9px;

    box-shadow:
        0 0 18px #000;

    font-size:13px;

    font-weight:bold;
}

#usageTitle{
    display:block;

    margin-bottom:7px;
}

#usageBars{
    display:flex;

    gap:5px;
}

.usageBar{
    width:25px;

    height:12px;

    border:
        1px solid #555;

    border-radius:2px;

    background:#151515;

    transition:.15s;
}

.usageBar.on{
    background:#63ff4d;

    box-shadow:
        0 0 6px #63ff4d,
        0 0 12px
        rgba(
            99,
            255,
            77,
            .5
        );
}

.usageBar.warning{
    background:#ffd43b;

    box-shadow:
        0 0 8px #ffd43b;
}

.usageBar.danger{
    background:#ff3030;

    box-shadow:
        0 0 9px red;
}

/* =========================================================
   DOOR FRAMES
========================================================= */

.doorFrame{
    position:absolute;

    top:21%;

    width:11.5%;

    height:56%;

    z-index:200;

    overflow:hidden;

    background:transparent;
}

#leftDoorFrame{
    left:7.2%;
}

#rightDoorFrame{
    right:7.5%;
}

/* =========================================================
   DOOR LIGHT
========================================================= */

.doorLight{
    position:absolute;

    inset:0;

    z-index:5;

    opacity:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(
                255,
                255,
                220,
                .98
            ),
            rgba(
                255,
                215,
                80,
                .68
            ) 35%,
            rgba(
                255,
                170,
                20,
                .20
            ) 68%,
            transparent 95%
        );
}

.doorFrame.lightOn .doorLight{
    opacity:1;
}

/* =========================================================
   MOB AT DOOR
========================================================= */

.doorEnemy{
    position:absolute;

    left:50%;

    top:52%;

    transform:
        translate(
            -50%,
            -50%
        );

    z-index:10;

    opacity:0;

    pointer-events:none;

    font-size:
        clamp(
            65px,
            7vw,
            115px
        );

    filter:
        drop-shadow(
            0 0 10px #fff
        )
        drop-shadow(
            0 0 25px red
        )
        drop-shadow(
            0 0 35px #000
        );
}

.doorEnemy.visible{
    opacity:1;
}

/* =========================================================
   METAL DOORS
========================================================= */

.door{
    position:absolute;

    inset:0;

    z-index:30;

    transform:
        translateY(-105%);

    transition:
        transform .35s ease;

    background:
        repeating-linear-gradient(
            0deg,
            #111 0px,
            #111 25px,
            #555 26px,
            #888 29px,
            #222 35px
        );

    border:
        2px solid #777;

    box-shadow:
        inset
        0 0 30px #000;
}

.door.closed{
    transform:
        translateY(0);
}

/* =========================================================
   LIGHT EFFECT
========================================================= */

.lightEffect{
    position:absolute;

    top:0;

    width:35%;

    height:100%;

    z-index:100;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .12s;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at left center,
            rgba(
                255,
                245,
                170,
                .38
            ),
            transparent 70%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at right center,
            rgba(
                255,
                245,
                170,
                .38
            ),
            transparent 70%
        );
}

.lightEffect.on{
    opacity:1;
}

/* =========================================================
   SIDE CONTROLS
========================================================= */

.sideControls{
    position:absolute;

    top:47%;

    z-index:700;

    display:flex;

    flex-direction:column;

    gap:10px;
}

#leftControls{
    left:22%;
}

#rightControls{
    right:22%;
}

.controlBtn{
    width:170px;

    padding:13px 8px;

    border:
        1px solid #666;

    border-radius:10px;

    background:
        rgba(
            5,
            5,
            5,
            .92
        );

    color:#fff;

    font-weight:bold;

    box-shadow:
        0 0 18px #000;

    transition:.15s;
}

.controlBtn:hover{
    background:#303030;
}

.controlBtn.lightActive{
    background:#ffd63a;

    color:#111;

    box-shadow:
        0 0 12px #fff,
        0 0 25px #ffd63a;
}

.controlBtn.doorActive{
    background:#a40000;

    box-shadow:
        0 0 20px red;
}

/* =========================================================
   CAMERA OPEN BUTTON
========================================================= */

#cameraBtn{
    position:absolute;

    bottom:20px;

    left:50%;

    transform:
        translateX(-50%);

    z-index:700;

    padding:15px 30px;

    border:0;

    border-radius:12px;

    background:#0874ff;

    color:#fff;

    font-size:17px;

    font-weight:bold;

    box-shadow:
        0 0 25px
        rgba(
            0,
            100,
            255,
            .55
        );
}

/* =========================================================
   PHONE
========================================================= */

#phone{
    position:fixed;

    top:85px;

    left:50%;

    transform:
        translateX(-50%);

    z-index:99990;

    width:
        min(
            620px,
            95vw
        );

    padding:18px;

    background:#050805;

    border:
        3px solid #42ff79;

    border-radius:18px;

    box-shadow:
        0 0 25px
        rgba(
            66,
            255,
            121,
            .5
        ),
        0 0 80px #000;
}

#phone.ringing{
    animation:
        ring .16s infinite alternate;
}

@keyframes ring{

    from{
        transform:
            translateX(-50%)
            rotate(-1deg);
    }

    to{
        transform:
            translateX(-50%)
            rotate(1deg);
    }
}

.phoneHeader{
    display:flex;

    align-items:center;

    gap:14px;
}

.phoneIcon{
    width:65px;

    height:65px;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-shrink:0;

    border-radius:50%;

    background:#159447;

    font-size:36px;

    box-shadow:
        0 0 20px #32ff70;
}

#callerName{
    font-size:21px;

    font-weight:900;
}

#phoneState{
    margin-top:5px;

    color:#74ff9a;

    font-weight:bold;
}

#phoneText{
    max-height:180px;

    margin-top:14px;

    padding:12px;

    overflow:auto;

    background:#090909;

    border:
        1px solid #333;

    border-radius:9px;

    color:#ddd;

    white-space:pre-line;

    line-height:1.5;
}

.phoneButtons{
    display:flex;

    flex-wrap:wrap;

    gap:9px;

    margin-top:14px;
}

.phoneBtn{
    flex:1;

    min-width:125px;

    padding:13px 7px;

    border:0;

    border-radius:9px;

    color:#fff;

    font-weight:bold;
}

#answerBtn{
    background:#159447;
}

#repeatVoiceBtn{
    background:#0b65c2;
}

#skipBtn{
    background:#444;
}

#hangBtn{
    background:#a31313;
}

/* =========================================================
   CAMERA PANEL
========================================================= */

#cameraPanel{
    position:fixed;

    inset:0;

    z-index:3000;

    padding:18px;

    background:#020202;
}

.cameraHeader{
    height:55px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    border-bottom:
        1px solid #444;
}

.cameraHeader h2{
    letter-spacing:2px;
}

#closeCamera{
    padding:10px 15px;

    border:0;

    border-radius:8px;

    background:#a00;

    color:#fff;

    font-weight:bold;
}

/* =========================================================
   CAMERA VIEW
========================================================= */

#cameraView{
    position:relative;

    height:
        calc(
            100vh - 90px
        );

    margin-top:12px;

    overflow:hidden;

    border:
        3px solid #333;

    border-radius:8px;

    background-color:#000;

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;
}

/* =========================================================
   CAMERA DARK EFFECT
========================================================= */

#cameraVignette{
    position:absolute;

    inset:0;

    z-index:15;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(
                0,
                0,
                0,
                .30
            ) 70%,
            rgba(
                0,
                0,
                0,
                .78
            ) 100%
        );
}

/* =========================================================
   CAMERA SCANLINES
========================================================= */

#cameraScanlines{
    position:absolute;

    inset:0;

    z-index:50;

    pointer-events:none;

    opacity:.45;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(
                255,
                255,
                255,
                .07
            ) 4px
        );
}

/* =========================================================
   CAMERA NOISE
========================================================= */

#cameraNoise{
    position:absolute;

    inset:-20px;

    z-index:51;

    pointer-events:none;

    opacity:.11;

    background-image:
        repeating-radial-gradient(
            circle at 30% 40%,
            rgba(
                255,
                255,
                255,
                .5
            ) 0px,
            rgba(
                255,
                255,
                255,
                .5
            ) 1px,
            transparent 1px,
            transparent 4px
        );

    animation:
        cameraNoiseMove
        .16s
        infinite;
}

@keyframes cameraNoiseMove{

    0%{
        transform:
            translate(0,0);
    }

    25%{
        transform:
            translate(-6px,3px);
    }

    50%{
        transform:
            translate(5px,-4px);
    }

    75%{
        transform:
            translate(-2px,-6px);
    }

    100%{
        transform:
            translate(4px,2px);
    }
}

/* =========================================================
   CAMERA SWITCH FLASH
========================================================= */

#cameraFlash{
    position:absolute;

    inset:0;

    z-index:200;

    pointer-events:none;

    opacity:0;

    background:#fff;
}

#cameraFlash.flash{
    animation:
        cameraFlashAnim .18s;
}

@keyframes cameraFlashAnim{

    0%{
        opacity:.85;
    }

    35%{
        opacity:.2;
    }

    100%{
        opacity:0;
    }
}

/* =========================================================
   CAMERA LABEL
========================================================= */

#cameraLabel{
    position:absolute;

    top:18px;

    left:20px;

    z-index:100;

    padding:8px 12px;

    background:
        rgba(
            0,
            0,
            0,
            .75
        );

    border:
        1px solid #777;

    border-radius:6px;

    font-size:16px;

    font-weight:900;

    text-shadow:
        0 0 5px #fff;
}

#cameraRec{
    position:absolute;

    top:18px;

    right:20px;

    z-index:100;

    padding:8px 12px;

    background:
        rgba(
            0,
            0,
            0,
            .75
        );

    border:
        1px solid #777;

    border-radius:6px;

    color:#ff3535;

    font-weight:bold;
}

#cameraRec::before{
    content:"● ";

    animation:
        recBlink .8s infinite;
}

@keyframes recBlink{

    0%,
    49%{
        opacity:1;
    }

    50%,
    100%{
        opacity:.2;
    }
}

/* =========================================================
   CAMERA MOBS
========================================================= */

.camEnemy{
    position:absolute;

    top:43%;

    z-index:30;

    opacity:0;

    font-size:
        clamp(
            80px,
            10vw,
            170px
        );

    filter:
        drop-shadow(
            0 0 12px #fff
        )
        drop-shadow(
            0 0 25px red
        )
        drop-shadow(
            0 0 40px #000
        );

    transition:
        opacity .12s;
}

.camEnemy.visible{
    opacity:1;
}

#camEnemy1{
    left:18%;
}

#camEnemy2{
    right:18%;
}

#camEnemy3{
    left:50%;

    transform:
        translateX(-50%);
}

/* =========================================================
   CAMERA INFO
========================================================= */

#cameraInfo{
    position:absolute;

    left:20px;

    bottom:20px;

    z-index:100;

    min-width:270px;

    padding:14px;

    background:
        rgba(
            0,
            0,
            0,
            .86
        );

    border:
        1px solid #555;

    border-radius:9px;
}

#cameraInfo p{
    margin-top:7px;

    color:#aaa;
}

/* =========================================================
   CAMERA MAP
========================================================= */

#cameraMap{
    position:absolute;

    right:20px;

    bottom:20px;

    z-index:100;

    width:290px;

    height:215px;

    background:
        rgba(
            0,
            0,
            0,
            .86
        );

    border:
        1px solid #777;

    border-radius:10px;

    box-shadow:
        0 0 25px #000;
}

.camBtn{
    position:absolute;

    width:78px;

    padding:8px;

    border:
        1px solid #777;

    border-radius:6px;

    background:#151515;

    color:#fff;

    font-weight:bold;
}

.camBtn:hover{
    background:#343434;
}

.camBtn.active{
    background:#0874ff;

    box-shadow:
        0 0 14px #0874ff;
}

.camBtn[data-cam="0"]{
    top:18px;

    left:106px;
}

.camBtn[data-cam="1"]{
    top:65px;

    left:20px;
}

.camBtn[data-cam="2"]{
    top:65px;

    right:20px;
}

.camBtn[data-cam="3"]{
    top:115px;

    left:20px;
}

.camBtn[data-cam="4"]{
    top:115px;

    right:20px;
}

.camBtn[data-cam="5"]{
    bottom:12px;

    left:106px;
}

/* =========================================================
   JUMPSCARE
========================================================= */

#jumpscare{
    position:fixed;

    inset:0;

    z-index:100000;

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    background:
        radial-gradient(
            circle,
            #620000,
            #180000 45%,
            #000
        );
}

#jumpscare.active{
    display:flex;

    animation:
        scareFlash .08s infinite,
        scareShake .06s infinite;
}

#jumpscareFace{
    font-size:
        min(
            50vw,
            480px
        );

    animation:
        scareZoom .5s forwards;
}

#jumpscare h1{
    font-size:
        clamp(
            40px,
            8vw,
            100px
        );
}

@keyframes scareZoom{

    from{
        transform:
            scale(.15);
    }

    to{
        transform:
            scale(1.25);
    }
}

@keyframes scareFlash{

    0%{
        filter:
            brightness(.6);
    }

    50%{
        filter:
            brightness(2);
    }

    100%{
        filter:
            brightness(.8);
    }
}

@keyframes scareShake{

    0%{
        transform:
            translate(0,0);
    }

    25%{
        transform:
            translate(-8px,5px);
    }

    50%{
        transform:
            translate(8px,-5px);
    }

    75%{
        transform:
            translate(-5px,-3px);
    }

    100%{
        transform:
            translate(0,0);
    }
}

/* =========================================================
   END SCREEN
========================================================= */

#endScreen{
    position:fixed;

    inset:0;

    z-index:5000;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:#000;

    text-align:center;
}

#endTitle{
    font-size:
        clamp(
            55px,
            10vw,
            120px
        );
}

#endText{
    margin-top:15px;

    color:#aaa;

    font-size:20px;
}

.endBtns{
    display:flex;

    gap:10px;

    margin-top:25px;
}

/* =========================================================
   TABLET
========================================================= */

@media(max-width:1100px){

    .doorFrame{
        width:13%;
    }

    #leftDoorFrame{
        left:5%;
    }

    #rightDoorFrame{
        right:5%;
    }

    #leftControls{
        left:20%;
    }

    #rightControls{
        right:20%;
    }

    try{

        audio.pause();

    }

/* =========================================================
   ENERGY
========================================================= */

function drainForNight(
    percent
){

    return (
        percent /
        (
            nightMs() /
            100
        )
    );
}

function updatePower(){

    if(
        !running ||
        powerOutActive
    ){

        return;
    }

    let drain =
        drainForNight(
            40
        );

    if(
        leftDoorClosed
    ){

        drain +=
            drainForNight(
                34
            );
    }

    if(
        rightDoorClosed
    ){

        drain +=
            drainForNight(
                34
            );
    }

    if(
        leftLightOn
    ){

        drain +=
            drainForNight(
                21
            );
    }

    if(
        rightLightOn
    ){

        drain +=
            drainForNight(
                21
            );
    }

    if(
        camerasOpen
    ){

        drain +=
            drainForNight(
                20
            );
    }

    power -=
        drain;

    if(
        power <=
        0
    ){

        power =
            0;

        powerLabel.textContent =
            "0";

        powerOut();

        return;
    }

    powerLabel.textContent =
        Math.floor(
            power
        );

    powerLabel.classList.remove(
        "low",
        "medium"
    );

    if(
        power <=
        20
    ){

        powerLabel.classList.add(
            "low"
        );

    }else if(
        power <=
        40
    ){

        powerLabel.classList.add(
            "medium"
        );
    }
}

                        "ringing"
                    )
                ){

                    playSound(
                        soundAlarm,
                        .65
                    );

                }else{

                    stopPhoneRinging();
                }

            },

            2800
        );
}

function stopPhoneRinging(){

    clearInterval(
        phoneRingTimer
    );

    phoneRingTimer =
        null;

    stopSound(
        soundAlarm
    );
}

/* =========================================================
   PHONE SPEECH VARIABLES
========================================================= */

let cachedVoices =
    [];

let activeUtterance =
    null;

let speechParts =
    [];

let speechPartIndex =
    0;

let speechStopped =
    false;

/* =========================================================
   LOAD VOICES
========================================================= */

function loadVoices(){

    if(
        !(
            "speechSynthesis"
            in window
        )
    ){

        return [];
    }

    cachedVoices =
        window
        .speechSynthesis
        .getVoices();

    return cachedVoices;
}

if(
    "speechSynthesis"
    in window
){

    loadVoices();

    window
    .speechSynthesis
    .onvoiceschanged =
    function(){

        loadVoices();
    };
}

/* =========================================================
   CHOOSE VOICE
========================================================= */

function chooseVoice(){

    const voices =
        loadVoices();

    if(
        !voices.length
    ){

        return null;
    }

    let voice =
        voices.find(
            function(v){

                return (
                    v.lang &&
                    v.lang
                    .toLowerCase()
                    .startsWith(
                        "uk"
                    )
                );
            }
        );

    if(
        !voice
    ){

        voice =
            voices.find(
                function(v){

                    return (
                        v.lang &&
                        v.lang
                        .toLowerCase()
                        .startsWith(
                            "ru"
                        )
                    );
                }
            );
    }

    if(
        !voice
    ){

        voice =
            voices[0];
    }

    return voice;
}

/* =========================================================
   SPLIT PHONE TEXT
========================================================= */

function makeSpeechParts(
    text
){

    const parts =
        text
        .replace(
            /\n+/g,
            " "
        )
        .match(
            /[^.!?]+[.!?]+|[^.!?]+$/g
        );

    if(
        !parts
    ){

        return [
            text
        ];
    }

    return parts
        .map(
            function(part){

                return part.trim();
            }
        )
        .filter(Boolean);
}

   SHOW PHONE CALL
========================================================= */

function showPhoneCall(){

    if(

/* =========================================================
   SPEAK PHONE GUY
========================================================= */

function speakPhoneGuy(){

    if(
        !(
            "speechSynthesis"
            in window
        ) ||
        !(
            "SpeechSynthesisUtterance"
            in window
        )
    ){

        phoneState.textContent =
            "❌ ГОЛОС НЕ ПІДТРИМУЄТЬСЯ";

        return;
    }

    lowerMusic();

    window
    .speechSynthesis
    .cancel();

    window
    .speechSynthesis
    .resume();

    speechStopped =
        false;

    speechParts =
        makeSpeechParts(
            PHONE_TEXT[
                currentNight
            ]
        );

    speechPartIndex =
        0;

    phoneState.textContent =
        "🔊 ОХОРОНЕЦЬ ГОВОРИТЬ...";

    setTimeout(
        speakNextPart,
        120
    );
}

/* =========================================================
   SPEAK NEXT PART
========================================================= */

function speakNextPart(){

    if(
        speechStopped
    ){

        return;
    }

    if(
        speechPartIndex >=
        speechParts.length
    ){

        activeUtterance =
            null;

        phoneState.textContent =
            "✅ РОЗМОВУ ЗАВЕРШЕНО";

        restoreMusic();

        return;
    }

    const text =
        speechParts[
            speechPartIndex
        ];

    activeUtterance =
        new SpeechSynthesisUtterance(
            text
        );

    const voice =
        chooseVoice();

    if(
        voice
    ){

        activeUtterance.voice =
            voice;

        activeUtterance.lang =
            voice.lang;

    }else{

        activeUtterance.lang =
            "uk-UA";
    }

    activeUtterance.rate =
        .90;

    activeUtterance.pitch =
        .82;

    activeUtterance.volume =
        1;

    activeUtterance.onstart =
    function(){

        phoneState.textContent =
            "🔊 ОХОРОНЕЦЬ ГОВОРИТЬ...";
    };

    activeUtterance.onend =
    function(){

        speechPartIndex++;

        setTimeout(
            speakNextPart,
            100
        );
    };

    activeUtterance.onerror =
    function(){

        speechPartIndex++;

        setTimeout(
            speakNextPart,
            120
        );
    };

    window
    .speechSynthesis
    .resume();

    window
    .speechSynthesis
    .speak(
        activeUtterance
    );
}

/* =========================================================
   STOP SPEECH
========================================================= */

function stopSpeech(){

    speechStopped =
        true;

    speechParts =
        [];

    speechPartIndex =
        0;

    activeUtterance =
        null;

    if(
        "speechSynthesis"
        in window
    ){

        window
        .speechSynthesis
        .cancel();
    }

    restoreMusic();
}

/* =========================================================
   CLOSE PHONE
========================================================= */

function closePhone(){

    stopPhoneRinging();

    stopSpeech();

    phone.classList.add(
        "hidden"

    phone.classList.remove(
        "ringing"

}

            );

            currentNight +

            next +
            ".";

        endText.textContent =
            "🏆 ТИ ПРОЙШОВ УСІ 5 НОЧЕЙ В АТБ!";

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            !running
        ){

            return;
        }

        const key =
            event.key
            .toLowerCase();

        if(
            key ===
            "a"
        ){

            leftLightBtn.click();
        }

        if(
            key ===
            "d"
        ){

            rightLightBtn.click();
        }

        if(
            key ===
            "q"
        ){

            leftDoorBtn.click();
        }

        if(
            key ===
            "e"
        ){

            rightDoorBtn.click();
        }

        if(
            key ===
            "c"
        ){

            if(
                camerasOpen
            ){

                closeCamera.click();

            }else{

                cameraBtn.click();
            }
        }

        if(
            event.key ===
            "Escape" &&
            camerasOpen
        ){

            closeCamera.click();
        }
    }
);
