<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#030303;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font-family:inherit;
}

.hidden{
    display:none !important;
}

/* =========================================================
   MENU
========================================================= */

#menu,
#nightSelect{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.025) 4px
        ),
        radial-gradient(
            circle at center,
            #202020,
            #080808 55%,
            #000
        );
}

.menu-title{
    font-size:clamp(42px,7vw,100px);
    letter-spacing:6px;

    text-shadow:
        0 0 8px white,
        0 0 25px red,
        0 0 80px rgba(255,0,0,.45);
}

.menu-subtitle{
    margin-top:15px;
    color:#aaa;
    font-size:19px;
}

.menu-buttons{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:45px;
}

.menu-btn{
    min-width:270px;
    padding:17px 30px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
    transition:.18s;
}

.menu-btn:hover{
    background:#292929;
    transform:scale(1.05);
}

.menu-btn.primary{
    background:linear-gradient(135deg,#1680ff,#003b9d);
    border-color:#4398ff;
    box-shadow:0 0 30px rgba(0,100,255,.4);
}

/* =========================================================
   NIGHT SELECT
========================================================= */

#nightSelect h2{
    font-size:48px;
    margin-bottom:35px;
}

.night-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;
    max-width:700px;
}

.night-btn{
    width:115px;
    height:100px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:white;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
    transition:.18s;
}

.night-btn:hover:not(:disabled){
    background:#0875ff;
    transform:translateY(-4px);
}

.night-btn.locked{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================================================
   GAME
========================================================= */

#game{
    position:fixed;
    inset:0;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #292929 0%,
            #111 45%,
            #020202 100%
        );
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar{
    position:absolute;

    top:18px;
    left:50%;
    transform:translateX(-50%);

    z-index:60;

    width:min(950px,94%);

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px 24px;

    border:1px solid #444;
    border-radius:15px;

    background:rgba(0,0,0,.85);

    box-shadow:0 0 35px #000;

    font-size:19px;
}

/* =========================================================
   OFFICE
========================================================= */

#office{
    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.012) 0,
            rgba(255,255,255,.012) 2px,
            transparent 2px,
            transparent 7px
        );
}

.office-center{
    position:absolute;

    top:37%;
    left:50%;

    transform:translate(-50%,-50%);

    width:75%;

    text-align:center;
}

.office-center h1{
    font-size:clamp(38px,6vw,86px);
    letter-spacing:5px;

    text-shadow:
        0 0 8px #fff,
        0 0 28px red,
        0 0 70px rgba(255,0,0,.4);
}

#status{
    margin-top:22px;

    min-height:30px;

    color:#bbb;
    font-size:19px;
}

/* =========================================================
   USAGE
========================================================= */

#usage{
    position:absolute;

    top:92px;
    right:30px;

    z-index:55;

    padding:8px 12px;

    background:rgba(0,0,0,.5);

    border-radius:8px;

    font-size:14px;
}

.usage-bar{
    display:inline-block;

    width:18px;
    height:10px;

    margin-left:3px;

    border:1px solid #555;

    background:#111;
}

.usage-bar.active{
    background:#75ff59;
    box-shadow:0 0 8px #75ff59;
}

/* =========================================================
   DOORS
========================================================= */

.door{
    position:absolute;

    top:0;

    width:18%;
    height:100%;

    z-index:25;

    background:
        repeating-linear-gradient(
            0deg,
            #181818 0px,
            #181818 34px,
            #555 35px,
            #252525 40px
        );

    border:4px solid #555;

    box-shadow:
        0 0 50px #000,
        inset 0 0 30px #000;

    transition:transform .32s ease;
}

.left-door{
    left:0;
    transform:translateY(-100%);
}

.right-door{
    right:0;
    transform:translateY(-100%);
}

.door.closed{
    transform:translateY(0);
}

/* =========================================================
   SIDE CONTROLS
========================================================= */

.left-controls,
.right-controls{
    position:absolute;

    top:42%;

    z-index:45;

    display:flex;
    flex-direction:column;
    gap:14px;
}

.left-controls{
    left:25px;
}

.right-controls{
    right:25px;
}

.control-btn{
    width:190px;

    padding:15px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:
        transform .15s,
        background .15s,
        box-shadow .15s;
}

.control-btn:hover{
    background:#292929;
    transform:scale(1.04);
}

.control-btn.light-active{
    background:#ffd84d;
    color:#111;

    box-shadow:0 0 35px rgba(255,216,77,.8);
}

.control-btn.door-active{
    background:#a31313;

    box-shadow:0 0 30px rgba(255,0,0,.5);
}

/* =========================================================
   LIGHT EFFECT
========================================================= */

#leftLightEffect,
#rightLightEffect{
    position:absolute;

    top:0;

    width:32%;
    height:100%;

    z-index:5;

    pointer-events:none;

    opacity:0;

    transition:opacity .15s;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at left center,
            rgba(255,245,180,.55),
            rgba(255,230,100,.12) 45%,
            transparent 72%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at right center,
            rgba(255,245,180,.55),
            rgba(255,230,100,.12) 45%,
            transparent 72%
        );
}

#leftLightEffect.on,
#rightLightEffect.on{
    opacity:1;
}

/* =========================================================
   CAMERA BUTTON
========================================================= */

#cameraBtn{
    position:absolute;

    bottom:32px;
    left:50%;

    transform:translateX(-50%);

    z-index:50;

    padding:18px 35px;

    border:0;
    border-radius:14px;

    background:
        linear-gradient(135deg,#1682ff,#00399b);

    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 0 35px rgba(0,100,255,.45);

    transition:.15s;
}

#cameraBtn:hover{
    transform:translateX(-50%) scale(1.05);
}

/* =========================================================
   CAMERA PANEL
========================================================= */

#cameraPanel{
    position:absolute;
    inset:0;

    z-index:150;

    padding:20px;

    background:#020202;
}

.camera-header{
    height:65px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid #333;
}

.camera-header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.record-dot{
    width:13px;
    height:13px;

    border-radius:50%;

    background:red;

    box-shadow:0 0 15px red;

    animation:recordBlink 1s infinite;
}

@keyframes recordBlink{
    50%{
        opacity:.2;
    }
}

#closeCameraBtn{
    padding:12px 20px;

    border:0;
    border-radius:10px;

    background:#a31313;
    color:white;

    font-weight:bold;

    cursor:pointer;
}

/* =========================================================
   CAMERA VIEW
========================================================= */

#cameraView{
    position:relative;

    height:calc(100vh - 105px);

    margin-top:14px;

    overflow:hidden;

    border:3px solid #333;
    border-radius:10px;

    background:
        radial-gradient(
            circle at center,
            #303030,
            #121212 50%,
            #020202
        );
}

.scanlines{
    position:absolute;
    inset:0;

    z-index:30;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.035) 4px
        );
}

.noise{
    position:absolute;
    inset:-20px;

    z-index:29;

    opacity:.07;

    pointer-events:none;

    background:
        repeating-radial-gradient(
            circle,
            white 0,
            transparent 1px,
            black 2px
        );

    animation:noiseMove .13s infinite;
}

@keyframes noiseMove{
    0%{transform:translate(0,0)}
    25%{transform:translate(5px,-4px)}
    50%{transform:translate(-4px,5px)}
    75%{transform:translate(5px,4px)}
}

/* =========================================================
   CAMERA ROOM VISUAL
========================================================= */

#roomVisual{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:120px;

    opacity:.18;
}

.camera-info{
    position:absolute;

    left:25px;
    bottom:25px;

    z-index:40;
}

#cameraTitle{
    font-size:29px;
}

#cameraText{
    margin-top:7px;

    color:#aaa;

    font-size:16px;
}

/* =========================================================
   ENEMIES
========================================================= */

.enemy{
    position:absolute;

    top:50%;

    z-index:20;

    transform:
        translateY(-50%)
        scale(.6);

    opacity:0;

    font-size:125px;

    filter:
        drop-shadow(0 0 25px rgba(255,0,0,.7));

    transition:
        opacity .2s,
        transform .2s;
}

.enemy.visible{
    opacity:1;

    transform:
        translateY(-50%)
        scale(1);
}

#enemy1{
    left:24%;
}

#enemy2{
    right:24%;
}

#enemy3{
    left:50%;
    transform:
        translate(-50%,-50%)
        scale(.6);
}

#enemy3.visible{
    transform:
        translate(-50%,-50%)
        scale(1);
}

/* =========================================================
   CAMERA MAP
========================================================= */

#cameraMap{
    position:absolute;

    right:25px;
    bottom:25px;

    z-index:40;

    width:285px;
    height:220px;

    border:1px solid #666;
    border-radius:12px;

    background:rgba(0,0,0,.82);

    box-shadow:0 0 25px #000;
}

.map-label{
    position:absolute;

    top:8px;
    left:50%;

    transform:translateX(-50%);

    color:#999;

    font-size:11px;
}

.map-room{
    position:absolute;

    min-width:75px;

    padding:8px;

    border:1px solid #666;
    border-radius:6px;

    background:#151515;
    color:white;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;
}

.map-room:hover{
    background:#333;
}

.map-room.active{
    background:#0876ff;

    border-color:#70b4ff;

    box-shadow:0 0 15px rgba(0,120,255,.6);
}

.map-room[data-camera="0"]{
    top:35px;
    left:105px;
}

.map-room[data-camera="1"]{
    top:80px;
    left:20px;
}

.map-room[data-camera="2"]{
    top:80px;
    right:20px;
}

.map-room[data-camera="3"]{
    top:125px;
    left:20px;
}

.map-room[data-camera="4"]{
    top:125px;
    right:20px;
}

.map-room[data-camera="5"]{
    bottom:15px;
    left:105px;
}

/* =========================================================
   WARNING
========================================================= */

#warning{
    position:absolute;
    inset:0;

    z-index:400;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:rgba(90,0,0,.96);

    animation:warningFlash .12s infinite;
}

.warning-icon{
    font-size:170px;
}

#warning h2{
    margin-top:20px;

    font-size:50px;
}

@keyframes warningFlash{
    50%{
        background:#000;
    }
}

/* =========================================================
   END SCREEN
========================================================= */

#endScreen{
    position:absolute;
    inset:0;

    z-index:500;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:rgba(0,0,0,.98);
}

#endTitle{
    font-size:clamp(60px,10vw,145px);

    text-shadow:0 0 35px red;
}

#endText{
    margin-top:25px;

    color:#aaa;

    font-size:22px;
}

.end-buttons{
    display:flex;
    gap:14px;

    margin-top:35px;
}

.end-btn{
    padding:17px 28px;

    border:0;
    border-radius:12px;

    background:#0875ff;
    color:white;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
}

.end-btn.secondary{
    background:#222;

    border:1px solid #555;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

    #topbar{
        font-size:13px;
        padding:11px;
    }

    #usage{
        top:75px;
        right:8px;
    }

    .control-btn{
        width:125px;

        padding:10px;

        font-size:12px;
    }

    .left-controls{
        left:7px;
    }

    .right-controls{
        right:7px;
    }

    .door{
        width:27%;
    }

    #cameraMap{
        width:230px;
        height:200px;

        right:8px;
        bottom:8px;
    }

    .map-room[data-camera="0"],
    .map-room[data-camera="5"]{
        left:78px;
    }

    .office-center h1{
        font-size:36px;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     MAIN MENU
======================================================= -->

<section id="menu">

    <h1 class="menu-title">
        П'ЯТЬ НОЧЕЙ В АТБ
    </h1>

    <p class="menu-subtitle">
        Переживи п'ять нічних змін
    </p>

    <div class="menu-buttons">

        <button
            id="playBtn"
            class="menu-btn primary"
        >
            ▶ ГРАТИ
        </button>

        <button
            id="resetBtn"
            class="menu-btn"
        >
            ♻ СКИНУТИ ПРОГРЕС
        </button>

    </div>

</section>


<!-- =======================================================
     NIGHT SELECT
======================================================= -->

<section
    id="nightSelect"
    class="hidden"
>

    <h2>ОБЕРИ НІЧ</h2>

    <div class="night-grid">

        <button
            class="night-btn"
            data-night="1"
        >
            🌙 Ніч 1
        </button>

        <button
            class="night-btn"
            data-night="2"
        >
            🌙 Ніч 2
        </button>

        <button
            class="night-btn"
            data-night="3"
        >
            🌙 Ніч 3
        </button>

        <button
            class="night-btn"
            data-night="4"
        >
            🌙 Ніч 4
        </button>

        <button
            class="night-btn"
            data-night="5"
        >
            🌙 Ніч 5
        </button>

    </div>

    <button
        id="backBtn"
        class="menu-btn"
        style="margin-top:30px"
    >
        ← НАЗАД
    </button>

</section>


<!-- =======================================================
     GAME
======================================================= -->

<section
    id="game"
    class="hidden"
>

    <!-- TOP -->

    <div id="topbar">

        <div>
            🌙 Ніч:
            <span id="night">1</span>
        </div>

        <div>
            🕛
            <span id="time">12 AM</span>
        </div>

        <div>
            ⚡
            <span id="power">100</span>%
        </div>

    </div>


    <!-- USAGE -->

    <div id="usage">

        Використання:

        <span class="usage-bar"></span>
        <span class="usage-bar"></span>
        <span class="usage-bar"></span>
        <span class="usage-bar"></span>
        <span class="usage-bar"></span>

    </div>


    <!-- OFFICE -->

    <main id="office">

        <div
            id="leftLightEffect"
        ></div>

        <div
            id="rightLightEffect"
        ></div>


        <div
            id="leftDoor"
            class="door left-door"
        ></div>

        <div
            id="rightDoor"
            class="door right-door"
        ></div>


        <div class="office-center">

            <h1>
                П'ЯТЬ НОЧЕЙ В АТБ
            </h1>

            <p id="status">
                Перевіряй камери та бережи енергію...
            </p>

        </div>


        <!-- LEFT -->

        <div class="left-controls">

            <button
                id="leftLightBtn"
                class="control-btn"
            >
                💡 Ліве світло
            </button>

            <button
                id="leftDoorBtn"
                class="control-btn"
            >
                🚪 Ліві двері
            </button>

        </div>


        <!-- RIGHT -->

        <div class="right-controls">

            <button
                id="rightLightBtn"
                class="control-btn"
            >
                💡 Праве світло
            </button>

            <button
                id="rightDoorBtn"
                class="control-btn"
            >
                🚪 Праві двері
            </button>

        </div>


        <button id="cameraBtn">
            📹 ВІДКРИТИ КАМЕРИ
        </button>

    </main>


    <!-- ===================================================
         CAMERAS
    =================================================== -->

    <section
        id="cameraPanel"
        class="hidden"
    >

        <div class="camera-header">

            <div class="camera-header-left">

                <div class="record-dot"></div>

                <h2>
                    SECURITY CAMERAS
                </h2>

            </div>


            <button id="closeCameraBtn">
                ✖ ЗАКРИТИ
            </button>

        </div>


        <div id="cameraView">

            <div class="noise"></div>
            <div class="scanlines"></div>

            <div id="roomVisual">
                🏪
            </div>


            <div
                id="enemy1"
                class="enemy"
            >
                👀
            </div>

            <div
                id="enemy2"
                class="enemy"
            >
                🐺
            </div>

            <div
                id="enemy3"
                class="enemy"
            >
                🦆
            </div>


            <div class="camera-info">

                <h2 id="cameraTitle">
                    CAM 1 — Вхід
                </h2>

                <p id="cameraText">
                    Нікого не видно...
                </p>

            </div>


            <!-- MAP -->

            <div id="cameraMap">

                <div class="map-label">
                    КАРТА АТБ
                </div>

                <button
                    class="map-room active"
                    data-camera="0"
                >
                    CAM 1
                </button>

                <button
                    class="map-room"
                    data-camera="1"
                >
                    CAM 2
                </button>

                <button
                    class="map-room"
                    data-camera="2"
                >
                    CAM 3
                </button>

                <button
                    class="map-room"
                    data-camera="3"
                >
                    CAM 4
                </button>

                <button
                    class="map-room"
                    data-camera="4"
                >
                    CAM 5
                </button>

                <button
                    class="map-room"
                    data-camera="5"
                >
                    CAM 6
                </button>

            </div>

        </div>

    </section>


    <!-- ===================================================
         WARNING
    =================================================== -->

    <section
        id="warning"
        class="hidden"
    >

        <div class="warning-icon">
            👀
        </div>

        <h2>
            ЩОСЬ ПОРУЧ...
        </h2>

    </section>


    <!-- ===================================================
         END
    =================================================== -->

    <section
        id="endScreen"
        class="hidden"
    >

        <h1 id="endTitle">
            GAME OVER
        </h1>

        <p id="endText"></p>


        <div class="end-buttons">

            <button
                id="restartBtn"
                class="end-btn"
            >
                🔄 ЩЕ РАЗ
            </button>

            <button
                id="menuBtn"
                class="end-btn secondary"
            >
                🏠 МЕНЮ
            </button>

        </div>

    </section>

</section>


<script>
document.addEventListener(
    "DOMContentLoaded",
    function(){

/* =========================================================
   ELEMENTS
========================================================= */

const menu =
    document.getElementById("menu");

const nightSelect =
    document.getElementById("nightSelect");

const game =
    document.getElementById("game");


const playBtn =
    document.getElementById("playBtn");

const resetBtn =
    document.getElementById("resetBtn");

const backBtn =
    document.getElementById("backBtn");


const nightButtons =
    document.querySelectorAll(".night-btn");


const nightEl =
    document.getElementById("night");

const timeEl =
    document.getElementById("time");

const powerEl =
    document.getElementById("power");

const statusEl =
    document.getElementById("status");


const usageBars =
    document.querySelectorAll(".usage-bar");


const leftDoor =
    document.getElementById("leftDoor");

const rightDoor =
    document.getElementById("rightDoor");


const leftDoorBtn =
    document.getElementById("leftDoorBtn");

const rightDoorBtn =
    document.getElementById("rightDoorBtn");


const leftLightBtn =
    document.getElementById("leftLightBtn");

const rightLightBtn =
    document.getElementById("rightLightBtn");


const leftLightEffect =

/* =========================================================
   ENEMY DOOR CHECK
========================================================= */

function enemyAtLeftDoor(){

    if(enemy1Position >= 6){
        return true;
    }


    if(
        enemy3Position >= 6 &&
        enemy3Side === "left"
    ){
        return true;
    }


    return false;
}


function enemyAtRightDoor(){

    if(enemy2Position >= 6){
        return true;
    }


    if(
        enemy3Position >= 6 &&
        enemy3Side === "right"
    ){
        return true;
    }


    return false;
}

========================================================= */

    );

    );

        "visible"
    );

    if(
        enemy1Position ===

    ){

            "visible"
        );

        visibleCount++;
    }


    if(
        enemy2Position ===
        selectedCamera
    ){

        enemy2El.classList.add(
            "visible"
        );

        visibleCount++;
    }


    if(
        enemy3Position ===
        selectedCamera
    ){

        enemy3El.classList.add(
            "visible"
        );

        visibleCount++;
    }


    if(visibleCount === 0){

        cameraText.textContent =
            "Нікого не видно...";

    }
    else if(visibleCount === 1){

        cameraText.textContent =
            "⚠️ Тут одразу кілька ворогів!";
    }

/* =========================================================
   POWER USAGE
========================================================= */

function getUsage(){

    let usage = 1;


    if(leftDoorClosed){
        usage++;
    }


    if(rightDoorClosed){
        usage++;
    }


    if(leftLightOn){
        usage++;
    }


    if(rightLightOn){
        usage++;
    }


    if(cameraOpen){
        usage++;
    }


    return Math.min(
        usage,
        usageBars.length
    );
}


function updateUsage(){

    const usage =
        getUsage();


    usageBars.forEach(
        function(bar,index){

            bar.classList.toggle(
                "active",
                index < usage
            );

        }
    );
}


/* =========================================================
   POWER
========================================================= */

function updatePower(){

    if(!gameRunning){
        return;
    }


    let drain = .007;


    if(leftDoorClosed){
        drain += .011;
    }


    if(rightDoorClosed){
        drain += .011;
    }


    if(leftLightOn){
        drain += .007;
    }


    if(rightLightOn){
        drain += .007;
    }


    if(cameraOpen){
        drain += .009;
    }


    drain *=
        1 +
        (currentNight - 1) * .06;


    power -= drain;


    if(power <= 0){

        power = 0;

        powerEl.textContent =
            "0";

        powerOut();

        return;
    }


    powerEl.textContent =
        Math.floor(power);


    if(power <= 20){

        powerEl.style.color =
            "#ff3333";

    }
    else if(power <= 40){

        powerEl.style.color =
            "#ffd84a";

    }
    else{

        powerEl.style.color =
            "white";
    }
}


/* =========================================================
   POWER OUT
========================================================= */

function powerOut(){

    if(!gameRunning){
        return;
    }


    leftDoorClosed = false;

    rightDoorClosed = false;


    leftLightOn = false;

    rightLightOn = false;


    resetControls();

    closeCamera();

    updateUsage();


    statusEl.textContent =
        "⚡ ЕНЕРГІЯ ЗАКІНЧИЛАСЯ...";


    setTimeout(
        function(){

            if(!gameRunning){
                return;
            }


            showWarning("👀");

        },
        1200
    );


    setTimeout(
        function(){

            if(!gameRunning){
                return;
            }


            loseGame(
                "Енергія закінчилася до 6 AM."
            );

        },
        3200
    );
}


/* =========================================================
   ENEMY AI
========================================================= */

function moveEnemies(){

    if(!gameRunning){
        return;
    }


    moveEnemy1();

    moveEnemy2();

    moveEnemy3();


    if(cameraOpen){

        renderCamera();

    }
}


/* =========================================================
   ENEMY 1
   LEFT
========================================================= */

function moveEnemy1(){

    const chance =
        .24 +
        currentNight * .065;


    if(Math.random() > chance){
        return;
    }


    if(enemy1Position < 5){

        enemy1Position++;


        if(enemy1Position === 4){

            statusEl.textContent =
                "📹 Чути рух у лівому коридорі...";

        }

    }
    else{

        enemy1Position = 6;


        attackEnemy(
            1,
            "left"
        );
    }
}


/* =========================================================
   ENEMY 2
   RIGHT
========================================================= */

function moveEnemy2(){

    const chance =
        .21 +
        currentNight * .065;


    if(Math.random() > chance){
        return;
    }


    const path = [
        2,
        1,
        0,
        4,
        5,
        6
    ];


    let index =
        path.indexOf(
            enemy2Position
        );


    if(index < 0){

        enemy2Position = 2;

        return;
    }


    if(index < path.length - 1){

        enemy2Position =
            path[index + 1];

    }
    else{

        enemy2Position = 6;
    }


    if(enemy2Position === 5){

        statusEl.textContent =
            "🐺 Чути рух справа...";

    }


    if(enemy2Position >= 6){

        attackEnemy(
            2,
            "right"
        );
    }
}


/* =========================================================
   ENEMY 3
========================================================= */

function moveEnemy3(){

    const chance =
        .17 +
        currentNight * .06;


    if(Math.random() > chance){
        return;
    }


    if(enemy3Position < 4){

        enemy3Position++;

    }
    else if(enemy3Position === 4){

        enemy3Position = 5;


        enemy3Side =
            Math.random() < .5
                ? "left"
                : "right";


        statusEl.textContent =
            enemy3Side === "left"
                ? "🦆 Шурхіт чути зліва..."
                : "🦆 Шурхіт чути справа...";

    }
    else{

        enemy3Position = 6;


        attackEnemy(
            3,
            enemy3Side
        );
    }
}


/* =========================================================
   ATTACK
========================================================= */

function attackEnemy(
    enemyNumber,
    side
){

    if(!gameRunning){
        return;
    }


    const doorClosed =
        side === "left"
            ? leftDoorClosed
            : rightDoorClosed;


    if(doorClosed){

        statusEl.textContent =
            side === "left"
                ? "💥 Щось вдарило у ЛІВІ двері!"
                : "💥 Щось вдарило у ПРАВІ двері!";


        resetEnemy(
            enemyNumber
        );


        return;
    }


    let icon = "👀";


    if(enemyNumber === 2){
        icon = "🐺";
    }


    if(enemyNumber === 3){
        icon = "🦆";
    }


    showWarning(icon);


    setTimeout(
        function(){

            if(!gameRunning){
                return;
            }


            loseGame(
                side === "left"
                    ? "Ти не встиг закрити ліві двері."
                    : "Ти не встиг закрити праві двері."
            );

        },
        800
    );
}


/* =========================================================
   RESET ENEMY
========================================================= */

function resetEnemy(number){

    if(number === 1){

        enemy1Position = 0;

    }


    if(number === 2){

        enemy2Position = 2;

    }


    if(number === 3){

        enemy3Position = 1;


        enemy3Side =
            Math.random() < .5
                ? "left"
                : "right";
    }


    if(cameraOpen){

        renderCamera();

    }
}


/* =========================================================
   WARNING
========================================================= */

function showWarning(icon){

    warningIcon.textContent =
        icon;


    warning.classList.remove(
        "hidden"
    );


    setTimeout(
        function(){

            warning.classList.add(
                "hidden"
            );

        },
        650
    );
}


/* =========================================================
   TIME
========================================================= */

function advanceTime(){

    if(!gameRunning){
        return;
    }


    hour++;


    if(hour >= 6){

        hour = 6;


        timeEl.textContent =
            "6 AM";


        winNight();

        return;
    }


    timeEl.textContent =
        hour + " AM";


    if(hour === 3){

        statusEl.textContent =
            "🕒 3 AM. Вороги активніші...";

    }


    if(hour === 5){

        statusEl.textContent =
            "🕔 Майже 6 AM! Тримайся!";

    }
}


/* =========================================================
   WIN
========================================================= */

function winNight(){

    if(!gameRunning){
        return;
    }


    gameRunning = false;


    stopTimers();

    closeCamera();


    warning.classList.add(
        "hidden"
    );


    endScreen.classList.remove(
        "hidden"
    );


    endTitle.textContent =
        "🎉 6 AM";


    endTitle.style.color =
        "#fff";


    endTitle.style.textShadow =
        "0 0 35px #1682ff";


    if(currentNight < 5){

        const nextNight =
            currentNight + 1;


        if(nextNight > unlockedNight){

            unlockedNight =
                nextNight;


            localStorage.setItem(
                "atbUnlockedNight",
                String(unlockedNight)
            );
        }


        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! Відкрито Ніч " +
            nextNight +
            ".";

    }
    else{

        endText.textContent =
            "🏆 ТИ ПЕРЕЖИВ УСІ П'ЯТЬ НОЧЕЙ В АТБ!";
    }


    updateNightButtons();
}


/* =========================================================
   LOSE
========================================================= */

function loseGame(reason){

    if(!gameRunning){
        return;
    }


    gameRunning = false;


    stopTimers();

    closeCamera();


    warning.classList.add(
        "hidden"
    );


    endScreen.classList.remove(
        "hidden"
    );


    endTitle.textContent =
        "GAME OVER";


    endTitle.style.color =
        "#fff";


    endTitle.style.textShadow =
        "0 0 35px red";


    endText.textContent =
        reason;
}

/* =========================================================
   TIMERS
========================================================= */

function startTimers(){

    powerTimer =
        setInterval(
            updatePower,
            100
        );


    /*
        20 секунд = 1 година.
        Ніч ≈ 2 хвилини.
    */

    timeTimer =
        setInterval(
            advanceTime,
            20000
        );


    const enemySpeed =
        Math.max(
            2200,
            5200 -
            currentNight * 450
        );


    enemyTimer =
        setInterval(
            moveEnemies,
            enemySpeed
        );
}


function stopTimers(){

    clearInterval(
        powerTimer
    );


    clearInterval(
        timeTimer
    );


    clearInterval(
        enemyTimer
    );


    powerTimer = null;

    timeTimer = null;

    enemyTimer = null;
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(!gameRunning){
            return;
        }


        const key =
            event.key.toLowerCase();


        /*
            Q = left door
            E = right door
            A = left light
            D = right light
            C = camera
        */


        if(key === "q"){

            leftDoorBtn.click();

        }


        if(key === "e"){

            rightDoorBtn.click();

        }


        if(key === "a"){

            leftLightBtn.click();

        }


        if(key === "d"){

            rightLightBtn.click();

        }


        if(key === "c"){

            if(cameraOpen){

                closeCamera();

            }
            else{

                cameraBtn.click();

            }
        }


        if(
            event.key === "Escape" &&
            cameraOpen
        ){

            closeCamera();

        }
    }
);

updateNightButtons();
