<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
    font-family:inherit;
}

/* MENU */

#menu,
#nightMenu{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle,#202020,#050505 65%,#000);

    text-align:center;
}

#menu h1{
    font-size:clamp(46px,7vw,100px);
    letter-spacing:5px;
    text-shadow:0 0 20px red;
}

#menu p{
    margin-top:15px;
    color:#aaa;
}

.menuBtn{
    margin-top:30px;
    min-width:250px;
    padding:16px 28px;

    border:1px solid #555;
    border-radius:12px;

    background:#111;
    color:white;

    font-size:18px;
    font-weight:bold;
}

.menuBtn:hover{
    background:#252525;
}

#playBtn{
    background:#086cff;
}

/* NIGHT MENU */

#nightMenu h2{
    font-size:45px;
    margin-bottom:30px;
}

.nightButtons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
}

.nightBtn{
    width:110px;
    height:90px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:white;

    font-size:17px;
    font-weight:bold;
}

.nightBtn.locked{
    opacity:.3;
    cursor:not-allowed;
}

/* GAME */

#game{
    position:fixed;
    inset:0;

    background:
        radial-gradient(circle at 50% 55%, rgba(80,90,95,.24), transparent 28%),
        linear-gradient(180deg,#050708 0%,#101315 48%,#030405 100%);

    overflow:hidden;
}

/* TOP */

#topbar{
    position:absolute;
    z-index:60;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    width:min(900px,94%);

    padding:14px 22px;

    display:flex;
    justify-content:space-between;

    background:rgba(0,0,0,.85);
    border:1px solid #444;
    border-radius:14px;

    font-size:19px;
}

/* OFFICE */

#office{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(90deg, rgba(0,0,0,.88) 0 16%, transparent 16% 84%, rgba(0,0,0,.88) 84%),
        repeating-linear-gradient(90deg, transparent 0 78px, rgba(255,255,255,.018) 79px 80px),
        linear-gradient(180deg,#080a0b 0 63%,#151719 63% 65%,#050607 65% 100%);
}

/* ATMOSPHERIC ATB SECURITY OFFICE */
#office::before{
    content:"";
    position:absolute;
    left:50%;
    bottom:-7%;
    transform:translateX(-50%);
    width:58%;
    height:34%;
    z-index:8;
    border-radius:45% 45% 0 0;
    background:
        radial-gradient(circle at 30% 18%,#172128 0 4%,transparent 4.5%),
        radial-gradient(circle at 70% 18%,#172128 0 4%,transparent 4.5%),
        linear-gradient(180deg,#292c2f,#0d0f10 28%,#050606);
    border-top:3px solid #34383b;
    box-shadow:0 -16px 60px rgba(0,0,0,.8), inset 0 12px 30px rgba(255,255,255,.03);
}

#office::after{
    content:"АТБ   •   НІЧНА ОХОРОНА";
    position:absolute;
    left:50%;
    top:19%;
    transform:translateX(-50%);
    z-index:9;
    padding:9px 24px;
    border:1px solid #30363a;
    border-radius:7px;
    background:#080a0b;
    color:#8b969d;
    font-size:13px;
    letter-spacing:5px;
    box-shadow:0 0 30px #000;
}

#title{
    position:absolute;
    z-index:12;

    top:33%;
    left:50%;

    transform:translate(-50%,-50%);

    width:75%;
    text-align:center;
}

#title h1{
    font-size:clamp(40px,6vw,85px);
    letter-spacing:4px;
    text-shadow:0 0 8px #fff,0 0 28px #d71920,0 0 70px rgba(215,25,32,.35);
}

#status{
    margin-top:20px;
    color:#aaa;
    font-size:18px;
}

/* LIGHT AREAS */

.lightEffect{
    position:absolute;
    top:0;
    width:40%;
    height:100%;

    opacity:0;

    pointer-events:none;

    transition:.15s;

    z-index:5;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at left center,
            rgba(255,245,180,.85),
            rgba(255,220,80,.18) 45%,
            transparent 75%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at right center,
            rgba(255,245,180,.85),
            rgba(255,220,80,.18) 45%,
            transparent 75%
        );
}

.lightEffect.on{
    opacity:1;
}

/* DOORS */

.door{
    position:absolute;

    top:0;
    width:18%;
    height:100%;

    z-index:25;

    background:
        repeating-linear-gradient(
            0deg,
            #222 0px,
            #222 35px,
            #666 36px,
            #333 40px
        );

    border:4px solid #555;

    box-shadow:0 0 40px black;

    transform:translateY(-100%);

    transition:transform .35s ease;
}

#leftDoor{
    left:0;
}

#rightDoor{
    right:0;
}

.door.closed{
    transform:translateY(0);
}

/* CONTROLS */

.sideControls{
    position:absolute;

    top:42%;

    z-index:50;

    display:flex;
    flex-direction:column;

    gap:12px;
}

#leftControls{
    left:25px;
}

#rightControls{
    right:25px;
}

.controlBtn{
    width:185px;
    padding:15px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:white;

    font-weight:bold;
    font-size:16px;
}

.controlBtn:hover{
    background:#2b2b2b;
}

.controlBtn.lightOn{
    background:#ffd84a;
    color:#111;

    box-shadow:0 0 30px #ffd84a;
}

.controlBtn.doorOn{
    background:#aa1515;

    box-shadow:0 0 30px rgba(255,0,0,.5);
}


/* ENEMIES IN DOORWAYS */

.doorEnemy{
    position:absolute;
    top:47%;
    z-index:18;
    font-size:105px;
    opacity:0;
    pointer-events:none;
    transform:translateY(-50%) scale(.72);
    transition:opacity .12s, transform .12s;
    filter:drop-shadow(0 0 22px rgba(255,0,0,.85));
}

#leftDoorEnemy{
    left:12%;
}

#rightDoorEnemy{
    right:12%;
}

.doorEnemy.visible{
    opacity:1;
    transform:translateY(-50%) scale(1);
}

/* CAMERA BUTTON */

#cameraBtn{
    position:absolute;

    left:50%;
    bottom:32px;

    transform:translateX(-50%);

    z-index:60;

    padding:18px 34px;

    border:0;
    border-radius:14px;

    background:#086cff;
    color:white;

    font-size:18px;
    font-weight:bold;
}

/* USAGE */

#usage{
    position:absolute;

    right:25px;
    top:90px;

    z-index:60;

    padding:8px 12px;

    background:rgba(0,0,0,.65);

    border-radius:8px;
}

.usageBar{
    display:inline-block;

    width:17px;
    height:10px;

    border:1px solid #555;

    background:#111;

    margin-left:3px;
}

.usageBar.on{
    background:#63ff4d;
}

/* CAMERA */

#cameraPanel{
    position:absolute;
    inset:0;

    z-index:200;

    background:#020202;

    padding:20px;
}

.cameraHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;

    height:65px;

    border-bottom:1px solid #333;
}

#closeCameraBtn{
    padding:12px 18px;

    border:0;
    border-radius:10px;

    background:#a00;
    color:white;

    font-weight:bold;
}

#cameraView{
    position:relative;

    height:calc(100vh - 105px);

    margin-top:14px;

    border:3px solid #333;
    border-radius:10px;

    overflow:hidden;

    background:
        linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.35)),
        radial-gradient(circle at center,#3a3d3f,#111 58%,#020202);
}

#cameraScene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:clamp(28px,4vw,58px);
    letter-spacing:14px;
    color:#aeb5b9;
    opacity:.48;
    text-shadow:0 0 18px #000;
}

#cameraScene::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(90deg,transparent 0 110px,rgba(255,255,255,.025) 111px 112px),
        linear-gradient(180deg,rgba(255,255,255,.03),transparent 35%,rgba(0,0,0,.45));
}

#cameraRoomIcon{
    position:absolute;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    font-size:140px;

    opacity:.22;
}

.scanlines{
    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.04) 4px
        );
}

#cameraInfo{
    position:absolute;

    left:25px;
    bottom:25px;
}

#cameraInfo h2{
    font-size:28px;
}

#cameraInfo p{
    margin-top:8px;
    color:#aaa;
}

/* CAMERA MAP */

#cameraMap{
    position:absolute;

    right:25px;
    bottom:25px;

    width:280px;
    height:220px;

    background:rgba(0,0,0,.85);

    border:1px solid #555;
    border-radius:12px;
}

.camBtn{
    position:absolute;

    width:75px;

    padding:8px;

    border:1px solid #666;
    border-radius:7px;

    background:#151515;
    color:white;

    font-weight:bold;
}

.camBtn.active{
    background:#086cff;
}

.camBtn[data-cam="0"]{
    top:25px;
    left:102px;
}

.camBtn[data-cam="1"]{
    top:75px;
    left:20px;
}

.camBtn[data-cam="2"]{
    top:75px;
    right:20px;
}

.camBtn[data-cam="3"]{
    top:125px;
    left:20px;
}

.camBtn[data-cam="4"]{
    top:125px;
    right:20px;
}

.camBtn[data-cam="5"]{
    bottom:15px;
    left:102px;
}

/* ENEMIES */

.enemy{
    position:absolute;

    top:50%;

    font-size:120px;

    opacity:0;

    transition:.2s;

    filter:drop-shadow(0 0 25px red);
}

.enemy.visible{
    opacity:1;
}

#enemy1{
    left:23%;
}

#enemy2{
    right:23%;
}

#enemy3{
    left:50%;
    transform:translateX(-50%);
}

/* WARNING */

#warning{
    position:absolute;
    inset:0;

    z-index:400;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(90,0,0,.95);

    animation:flash .15s infinite;
}

#warningIcon{
    font-size:170px;
}

#warning h2{
    margin-top:20px;
    font-size:50px;
}

@keyframes flash{
    50%{
        background:#000;
    }
}

/* END */

#endScreen{
    position:absolute;
    inset:0;

    z-index:500;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#000;

    text-align:center;
}

#endTitle{
    font-size:clamp(60px,10vw,140px);

    text-shadow:0 0 35px red;
}

#endText{
    margin-top:20px;
    color:#aaa;
    font-size:20px;
}

.endButtons{
    display:flex;
    gap:12px;
    margin-top:30px;
}

.endBtn{
    padding:16px 25px;

    border:0;
    border-radius:10px;

    background:#086cff;
    color:white;

    font-weight:bold;
    font-size:16px;
}

.endBtn.gray{
    background:#222;
    border:1px solid #555;
}

@keyframes officeFlicker{
    0%,94%,100%{filter:brightness(1)}
    95%{filter:brightness(.72)}
    96%{filter:brightness(1.12)}
    97%{filter:brightness(.82)}
}

#office{
    animation:officeFlicker 9s infinite;
}


/* SOUND */

#soundBtn{
    position:absolute;
    top:88px;
    left:25px;
    z-index:70;
    padding:9px 13px;
    border:1px solid #555;
    border-radius:9px;
    background:rgba(0,0,0,.72);
    color:white;
    font-weight:bold;
}

#soundBtn.off{
    opacity:.55;
}

/* MOBILE */

@media(max-width:750px){

    .controlBtn{
        width:125px;
        font-size:12px;
        padding:10px;
    }

    #leftControls{
        left:7px;
    }

    #rightControls{
        right:7px;
    }

    .door{
        width:27%;
    }

    #topbar{
        font-size:13px;
    }
}
</style>
</head>

<body>

<section id="menu">

    <h1>П'ЯТЬ НОЧЕЙ В АТБ</h1>

        id="playBtn"

            id="rightDoor"

        ></div>


        <div id="title">

            <h1>
                П'ЯТЬ НОЧЕЙ В АТБ
            </h1>

            <p id="status">
                Перевіряй камери та бережи енергію...
            </p>

        </div>


        <div
            id="leftControls"

        >

            <button
                id="leftLightBtn"

                💡 Ліве світло

                🚪 Праві двері
            </button>

        </div>


        <button id="cameraBtn">
            📹 ВІДКРИТИ КАМЕРИ
        </button>

    </main>


    <section
        id="cameraPanel"
        class="hidden"
    >

        <div class="cameraHeader">

            <h2>
                🔴 SECURITY CAMERAS
            </h2>

            <button id="closeCameraBtn">
                ✖ ЗАКРИТИ
            </button>

        </div>


        <div id="cameraView">

            <div class="scanlines"></div>

            <div id="cameraScene">🚪 ВХІД • ТУРНІКЕТ • ВІТРИНИ</div>

                    CAM 3
                </button>

                </button>

                <button

                    CAM 6
                </button>

    </section>


    <section
        id="warning"
        class="hidden"
    >

        <div id="warningIcon">
            👀
        </div>

        <h2>
            ЩОСЬ ПОРУЧ...
        </h2>

    </section>


    <section
        id="endScreen"
        class="hidden"
    >

        <h1 id="endTitle">
            GAME OVER
        </h1>

        <p id="endText"></p>


        <div class="endButtons">

            <button
                id="restartBtn"
                class="endBtn"
            >
                🔄 ЩЕ РАЗ
            </button>

            <button
                id="menuBtn"
                class="endBtn gray"
            >
                🏠 МЕНЮ
            </button>

        </div>

    </section>

</section>

const cameraScenes = [
    "🚪  ВХІД  •  ВІТРИНИ  •  ТУРНІКЕТ",
    "🛒  КАСИ  •  ВІЗКИ  •  ТОРГОВИЙ ЗАЛ",
    "📦  КОРОБКИ  •  СКЛАД  •  СТЕЛАЖІ",
    "⬅️  ЛІВИЙ КОРИДОР  •  СЛУЖБОВІ ДВЕРІ",
    "➡️  ПРАВИЙ КОРИДОР  •  ХОЛОДИЛЬНИКИ",
    "🚨  ОФІС ОХОРОНИ  •  ЗАПАСНИЙ ВИХІД"
];


let unlockedNight =
    Number(
        localStorage.getItem("atbNight") || "1"
    );


let currentNight = 1;

let power = 100;

let hour = 0;

let running = false;


let leftDoorClosed = false;

let rightDoorClosed = false;


let leftLightOn = false;

let rightLightOn = false;


let camerasOpen = false;

let selectedCamera = 0;


let enemy1 = 0;

let enemy2 = 2;

let enemy3 = 1;

let enemy3Side = "left";


let powerTimer = null;

let timeTimer = null;

let enemyTimer = null;


/* MENU */

playBtn.addEventListener(
    "click",
    function(){

        menu.classList.add("hidden");

        nightMenu.classList.remove("hidden");

        updateNightButtons();
    }
);


backBtn.addEventListener(
    "click",
    function(){

        nightMenu.classList.add("hidden");

        menu.classList.remove("hidden");
    }
);


resetProgressBtn.addEventListener(
    "click",
    function(){

        unlockedNight = 1;

        localStorage.setItem(
            "atbNight",
            "1"
        );

        updateNightButtons();

        alert("Прогрес скинуто!");
    }
);


function updateNightButtons(){

    nightButtons.forEach(
        function(button){

            const n =
                Number(
                    button.dataset.night
                );


            if(n <= unlockedNight){

                button.disabled = false;

                button.classList.remove("locked");

                button.textContent =
                    "🌙 Ніч " + n;

            }
            else{

                button.disabled = true;

                button.classList.add("locked");

                button.textContent =
                    "🔒 Ніч " + n;
            }
        }
    );
}


nightButtons.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                const n =
                    Number(
                        button.dataset.night
                    );


                if(n <= unlockedNight){

                    startGame(n);

                }
            }
        );
    }
);


/* START */

function startGame(night){

    stopTimers();


    currentNight = night;

    power = 100;

    hour = 0;

    running = true;


    leftDoorClosed = false;

    rightDoorClosed = false;


    leftLightOn = false;

    rightLightOn = false;


    camerasOpen = false;

    selectedCamera = 0;


    enemy1 = 0;

    enemy2 = 2;

    enemy3 = 1;

    enemy3Side =
        Math.random() < .5
            ? "left"
            : "right";


    menu.classList.add("hidden");

    nightMenu.classList.add("hidden");

    game.classList.remove("hidden");


    cameraPanel.classList.add("hidden");

    warning.classList.add("hidden");

    endScreen.classList.add("hidden");


    leftDoor.classList.remove("closed");

    rightDoor.classList.remove("closed");


    leftDoorBtn.classList.remove("doorOn");

    rightDoorBtn.classList.remove("doorOn");


    leftLightBtn.classList.remove("lightOn");

    rightLightBtn.classList.remove("lightOn");


    leftLightEffect.classList.remove("on");

    rightLightEffect.classList.remove("on");

    leftDoorEnemy.classList.remove("visible");
    rightDoorEnemy.classList.remove("visible");


    leftDoorBtn.textContent =
        "🚪 Ліві двері";

    rightDoorBtn.textContent =
        "🚪 Праві двері";


    nightLabel.textContent =
        currentNight;

    timeLabel.textContent =
        "12 AM";

    powerLabel.textContent =
        "100";

    powerLabel.style.color =
        "white";


    status.textContent =
        "Перевіряй камери та бережи енергію...";


    selectCamera(0);

    updateUsage();

    startTimers();
}


/* LEFT DOOR */

leftDoorBtn.addEventListener(
    "click",
    function(){

        if(!running || power <= 0){
            return;
        }


        leftDoorClosed =
            !leftDoorClosed;

        soundDoor(leftDoorClosed);


        leftDoor.classList.toggle(
            "closed",
            leftDoorClosed
        );


        leftDoorBtn.classList.toggle(
            "doorOn",
            leftDoorClosed
        );


        leftDoorBtn.textContent =
            leftDoorClosed
                ? "🔒 ВІДКРИТИ ЛІВІ"
                : "🚪 Ліві двері";


        status.textContent =
            leftDoorClosed
                ? "🚪 Ліві двері закрито."
                : "🚪 Ліві двері відкрито.";


        updateUsage();
    }
);


/* RIGHT DOOR */

rightDoorBtn.addEventListener(
    "click",
    function(){

        if(!running || power <= 0){
            return;
        }


        rightDoorClosed =
            !rightDoorClosed;

        soundDoor(rightDoorClosed);


        rightDoor.classList.toggle(
            "closed",
            rightDoorClosed
        );


        rightDoorBtn.classList.toggle(
            "doorOn",
            rightDoorClosed
        );


        rightDoorBtn.textContent =
            rightDoorClosed
                ? "🔒 ВІДКРИТИ ПРАВІ"
                : "🚪 Праві двері";


        status.textContent =
            rightDoorClosed
                ? "🚪 Праві двері закрито."
                : "🚪 Праві двері відкрито.";


        updateUsage();
    }
);



function updateDoorEnemies(){

    const leftVisible =
        leftLightOn &&
        (
            enemy1 >= 5 ||
            (
                enemy3 >= 5 &&
                enemy3Side === "left"
            )
        );

    const rightVisible =
        rightLightOn &&
        (
            enemy2 >= 5 ||
            (
                enemy3 >= 5 &&
                enemy3Side === "right"
            )
        );

    if(leftVisible){

        leftDoorEnemy.textContent =
            (
                enemy3 >= 5 &&
                enemy3Side === "left"
            )
                ? "🦆"
                : "👀";

    }

    if(rightVisible){

        rightDoorEnemy.textContent =
            (
                enemy3 >= 5 &&
                enemy3Side === "right"
            )
                ? "🦆"
                : "🐺";

    }

    leftDoorEnemy.classList.toggle(
        "visible",
        leftVisible
    );

    rightDoorEnemy.classList.toggle(
        "visible",
        rightVisible
    );
}


/* LEFT LIGHT */

leftLightBtn.addEventListener(
    "click",
    function(){

        if(!running || power <= 0){
            return;
        }


        leftLightOn =
            !leftLightOn;

        soundLight();


        leftLightBtn.classList.toggle(
            "lightOn",
            leftLightOn
        );


        leftLightEffect.classList.toggle(
            "on",
            leftLightOn
        );


        if(leftLightOn){

            if(
                enemy1 >= 5 ||
                (
                    enemy3 >= 5 &&
                    enemy3Side === "left"
                )
            ){

                status.textContent =
                    "👀 ХТОСЬ Є ЗЛІВА!";

            }
            else{

                status.textContent =
                    "💡 Зліва нікого.";
            }

        }
        else{

            status.textContent =
                "Ліве світло вимкнено.";
        }


        updateDoorEnemies();
        updateUsage();
    }
);


/* RIGHT LIGHT */

rightLightBtn.addEventListener(
    "click",
    function(){

        if(!running || power <= 0){
            return;
        }


        rightLightOn =
            !rightLightOn;

        soundLight();


        rightLightBtn.classList.toggle(
            "lightOn",
            rightLightOn
        );


        rightLightEffect.classList.toggle(
            "on",
            rightLightOn
        );


        if(rightLightOn){

            if(
                enemy2 >= 5 ||
                (
                    enemy3 >= 5 &&
                    enemy3Side === "right"
                )
            ){

                status.textContent =
                    "👀 ХТОСЬ Є СПРАВА!";

            }
            else{

                status.textContent =
                    "💡 Справа нікого.";
            }

        }
        else{

            status.textContent =
                "Праве світло вимкнено.";
        }


        updateDoorEnemies();
        updateUsage();
    }
);


/* OPEN CAMERA */

cameraBtn.addEventListener(
    "click",
    function(){

        if(!running || power <= 0){
            return;
        }


        camerasOpen = true;

        soundCamera(true);


        cameraPanel.classList.remove(
            "hidden"
        );


        renderCamera();

        updateUsage();
    }
);


/* CLOSE CAMERA */

closeCameraBtn.addEventListener(
    "click",
    function(){

        closeCamera();

    }
);


function closeCamera(){

    if(camerasOpen){
        soundCamera(false);
    }

    camerasOpen = false;


    cameraPanel.classList.add(
        "hidden"
    );


    updateUsage();
}


/* CAMERA BUTTONS */

cameraButtons.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                const cam =
                    Number(
                        button.dataset.cam
                    );


                soundCameraSwitch();
                selectCamera(cam);
            }
        );
    }
);


function selectCamera(cam){

    selectedCamera = cam;


    cameraButtons.forEach(
        function(button){

            button.classList.toggle(
                "active",
                Number(button.dataset.cam)
                === selectedCamera
            );
        }
    );


    renderCamera();
}


function renderCamera(){

    cameraTitle.textContent =
        cameraNames[selectedCamera];


    cameraRoomIcon.textContent =
        cameraIcons[selectedCamera];

    cameraScene.textContent =
        cameraScenes[selectedCamera];


    enemy1El.classList.remove("visible");

    enemy2El.classList.remove("visible");

    enemy3El.classList.remove("visible");


    let amount = 0;


    if(enemy1 === selectedCamera){

        enemy1El.classList.add("visible");

        amount++;
    }


    if(enemy2 === selectedCamera){

        enemy2El.classList.add("visible");

        amount++;
    }


    if(enemy3 === selectedCamera){

        enemy3El.classList.add("visible");

        amount++;
    }


    if(amount === 0){

        cameraText.textContent =
            "Нікого не видно...";

    }
    else if(amount === 1){

        cameraText.textContent =
            "⚠️ На камері хтось є...";

    }
    else{

        cameraText.textContent =
            "⚠️ Тут кілька ворогів!";
    }
}


/* USAGE */

function updateUsage(){

    let usage = 1;


    if(leftDoorClosed){
        usage++;
    }


    if(rightDoorClosed){
        usage++;
    }


    if(leftLightOn){
        usage++;
    }


    if(rightLightOn){
        usage++;
    }


    if(camerasOpen){
        usage++;
    }


    usageBars.forEach(
        function(bar,index){

            bar.classList.toggle(
                "on",
                index < usage
            );

        }
    );
}


/* POWER */

function updatePower(){

    if(!running){
        return;
    }


    let drain = .007;


    if(leftDoorClosed){
        drain += .012;
    }


    if(rightDoorClosed){
        drain += .012;
    }


    if(leftLightOn){
        drain += .008;
    }


    if(rightLightOn){
        drain += .008;
    }


    if(camerasOpen){
        drain += .010;
    }


    power -= drain;


    if(power <= 0){

        power = 0;

        powerLabel.textContent = "0";

        powerOut();

        return;
    }


    powerLabel.textContent =
        Math.floor(power);


    if(power <= 20){

        powerLabel.style.color =
            "red";

    }
    else if(power <= 40){

        powerLabel.style.color =
            "yellow";

    }
    else{

        powerLabel.style.color =
            "white";
    }
}


function powerOut(){

    if(!running){
        return;
    }


    leftDoorClosed = false;

    rightDoorClosed = false;

    leftLightOn = false;

    rightLightOn = false;


    leftDoor.classList.remove("closed");

    rightDoor.classList.remove("closed");

    leftLightEffect.classList.remove("on");

    rightLightEffect.classList.remove("on");

    leftDoorEnemy.classList.remove("visible");
    rightDoorEnemy.classList.remove("visible");


    closeCamera();


    status.textContent =
        "⚡ Енергія закінчилася...";


    setTimeout(
        function(){

            if(running){

                loseGame(
                    "Енергія закінчилася."
                );

            }

        },
        2500
    );
}


/* ENEMIES */

function moveEnemies(){

    if(!running){
        return;
    }


    const chance =
        .25 +
        currentNight * .05;


    if(
        Math.random() < chance &&
        enemy1 < 6
    ){

        enemy1++;
    }


    if(
        Math.random() < chance &&
        enemy2 < 6
    ){

        enemy2++;
    }


    if(
        Math.random() < chance * .8 &&
        enemy3 < 6
    ){

        enemy3++;
    }


    if(enemy1 >= 6){

        attack(
            "left",
            "👀",
            1
        );
    }


    if(enemy2 >= 6){

        attack(
            "right",
            "🐺",
            2
        );
    }


    if(enemy3 >= 6){

        attack(
            enemy3Side,
            "🦆",
            3
        );
    }


    updateDoorEnemies();

    if(camerasOpen){

        renderCamera();

    }
}


function attack(
    side,
    icon,
    enemyNumber
){

    if(!running){
        return;
    }


    const closed =
        side === "left"
            ? leftDoorClosed
            : rightDoorClosed;


    if(closed){

        status.textContent =
            side === "left"
                ? "💥 Щось ударило у ліві двері!"
                : "💥 Щось ударило у праві двері!";

        soundHit();


        if(enemyNumber === 1){
            enemy1 = 0;
        }


        if(enemyNumber === 2){
            enemy2 = 2;
        }


        if(enemyNumber === 3){

            enemy3 = 1;

            enemy3Side =
                Math.random() < .5
                    ? "left"
                    : "right";
        }


        return;
    }


    warningIcon.textContent =
        icon;

    soundWarning();


    warning.classList.remove(
        "hidden"
    );


    setTimeout(
        function(){

            warning.classList.add(
                "hidden"
            );

        },
        600
    );


    setTimeout(
        function(){

            if(running){

                loseGame(
                    side === "left"
                        ? "Ти не закрив ліві двері."
                        : "Ти не закрив праві двері."
                );

            }

        },
        800
    );
}


/* TIME */

function advanceTime(){

    if(!running){
        return;
    }


    hour++;


    if(hour >= 6){

        hour = 6;

        timeLabel.textContent =
            "6 AM";

        winGame();

        return;
    }


    timeLabel.textContent =
        hour + " AM";


    if(hour === 5){

        status.textContent =
            "🕔 Майже 6 AM!";
    }
}


/* WIN */

function winGame(){

    if(!running){
        return;
    }


    running = false;

    stopTimers();

    closeCamera();

    soundWin();


    endScreen.classList.remove(
        "hidden"
    );


    endTitle.textContent =
        "🎉 6 AM";


    if(currentNight < 5){

        const next =
            currentNight + 1;


        if(next > unlockedNight){

            unlockedNight =
                next;


            localStorage.setItem(
                "atbNight",
                String(unlockedNight)
            );
        }


        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! Відкрито Ніч " +
            next +
            ".";

    }
    else{

        endText.textContent =
            "🏆 Ти пережив усі П'ЯТЬ НОЧЕЙ В АТБ!";
    }


    updateNightButtons();
}


/* LOSE */

function loseGame(reason){

    if(!running){
        return;
    }


    running = false;

    stopTimers();

    closeCamera();

    soundLose();


    warning.classList.add(
        "hidden"
    );


    endScreen.classList.remove(
        "hidden"
    );


    endTitle.textContent =
        "GAME OVER";


    endText.textContent =
        reason;
}


/* RESTART */

restartBtn.addEventListener(
    "click",
    function(){

        startGame(
            currentNight
        );
    }
);


/* MENU BUTTON */

menuBtn.addEventListener(
    "click",
    function(){

        stopTimers();

        running = false;


        game.classList.add(
            "hidden"
        );


        endScreen.classList.add(
            "hidden"
        );


        menu.classList.remove(
            "hidden"
        );
    }
);


/* TIMERS */

function startTimers(){

    powerTimer =
        setInterval(
            updatePower,
            100
        );


    timeTimer =
        setInterval(
            advanceTime,
            20000
        );


    enemyTimer =
        setInterval(
            moveEnemies,
            Math.max(
                2300,
                5200 -
                currentNight * 400
            )
        );
}


function stopTimers(){

    clearInterval(powerTimer);

    clearInterval(timeTimer);

    clearInterval(enemyTimer);


    powerTimer = null;

    timeTimer = null;

    enemyTimer = null;
}


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(event){

        if(!running){
            return;
        }


        const key =
            event.key.toLowerCase();


        if(key === "q"){
            leftDoorBtn.click();
        }


        if(key === "e"){
            rightDoorBtn.click();
        }


        if(key === "a"){
            leftLightBtn.click();
        }


        if(key === "d"){
            rightLightBtn.click();
        }


        if(key === "c"){

            if(camerasOpen){

                closeCamera();

            }
            else{

                cameraBtn.click();
            }
        }


        if(
            event.key === "Escape" &&
            camerasOpen
        ){

            closeCamera();
        }
    }
);


updateNightButtons();

console.log(
    "П'ЯТЬ НОЧЕЙ В АТБ запущено"
);
</script>
