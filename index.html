<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
    user-select:none;
    touch-action:manipulation;
    font-family:inherit;
}

/* =========================================================
   MENU
========================================================= */

.screen{
    position:fixed;
    inset:0;
    z-index:5000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            #242424 0%,
            #080808 58%,
            #000 100%
        );
}

.title{
    font-size:clamp(40px,7vw,90px);
    letter-spacing:4px;

    text-shadow:
        0 0 10px #fff,
        0 0 30px red,
        0 0 70px red;
}

.subtitle{
    margin-top:15px;
    color:#aaa;
    font-size:18px;
}

.menuBtn{
    min-width:280px;
    margin-top:22px;
    padding:16px 26px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:#fff;

    font-size:18px;
    font-weight:bold;

    transition:.15s;
}

.menuBtn:hover{
    background:#292929;
    transform:scale(1.03);
}

#playBtn{
    background:#0874ff;
}

/* =========================================================
   NIGHT MENU
========================================================= */

.nightButtons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;

    gap:12px;
    margin-top:25px;
}

.nightBtn{
    width:135px;
    height:105px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:#fff;

    font-size:16px;
    font-weight:bold;

    transition:.15s;
}

.nightBtn span{
    display:block;
    margin-top:8px;

    color:#aaa;
    font-size:12px;
}

.nightBtn:hover:not(:disabled){
    background:#0874ff;
    transform:translateY(-2px);
}

.nightBtn:disabled{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================================================
   GAME
========================================================= */

#game{
    position:fixed;
    inset:0;

    overflow:hidden;
    background:#000;
}

/* =========================================================
   OFFICE
========================================================= */

#office{
    position:absolute;
    inset:0;

    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(0,0,0,.02),
            rgba(0,0,0,.06)
        ),
        url("office.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-color:#050505;
}

/* =========================================================
   TOP
========================================================= */

#topbar{
    position:absolute;

    top:16px;
    left:50%;

    transform:translateX(-50%);

    z-index:800;

    width:min(900px,94%);
    padding:14px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,.88);

    border:1px solid #555;
    border-radius:12px;

    box-shadow:0 0 25px #000;

    font-size:18px;
    font-weight:bold;
}

#power.medium{
    color:#ffd43b;
}

#power.low{
    color:#ff3333;
    text-shadow:0 0 10px red;
}

/* =========================================================
   STATUS
========================================================= */

#statusBox{
    position:absolute;

    top:25%;
    left:50%;

    transform:translateX(-50%);

    z-index:550;

    width:min(600px,55%);
    padding:9px 14px;

    text-align:center;

    background:rgba(0,0,0,.72);

    border:1px solid #444;
    border-radius:9px;

    box-shadow:0 0 15px #000;
}

/* =========================================================
   AUDIO BUTTONS
========================================================= */

#audioControls{
    position:absolute;

    top:82px;
    left:15px;

    z-index:900;

    display:flex;
    flex-direction:column;
    gap:7px;
}

.audioBtn{
    min-width:145px;
    padding:9px 10px;

    border:1px solid #555;
    border-radius:8px;

    background:rgba(0,0,0,.88);
    color:#fff;

    font-size:12px;
    font-weight:bold;
}

#effectsBtn.active{
    background:#123a20;
    border-color:#35cf65;
}

#musicOnBtn.active{
    background:#126a35;
    border-color:#4cff7c;
}

#musicOffBtn.active{
    background:#7b1717;
    border-color:#ff5050;
}

/* =========================================================
   USAGE
========================================================= */

#usage{
    position:absolute;

    top:82px;
    right:15px;

    z-index:900;

    min-width:225px;
    padding:11px 13px;

    background:rgba(0,0,0,.88);

    border:1px solid #555;
    border-radius:9px;

    box-shadow:0 0 18px #000;

    font-size:13px;
    font-weight:bold;
}

#usageTitle{
    display:block;
    margin-bottom:7px;
}

#usageBars{
    display:flex;
    gap:5px;
}

.usageBar{
    width:25px;
    height:12px;

    border:1px solid #555;
    border-radius:2px;

    background:#151515;
}

.usageBar.on{
    background:#63ff4d;
    box-shadow:0 0 8px #63ff4d;
}

.usageBar.warning{
    background:#ffd43b;
    box-shadow:0 0 8px #ffd43b;
}

.usageBar.danger{
    background:#ff3030;
    box-shadow:0 0 9px red;
}

/* =========================================================
   DOORS
========================================================= */

.doorFrame{
    position:absolute;

    top:21%;

    width:11.5%;
    height:56%;

    z-index:200;

    overflow:hidden;
}

#leftDoorFrame{
    left:7.2%;
}

#rightDoorFrame{
    right:7.5%;
}

.doorLight{
    position:absolute;
    inset:0;

    z-index:5;

    opacity:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,220,.98),
            rgba(255,215,80,.65) 35%,
            rgba(255,170,20,.25) 60%,
            transparent 90%
        );
}

.doorFrame.lightOn .doorLight{
    opacity:1;
}

/* =========================================================
   PNG MOB AT DOOR
========================================================= */

.doorEnemy{
    position:absolute;

    left:50%;
    top:57%;

    z-index:15;

    width:235%;
    height:145%;

    object-fit:contain;

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,-50%)
        scale(.86);

    transform-origin:center bottom;

    transition:
        opacity .1s,
        transform .12s;

    filter:
        brightness(.75)
        contrast(1.22)
        saturate(.78)
        drop-shadow(0 0 12px #000)
        drop-shadow(0 0 17px rgba(255,0,0,.5));
}

.doorEnemy.visible{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1.08);
}

.doorEnemy.threat{
    animation:
        threatMove .28s
        infinite alternate
        ease-in-out;
}

@keyframes threatMove{
    from{
        transform:
            translate(-50%,-50%)
            scale(1.05)
            rotate(-.8deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            scale(1.15)
            rotate(.8deg);
    }
}

/* =========================================================
   METAL DOOR
========================================================= */

.door{
    position:absolute;
    inset:0;

    z-index:30;

    transform:translateY(-105%);

    transition:transform .35s ease;

    background:
        repeating-linear-gradient(
            0deg,
            #111 0,
            #111 25px,
            #555 26px,
            #888 29px,
            #222 35px
        );

    border:2px solid #777;

    box-shadow:
        inset 0 0 30px #000;
}

.door.closed{
    transform:translateY(0);
}

/* =========================================================
   LIGHT
========================================================= */

.lightEffect{
    position:absolute;

    top:0;

    width:35%;
    height:100%;

    z-index:100;

    opacity:0;

    pointer-events:none;

    transition:opacity .12s;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at left center,
            rgba(255,245,170,.38),
            transparent 70%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at right center,
            rgba(255,245,170,.38),
            transparent 70%
        );
}

.lightEffect.on{
    opacity:1;
}

/* =========================================================
   CONTROLS
========================================================= */

.sideControls{
    position:absolute;

    top:47%;

    z-index:700;

    display:flex;
    flex-direction:column;

    gap:10px;
}

#leftControls{
    left:22%;
}

#rightControls{
    right:22%;
}

.controlBtn{
    width:170px;

    padding:13px 8px;

    border:1px solid #666;
    border-radius:10px;

    background:rgba(5,5,5,.92);
    color:#fff;

    font-weight:bold;

    box-shadow:0 0 18px #000;
}

.controlBtn.lightActive{
    background:#ffd63a;
    color:#111;

    box-shadow:
        0 0 12px #fff,
        0 0 25px #ffd63a;
}

.controlBtn.doorActive{
    background:#a40000;
    box-shadow:0 0 20px red;
}

/* =========================================================
   CAMERA BUTTON
========================================================= */

#cameraBtn{
    position:absolute;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    z-index:700;

    padding:15px 30px;

    border:0;
    border-radius:12px;

    background:#0874ff;
    color:#fff;

    font-size:17px;
    font-weight:bold;

    box-shadow:
        0 0 25px rgba(0,100,255,.55);
}

/* =========================================================
   PHONE
========================================================= */

#phone{
    position:fixed;

    top:85px;
    left:50%;

    transform:translateX(-50%);

    z-index:99990;

    width:min(620px,95vw);

    padding:18px;

    background:#050805;

    border:3px solid #42ff79;
    border-radius:18px;

    box-shadow:
        0 0 25px rgba(66,255,121,.5),
        0 0 80px #000;
}

#phone.ringing{
    animation:ring .16s infinite alternate;
}

@keyframes ring{
    from{
        transform:
            translateX(-50%)
            rotate(-1deg);
    }

    to{
        transform:
            translateX(-50%)
            rotate(1deg);
    }
}

.phoneHeader{
    display:flex;
    align-items:center;
    gap:14px;
}

.phoneIcon{
    width:65px;
    height:65px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:#159447;

    font-size:36px;

    box-shadow:0 0 20px #32ff70;
}

#callerName{
    font-size:21px;
    font-weight:900;
}

#phoneState{
    margin-top:5px;

    color:#74ff9a;
    font-weight:bold;
}

#phoneText{
    max-height:180px;

    margin-top:14px;
    padding:12px;

    overflow:auto;

    background:#090909;

    border:1px solid #333;
    border-radius:9px;

    color:#ddd;

    white-space:pre-line;
    line-height:1.5;
}

.phoneButtons{
    display:flex;
    flex-wrap:wrap;

    gap:9px;

    margin-top:14px;
}

.phoneBtn{
    flex:1;

    min-width:125px;

    padding:13px 7px;

    border:0;
    border-radius:9px;

    color:#fff;

    font-weight:bold;
}

#answerBtn{
    background:#159447;
}

#repeatVoiceBtn{
    background:#0b65c2;
}

#skipBtn{
    background:#444;
}

#hangBtn{
    background:#a31313;
}

/* =========================================================
   CAMERA PANEL
========================================================= */

#cameraPanel{
    position:fixed;
    inset:0;

    z-index:3000;

    padding:18px;

    background:#020202;
}

.cameraHeader{
    height:55px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid #444;
}

#closeCamera{
    padding:10px 15px;

    border:0;
    border-radius:8px;

    background:#a00;
    color:#fff;

    font-weight:bold;
}

#cameraView{
    position:relative;

    height:calc(100vh - 90px);

    margin-top:12px;

    overflow:hidden;

    border:3px solid #333;
    border-radius:8px;

    background:#000;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* =========================================================
   CAMERA MOBS
========================================================= */

.camEnemy{
    position:absolute;

    z-index:30;

    object-fit:contain;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .12s,
        width .25s,
        height .25s,
        bottom .25s;

    filter:
        brightness(.72)
        contrast(1.25)
        saturate(.70)
        drop-shadow(0 0 24px #000);
}

.camEnemy.visible{
    opacity:1;
}

.camEnemy.cameraThreat{
    animation:
        cameraThreat .35s
        infinite alternate
        ease-in-out;
}

@keyframes cameraThreat{
    from{
        margin-bottom:0;
        filter:
            brightness(.72)
            contrast(1.25)
            saturate(.70)
            drop-shadow(0 0 24px #000);
    }

    to{
        margin-bottom:9px;
        filter:
            brightness(.85)
            contrast(1.3)
            saturate(.80)
            drop-shadow(0 0 30px #000);
    }
}

/* =========================================================
   CCTV EFFECTS
========================================================= */

#cameraVignette{
    position:absolute;
    inset:0;

    z-index:40;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.28) 68%,
            rgba(0,0,0,.82) 100%
        );
}

#cameraScanlines{
    position:absolute;
    inset:0;

    z-index:80;

    pointer-events:none;

    opacity:.38;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.08) 4px
        );
}

#cameraNoise{
    position:absolute;
    inset:-20px;

    z-index:81;

    pointer-events:none;

    opacity:.10;

    background:
        repeating-radial-gradient(
            circle at 30% 40%,
            rgba(255,255,255,.45) 0,
            rgba(255,255,255,.45) 1px,
            transparent 1px,
            transparent 4px
        );

    animation:noiseMove .15s infinite;
}

@keyframes noiseMove{
    0%{transform:translate(0,0);}
    25%{transform:translate(-5px,4px);}
    50%{transform:translate(4px,-3px);}
    75%{transform:translate(-3px,-5px);}
    100%{transform:translate(3px,2px);}
}

#cameraFlash{
    position:absolute;
    inset:0;

    z-index:500;

    opacity:0;

    pointer-events:none;

    background:#fff;
}

#cameraFlash.flash{
    animation:flashCam .18s;
}

@keyframes flashCam{
    0%{opacity:.95;}
    100%{opacity:0;}
}

/* =========================================================
   CAMERA UI
========================================================= */

#cameraLabel{
    position:absolute;

    top:18px;
    left:20px;

    z-index:120;

    padding:8px 12px;

    background:rgba(0,0,0,.75);

    border:1px solid #777;
    border-radius:6px;

    font-weight:bold;
}

#cameraRec{
    position:absolute;

    top:18px;
    right:20px;

    z-index:120;

    padding:8px 12px;

    background:rgba(0,0,0,.75);

    border:1px solid #777;
    border-radius:6px;

    color:#ff3535;
    font-weight:bold;
}

#cameraRec::before{
    content:"● ";

    animation:
        recBlink .8s infinite;
}

@keyframes recBlink{
    0%,49%{opacity:1;}
    50%,100%{opacity:.2;}
}

#cameraInfo{
    position:absolute;

    left:20px;
    bottom:20px;

    z-index:120;

    min-width:270px;

    padding:14px;

    background:rgba(0,0,0,.86);

    border:1px solid #555;
    border-radius:9px;
}

#cameraInfo p{
    margin-top:7px;
    color:#aaa;
}

#cameraMap{
    position:absolute;

    right:20px;
    bottom:20px;

    z-index:120;

    width:290px;
    height:215px;

    background:rgba(0,0,0,.86);

    border:1px solid #777;
    border-radius:10px;

    box-shadow:0 0 25px #000;
}

.camBtn{
    position:absolute;

    width:78px;

    padding:8px;

    border:1px solid #777;
    border-radius:6px;

    background:#151515;
    color:#fff;

    font-weight:bold;
}

.camBtn.active{
    background:#0874ff;
    box-shadow:0 0 14px #0874ff;
}

.camBtn[data-cam="0"]{
    top:18px;
    left:106px;
}

.camBtn[data-cam="1"]{
    top:65px;
    left:20px;
}

.camBtn[data-cam="2"]{
    top:65px;
    right:20px;
}

.camBtn[data-cam="3"]{
    top:115px;
    left:20px;
}

.camBtn[data-cam="4"]{
    top:115px;
    right:20px;
}

.camBtn[data-cam="5"]{
    bottom:12px;
    left:106px;
}

/* =========================================================
   JUMPSCARE
========================================================= */

#jumpscare{
    position:fixed;
    inset:0;

    z-index:100000;

    display:none;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #330000,
            #080000 55%,
            #000
        );
}

#jumpscare.active{
    display:flex;

    animation:
        scareFlash .08s infinite,
        scareShake .05s infinite;
}

#jumpscareImage{
    width:min(100vw,1200px);
    height:min(100vh,950px);

    object-fit:contain;

    filter:
        contrast(1.25)
        brightness(1.08)
        drop-shadow(0 0 40px red);

    animation:
        scareZoom .72s forwards;
}

@keyframes scareZoom{
    from{
        transform:scale(.25);
    }

    to{
        transform:scale(1.48);
    }
}

@keyframes scareFlash{
    0%{filter:brightness(.75);}
    50%{filter:brightness(1.65);}
    100%{filter:brightness(.85);}
}

@keyframes scareShake{
    0%{transform:translate(0,0);}
    25%{transform:translate(-7px,4px);}
    50%{transform:translate(7px,-4px);}
    75%{transform:translate(-4px,-4px);}
    100%{transform:translate(0,0);}
}

/* =========================================================
   END
========================================================= */

#endScreen{
    position:fixed;
    inset:0;

    z-index:5000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#000;

    text-align:center;
}

#endTitle{
    font-size:clamp(55px,10vw,120px);
}

#endText{
    margin-top:15px;

    color:#aaa;
    font-size:20px;
}

.endBtns{
    display:flex;
    gap:10px;

    margin-top:25px;
}

/* =========================================================
   TABLET
========================================================= */

@media(max-width:1100px){

    .doorFrame{
        width:13%;
    }

    #leftDoorFrame{
        left:5%;
    }

    #rightDoorFrame{
        right:5%;
    }

    #leftControls{
        left:20%;
    }

    #rightControls{
        right:20%;
    }

    .controlBtn{
        width:140px;
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:750px){

    #topbar{
        top:5px;
        padding:9px;
        font-size:12px;
    }

    #audioControls{
        top:55px;
        left:5px;
    }

    .audioBtn{
        min-width:100px;
        padding:6px 4px;
        font-size:9px;
    }

    #usage{
        top:55px;
        right:5px;

        min-width:140px;

        padding:7px;

        font-size:9px;
    }

    #usageBars{
        gap:3px;
    }

    .usageBar{
        width:16px;
        height:9px;
    }

    .doorFrame{
        width:18%;
    }

    #leftDoorFrame{
        left:1%;
    }

    #rightDoorFrame{
        right:1%;
    }

    .doorEnemy{
        width:215%;
        height:135%;
    }

    #leftControls{
        left:20%;
    }

    #rightControls{
        right:20%;
    }

    .controlBtn{
        width:102px;
        padding:9px 4px;
        font-size:10px;
    }

    #cameraBtn{
        bottom:8px;

        padding:10px 15px;

        font-size:11px;
    }

    #phone{
        top:52px;
        width:96vw;
        padding:11px;
    }

    .phoneIcon{
        width:43px;
        height:43px;
        font-size:25px;
    }

    #callerName{
        font-size:15px;
    }

    #phoneState{
        font-size:11px;
    }

    #phoneText{
        max-height:110px;
        font-size:12px;
    }

    .phoneBtn{
        min-width:100px;
        padding:10px 4px;
        font-size:10px;
    }

    #cameraPanel{
        padding:6px;
    }

    .cameraHeader{
        height:40px;
    }

    .cameraHeader h2{
        font-size:13px;
    }

    #closeCamera{
        padding:7px 10px;
        font-size:10px;
    }

    #cameraView{
        height:calc(100vh - 55px);
        margin-top:5px;
    }

    #cameraLabel{
        top:8px;
        left:8px;
        font-size:11px;
    }

    #cameraRec{
        top:8px;
        right:8px;
        font-size:10px;
    }

    #cameraInfo{
        left:5px;
        bottom:5px;

        min-width:0;
        width:145px;

        padding:8px;

        font-size:10px;
    }

    #cameraInfo h2{
        font-size:11px;
    }

    #cameraMap{
        width:205px;
        height:165px;

        right:5px;

        usage++;

    if(rightDoorClosed){
        usage++;
    }

    if(leftLightOn){
        usage++;
    }

    if(rightLightOn){
        usage++;
    }

    if(camerasOpen){
        usage++;
    }

    usageNumber.textContent =
        usage;

    usageBars.forEach(
        function(
            bar,
            index
        ){

            bar.classList.remove(
                "on",
                "warning",
                "danger"
            );

            if(index < usage){

                if(usage >= 6){

                    bar.classList.add(
                        "danger"
                    );

                }else if(
                    usage >= 4
                ){

                    bar.classList.add(
                        "warning"
                    );

                }else{

                    bar.classList.add(
                        "on"
                    );
                }
            }
        }
    );
}

function cameraStateForPosition(
    position
){

    if(position === 5){
        return "attack";
    }

    if(
        position === 0 ||
        position === 2
    ){
        return "idle";
    }

    return "walk";

/* =========================================================
   CAMERA MOB POSITION
========================================================= */

function setCameraMobStyle(
    element,
    mob,
    camera
){

    const style =
        CAMERA_MOB_STYLE[
            camera
        ];

    element.style.width =
        style.width;

    element.style.height =
        style.height;

    element.style.bottom =
        style.bottom;

    element.style.left =
        "auto";

    element.style.right =
        "auto";

    element.style.transform =
        "none";

    if(mob === "bear"){

        element.style.left =
            camera === 5
            ? "10%"
            : "8%";
    }

    if(mob === "wolf"){

        element.style.right =
            camera === 5
            ? "10%"
            : "8%";
    }

    if(mob === "duck"){

        element.style.left =
            "50%";

        element.style.transform =
            "translateX(-50%)";
    }
}

        .04;

/* =========================================================
   POWER
========================================================= */

function drainForNight(percent){

    return (
        percent /
        (
            nightMs() /
            100
        )
    );
}

function updatePower(){

    if(
        !running ||
        powerOutActive
    ){
        return;
    }

    let drain =
        drainForNight(
            40
        );

    if(leftDoorClosed){

        drain +=
            drainForNight(
                34
            );
    }

    if(rightDoorClosed){

        drain +=
            drainForNight(
                34
            );
    }

    if(leftLightOn){

        drain +=
            drainForNight(
                21
            );
    }

    if(rightLightOn){

        drain +=
            drainForNight(
                21
            );
    }

    if(camerasOpen){

        drain +=
            drainForNight(
                20
            );
    }

    power -= drain;

    if(power <= 0){

        power = 0;

        powerLabel.textContent =
            "0";

        powerOut();

        return;
    }

    powerLabel.textContent =
        Math.floor(
            power
        );

    powerLabel.classList.remove(
        "low",
        "medium"
    );

    if(power <= 20){

        powerLabel.classList.add(
            "low"
        );

    }else if(power <= 40){

        powerLabel.classList.add(
            "medium"
        );
    }
}

/* =========================================================
   PHONE VOICE
========================================================= */

let speechParts = [];
let speechIndex = 0;
let speechStopped = false;

let activeUtterance = null;

function chooseVoice(){

    if(
        !(
            "speechSynthesis"
            in window
        )
    ){
        return null;
    }

    const voices =
        speechSynthesis
        .getVoices();

    return (

        voices.find(
            voice =>
                voice.lang &&
                voice.lang
                .toLowerCase()
                .startsWith("uk")
        )

        ||

        voices.find(
            voice =>
                voice.lang &&
                voice.lang
                .toLowerCase()
                .startsWith("ru")
        )

        ||

        voices[0]

        ||

        null
    );
}

function makeSpeechParts(text){

    const parts =
        text
        .replace(
            /\n+/g,
            " "
        )
        .match(
            /[^.!?]+[.!?]+|[^.!?]+$/g
        );

    return parts || [text];
}

function speakPhoneGuy(){

    if(
        !(
            "speechSynthesis"
            in window
        ) ||
        !(
            "SpeechSynthesisUtterance"
            in window
        )
    ){

        phoneState.textContent =
            "❌ ГОЛОС НЕ ПІДТРИМУЄТЬСЯ";

        return;
    }

    speechSynthesis.cancel();
    speechSynthesis.resume();

    lowerMusic();

    speechStopped = false;

    speechParts =
        makeSpeechParts(
            PHONE_TEXT[
                currentNight
            ]
        );

    speechIndex = 0;

    phoneState.textContent =
        "🔊 ОХОРОНЕЦЬ ГОВОРИТЬ...";

    setTimeout(
        speakNext,
        100
    );
}

function speakNext(){

    if(speechStopped){
        return;
    }

    if(
        speechIndex >=
        speechParts.length
    ){

        activeUtterance = null;

        phoneState.textContent =
            "✅ РОЗМОВУ ЗАВЕРШЕНО";

        restoreMusic();

        return;
    }

    activeUtterance =
        new SpeechSynthesisUtterance(
            speechParts[
                speechIndex
            ]
        );

    const voice =
        chooseVoice();

    if(voice){

        activeUtterance.voice =
            voice;

        activeUtterance.lang =
            voice.lang;

    }else{

        activeUtterance.lang =
            "uk-UA";
    }

    activeUtterance.rate =
        .90;

    activeUtterance.pitch =
        .82;

    activeUtterance.volume =
        1;

    activeUtterance.onend =
    function(){

        speechIndex++;

        setTimeout(
            speakNext,
            90
        );
    };

    activeUtterance.onerror =
    function(){

        speechIndex++;

        setTimeout(
            speakNext,
            100
        );
    };

    speechSynthesis.speak(
        activeUtterance
    );
}

function stopSpeech(){

    speechStopped = true;

    activeUtterance = null;

    speechParts = [];

    speechIndex = 0;

    if(
        "speechSynthesis"
        in window
    ){

        speechSynthesis.cancel();
    }

    restoreMusic();
}

/* =========================================================
   JUMPSCARE
========================================================= */

function showJumpscare(
    mob,
    side
){

    if(scareRunning){
        return;
    }

    scareRunning = true;

    running = false;

    powerOutActive = false;

    stopTimers();
    stopAnimation();

    stopPhone();
    stopMusic();

    camerasOpen = false;

    cameraPanel.classList.add(
        "hidden"
    );

    leftDoorEnemy.classList.remove(
        "visible",
        "threat"
    );

    rightDoorEnemy.classList.remove(
        "visible",
        "threat"
    );

    jumpscareImage.src =
        MOB_ANIMATIONS[
            mob
        ].jumpscare;

    jumpscare.classList.add(
        "active"
    );

    playSound(
        soundJumpscare,
        1
    );

    setTimeout(
        function(){

            jumpscare.classList.remove(
                "active"
            );

            stopSound(
                soundJumpscare
            );

            showGameOver(
                side === "left"
                ? "Ти не закрив ліві двері."
                : "Ти не закрив праві двері."
            );

        },
        1700
    );
}

/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(reason){

    playSound(
        soundGameOver,
        .85
    );

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "GAME OVER";

    endText.textContent =

}

/* =========================================================
   WIN
========================================================= */

function winGame(){

    running = false;

    powerOutActive = false;

    stopTimers();
    stopAnimation();

    stopPhone();
    stopMusic();

    camerasOpen = false;

    cameraPanel.classList.add(
        "hidden"
    );

    playSound(
        soundWin,
        1
    );

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "🎉 6 AM";

    if(currentNight < 5){

        const next =
            currentNight + 1;

        if(next > unlockedNight){

            unlockedNight =
                next;

            localStorage.setItem(
                "atbNight",
                String(next)
            );
        }

        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! Відкрито ніч " +
            next +
            ".";

    }else{

        endText.textContent =
            "🏆 ТИ ПРОЙШОВ УСІ 5 НОЧЕЙ В АТБ!";
    }

    updateNightButtons();
}

========================================================= */

function startTimers(){

    powerTimer =
        setInterval(
            updatePower,
            100
        );

    clockTimer =
        setInterval(
            advanceHour,
            hourMs()
        );

    enemyTimer =
        setInterval(
            moveEnemies,
            MOVE_TIME[
                currentNight
            ]
        );
}

function stopTimers(){

    clearInterval(
        powerTimer
    );

    clearInterval(
        clockTimer
    );

    clearInterval(
        enemyTimer
    );

    clearTimeout(
        attack1
    );

    clearTimeout(
        attack2
    );

    clearTimeout(
        attack3
    );

    powerTimer = null;
    clockTimer = null;
    enemyTimer = null;

    attack1 = null;
    attack2 = null;
    attack3 = null;
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(!running){
            return;
        }

        const key =
            event.key
            .toLowerCase();

        if(key === "a"){
            leftLightBtn.click();
        }

        if(key === "d"){
            rightLightBtn.click();
        }

        if(key === "q"){
            leftDoorBtn.click();
        }

        if(key === "e"){
            rightDoorBtn.click();
        }

        if(key === "c"){

            if(camerasOpen){

                closeCamera.click();

            }else{

                cameraBtn.click();
            }
        }

        if(
            event.key ===
            "Escape" &&
            camerasOpen
        ){

            closeCamera.click();
        }
    }
);

        ...MOB_ANIMATIONS.duck.walk,
        ...MOB_ANIMATIONS.duck.attack,

        MOB_ANIMATIONS.duck.jumpscare
    ];

    const uniqueFiles =
        [...new Set(files)];

    uniqueFiles.forEach(
        function(src){

            const image =
                new Image();

            image.src =
                src;
        }
    );
}
