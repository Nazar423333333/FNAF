<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
    font-family:inherit;
    user-select:none;
}

/* =========================================================
   MENU
========================================================= */

#menu,
#nightMenu{
    position:fixed;
    inset:0;
    z-index:5000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            #242424,
            #070707 60%,
            #000
        );
}

#menu h1{
    font-size:clamp(42px,7vw,95px);
    letter-spacing:4px;

    text-shadow:
        0 0 10px white,
        0 0 30px #d71920,
        0 0 70px #d71920;
}

#menu p{
    margin-top:16px;
    color:#aaa;
    font-size:20px;
}

.menuBtn{
    min-width:280px;

    margin-top:24px;

    padding:17px 30px;

    border:1px solid #555;
    border-radius:12px;

    background:#111;
    color:white;

    font-size:18px;
    font-weight:bold;

    transition:.18s;
}

.menuBtn:hover{
    transform:scale(1.04);
    background:#292929;
}

#playBtn{
    background:#086cff;
}

#playBtn:hover{
    background:#2780ff;
}

/* =========================================================
   NIGHT SELECT
========================================================= */

#nightMenu h2{
    margin-bottom:15px;
    font-size:46px;
}

#nightInfo{
    margin-bottom:28px;

    color:#aaa;

    font-size:17px;
}

.nightButtons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

.nightBtn{
    width:130px;
    height:100px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:white;

    font-size:16px;
    font-weight:bold;

    transition:.15s;
}

.nightBtn span{
    display:block;

    margin-top:8px;

    color:#999;

    font-size:12px;
}

.nightBtn:hover:not(:disabled){
    background:#086cff;
    transform:translateY(-2px);
}

.nightBtn:hover:not(:disabled) span{
    color:white;
}

.nightBtn.locked{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================================================
   GAME
========================================================= */

#game{
    position:fixed;
    inset:0;

    overflow:hidden;

    background:#000;
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar{
    position:absolute;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:700;

    width:min(900px,94%);

    padding:14px 22px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,.88);

    border:1px solid #555;
    border-radius:14px;

    box-shadow:
        0 0 25px black;

    font-size:19px;
    font-weight:bold;
}

#powerLabel.low{
    color:#ff3030;

    text-shadow:
        0 0 10px red;
}

#powerLabel.medium{
    color:#ffd43b;
}

/* =========================================================
   OFFICE PNG
========================================================= */

#office{
    position:absolute;

    inset:0;

    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(0,0,0,.02),
            rgba(0,0,0,.05)
        ),
        url("office.png");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    background-color:#050505;
}

/* =========================================================
   STATUS
========================================================= */

#statusBox{
    position:absolute;

    top:25%;
    left:50%;

    transform:translateX(-50%);

    z-index:500;

    width:min(620px,55%);

    padding:9px 16px;

    background:rgba(0,0,0,.66);

    border:1px solid rgba(255,255,255,.14);
    border-radius:10px;

    text-align:center;

    color:#ddd;

    font-size:16px;

    box-shadow:
        0 0 18px black;
}

/* =========================================================
   DOOR FRAMES
========================================================= */

.doorFrame{
    position:absolute;

    top:21%;

    width:11.5%;
    height:56%;

    z-index:160;

    overflow:hidden;

    background:transparent;

    border:none;

    box-shadow:none;
}

#leftDoorFrame{
    left:7.2%;
}

#rightDoorFrame{
    right:7.5%;
}

/* =========================================================
   LIGHT IN DOOR
========================================================= */

.doorLight{
    position:absolute;

    inset:0;

    z-index:5;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .12s;

    background:
        radial-gradient(
            ellipse at 50% 52%,
            rgba(255,255,225,.96) 0%,
            rgba(255,240,155,.82) 20%,
            rgba(255,210,65,.56) 44%,
            rgba(255,160,20,.20) 70%,
            transparent 96%
        );

    box-shadow:
        inset 0 0 40px rgba(255,240,160,.45),
        inset 0 0 90px rgba(255,190,30,.28);
}

.doorFrame.lightOn .doorLight{
    opacity:1;
}

/* =========================================================
   MOB IN DOOR
========================================================= */

.doorEnemy{
    position:absolute;

    left:50%;
    top:52%;

    z-index:10;

    opacity:0;

    pointer-events:none;

    font-size:clamp(65px,7vw,115px);

    transform:
        translate(-50%,-50%)
        scale(.72);

    transition:
        opacity .1s,
        transform .1s;

    filter:
        drop-shadow(0 0 8px white)
        drop-shadow(0 0 22px red)
        drop-shadow(0 0 35px black);
}

.doorEnemy.visible{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

/* =========================================================
   DOORS
========================================================= */

.door{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:30;

    background:
        repeating-linear-gradient(
            0deg,
            #111 0px,
            #111 26px,
            #454545 27px,
            #8a8a8a 30px,
            #242424 35px
        );

    border:2px solid #666;

    box-shadow:
        inset 0 0 30px black;

    transform:
        translateY(-105%);

    transition:
        transform .35s ease;
}

.door::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 42px,
            rgba(255,255,255,.06) 43px 46px
        );
}

.door::after{
    content:"";

    position:absolute;

    left:50%;
    top:8%;

    transform:
        translateX(-50%);

    width:62%;
    height:4px;

    background:#888;

    box-shadow:
        0 62px #888,
        0 124px #888,
        0 186px #888,
        0 248px #888,
        0 310px #888,
        0 372px #888;
}

.door.closed{
    transform:
        translateY(0);
}

/* =========================================================
   LIGHT EFFECT
========================================================= */

.lightEffect{
    position:absolute;

    top:0;

    width:35%;
    height:100%;

    z-index:100;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .12s;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at 9% 50%,
            rgba(255,245,175,.42),
            rgba(255,215,65,.12) 38%,
            transparent 75%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at 91% 50%,
            rgba(255,245,175,.42),
            rgba(255,215,65,.12) 38%,
            transparent 75%
        );
}

.lightEffect.on{
    opacity:1;
}

/* =========================================================
   CONTROLS
========================================================= */

.sideControls{
    position:absolute;

    top:47%;

    z-index:550;

    display:flex;
    flex-direction:column;

    gap:11px;
}

#leftControls{
    left:22%;
}

#rightControls{
    right:22%;
}

.controlBtn{
    width:170px;

    padding:14px 10px;

    border:1px solid #666;
    border-radius:11px;

    background:rgba(8,8,8,.92);

    color:white;

    font-size:15px;
    font-weight:bold;

    box-shadow:
        0 0 18px black;

    transition:.15s;
}

.controlBtn:hover{
    background:#303030;

    transform:
        scale(1.03);
}

.controlBtn.lightOn{
    background:#ffd84a;
    color:#111;

    border-color:white;

    box-shadow:
        0 0 12px white,
        0 0 30px #ffd84a;
}

.controlBtn.doorOn{
    background:#b51414;

    color:white;

    border-color:#ff5555;

    box-shadow:
        0 0 15px red,
        0 0 30px rgba(255,0,0,.6);
}

/* =========================================================
   CAMERA BUTTON
========================================================= */

#cameraBtn{
    position:absolute;

    left:50%;
    bottom:24px;

    transform:
        translateX(-50%);

    z-index:600;

    padding:17px 35px;

    border:0;
    border-radius:14px;

    background:#086cff;
    color:white;

    font-size:18px;
    font-weight:bold;

    box-shadow:
        0 0 28px rgba(0,100,255,.55);

    transition:.18s;
}

#cameraBtn:hover{
    transform:
        translateX(-50%)
        scale(1.04);

    background:#287fff;
}

/* =========================================================
   SOUND
========================================================= */

#soundBtn{
    position:absolute;

    top:88px;
    left:22px;

    z-index:700;

    padding:10px 14px;

    border:1px solid #555;
    border-radius:9px;

    background:rgba(0,0,0,.80);

    color:white;

    font-weight:bold;
}

/* =========================================================
   USAGE
========================================================= */

#usage{
    position:absolute;

    top:88px;
    right:22px;

    z-index:700;

    padding:10px 13px;

    border:1px solid #444;
    border-radius:8px;

    background:rgba(0,0,0,.80);

    font-size:14px;
}

.usageBar{
    display:inline-block;

    width:17px;
    height:11px;

    margin-left:3px;

    border:1px solid #555;

    background:#111;
}

.usageBar.on{
    background:#63ff4d;

    box-shadow:
        0 0 8px #63ff4d;
}

/* =========================================================
   CAMERA PANEL
========================================================= */

#cameraPanel{
    position:absolute;

    inset:0;

    z-index:1500;

    padding:20px;

    background:#020202;
}

.cameraHeader{
    height:65px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:
        1px solid #333;
}

.cameraHeader h2{
    letter-spacing:2px;
}

#closeCameraBtn{
    padding:12px 18px;

    border:0;
    border-radius:10px;

    background:#a00;
    color:white;

    font-weight:bold;
}

/* =========================================================
   CAMERA VIEW
========================================================= */

#cameraView{
    position:relative;

    height:
        calc(100vh - 105px);

    margin-top:14px;

    overflow:hidden;

    border:3px solid #333;
    border-radius:10px;

    background:
        radial-gradient(
            circle at center,
            #3d4143,
            #161819 55%,
            #020202
        );
}

#cameraView::before{
    content:"";

    position:absolute;
    inset:0;

    z-index:40;

    pointer-events:none;

    opacity:.35;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 7px,
            rgba(255,255,255,.025) 8px
        );

    animation:
        noiseMove .18s infinite;
}

#cameraView::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:41;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.05) 4px
        );
}

@keyframes noiseMove{
    0%{
        transform:
            translate(0,0);
    }

    50%{
        transform:
            translate(2px,-2px);
    }

    100%{
        transform:
            translate(-2px,1px);
    }
}

/* =========================================================
   CAMERA SCENE
========================================================= */

#cameraScene{
    position:absolute;

    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding-bottom:130px;

    color:#acb4b8;

    opacity:.40;

    text-align:center;

    font-size:
        clamp(24px,4vw,55px);

    letter-spacing:7px;
}

#cameraRoomIcon{
    position:absolute;

    top:43%;
    left:50%;

    transform:
        translate(-50%,-50%);

    font-size:155px;

    opacity:.18;
}

/* =========================================================
   CAMERA ENEMIES
========================================================= */

.enemy{
    position:absolute;

    top:46%;

    z-index:25;

    font-size:135px;

    opacity:0;

    filter:
        drop-shadow(0 0 20px red)
        drop-shadow(0 0 35px black);
}

.enemy.visible{
    opacity:1;
}

#enemy1{
    left:22%;
}

#enemy2{
    right:22%;
}

#enemy3{
    left:50%;

    transform:
        translateX(-50%);
}

/* =========================================================
   CAMERA INFO
========================================================= */

#cameraInfo{
    position:absolute;

    left:25px;
    bottom:25px;

    z-index:80;

    min-width:290px;

    padding:15px;

    background:
        rgba(0,0,0,.84);

    border:
        1px solid #444;

    border-radius:10px;
}

#cameraInfo p{
    margin-top:8px;

    color:#aaa;
}

/* =========================================================
   CAMERA MAP
========================================================= */

#cameraMap{
    position:absolute;

    right:25px;
    bottom:25px;

    z-index:80;

    width:290px;
    height:230px;

    background:
        rgba(0,0,0,.92);

    border:
        1px solid #555;

    border-radius:12px;

    box-shadow:
        0 0 30px black;
}

.camBtn{
    position:absolute;

    width:78px;

    padding:9px;

    border:1px solid #666;
    border-radius:7px;

    background:#151515;
    color:white;

    font-weight:bold;

    transition:.12s;
}

.camBtn:hover{
    background:#333;
}

.camBtn.active{
    background:#086cff;

    box-shadow:
        0 0 15px #086cff;
}

.camBtn[data-cam="0"]{
    top:25px;
    left:106px;
}

.camBtn[data-cam="1"]{
    top:78px;
    left:20px;
}

.camBtn[data-cam="2"]{
    top:78px;
    right:20px;
}

.camBtn[data-cam="3"]{
    top:132px;
    left:20px;
}

.camBtn[data-cam="4"]{
    top:132px;
    right:20px;
}

.camBtn[data-cam="5"]{
    bottom:15px;
    left:106px;
}

/* =========================================================
   JUMPSCARE
========================================================= */

#jumpscare{
    position:fixed;

    inset:0;

    z-index:99999;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #5e0000,
            #170000 45%,
            #000 85%
        );
}

#jumpscare.active{
    display:flex;

    animation:
        scareFlash .07s infinite,
        scareShake .055s infinite;
}

#jumpscareFace{
    font-size:
        min(52vw,500px);

    line-height:1;

    filter:
        drop-shadow(0 0 30px red)
        drop-shadow(0 0 60px white);

    animation:
        scareZoom .55s forwards;
}

#jumpscareText{
    position:absolute;

    bottom:7%;

    font-size:
        clamp(35px,7vw,90px);

    font-weight:900;

    letter-spacing:8px;

    text-shadow:
        0 0 15px red,
        0 0 40px red;
}

@keyframes scareZoom{
    0%{
        transform:
            scale(.12)
            rotate(-8deg);
    }

    40%{
        transform:
            scale(1.5)
            rotate(7deg);
    }

    65%{
        transform:
            scale(.9)
            rotate(-4deg);
    }

    100%{
        transform:
            scale(1.18)
            rotate(0);
    }
}

@keyframes scareShake{
    0%{
        transform:
            translate(0,0);
    }

    25%{
        transform:
            translate(-12px,6px);
    }

    50%{
        transform:
            translate(11px,-8px);
    }

    75%{
        transform:
            translate(-8px,-5px);
    }

    100%{
        transform:
            translate(0,0);
    }
}

@keyframes scareFlash{
    0%{
        filter:
            brightness(.7);
    }

    50%{
        filter:
            brightness(2.3);
    }

    100%{
        filter:
            brightness(.5);
    }
}

/* =========================================================
   END SCREEN
========================================================= */

#endScreen{
    position:absolute;

    inset:0;

    z-index:3000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:#000;
}

#endTitle{
    font-size:
        clamp(60px,10vw,135px);

    text-shadow:
        0 0 20px red,
        0 0 50px red;
}

#endText{
    margin-top:18px;

    color:#aaa;

    font-size:21px;
}

.endButtons{
    display:flex;

    gap:12px;

    margin-top:30px;
}

.endBtn{
    padding:16px 24px;

    border:0;
    border-radius:10px;

    background:#086cff;
    color:white;

    font-size:16px;
    font-weight:bold;
}

.endBtn.gray{
    background:#222;

    border:
        1px solid #555;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .doorFrame{
        width:13%;
    }

    #leftDoorFrame{
        left:5%;
    }

    #rightDoorFrame{
        right:5%;
    }

    #leftControls{
        left:20%;
    }

    #rightControls{
        right:20%;
    }

    .controlBtn{
        width:140px;

        padding:11px;

        font-size:13px;
    }
}

@media(max-width:750px){

    #topbar{
        font-size:13px;
    }

    #usage{
        display:none;
    }

    #statusBox{
        top:29%;

        width:50%;

        font-size:12px;
    }

    .doorFrame{
        width:18%;
    }

    #leftDoorFrame{
        left:1%;
    }

    #rightDoorFrame{
        right:1%;
    }

    #leftControls{
        left:20%;
    }

    #rightControls{
        right:20%;
    }

    .controlBtn{
        width:105px;

        padding:9px 5px;

        font-size:10px;
    }
}
</style>
</head>

<body>

<!-- ======================================================
     MENU
====================================================== -->

<section id="menu">

    <h1>
        П'ЯТЬ НОЧЕЙ В АТБ
    </h1>

    <p>
        Переживи п'ять нічних змін
    </p>

    <button
        id="playBtn"
        class="menuBtn"
    >
        ▶ ГРАТИ
    </button>

    <button
        id="resetProgressBtn"
        class="menuBtn"
    >
        ♻ СКИНУТИ ПРОГРЕС
    </button>

</section>

<!-- ======================================================
     NIGHT MENU
====================================================== -->

<section
    id="nightMenu"
    class="hidden"
>

    <h2>
        ОБЕРИ НІЧ
    </h2>

    <p id="nightInfo">
        Кожна наступна ніч довша і складніша
    </p>

    <div class="nightButtons">

        <button
            class="nightBtn"
            data-night="1"
        >
            🌙 Ніч 1
            <span>6 хв</span>
        </button>

        <button
            class="nightBtn"
            data-night="2"
        >
            🌙 Ніч 2
            <span>9 хв</span>
        </button>

        <button
            class="nightBtn"
            data-night="3"
        >
            🌙 Ніч 3
            <span>12 хв</span>
        </button>

        <button
            class="nightBtn"
            data-night="4"
        >
            🌙 Ніч 4
            <span>16 хв</span>
        </button>

        <button
            class="nightBtn"
            data-night="5"
        >
            🌙 Ніч 5
            <span>20 хв</span>
        </button>

    </div>

    <button
        id="backBtn"
        class="menuBtn"
    >
        ← НАЗАД
    </button>

</section>

<!-- ======================================================
     GAME
====================================================== -->

<section
    id="game"
    class="hidden"
>

    <div id="topbar">

        <div>
            🌙 Ніч:
            <span id="nightLabel">
                1
            </span>
        </div>

        <div>
            🕛
            <span id="timeLabel">
                12 AM
            </span>
        </div>

        <div>
            ⚡
            <span id="powerLabel">
                100
            </span>%
        </div>

    </div>

    <button id="soundBtn">
        🔊 ЗВУК
    </button>

    <div id="usage">

        Використання:

        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>

    </div>

    <!-- OFFICE -->

    <main id="office">

        <div id="statusBox">
            <span id="status">
                Перевіряй камери та бережи енергію...
            </span>
        </div>

        <div
            id="leftLightEffect"
            class="lightEffect"
        ></div>

        <div
            id="rightLightEffect"
            class="lightEffect"
        ></div>

        <!-- LEFT DOOR -->

        <div
            id="leftDoorFrame"
            class="doorFrame"
        >

            <div class="doorLight"></div>

            <div
                id="leftDoorEnemy"
                class="doorEnemy"
            >
                👀
            </div>

            <div
                id="leftDoor"
                class="door"
            ></div>

        </div>

        <!-- RIGHT DOOR -->

        <div
            id="rightDoorFrame"

let soundEnabled = true;
let audioContext = null;

function getAudioContext(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        audioContext =
            new AudioCtx();
    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }

    return audioContext;
}

function beep(
    frequency = 400,
    duration = 100,
    volume = .07,
    type = "square"
){

    if(!soundEnabled){
        return;
    }

    try{

        const ctx =
            getAudioContext();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type =
            type;

        osc.frequency.value =
            frequency;

        gain.gain.value =
            volume;

        osc.connect(
            gain
        );

        gain.connect(
            ctx.destination
        );

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime +
            duration / 1000
        );

        osc.stop(
            ctx.currentTime +
            duration / 1000
        );

    }catch(error){

        console.log(
            "Audio:",
            error
        );
    }
}

        chance &&

        enemy1Step <
        enemy1Route.length - 1
    ){

        enemy1Step++;
    }

    if(
        Math.random() <
        chance &&

        enemy2Step <
        enemy2Route.length - 1
    ){

        enemy2Step++;
    }

    if(
        Math.random() <
        chance * .80 &&

        enemy3Step <
        enemy3Route.length - 1
    ){

        enemy3Step++;
    }

    updateDoorEnemies();

    checkEnemyAttack();

    if(camerasOpen){

        renderCamera();
    }
}

/* =========================================================
   ATTACK DELAY
========================================================= */

function checkEnemyAttack(){

    if(
        !running ||
        powerOutActive
    ){

        return;
    }

    /* 👀 */

    if(
        enemy1Position() ===
        "left" &&

        !enemy1AttackTimer
    ){

        statusText.textContent =
            "⚠️ Щось підійшло до лівих дверей...";

        enemy1AttackTimer =
            setTimeout(
                function(){

                    enemy1AttackTimer =
                        null;

                    if(
                        running &&
                        enemy1Position() ===
                        "left"
                    ){

                        attemptAttack(
                            "left",
                            "👀",
                            1
                        );
                    }

                },
                3500
            );
    }

    /* 🐺 */

    if(
        enemy2Position() ===
        "right" &&

        !enemy2AttackTimer
    ){

        statusText.textContent =
            "⚠️ Щось підійшло до правих дверей...";

        enemy2AttackTimer =
            setTimeout(
                function(){

                    enemy2AttackTimer =
                        null;

                    if(
                        running &&
                        enemy2Position() ===
                        "right"
                    ){

                        attemptAttack(
                            "right",
                            "🐺",
                            2
                        );
                    }

                },
                3500
            );
    }

    /* 🦆 */

    if(
        enemy3Position() ===
        enemy3Side &&

        !enemy3AttackTimer
    ){

        statusText.textContent =
            enemy3Side ===
            "left"

                ? "⚠️ Щось підійшло до лівих дверей..."

                : "⚠️ Щось підійшло до правих дверей...";

        enemy3AttackTimer =
            setTimeout(
                function(){

                    enemy3AttackTimer =
                        null;

                    if(
                        running &&
                        enemy3Position() ===
                        enemy3Side
                    ){

                        attemptAttack(
                            enemy3Side,
                            "🦆",
                            3
                        );
                    }

                },
                3500
            );
    }
}

/* =========================================================
   ATTACK
========================================================= */

function attemptAttack(
    side,
    icon,
    enemyNumber
){

    if(
        !running ||
        powerOutActive
    ){

        return;
    }

    const closed =
        side ===
        "left"

            ? leftDoorClosed

            : rightDoorClosed;

    if(closed){

        hitSound();

        statusText.textContent =
            side ===
            "left"

                ? "💥 Ворог ударив у ліві двері!"

                : "💥 Ворог ударив у праві двері!";

        resetEnemy(
            enemyNumber
        );

        return;
    }

    showJumpscare(
        icon,
        side
    );
}

/* =========================================================
   RESET ENEMY
========================================================= */

function resetEnemy(number){

    if(number === 1){

        enemy1Step =
            0;

        clearTimeout(
            enemy1AttackTimer
        );

        enemy1AttackTimer =
            null;
    }

    if(number === 2){

        enemy2Step =
            0;

        clearTimeout(
            enemy2AttackTimer
        );

        enemy2AttackTimer =
            null;
    }

    if(number === 3){

        enemy3Step =
            0;

        clearTimeout(
            enemy3AttackTimer
        );

        enemy3AttackTimer =
            null;

        enemy3Side =
            Math.random() < .5
                ? "left"
                : "right";

        createDuckRoute();
    }

    updateDoorEnemies();

    if(camerasOpen){

        renderCamera();
    }
}

/* =========================================================
   JUMPSCARE
========================================================= */

function showJumpscare(
    icon,
    side
){

    if(scareRunning){

        return;
    }

    scareRunning =
        true;

    running =
        false;

    stopTimers();

    camerasOpen =
        false;

    cameraPanel.classList.add(
        "hidden"
    );

    jumpscareFace.textContent =
        icon;

    jumpscare.classList.add(
        "active"
    );

    jumpscareSound();

    setTimeout(
        function(){

            jumpscare.classList.remove(
                "active"
            );

            showGameOver(
                side ===
                "left"

                    ? "Ти не закрив ліві двері."

                    : "Ти не закрив праві двері."
            );

            scareRunning =
                false;

        },
        1200
    );
}

/* =========================================================
   ENERGY USAGE BARS
========================================================= */

function updateUsage(){

    let usage =
        1;

    if(leftDoorClosed){

        usage++;
    }

    if(rightDoorClosed){

        usage++;
    }

    if(leftLightOn){

        usage++;
    }

    if(rightLightOn){

        usage++;
    }

    if(camerasOpen){

        usage++;
    }

    usageBars.forEach(
        function(bar,index){

            bar.classList.toggle(
                "on",
                index < usage
            );
        }
    );
}

/* =========================================================
   ENERGY

   ЕНЕРГІЯ АВТОМАТИЧНО ПІДЛАШТОВУЄТЬСЯ
   ПІД ДОВЖИНУ НОЧІ.
========================================================= */

function getEnergyDrainPerTick(
    percentForWholeNight
){

    /*
        updatePower запускається
        кожні 100 мс.

        Рахуємо кількість
        100-мс тікiв за всю ніч.
    */

    const totalTicks =
        getNightDurationMs() /
        100;

    return (
        percentForWholeNight /
        totalTicks
    );
}

function updatePower(){

    if(
        !running ||
        powerOutActive
    ){

        return;
    }

    /*
        БАЗОВА ЕНЕРГІЯ:

        якщо ніч пройти
        без дверей/світла/камер,
        витратиться приблизно 42%.
    */

    let drain =
        getEnergyDrainPerTick(
            42
        );

    /*
        ЯКЩО ЛІВІ ДВЕРІ
        БУЛИ Б ЗАКРИТІ ВСЮ НІЧ:
        +32%
    */

    if(leftDoorClosed){

        drain +=
            getEnergyDrainPerTick(
                32
            );
    }

    /*
        ПРАВІ ДВЕРІ:
        +32% ЗА ВСЮ НІЧ
    */

    if(rightDoorClosed){

        drain +=
            getEnergyDrainPerTick(
                32
            );
    }

    /*
        ЛІВЕ СВІТЛО:
        +20%
    */

    if(leftLightOn){

        drain +=
            getEnergyDrainPerTick(
                20
            );
    }

    /*
        ПРАВЕ СВІТЛО:
        +20%
    */

    if(rightLightOn){

        drain +=
            getEnergyDrainPerTick(
                20
            );
    }

    /*
        КАМЕРИ:
        +18%
    */

    if(camerasOpen){

        drain +=
            getEnergyDrainPerTick(
                18
            );
    }

    power -=
        drain;

    if(
        power <= 0
    ){

        power =
            0;

        powerLabel.textContent =
            "0";

        powerOut();

        return;
    }

    powerLabel.textContent =
        Math.floor(
            power
        );

    powerLabel.classList.remove(
        "low",
        "medium"
    );

    if(
        power <= 20
    ){

        powerLabel.classList.add(
            "low"
        );

    }else if(
        power <= 40
    ){

        powerLabel.classList.add(
            "medium"
        );
    }
}

/* =========================================================
   POWER OUT
========================================================= */

function powerOut(){

    if(powerOutActive){

        return;
    }

    powerOutActive =
        true;

    clearInterval(
        powerTimer
    );

    clearInterval(
        timeTimer
    );

    clearInterval(
        enemyTimer
    );

    clearTimeout(
        enemy1AttackTimer
    );

    clearTimeout(
        enemy2AttackTimer
    );

    clearTimeout(
        enemy3AttackTimer
    );

    enemy1AttackTimer =
        null;

    enemy2AttackTimer =
        null;

    enemy3AttackTimer =
        null;

    leftDoorClosed =
        false;

    rightDoorClosed =
        false;

    leftLightOn =
        false;

    rightLightOn =
        false;

    leftDoor.classList.remove(
        "closed"
    );

    rightDoor.classList.remove(
        "closed"
    );

    leftDoorBtn.classList.remove(
        "doorOn"
    );

    rightDoorBtn.classList.remove(
        "doorOn"
    );

    leftLightBtn.classList.remove(
        "lightOn"
    );

    rightLightBtn.classList.remove(
        "lightOn"
    );

    leftLightEffect.classList.remove(
        "on"
    );

    rightLightEffect.classList.remove(
        "on"
    );

    leftDoorFrame.classList.remove(
        "lightOn"
    );

    rightDoorFrame.classList.remove(
        "lightOn"
    );

    leftDoorEnemy.classList.remove(
        "visible"
    );

    rightDoorEnemy.classList.remove(
        "visible"
    );

    camerasOpen =
        false;

    cameraPanel.classList.add(
        "hidden"
    );

    updateUsage();

    statusText.textContent =
        "⚡ ЕНЕРГІЯ ЗАКІНЧИЛАСЯ...";

    setTimeout(
        function(){

            if(
                running &&
                powerOutActive
            ){

                showPowerOutJumpscare();
            }

        },
        2800
    );
}

/* =========================================================
   POWER OUT JUMPSCARE
========================================================= */

function showPowerOutJumpscare(){

    if(scareRunning){

        return;
    }

    scareRunning =
        true;

    running =
        false;

    stopTimers();

    jumpscareFace.textContent =
        "👀";

    jumpscare.classList.add(
        "active"
    );

    jumpscareSound();

    setTimeout(
        function(){

            jumpscare.classList.remove(
                "active"
            );

            showGameOver(
                "Енергія закінчилася."
            );

            scareRunning =
                false;

        },
        1200
    );
}

/* =========================================================
   TIME
========================================================= */

function advanceTime(){

    if(
        !running ||
        powerOutActive
    ){

        return;
    }

    hour++;

    if(
        hour >= 6
    ){

        hour =
            6;

        timeLabel.textContent =
            "6 AM";

        winGame();

        return;
    }

    timeLabel.textContent =
        hour +
        " AM";

    if(
        hour === 5
    ){

        statusText.textContent =
            "🕔 МАЙЖЕ 6 AM!";
    }
}

/* =========================================================
   WIN
========================================================= */

function winGame(){

    if(!running){

        return;
    }

    running =
        false;

    stopTimers();

    camerasOpen =
        false;

    cameraPanel.classList.add(
        "hidden"
    );

    winSound();

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "🎉 6 AM";

    if(
        currentNight <
        5
    ){

        const nextNight =
            currentNight +
            1;

        if(
            nextNight >
            unlockedNight
        ){

            unlockedNight =
                nextNight;

            localStorage.setItem(
                "atbNight",
                String(
                    unlockedNight
                )
            );
        }

        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! " +
            "Відкрито Ніч " +
            nextNight +
            ".";

    }else{

        endText.textContent =
            "🏆 ТИ ПЕРЕЖИВ УСІ П'ЯТЬ НОЧЕЙ В АТБ!";
    }

    updateNightButtons();
}

/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(reason){

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "GAME OVER";

    endText.textContent =
        reason;
}

/* =========================================================
   RESTART
========================================================= */

restartBtn.onclick =
function(){

    startGame(
        currentNight
    );
};

/* =========================================================
   MENU
========================================================= */

menuBtn.onclick =
function(){

    stopTimers();

    running =
        false;

    scareRunning =
        false;

    powerOutActive =
        false;

    jumpscare.classList.remove(
        "active"
    );

    game.classList.add(
        "hidden"
    );

    endScreen.classList.add(
        "hidden"
    );

    cameraPanel.classList.add(
        "hidden"
    );

    menu.classList.remove(
        "hidden"
    );
};

/* =========================================================
   TIMERS
========================================================= */

function startTimers(){

    /*
        ЕНЕРГІЯ
    */

    powerTimer =
        setInterval(
            updatePower,
            100
        );

    /*
        ЧАС

        Ніч 1:
        6 хв / 6 годин
        = 1 хв на годину.

        Ніч 2:
        9 хв / 6
        = 1 хв 30 сек.

        Ніч 3:
        12 хв / 6
        = 2 хв.

        Ніч 4:
        16 хв / 6
        ≈ 2 хв 40 сек.

        Ніч 5:
        20 хв / 6
        ≈ 3 хв 20 сек.
    */

    const hourDuration =
        getHourDuration();

    timeTimer =
        setInterval(
            advanceTime,
            hourDuration
        );

    /*
        МОБИ

        НА ВИЩИХ НОЧАХ
        ВОНИ РУХАЮТЬСЯ ШВИДШЕ.
    */

    enemyTimer =
        setInterval(
            moveEnemies,

            Math.max(
                2500,

                6500 -
                currentNight *
                550
            )
        );

    console.log(
        "🌙 Ніч " +
        currentNight +
        ": " +
        NIGHT_DURATION_MINUTES[
            currentNight
        ] +
        " хв."
    );

    console.log(
        "🕛 Одна ігрова година: " +
        Math.round(
            hourDuration /
            1000
        ) +
        " секунд."
    );
}

/* =========================================================
   STOP TIMERS
========================================================= */

function stopTimers(){

    clearInterval(
        powerTimer
    );

    clearInterval(
        timeTimer
    );

    clearInterval(
        enemyTimer
    );

    clearTimeout(
        enemy1AttackTimer
    );

    clearTimeout(
        enemy2AttackTimer
    );

    clearTimeout(
        enemy3AttackTimer
    );

    powerTimer =
        null;

    timeTimer =
        null;

    enemyTimer =
        null;

    enemy1AttackTimer =
        null;

    enemy2AttackTimer =
        null;

    enemy3AttackTimer =
        null;
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            !running ||
            powerOutActive
        ){

            return;
        }

        const key =
            event.key.toLowerCase();

        /*
            A = ЛІВЕ СВІТЛО

            D = ПРАВЕ СВІТЛО

            Q = ЛІВІ ДВЕРІ

            E = ПРАВІ ДВЕРІ

            C = КАМЕРИ

            ESC = ЗАКРИТИ КАМЕРИ
        */

        if(
            key === "a"
        ){

            leftLightBtn.click();
        }

        if(
            key === "d"
        ){

            rightLightBtn.click();
        }

        if(
            key === "q"
        ){

            leftDoorBtn.click();
        }

        if(
            key === "e"
        ){

            rightDoorBtn.click();
        }

        if(
            key === "c"
        ){

            if(camerasOpen){

                closeCamera();

            }else{

                cameraBtn.click();
            }
        }

        if(
            event.key ===
            "Escape" &&

            camerasOpen
        ){

            closeCamera();
        }
    }
);

/* =========================================================
   INIT
========================================================= */

updateNightButtons();

console.log(
    "П'ЯТЬ НОЧЕЙ В АТБ — LONG NIGHTS VERSION"
);

</script>
