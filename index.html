<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
    font-family:inherit;
}

#menu,
#nightMenu{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#202020,#050505 65%,#000);
    text-align:center;
}

#menu h1{
    font-size:clamp(46px,7vw,100px);
    letter-spacing:5px;
    text-shadow:0 0 20px red;
}

#menu p{
    margin-top:15px;
    color:#aaa;
}

.menuBtn{
    margin-top:30px;
    min-width:250px;
    padding:16px 28px;
    border:1px solid #555;
    border-radius:12px;
    background:#111;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.menuBtn:hover{
    background:#252525;
}

#playBtn{
    background:#086cff;
}

#nightMenu h2{
    font-size:45px;
    margin-bottom:30px;
}

.nightButtons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
}

.nightBtn{
    width:110px;
    height:90px;
    border:1px solid #555;
    border-radius:12px;
    background:#151515;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.nightBtn.locked{
    opacity:.3;
    cursor:not-allowed;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#050505;
}

#topbar{
    position:absolute;
    z-index:60;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    width:min(900px,94%);
    padding:14px 22px;
    display:flex;
    justify-content:space-between;
    background:rgba(0,0,0,.85);
    border:1px solid #444;
    border-radius:14px;
    font-size:19px;
}

#office{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 55%,rgba(80,90,95,.24),transparent 28%),
        linear-gradient(180deg,#050708 0%,#101315 48%,#030405 100%);
}

#office::after{
    content:"АТБ • НІЧНА ОХОРОНА";
    position:absolute;
    left:50%;
    top:19%;
    transform:translateX(-50%);
    color:#8b969d;
    letter-spacing:5px;
}

#title{
    position:absolute;
    z-index:12;
    top:33%;
    left:50%;
    transform:translate(-50%,-50%);
    width:75%;
    text-align:center;
}

#title h1{
    font-size:clamp(40px,6vw,85px);
    text-shadow:0 0 8px #fff,0 0 28px red;
}

#status{
    margin-top:20px;
    color:#aaa;
    font-size:18px;
}

.lightEffect{
    position:absolute;
    top:0;
    width:42%;
    height:100%;
    opacity:0;
    pointer-events:none;
    transition:.15s;
    z-index:5;
}

#leftLightEffect{
    left:0;
    background:radial-gradient(
        ellipse at left center,
        rgba(255,245,180,.9),
        rgba(255,220,80,.2) 45%,
        transparent 75%
    );
}

#rightLightEffect{
    right:0;
    background:radial-gradient(
        ellipse at right center,
        rgba(255,245,180,.9),
        rgba(255,220,80,.2) 45%,
        transparent 75%
    );
}

.lightEffect.on{
    opacity:1;
}

.door{
    position:absolute;
    top:0;
    width:18%;
    height:100%;
    z-index:25;
    background:
        repeating-linear-gradient(
            0deg,
            #222 0px,
            #222 35px,
            #666 36px,
            #333 40px
        );
    border:4px solid #555;
    box-shadow:0 0 40px black;
    transform:translateY(-100%);
    transition:transform .35s ease;
}

#leftDoor{
    left:0;
}

#rightDoor{
    right:0;
}

.door.closed{
    transform:translateY(0);
}

.sideControls{
    position:absolute;
    top:42%;
    z-index:50;
    display:flex;
    flex-direction:column;
    gap:12px;
}

#leftControls{
    left:25px;
}

#rightControls{
    right:25px;
}

.controlBtn{
    width:185px;
    padding:15px;
    border:1px solid #555;
    border-radius:12px;
    background:#151515;
    color:white;
    font-weight:bold;
    font-size:16px;
}

.controlBtn:hover{
    background:#2b2b2b;
}

.controlBtn.lightOn{
    background:#ffd84a;
    color:#111;
    box-shadow:0 0 30px #ffd84a;
}

.controlBtn.doorOn{
    background:#aa1515;
    box-shadow:0 0 30px rgba(255,0,0,.5);
}

.doorEnemy{
    position:absolute;
    top:50%;
    z-index:18;
    font-size:100px;
    opacity:0;
    transform:translateY(-50%) scale(.7);
    transition:.15s;
}

#leftDoorEnemy{
    left:12%;
}

#rightDoorEnemy{
    right:12%;
}

.doorEnemy.visible{
    opacity:1;
    transform:translateY(-50%) scale(1);
}

#cameraBtn{
    position:absolute;
    left:50%;
    bottom:32px;
    transform:translateX(-50%);
    z-index:60;
    padding:18px 34px;
    border:0;
    border-radius:14px;
    background:#086cff;
    color:white;
    font-size:18px;
    font-weight:bold;
}

#usage{
    position:absolute;
    right:25px;
    top:90px;
    z-index:60;
    padding:8px 12px;
    background:rgba(0,0,0,.65);
    border-radius:8px;
}

.usageBar{
    display:inline-block;
    width:17px;
    height:10px;
    border:1px solid #555;
    background:#111;
    margin-left:3px;
}

.usageBar.on{
    background:#63ff4d;
}

#soundBtn{
    position:absolute;
    top:88px;
    left:25px;
    z-index:70;
    padding:9px 13px;
    border:1px solid #555;
    border-radius:9px;
    background:rgba(0,0,0,.72);
    color:white;
}

#cameraPanel{
    position:absolute;
    inset:0;
    z-index:200;
    background:#020202;
    padding:20px;
}

.cameraHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:65px;
    border-bottom:1px solid #333;
}

#closeCameraBtn{
    padding:12px 18px;
    border:0;
    border-radius:10px;
    background:#a00;
    color:white;
    font-weight:bold;
}

#cameraView{
    position:relative;
    height:calc(100vh - 105px);
    margin-top:14px;
    border:3px solid #333;
    border-radius:10px;
    overflow:hidden;
    background:radial-gradient(circle at center,#3a3d3f,#111 58%,#020202);
}

#cameraScene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(24px,4vw,55px);
    color:#aaa;
    opacity:.5;
    text-align:center;
}

#cameraRoomIcon{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    font-size:140px;
    opacity:.25;
}

.enemy{
    position:absolute;
    top:50%;
    font-size:120px;
    opacity:0;
    filter:drop-shadow(0 0 25px red);
}

.enemy.visible{
    opacity:1;
}

#enemy1{
    left:23%;
}

#enemy2{
    right:23%;
}

#enemy3{
    left:50%;
    transform:translateX(-50%);
}

#cameraInfo{
    position:absolute;
    left:25px;
    bottom:25px;
}

#cameraMap{
    position:absolute;
    right:25px;
    bottom:25px;
    width:280px;
    height:220px;
    background:rgba(0,0,0,.85);
    border:1px solid #555;
    border-radius:12px;
}

.camBtn{
    position:absolute;
    width:75px;
    padding:8px;
    border:1px solid #666;
    border-radius:7px;
    background:#151515;
    color:white;
}

.camBtn.active{
    background:#086cff;
}

.camBtn[data-cam="0"]{top:25px;left:102px}
.camBtn[data-cam="1"]{top:75px;left:20px}
.camBtn[data-cam="2"]{top:75px;right:20px}
.camBtn[data-cam="3"]{top:125px;left:20px}
.camBtn[data-cam="4"]{top:125px;right:20px}
.camBtn[data-cam="5"]{bottom:15px;left:102px}

#warning{
    position:absolute;
    inset:0;
    z-index:400;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(90,0,0,.95);
}

#warningIcon{
    font-size:170px;
}

#endScreen{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    text-align:center;
}

#endTitle{
    font-size:clamp(60px,10vw,140px);
    text-shadow:0 0 35px red;
}

#endText{
    margin-top:20px;
    color:#aaa;
    font-size:20px;
}

.endButtons{
    display:flex;
    gap:12px;
    margin-top:30px;
}

.endBtn{
    padding:16px 25px;
    border:0;
    border-radius:10px;
    background:#086cff;
    color:white;
    font-weight:bold;
}

.endBtn.gray{
    background:#222;
}
</style>
</head>

<body>

<section id="menu">
    <h1>П'ЯТЬ НОЧЕЙ В АТБ</h1>
    <p>Переживи п'ять нічних змін</p>

    <button id="playBtn" class="menuBtn">▶ ГРАТИ</button>
    <button id="resetProgressBtn" class="menuBtn">♻ СКИНУТИ ПРОГРЕС</button>
</section>

<section id="nightMenu" class="hidden">
    <h2>ОБЕРИ НІЧ</h2>

    <div class="nightButtons">
        <button class="nightBtn" data-night="1">🌙 Ніч 1</button>
        <button class="nightBtn" data-night="2">🌙 Ніч 2</button>
        <button class="nightBtn" data-night="3">🌙 Ніч 3</button>
        <button class="nightBtn" data-night="4">🌙 Ніч 4</button>
        <button class="nightBtn" data-night="5">🌙 Ніч 5</button>
    </div>

    <button id="backBtn" class="menuBtn">← НАЗАД</button>
</section>

<section id="game" class="hidden">

    <div id="topbar">
        <div>🌙 Ніч: <span id="nightLabel">1</span></div>
        <div>🕛 <span id="timeLabel">12 AM</span></div>
        <div>⚡ <span id="powerLabel">100</span>%</div>
    </div>

    <button id="soundBtn">🔊 ЗВУК</button>

    <div id="usage">
        Використання:
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
    </div>

    <main id="office">

        <div id="leftLightEffect" class="lightEffect"></div>
        <div id="rightLightEffect" class="lightEffect"></div>

        <div id="leftDoorEnemy" class="doorEnemy">👀</div>
        <div id="rightDoorEnemy" class="doorEnemy">🐺</div>

        <div id="leftDoor" class="door"></div>
        <div id="rightDoor" class="door"></div>

        <div id="title">
            <h1>П'ЯТЬ НОЧЕЙ В АТБ</h1>
            <p id="status">Перевіряй камери та бережи енергію...</p>
        </div>

        <div id="leftControls" class="sideControls">
            <button id="leftLightBtn" class="controlBtn">💡 Ліве світло</button>
            <button id="leftDoorBtn" class="controlBtn">🚪 Ліві двері</button>
        </div>

        <div id="rightControls" class="sideControls">
            <button id="rightLightBtn" class="controlBtn">💡 Праве світло</button>
            <button id="rightDoorBtn" class="controlBtn">🚪 Праві двері</button>
        </div>

        <button id="cameraBtn">📹 ВІДКРИТИ КАМЕРИ</button>
    </main>

    <section id="cameraPanel" class="hidden">

        <div class="cameraHeader">
            <h2>🔴 SECURITY CAMERAS</h2>
            <button id="closeCameraBtn">✖ ЗАКРИТИ</button>
        </div>

        <div id="cameraView">

            <div id="cameraScene"></div>
            <div id="cameraRoomIcon">🚪</div>

            <div id="enemy1" class="enemy">👀</div>
            <div id="enemy2" class="enemy">🐺</div>
            <div id="enemy3" class="enemy">🦆</div>

            <div id="cameraInfo">
                <h2 id="cameraTitle"></h2>
                <p id="cameraText"></p>
            </div>

            <div id="cameraMap">
                <button class="camBtn active" data-cam="0">CAM 1</button>
                <button class="camBtn" data-cam="1">CAM 2</button>
                <button class="camBtn" data-cam="2">CAM 3</button>
                <button class="camBtn" data-cam="3">CAM 4</button>
                <button class="camBtn" data-cam="4">CAM 5</button>
                <button class="camBtn" data-cam="5">CAM 6</button>
            </div>

        </div>
    </section>

    <section id="warning" class="hidden">
        <div id="warningIcon">👀</div>
        <h2>ЩОСЬ ПОРУЧ...</h2>
    </section>

    <section id="endScreen" class="hidden">
        <h1 id="endTitle">GAME OVER</h1>
        <p id="endText"></p>

        <div class="endButtons">
            <button id="restartBtn" class="endBtn">🔄 ЩЕ РАЗ</button>
            <button id="menuBtn" class="endBtn gray">🏠 МЕНЮ</button>
        </div>
    </section>

</section>

<script>
const $ = id => document.getElementById(id);

const menu = $("menu");
const nightMenu = $("nightMenu");
const game = $("game");

const playBtn = $("playBtn");
const backBtn = $("backBtn");
const resetProgressBtn = $("resetProgressBtn");

const nightButtons = document.querySelectorAll(".nightBtn");

const leftDoor = $("leftDoor");
const rightDoor = $("rightDoor");

const leftDoorBtn = $("leftDoorBtn");
const rightDoorBtn = $("rightDoorBtn");

const leftLightBtn = $("leftLightBtn");
const rightLightBtn = $("rightLightBtn");

const leftLightEffect = $("leftLightEffect");
const rightLightEffect = $("rightLightEffect");

const leftDoorEnemy = $("leftDoorEnemy");
const rightDoorEnemy = $("rightDoorEnemy");

const cameraBtn = $("cameraBtn");
const cameraPanel = $("cameraPanel");
const closeCameraBtn = $("closeCameraBtn");

const cameraButtons = document.querySelectorAll(".camBtn");

const cameraTitle = $("cameraTitle");
const cameraText = $("cameraText");
const cameraScene = $("cameraScene");
const cameraRoomIcon = $("cameraRoomIcon");

const enemy1El = $("enemy1");
const enemy2El = $("enemy2");
const enemy3El = $("enemy3");

const nightLabel = $("nightLabel");
const timeLabel = $("timeLabel");
const powerLabel = $("powerLabel");
const statusText = $("status");

const warning = $("warning");
const warningIcon = $("warningIcon");

const endScreen = $("endScreen");
const endTitle = $("endTitle");
const endText = $("endText");

const restartBtn = $("restartBtn");
const menuBtn = $("menuBtn");

const soundBtn = $("soundBtn");

const usageBars = document.querySelectorAll(".usageBar");

let unlockedNight = Number(localStorage.getItem("atbNight") || 1);

let currentNight = 1;
let running = false;

let power = 100;
let hour = 0;

let leftDoorClosed = false;
let rightDoorClosed = false;

let leftLightOn = false;
let rightLightOn = false;

let camerasOpen = false;
let selectedCamera = 0;

let enemy1 = 0;
let enemy2 = 2;
let enemy3 = 1;

let enemy3Side = "left";

let powerTimer;
let timeTimer;
let enemyTimer;

let soundEnabled = true;

const cameraNames = [
    "CAM 1 — Вхід",
    "CAM 2 — Торговий зал",
    "CAM 3 — Склад",
    "CAM 4 — Лівий коридор",
    "CAM 5 — Правий коридор",
    "CAM 6 — Біля офісу"
];

const cameraScenes = [
    "🚪 ВХІД • ТУРНІКЕТ • ВІТРИНИ",
    "🛒 КАСИ • ВІЗКИ • ТОРГОВИЙ ЗАЛ",
    "📦 КОРОБКИ • СКЛАД • СТЕЛАЖІ",
    "⬅️ ЛІВИЙ КОРИДОР",
    "➡️ ПРАВИЙ КОРИДОР",
    "🚨 ОФІС ОХОРОНИ"
];

const cameraIcons = [
    "🚪",
    "🛒",
    "📦",
    "⬅️",
    "➡️",
    "🚨"
];

function beep(frequency = 300, duration = 100){
    if(!soundEnabled) return;

    try{
        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx = new AudioContext();

        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.frequency.value = frequency;

        gain.gain.value = 0.08;

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();

        setTimeout(()=>{
            oscillator.stop();
            ctx.close();
        },duration);

    }catch(e){}
}

soundBtn.onclick = ()=>{
    soundEnabled = !soundEnabled;

    soundBtn.textContent =
        soundEnabled
        ? "🔊 ЗВУК"
        : "🔇 БЕЗ ЗВУКУ";
};

function updateNightButtons(){

    nightButtons.forEach(button=>{

        const n = Number(button.dataset.night);

        if(n <= unlockedNight){

            button.disabled = false;
            button.classList.remove("locked");

            button.textContent =
                "🌙 Ніч " + n;

        }else{

            button.disabled = true;
            button.classList.add("locked");

            button.textContent =
                "🔒 Ніч " + n;
        }
    });
}

playBtn.onclick = ()=>{

    menu.classList.add("hidden");
    nightMenu.classList.remove("hidden");

    updateNightButtons();
};

backBtn.onclick = ()=>{

    nightMenu.classList.add("hidden");
    menu.classList.remove("hidden");
};

resetProgressBtn.onclick = ()=>{

    unlockedNight = 1;

    localStorage.setItem(
        "atbNight",
        "1"
    );

    updateNightButtons();

    alert("Прогрес скинуто!");
};

nightButtons.forEach(button=>{

    button.onclick = ()=>{

        const n =
            Number(button.dataset.night);

        if(n <= unlockedNight){
            startGame(n);
        }
    };
});

function startGame(night){

    stopTimers();

    currentNight = night;

    running = true;

    power = 100;
    hour = 0;

    leftDoorClosed = false;
    rightDoorClosed = false;

    leftLightOn = false;
    rightLightOn = false;

    camerasOpen = false;

    enemy1 = 0;
    enemy2 = 2;
    enemy3 = 1;

    enemy3Side =
        Math.random() < .5
        ? "left"
        : "right";

    menu.classList.add("hidden");
    nightMenu.classList.add("hidden");
    game.classList.remove("hidden");

    endScreen.classList.add("hidden");
    warning.classList.add("hidden");
    cameraPanel.classList.add("hidden");

    leftDoor.classList.remove("closed");
    rightDoor.classList.remove("closed");

    leftDoorBtn.classList.remove("doorOn");
    rightDoorBtn.classList.remove("doorOn");

    leftLightBtn.classList.remove("lightOn");
    rightLightBtn.classList.remove("lightOn");

    leftLightEffect.classList.remove("on");
    rightLightEffect.classList.remove("on");

    nightLabel.textContent = currentNight;
    timeLabel.textContent = "12 AM";

    powerLabel.textContent = "100";
    powerLabel.style.color = "white";

    statusText.textContent =
        "Перевіряй камери та бережи енергію...";

    selectCamera(0);

    updateDoorEnemies();
    updateUsage();

    startTimers();
}

leftDoorBtn.onclick = ()=>{

    if(!running || power <= 0) return;

    leftDoorClosed = !leftDoorClosed;

    leftDoor.classList.toggle(
        "closed",
        leftDoorClosed
    );

    leftDoorBtn.classList.toggle(
        "doorOn",
        leftDoorClosed
    );

    leftDoorBtn.textContent =
        leftDoorClosed
        ? "🔒 ВІДКРИТИ ЛІВІ"
        : "🚪 Ліві двері";

    beep(120,180);

    updateUsage();
};

rightDoorBtn.onclick = ()=>{

    if(!running || power <= 0) return;

    rightDoorClosed = !rightDoorClosed;

    rightDoor.classList.toggle(
        "closed",
        rightDoorClosed
    );

    rightDoorBtn.classList.toggle(
        "doorOn",
        rightDoorClosed
    );

    rightDoorBtn.textContent =
        rightDoorClosed
        ? "🔒 ВІДКРИТИ ПРАВІ"
        : "🚪 Праві двері";

    beep(120,180);

    updateUsage();
};

leftLightBtn.onclick = ()=>{

    if(!running || power <= 0) return;

    leftLightOn = !leftLightOn;

    leftLightBtn.classList.toggle(
        "lightOn",
        leftLightOn
    );

    leftLightEffect.classList.toggle(
        "on",
        leftLightOn
    );

    beep(600,70);

    updateDoorEnemies();
    updateUsage();
};

rightLightBtn.onclick = ()=>{

    if(!running || power <= 0) return;

    rightLightOn = !rightLightOn;

    rightLightBtn.classList.toggle(
        "lightOn",
        rightLightOn
    );

    rightLightEffect.classList.toggle(
        "on",
        rightLightOn
    );

    beep(600,70);

    updateDoorEnemies();
    updateUsage();
};

function updateDoorEnemies(){

    const leftVisible =
        leftLightOn &&
        (
            enemy1 >= 5 ||
            (
                enemy3 >= 5 &&
                enemy3Side === "left"
            )
        );

    const rightVisible =
        rightLightOn &&
        (
            enemy2 >= 5 ||
            (
                enemy3 >= 5 &&
                enemy3Side === "right"
            )
        );

    if(
        enemy3 >= 5 &&
        enemy3Side === "left"
    ){
        leftDoorEnemy.textContent = "🦆";
    }else{
        leftDoorEnemy.textContent = "👀";
    }

    if(
        enemy3 >= 5 &&
        enemy3Side === "right"
    ){
        rightDoorEnemy.textContent = "🦆";
    }else{
        rightDoorEnemy.textContent = "🐺";
    }

    leftDoorEnemy.classList.toggle(
        "visible",
        leftVisible
    );

    rightDoorEnemy.classList.toggle(
        "visible",
        rightVisible
    );

    if(leftVisible){
        statusText.textContent =
            "⚠️ ХТОСЬ ЗЛІВА!";
    }

    if(rightVisible){
        statusText.textContent =
            "⚠️ ХТОСЬ СПРАВА!";
    }
}

cameraBtn.onclick = ()=>{

    if(!running || power <= 0) return;

    camerasOpen = true;

    cameraPanel.classList.remove("hidden");

    beep(250,90);

    renderCamera();
    updateUsage();
};

closeCameraBtn.onclick = closeCamera;

function closeCamera(){

    camerasOpen = false;

    cameraPanel.classList.add("hidden");

    updateUsage();
}

cameraButtons.forEach(button=>{

    button.onclick = ()=>{

        selectCamera(
            Number(button.dataset.cam)
        );

        beep(350,40);
    };
});

function selectCamera(cam){

    selectedCamera = cam;

    cameraButtons.forEach(button=>{

        button.classList.toggle(
            "active",
            Number(button.dataset.cam) === cam
        );
    });

    renderCamera();
}

function renderCamera(){

    cameraTitle.textContent =
        cameraNames[selectedCamera];

    cameraScene.textContent =
        cameraScenes[selectedCamera];

    cameraRoomIcon.textContent =
        cameraIcons[selectedCamera];

    enemy1El.classList.remove("visible");
    enemy2El.classList.remove("visible");
    enemy3El.classList.remove("visible");

    let enemies = 0;

    if(enemy1 === selectedCamera){
        enemy1El.classList.add("visible");
        enemies++;
    }

    if(enemy2 === selectedCamera){
        enemy2El.classList.add("visible");
        enemies++;
    }

    if(enemy3 === selectedCamera){
        enemy3El.classList.add("visible");
        enemies++;
    }

    if(enemies === 0){
        cameraText.textContent =
            "Нікого не видно...";
    }

    if(enemies === 1){
        cameraText.textContent =
            "⚠️ На камері хтось є...";
    }

    if(enemies >= 2){
        cameraText.textContent =
            "🚨 КІЛЬКА ВОРОГІВ!";
    }
}

function updateUsage(){

    let usage = 1;

    if(leftDoorClosed) usage++;
    if(rightDoorClosed) usage++;

    if(leftLightOn) usage++;
    if(rightLightOn) usage++;

    if(camerasOpen) usage++;

    usageBars.forEach((bar,index)=>{

        bar.classList.toggle(
            "on",
            index < usage
        );
    });
}

function updatePower(){

    if(!running) return;

    let drain = .007;

    if(leftDoorClosed) drain += .012;
    if(rightDoorClosed) drain += .012;

    if(leftLightOn) drain += .008;
    if(rightLightOn) drain += .008;

    if(camerasOpen) drain += .010;

    power -= drain;

    if(power <= 0){

        power = 0;
        powerLabel.textContent = "0";

        powerOut();

        return;
    }

    powerLabel.textContent =
        Math.floor(power);

    if(power <= 20){
        powerLabel.style.color = "red";
    }else if(power <= 40){
        powerLabel.style.color = "yellow";
    }else{
        powerLabel.style.color = "white";
    }
}

function powerOut(){

    leftDoorClosed = false;
    rightDoorClosed = false;

    leftLightOn = false;
    rightLightOn = false;

    leftDoor.classList.remove("closed");
    rightDoor.classList.remove("closed");

    leftLightEffect.classList.remove("on");
    rightLightEffect.classList.remove("on");

    leftDoorEnemy.classList.remove("visible");
    rightDoorEnemy.classList.remove("visible");

    closeCamera();

    statusText.textContent =
        "⚡ Енергія закінчилася...";

    setTimeout(()=>{

        if(running){
            loseGame(
                "Енергія закінчилася."
            );
        }

    },2500);
}

function moveEnemies(){

    if(!running) return;

    const chance =
        .22 +
        currentNight * .045;

    if(
        Math.random() < chance &&
        enemy1 < 6
    ){
        enemy1++;
    }

    if(
        Math.random() < chance &&
        enemy2 < 6
    ){
        enemy2++;
    }

    if(
        Math.random() < chance * .75 &&
        enemy3 < 6
    ){
        enemy3++;
    }

    if(enemy1 >= 6){
        attack("left","👀",1);
    }

    if(enemy2 >= 6){
        attack("right","🐺",2);
    }

    if(enemy3 >= 6){
        attack(
            enemy3Side,
            "🦆",
            3
        );
    }

    updateDoorEnemies();

    if(camerasOpen){
        renderCamera();
    }
}

function attack(side,icon,enemyNumber){

    if(!running) return;

    const doorClosed =
        side === "left"
        ? leftDoorClosed
        : rightDoorClosed;

    if(doorClosed){

        statusText.textContent =
            "💥 Ворог ударив у двері!";

        beep(90,250);

        if(enemyNumber === 1){
            enemy1 = 0;
        }

        if(enemyNumber === 2){
            enemy2 = 2;
        }

        if(enemyNumber === 3){

            enemy3 = 1;

            enemy3Side =
                Math.random() < .5
                ? "left"
                : "right";
        }

        updateDoorEnemies();

        return;
    }

    warningIcon.textContent = icon;

    warning.classList.remove("hidden");

    beep(70,500);

    setTimeout(()=>{

        warning.classList.add("hidden");

    },600);

    setTimeout(()=>{

        if(running){

            loseGame(
                side === "left"
                ? "Ти не закрив ліві двері."
                : "Ти не закрив праві двері."
            );
        }

    },800);
}

function advanceTime(){

    if(!running) return;

    hour++;

    if(hour >= 6){

        hour = 6;

        timeLabel.textContent = "6 AM";

        winGame();

        return;
    }

    timeLabel.textContent =
        hour + " AM";

    if(hour === 5){

        statusText.textContent =
            "🕔 Майже 6 AM!";
    }
}

function winGame(){

    if(!running) return;

    running = false;

    stopTimers();
    closeCamera();

    endScreen.classList.remove("hidden");

    endTitle.textContent =
        "🎉 6 AM";

    beep(700,400);

    if(currentNight < 5){

        const nextNight =
            currentNight + 1;

        if(nextNight > unlockedNight){

            unlockedNight =
                nextNight;

            localStorage.setItem(
                "atbNight",
                String(unlockedNight)
            );
        }

        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! Відкрито Ніч " +
            nextNight +
            ".";

    }else{

        endText.textContent =
            "🏆 ТИ ПЕРЕЖИВ УСІ П'ЯТЬ НОЧЕЙ В АТБ!";
    }

    updateNightButtons();
}

function loseGame(reason){

    if(!running) return;

    running = false;

    stopTimers();
    closeCamera();

    warning.classList.add("hidden");
    endScreen.classList.remove("hidden");

    endTitle.textContent =
        "GAME OVER";

    endText.textContent =
        reason;

    beep(70,600);
}

restartBtn.onclick = ()=>{

    startGame(currentNight);
};

menuBtn.onclick = ()=>{

    stopTimers();

    running = false;

    game.classList.add("hidden");
    endScreen.classList.add("hidden");

    menu.classList.remove("hidden");
};

function startTimers(){

    powerTimer =
        setInterval(
            updatePower,
            100
        );

    timeTimer =
        setInterval(
            advanceTime,
            20000
        );

    enemyTimer =
        setInterval(
            moveEnemies,
            Math.max(
                2200,
                5200 -
                currentNight * 400
            )
        );
}

function stopTimers(){

    clearInterval(powerTimer);
    clearInterval(timeTimer);
    clearInterval(enemyTimer);
}

document.addEventListener(
    "keydown",
    event=>{

        if(!running) return;

        const key =
            event.key.toLowerCase();

        if(key === "q"){
            leftDoorBtn.click();
        }

        if(key === "e"){
            rightDoorBtn.click();
        }

        if(key === "a"){
            leftLightBtn.click();
        }

        if(key === "d"){
            rightLightBtn.click();
        }

        if(key === "c"){

            if(camerasOpen){
                closeCamera();
            }else{
                cameraBtn.click();
            }
        }

        if(
            event.key === "Escape" &&
            camerasOpen
        ){
            closeCamera();
        }
    }
);

updateNightButtons();
</script>

</body>
</html>
