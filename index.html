<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    font-family:inherit;
    cursor:pointer;
    user-select:none;
}

/* =========================
   MENU
========================= */

#menu,
#nightMenu{
    position:fixed;
    inset:0;
    z-index:5000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #292929 0%,
            #080808 60%,
            #000 100%
        );
}

#menu h1{
    font-size:clamp(40px,7vw,90px);
    letter-spacing:4px;

    text-shadow:
        0 0 10px #fff,
        0 0 30px red,
        0 0 70px red;
}

#menu p{
    margin-top:15px;
    color:#aaa;
    font-size:20px;
}

.menuBtn{
    min-width:280px;
    margin-top:22px;
    padding:17px 30px;

    border:1px solid #555;
    border-radius:12px;

    background:#111;
    color:#fff;

    font-size:18px;
    font-weight:bold;
}

.menuBtn:hover{
    background:#292929;
    transform:scale(1.04);
}

#playBtn{
    background:#086cff;
}

/* =========================
   NIGHT SELECT
========================= */

#nightMenu h2{
    margin-bottom:12px;
    font-size:45px;
}

#nightMenu p{
    margin-bottom:25px;
    color:#aaa;
}

.nightButtons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

.nightBtn{
    width:135px;
    height:100px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:#fff;

    font-weight:bold;
    font-size:16px;
}

.nightBtn span{
    display:block;
    margin-top:8px;
    color:#aaa;
    font-size:12px;
}

.nightBtn:not(:disabled):hover{
    background:#086cff;
}

.nightBtn.locked{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================
   GAME
========================= */

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* =========================
   OFFICE
========================= */

#office{
    position:absolute;
    inset:0;

    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(0,0,0,.02),
            rgba(0,0,0,.06)
        ),
        url("office.png");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    background-color:#050505;
}

/* =========================
   TOP BAR
========================= */

#topbar{
    position:absolute;
    top:18px;
    left:50%;

    transform:translateX(-50%);

    z-index:1000;

    width:min(900px,94%);

    padding:14px 22px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,.88);

    border:1px solid #555;
    border-radius:14px;

    box-shadow:0 0 25px #000;

    font-size:19px;
    font-weight:bold;
}

#powerLabel.medium{
    color:#ffd43b;
}

#powerLabel.low{
    color:#ff3030;
    text-shadow:0 0 10px red;
}

/* =========================
   STATUS
========================= */

#statusBox{
    position:absolute;

    top:25%;
    left:50%;

    transform:translateX(-50%);

    z-index:600;

    width:min(620px,55%);

    padding:9px 15px;

    background:rgba(0,0,0,.72);

    border:1px solid #444;
    border-radius:10px;

    text-align:center;
    color:#ddd;
}

/* =========================
   DOORS
========================= */

.doorFrame{
    position:absolute;

    top:21%;

    width:11.5%;
    height:56%;

    z-index:200;

    overflow:hidden;

    background:transparent;
}

#leftDoorFrame{
    left:7.2%;
}

#rightDoorFrame{
    right:7.5%;
}

.doorLight{
    position:absolute;
    inset:0;

    z-index:5;

    opacity:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,220,.98),
            rgba(255,220,80,.65) 35%,
            rgba(255,170,20,.25) 65%,
            transparent 95%
        );
}

.doorFrame.lightOn .doorLight{
    opacity:1;
}

.doorEnemy{
    position:absolute;

    left:50%;
    top:52%;

    transform:translate(-50%,-50%) scale(.75);

    z-index:10;

    opacity:0;

    font-size:clamp(60px,7vw,115px);

    pointer-events:none;

    filter:
        drop-shadow(0 0 10px white)
        drop-shadow(0 0 25px red);
}

.doorEnemy.visible{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

.door{
    position:absolute;
    inset:0;

    z-index:30;

    background:
        repeating-linear-gradient(
            0deg,
            #111 0px,
            #111 25px,
            #444 26px,
            #888 30px,
            #222 35px
        );

    border:2px solid #666;

    box-shadow:
        inset 0 0 30px #000;

    transform:translateY(-105%);

    transition:transform .35s ease;
}

.door.closed{
    transform:translateY(0);
}

/* =========================
   LIGHT EFFECT
========================= */

.lightEffect{
    position:absolute;
    top:0;

    width:35%;
    height:100%;

    z-index:100;

    opacity:0;

    pointer-events:none;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at left center,
            rgba(255,245,170,.38),
            transparent 70%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at right center,
            rgba(255,245,170,.38),
            transparent 70%
        );
}

.lightEffect.on{
    opacity:1;
}

/* =========================
   CONTROLS
========================= */

.sideControls{
    position:absolute;
    top:47%;

    z-index:700;

    display:flex;
    flex-direction:column;
    gap:10px;
}

#leftControls{
    left:22%;
}

#rightControls{
    right:22%;
}

.controlBtn{
    width:170px;

    padding:14px 10px;

    border:1px solid #666;
    border-radius:11px;

    background:rgba(8,8,8,.92);
    color:#fff;

    font-weight:bold;

    box-shadow:0 0 18px #000;
}

.controlBtn.lightOn{
    background:#ffd84a;
    color:#111;

    box-shadow:
        0 0 12px white,
        0 0 30px #ffd84a;
}

.controlBtn.doorOn{
    background:#b51414;

    box-shadow:
        0 0 20px red;
}

/* =========================
   CAMERA BUTTON
========================= */

#cameraBtn{
    position:absolute;

    left:50%;
    bottom:22px;

    transform:translateX(-50%);

    z-index:700;

    padding:16px 30px;

    border:0;
    border-radius:13px;

    background:#086cff;
    color:#fff;

    font-size:17px;
    font-weight:bold;
}

/* =========================
   SOUND
========================= */

#soundBtn{
    position:absolute;

    top:88px;
    left:20px;

    z-index:1000;

    padding:9px 12px;

    border:1px solid #555;
    border-radius:9px;

    background:rgba(0,0,0,.85);
    color:#fff;

    font-weight:bold;
}

/* =========================
   PHONE TEST BUTTON
========================= */

#testPhoneBtn{
    position:absolute;

    top:130px;
    left:20px;

    z-index:1000;

    padding:9px 12px;

    border:1px solid #369a55;
    border-radius:9px;

    background:#12391f;
    color:#8cffac;

    font-weight:bold;
}

/* =========================
   ENERGY USAGE
========================= */

#usage{
    position:absolute;

    top:88px;
    right:20px;

    z-index:1000;

    padding:10px;

    background:rgba(0,0,0,.85);

    border:1px solid #444;
    border-radius:8px;
}

.usageBar{
    display:inline-block;

    width:16px;
    height:11px;

    margin-left:3px;

    background:#111;

    border:1px solid #555;
}

.usageBar.on{
    background:#63ff4d;
    box-shadow:0 0 7px #63ff4d;
}

/* =========================================================
   📞 PHONE OVERLAY
   ВАЖЛИВО: position FIXED + дуже великий z-index
========================================================= */

#phoneCall{
    position:fixed;

    top:90px;
    left:50%;

    transform:translateX(-50%);

    z-index:99990;

    width:min(600px,94vw);

    padding:18px;

    background:
        linear-gradient(
            180deg,
            rgba(20,22,20,.99),
            rgba(0,0,0,.99)
        );

    border:3px solid #3cff76;
    border-radius:18px;

    box-shadow:
        0 0 25px rgba(60,255,118,.55),
        0 0 80px #000;
}

#phoneCall.ringing{
    animation:ringBox .18s infinite alternate;
}

@keyframes ringBox{
    0%{
        transform:
            translateX(-50%)
            rotate(-1deg);
    }

    100%{
        transform:
            translateX(-50%)
            rotate(1deg);
    }
}

.phoneHeader{
    display:flex;
    align-items:center;
    gap:14px;
}

.phoneIcon{
    width:65px;
    height:65px;

    flex-shrink:0;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:#149447;

    font-size:36px;

    box-shadow:
        0 0 25px #16b856;
}

.phoneName{
    font-size:21px;
    font-weight:900;
}

#phoneState{
    margin-top:5px;

    color:#78ff9b;

    font-size:14px;
}

#phoneMessage{
    margin-top:15px;

    max-height:180px;

    overflow-y:auto;

    padding:13px;

    background:#080808;

    border:1px solid #333;
    border-radius:10px;

    color:#ddd;

    font-size:15px;
    line-height:1.5;

    white-space:pre-line;
}

.phoneButtons{
    display:flex;
    gap:10px;

    margin-top:15px;
}

.phoneBtn{
    flex:1;

    padding:13px 8px;

    border:0;
    border-radius:10px;

    color:#fff;

    font-size:14px;
    font-weight:900;
}

#answerPhoneBtn{
    background:#159447;
}

#hangPhoneBtn{
    background:#a51515;
}

#skipPhoneBtn{
    background:#333;
}

/* =========================
   CAMERA PANEL
========================= */

#cameraPanel{
    position:absolute;
    inset:0;

    z-index:3000;

    padding:20px;

    background:#020202;
}

.cameraHeader{
    height:60px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #333;
}

#closeCameraBtn{
    padding:12px 18px;

    border:0;
    border-radius:9px;

    background:#a00;
    color:white;

    font-weight:bold;
}

#cameraView{
    position:relative;

    height:calc(100vh - 100px);

    margin-top:12px;

    overflow:hidden;

    border:3px solid #333;

    background:
        radial-gradient(
            circle,
            #3a4042,
            #131516 60%,
            #000
        );
}

#cameraView::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:50;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0 3px,
            rgba(255,255,255,.055) 4px
        );
}

#cameraScene{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding-bottom:120px;

    opacity:.4;

    color:#bbb;

    font-size:clamp(25px,4vw,55px);

    letter-spacing:5px;
}

#cameraIcon{
    position:absolute;

    top:42%;
    left:50%;

    transform:translate(-50%,-50%);

    font-size:140px;

    opacity:.17;
}

.cameraEnemy{
    position:absolute;

    top:45%;

    z-index:20;

    opacity:0;

    font-size:130px;
}

.cameraEnemy.visible{
    opacity:1;
}

#enemy1{
    left:20%;
}

#enemy2{
    right:20%;
}

#enemy3{
    left:50%;
    transform:translateX(-50%);
}

#cameraInfo{
    position:absolute;

    left:20px;
    bottom:20px;

    z-index:80;

    padding:14px;

    background:rgba(0,0,0,.86);

    border:1px solid #555;
    border-radius:10px;
}

#cameraMap{
    position:absolute;

    right:20px;
    bottom:20px;

    z-index:80;

    width:285px;
    height:220px;

    background:rgba(0,0,0,.92);

    border:1px solid #555;
    border-radius:10px;
}

.camBtn{
    position:absolute;

    width:78px;

    padding:9px;

    border:1px solid #666;
    border-radius:7px;

    background:#151515;
    color:#fff;

    font-weight:bold;
}

.camBtn.active{
    background:#086cff;
}

.camBtn[data-cam="0"]{
    top:20px;
    left:104px;
}

.camBtn[data-cam="1"]{
    top:70px;
    left:18px;
}

.camBtn[data-cam="2"]{
    top:70px;
    right:18px;
}

.camBtn[data-cam="3"]{
    top:120px;
    left:18px;
}

.camBtn[data-cam="4"]{
    top:120px;
    right:18px;
}

.camBtn[data-cam="5"]{
    bottom:12px;
    left:104px;
}

/* =========================
   JUMPSCARE
========================= */

#jumpscare{
    position:fixed;
    inset:0;

    z-index:100000;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle,
            #650000,
            #180000 45%,
            #000 90%
        );
}

#jumpscare.active{
    display:flex;

    animation:flash .08s infinite;
}

#jumpscareFace{
    font-size:min(50vw,480px);

    animation:zoom .5s forwards;
}

#jumpscareText{
    font-size:clamp(30px,7vw,80px);
    font-weight:900;
}

@keyframes zoom{
    from{
        transform:scale(.1);
    }

    to{
        transform:scale(1.25);
    }
}

@keyframes flash{
    0%{filter:brightness(.5);}
    50%{filter:brightness(2);}
    100%{filter:brightness(.8);}
}

/* =========================
   END
========================= */

#endScreen{
    position:absolute;
    inset:0;

    z-index:5000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#000;

    text-align:center;
}

#endTitle{
    font-size:clamp(55px,10vw,130px);
}

#endText{
    margin-top:15px;
    color:#aaa;
}

.endButtons{
    display:flex;
    gap:10px;

    margin-top:25px;
}

.endBtn{
    padding:15px 22px;

    border:0;
    border-radius:10px;

    background:#086cff;
    color:#fff;

    font-weight:bold;
}

.endBtn.gray{
    background:#222;

    border:1px solid #555;
}

/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    #topbar{
        top:5px;

        padding:10px;

        font-size:12px;
    }

    #soundBtn{
        top:57px;
        left:5px;

        font-size:10px;
    }

    #testPhoneBtn{
        top:98px;
        left:5px;

        font-size:10px;
    }

    #usage{
        display:none;
    }

    #phoneCall{
        top:55px;

        width:96vw;

        padding:12px;
    }

    .phoneIcon{
        width:45px;
        height:45px;

        font-size:25px;
    }

    .phoneName{
        font-size:16px;
    }

    #phoneMessage{
        max-height:110px;

        font-size:12px;
    }

    .phoneBtn{
        padding:10px 5px;

        font-size:11px;
    }

    #statusBox{
        top:25%;

        width:48%;

        font-size:11px;
    }

    .doorFrame{
        width:18%;
    }

    #leftDoorFrame{
        left:1%;
    }

    #rightDoorFrame{
        right:1%;
    }

    #leftControls{
        left:20%;
    }

    #rightControls{
        right:20%;
    }

    .controlBtn{
        width:105px;

        padding:10px 5px;

        font-size:10px;
    }

    #cameraBtn{
        bottom:8px;

        padding:12px 17px;

        font-size:12px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<section id="menu">

    <h1>П'ЯТЬ НОЧЕЙ В АТБ</h1>

    <p>
        Переживи п'ять нічних змін
    </p>

    <button
        id="playBtn"
        class="menuBtn"
    >
        ▶ ГРАТИ
    </button>

    <button
        id="resetBtn"
        class="menuBtn"
    >
        ♻ СКИНУТИ ПРОГРЕС
    </button>

</section>

<!-- =========================
     NIGHT MENU
========================= -->

<section
    id="nightMenu"
    class="hidden"
>

    <h2>
        ОБЕРИ НІЧ
    </h2>

    <p>
        📞 На початку кожної ночі дзвонить охоронець
    </p>

    <div class="nightButtons">

        <button
            class="nightBtn"
            data-night="1"
        ></button>

        <button
            class="nightBtn"
            data-night="2"
        ></button>

        <button
            class="nightBtn"
            data-night="3"
        ></button>

        <button
            class="nightBtn"
            data-night="4"
        ></button>

        <button
            class="nightBtn"
            data-night="5"
        ></button>

    </div>

    <button
        id="backBtn"
        class="menuBtn"
    >
        ← НАЗАД
    </button>

</section>

<!-- =========================
     GAME
========================= -->

<section
    id="game"
    class="hidden"
>

    <div id="topbar">

        <div>
            🌙 Ніч
            <span id="nightLabel">1</span>
        </div>

        <div>
            🕛
            <span id="timeLabel">
                12 AM
            </span>
        </div>

        <div>
            ⚡
            <span id="powerLabel">
                100
            </span>%
        </div>

    </div>

    <button id="soundBtn">
        🔊 ЗВУК
    </button>

    <button id="testPhoneBtn">
        📞 ТЕСТ ДЗВІНКА
    </button>

    <div id="usage">

        Використання:

        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>

    </div>

    <main id="office">

        <div id="statusBox">

            <span id="status">
                Ніч почалася...
            </span>

        </div>

        <div
            id="leftLightEffect"
            class="lightEffect"
        ></div>

        <div
            id="rightLightEffect"
            class="lightEffect"
        ></div>

        <!-- LEFT -->

        <div
            id="leftDoorFrame"
            class="doorFrame"
        >

            <div class="doorLight"></div>

            <div
                id="leftDoorEnemy"
                class="doorEnemy"
            >
                👀
            </div>

            <div
                id="leftDoor"
                class="door"
            ></div>

        </div>

        <!-- RIGHT -->

        <div
            id="rightDoorFrame"
            class="doorFrame"
        >

            <div class="doorLight"></div>

            <div
                id="rightDoorEnemy"
                class="doorEnemy"
            >
                🐺
            </div>

            <div
                id="rightDoor"
                class="door"
            ></div>

        </div>

        <!-- LEFT CONTROLS -->

        <div
            id="leftControls"
            class="sideControls"
        >

            <button
                id="leftLightBtn"
                class="controlBtn"
            >
                💡 Ліве світло
            </button>

            <button
                id="leftDoorBtn"
                class="controlBtn"
            >
                🚪 Ліві двері
            </button>

        </div>

        <!-- RIGHT CONTROLS -->

        <div
            id="rightControls"
            class="sideControls"
        >

            <button
                id="rightLightBtn"
                class="controlBtn"
            >
                💡 Праве світло
            </button>

            <button
                id="rightDoorBtn"
                class="controlBtn"
            >
                🚪 Праві двері
            </button>

        </div>

        <button id="cameraBtn">
            📹 ВІДКРИТИ КАМЕРИ
        </button>

    </main>

    <!-- =========================
         CAMERAS
    ========================= -->

    <section
        id="cameraPanel"
        class="hidden"
    >

        <div class="cameraHeader">

            <h2>
                🔴 SECURITY CAMERAS
            </h2>

            <button id="closeCameraBtn">
                ✖ ЗАКРИТИ
            </button>

        </div>

        <div id="cameraView">

            <div id="cameraScene"></div>

            <div id="cameraIcon"></div>

            <div
                id="enemy1"
                class="cameraEnemy"
            >
                👀
            </div>

            <div
                id="enemy2"
                class="cameraEnemy"
            >
                🐺
            </div>

            <div
                id="enemy3"
                class="cameraEnemy"
            >
                🦆
            </div>

            <div id="cameraInfo">

                <h2 id="cameraTitle">
                    CAM 1
                </h2>

                <p id="cameraText">
                    Нікого не видно...
                </p>

            </div>

            <div id="cameraMap">

                <button
                    class="camBtn active"
                    data-cam="0"
                >
                    CAM 1
                </button>

                <button
                    class="camBtn"
                    data-cam="1"
                >
                    CAM 2
                </button>

                <button
                    class="camBtn"
                    data-cam="2"

function audio(){

    if(!audioContext){

        const Audio =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!Audio){
            return null;
        }

        audioContext =
            new Audio();
    }

    if(
        audioContext.state === "suspended"
    ){
        audioContext.resume();
    }

    return audioContext;
}

function beep(
    frequency,
    duration,
    volume=.06,
    type="square"
){

    if(!soundEnabled){
        return;
    }

    try{

        const ctx = audio();

        if(!ctx){
            return;
        }

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type = type;

        oscillator.frequency.value =
            frequency;

        gain.gain.value =
            volume;

        oscillator.connect(gain);

        gain.connect(ctx.destination);

        oscillator.start();

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime +
            duration / 1000
        );

        oscillator.stop(
            ctx.currentTime +
            duration / 1000
        );

    }catch(error){

        console.log(error);
    }
}

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(
            PHONE_MESSAGES[
                currentNight
            ]
        );

    speech.lang =
        "uk-UA";

    speech.rate =
        0.88;

    speech.pitch =
        0.78;

    speech.volume =
        soundEnabled ? 1 : 0;

    const setVoice = ()=>{

        const voices =
            window.speechSynthesis.getVoices();

        const ukrainian =
            voices.find(
                voice =>
                    voice.lang
                    .toLowerCase()
                    .startsWith("uk")
            );

        if(ukrainian){

            speech.voice =
                ukrainian;
        }

        window.speechSynthesis.speak(
            speech
        );
    };

    const voices =
        window.speechSynthesis.getVoices();

    if(voices.length){

        setVoice();

    }else{

        setTimeout(
            setVoice,
            300
        );
    }

    speech.onend =
    function(){

        if(phoneAnswered){

            phoneState.textContent =
                "✅ РОЗМОВУ ЗАВЕРШЕНО";

        "visible",

        rightEnemy &&
        rightLightOn &&
        !rightDoorClosed
    );

    if(
        leftLightOn &&
        leftEnemy &&
        !leftDoorClosed
    ){

        statusText.textContent =
            "🚨 МОБ У ЛІВИХ ДВЕРЯХ!";
    }

    if(
        rightLightOn &&
        rightEnemy &&
        !rightDoorClosed
    ){

        statusText.textContent =
            "🚨 МОБ У ПРАВИХ ДВЕРЯХ!";
    }
}

/* =========================================================
   CAMERA
========================================================= */

cameraBtn.onclick =
function(){

    if(!running){
        return;
    }

    camerasOpen =
        true;

    cameraPanel.classList.remove(
        "hidden"
    );

    renderCamera();

    updateUsage();
};

closeCameraBtn.onclick =
function(){

    closeCamera();
};

function closeCamera(){

    camerasOpen =
        false;

    cameraPanel.classList.add(
        "hidden"
    );

    updateUsage();
}

cameraButtons.forEach(
    button => {

        button.onclick =
        function(){

            selectedCamera =
                Number(
                    button.dataset.cam
                );

            selectCamera(
                selectedCamera
            );
        };
    }
);

function selectCamera(cam){

    selectedCamera =
        cam;

    cameraButtons.forEach(
        button => {

            button.classList.toggle(
                "active",

                Number(
                    button.dataset.cam
                ) === selectedCamera
            );
        }
    );

    renderCamera();
}

function renderCamera(){

    cameraTitle.textContent =
        CAMERA_NAMES[
            selectedCamera
        ];

    cameraScene.textContent =
        CAMERA_SCENES[
            selectedCamera
        ];

    cameraIcon.textContent =
        CAMERA_ICONS[
            selectedCamera
        ];

    enemy1Element.classList.remove(
        "visible"
    );

    enemy2Element.classList.remove(
        "visible"
    );

    enemy3Element.classList.remove(
        "visible"
    );

    let enemies =
        0;

    if(
        enemy1Position() ===
        selectedCamera
    ){

        enemy1Element.classList.add(
            "visible"
        );

        enemies++;
    }

    if(
        enemy2Position() ===
        selectedCamera
    ){

        enemy2Element.classList.add(
            "visible"
        );

        enemies++;
    }

    if(
        enemy3Position() ===
        selectedCamera
    ){

        enemy3Element.classList.add(
            "visible"
        );

        enemies++;
    }

    cameraText.textContent =
        enemies
        ? "⚠️ ВОРОГ НА КАМЕРІ!"
        : "Нікого не видно...";
}

/* =========================================================
   ENEMY MOVEMENT
========================================================= */

function moveEnemies(){

    if(
        !running ||
        powerOutActive
    ){
        return;
    }

    const chance =
        .16 +
        currentNight *
        .04;

    if(
        Math.random() < chance &&
        enemy1Step <
        enemy1Route.length - 1
    ){

        enemy1Step++;
    }

    if(
        Math.random() < chance &&
        enemy2Step <
        enemy2Route.length - 1
    ){

        enemy2Step++;
    }

    if(
        Math.random() <
        chance * .75 &&

        enemy3Step <
        enemy3Route.length - 1
    ){

        enemy3Step++;
    }

    updateDoorEnemies();

    checkAttacks();

    if(camerasOpen){

        renderCamera();
    }
}

/* =========================================================
   ATTACKS
========================================================= */

function checkAttacks(){

    if(
        enemy1Position() === "left" &&
        !enemy1AttackTimer
    ){

        enemy1AttackTimer =
            setTimeout(
                ()=>{

                    enemy1AttackTimer =
                        null;

                    if(
                        running &&
                        enemy1Position() === "left"
                    ){

                        attack(
                            "left",
                            "👀",
                            1
                        );
                    }

                },
                ENEMY_ATTACK_DELAY[
                    currentNight
                ]
            );
    }

    if(
        enemy2Position() === "right" &&
        !enemy2AttackTimer
    ){

        enemy2AttackTimer =
            setTimeout(
                ()=>{

                    enemy2AttackTimer =
                        null;

                    if(
                        running &&
                        enemy2Position() === "right"
                    ){

                        attack(
                            "right",
                            "🐺",
                            2
                        );
                    }

                },
                ENEMY_ATTACK_DELAY[
                    currentNight
                ]
            );
    }

    if(
        enemy3Position() ===
        enemy3Side &&

        !enemy3AttackTimer
    ){

        enemy3AttackTimer =
            setTimeout(
                ()=>{

                    enemy3AttackTimer =
                        null;

                    if(
                        running &&
                        enemy3Position() ===
                        enemy3Side
                    ){

                        attack(
                            enemy3Side,
                            "🦆",
                            3
                        );
                    }

                },
                ENEMY_ATTACK_DELAY[
                    currentNight
                ]
            );
    }
}

function attack(
    side,
    icon,
    enemyNumber
){

    const doorClosed =
        side === "left"
        ? leftDoorClosed
        : rightDoorClosed;

    if(doorClosed){

        hitSound();

        resetEnemy(
            enemyNumber
        );

        return;
    }

    showJumpscare(
        icon,
        side
    );
}

function resetEnemy(number){

    if(number === 1){

        enemy1Step = 0;
    }

    if(number === 2){

        enemy2Step = 0;
    }

    if(number === 3){

        enemy3Step = 0;

        enemy3Side =
            Math.random() < .5
            ? "left"
            : "right";

        createDuckRoute();
    }

    updateDoorEnemies();
}

/* =========================================================
   POWER
========================================================= */

function energyDrain(percent){

    return (
        percent /
        (
            getNightMs() /
            100
        )
    );
}

function updatePower(){

    if(
        !running ||
        powerOutActive
    ){
        return;
    }

    let drain =
        energyDrain(40);

    if(leftDoorClosed){

        drain +=
            energyDrain(34);
    }

    if(rightDoorClosed){

        drain +=
            energyDrain(34);
    }

    if(leftLightOn){

        drain +=
            energyDrain(21);
    }

    if(rightLightOn){

        drain +=
            energyDrain(21);
    }

    if(camerasOpen){

        drain +=
            energyDrain(20);
    }

    power -= drain;

    if(power <= 0){

        power = 0;

        powerLabel.textContent =
            "0";

        powerOut();

        return;
    }

    powerLabel.textContent =
        Math.floor(power);

    powerLabel.classList.remove(
        "medium",
        "low"
    );

    if(power <= 20){

        powerLabel.classList.add(
            "low"
        );

    }else if(power <= 40){

        powerLabel.classList.add(
            "medium"
        );
    }
}

function updateUsage(){

    let usage = 1;

    if(leftDoorClosed) usage++;
    if(rightDoorClosed) usage++;
    if(leftLightOn) usage++;
    if(rightLightOn) usage++;
    if(camerasOpen) usage++;

    usageBars.forEach(
        (bar,index)=>{

            bar.classList.toggle(
                "on",
                index < usage
            );
        }
    );
}

function powerOut(){

    if(powerOutActive){
        return;
    }

    powerOutActive =
        true;

    stopPhone();

    leftDoorClosed =
        false;

    rightDoorClosed =
        false;

    leftDoor.classList.remove(
        "closed"
    );

    rightDoor.classList.remove(
        "closed"
    );

    leftLightOn =
        false;

    rightLightOn =
        false;

    leftLightEffect.classList.remove(
        "on"
    );

    rightLightEffect.classList.remove(
        "on"
    );

    cameraPanel.classList.add(
        "hidden"
    );

    camerasOpen =
        false;

    statusText.textContent =
        "⚡ ЕНЕРГІЯ ЗАКІНЧИЛАСЯ...";

    setTimeout(
        ()=>{

            if(running){

                showJumpscare(
                    "👀",
                    "left"
                );
            }

        },
        2800
    );
}

/* =========================================================
   TIME
========================================================= */

function advanceTime(){

    if(!running){
        return;
    }

    hour++;

    if(hour >= 6){

        hour = 6;

        timeLabel.textContent =
            "6 AM";

        winGame();

        return;
    }

    timeLabel.textContent =
        hour +
        " AM";
}

/* =========================================================
   JUMPSCARE
========================================================= */

function showJumpscare(
    icon,
    side
){

    if(scareRunning){
        return;
    }

    scareRunning =
        true;

    running =
        false;

    stopTimers();

    stopPhone();

    cameraPanel.classList.add(
        "hidden"
    );

    jumpscareFace.textContent =
        icon;

    jumpscare.classList.add(
        "active"
    );

    scareSound();

    setTimeout(
        ()=>{

            jumpscare.classList.remove(
                "active"
            );

            showGameOver(
                side === "left"
                ? "Ти не закрив ліві двері."
                : "Ти не закрив праві двері."
            );

        },
        1200
    );
}

/* =========================================================
   WIN
========================================================= */

function winGame(){

    running =
        false;

    stopTimers();

    stopPhone();

    cameraPanel.classList.add(
        "hidden"
    );

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "🎉 6 AM";

    if(currentNight < 5){

        const nextNight =
            currentNight + 1;

        if(
            nextNight > unlockedNight
        ){

            unlockedNight =
                nextNight;

            localStorage.setItem(
                "atbNight",
                String(
                    unlockedNight
                )
            );
        }

        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! Відкрито Ніч " +
            nextNight +
            ".";

    }else{

        endText.textContent =
            "🏆 ТИ ПРОЙШОВ УСІ П'ЯТЬ НОЧЕЙ В АТБ!";
    }

    updateNightButtons();
}

function showGameOver(reason){

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "GAME OVER";

    endText.textContent =
        reason;
}

/* =========================================================
   BUTTONS
========================================================= */

restartBtn.onclick =
function(){

    startGame(
        currentNight
    );
};

menuBtn.onclick =
function(){

    stopTimers();

    stopPhone();

    running =
        false;

    game.classList.add(
        "hidden"
    );

    endScreen.classList.add(
        "hidden"
    );

    menu.classList.remove(
        "hidden"
    );
};

/* =========================================================
   TIMERS
========================================================= */

function startTimers(){

    powerTimer =
        setInterval(
            updatePower,
            100
        );

    timeTimer =
        setInterval(
            advanceTime,
            getHourMs()
        );

    enemyTimer =
        setInterval(
            moveEnemies,
            ENEMY_MOVE_TIME[
                currentNight
            ]
        );
}

function stopTimers(){

    clearInterval(
        powerTimer
    );

    clearInterval(
        timeTimer
    );

    clearInterval(
        enemyTimer
    );

    clearTimeout(
        enemy1AttackTimer
    );

    clearTimeout(
        enemy2AttackTimer
    );

    clearTimeout(
        enemy3AttackTimer
    );

    powerTimer =
        null;

    timeTimer =
        null;

    enemyTimer =
        null;

    enemy1AttackTimer =
        null;

    enemy2AttackTimer =
        null;

    enemy3AttackTimer =
        null;
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(!running){
            return;
        }

        const key =
            event.key.toLowerCase();

        if(key === "a"){

            leftLightBtn.click();
        }

        if(key === "d"){

            rightLightBtn.click();
        }

        if(key === "q"){

            leftDoorBtn.click();
        }

        if(key === "e"){

            rightDoorBtn.click();
        }

        if(key === "c"){

            if(camerasOpen){

                closeCamera();

            }else{

                cameraBtn.click();
            }
        }

        if(
            event.key === "Escape" &&
            camerasOpen
        ){

            closeCamera();
        }
    }
);

/* =========================================================
   INIT
========================================================= */

updateNightButtons();

console.log(
    "FIVE NIGHTS AT ATB - PHONE FIX"
);
</script>
