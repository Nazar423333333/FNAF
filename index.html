<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
/* =========================================================
   ОСНОВА
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    font-family:inherit;
    cursor:pointer;
    user-select:none;
}

/* =========================================================
   МЕНЮ
========================================================= */

#menu,
#nightMenu{
    position:fixed;
    inset:0;
    z-index:5000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(circle at center,#242424 0%,#090909 55%,#000 100%);
}

#menu h1{
    font-size:clamp(42px,7vw,92px);
    letter-spacing:4px;

    text-shadow:
        0 0 8px #fff,
        0 0 22px #d71920,
        0 0 55px #d71920;
}

#menu p{
    margin-top:16px;
    color:#aaa;
    font-size:20px;
}

.menuBtn{
    min-width:280px;
    margin-top:22px;
    padding:16px 28px;

    border:1px solid #555;
    border-radius:12px;

    background:#111;
    color:#fff;

    font-size:18px;
    font-weight:700;

    transition:.18s;
}

.menuBtn:hover{
    transform:scale(1.04);
    background:#292929;
}

#playBtn{
    background:#086cff;
}

#playBtn:hover{
    background:#267fff;
}

/* =========================================================
   ВИБІР НОЧІ
========================================================= */

#nightMenu h2{
    margin-bottom:30px;
    font-size:46px;
}

.nightButtons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

.nightBtn{
    width:120px;
    height:90px;

    border:1px solid #555;
    border-radius:12px;

    background:#151515;
    color:#fff;

    font-size:17px;
    font-weight:700;

    transition:.15s;
}

.nightBtn:hover:not(:disabled){
    background:#086cff;
    transform:translateY(-2px);
}

.nightBtn.locked{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================================================
   ГРА
========================================================= */

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* =========================================================
   ВЕРХНЯ ПАНЕЛЬ
========================================================= */

#topbar{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);

    z-index:700;

    width:min(900px,94%);
    padding:14px 22px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(0,0,0,.88);

    border:1px solid #555;
    border-radius:14px;

    box-shadow:0 0 25px #000;

    font-size:19px;
    font-weight:700;
}

#powerLabel.low{
    color:#ff3b3b;
    text-shadow:0 0 10px red;
}

#powerLabel.medium{
    color:#ffd43b;
}

/* =========================================================
   PNG ОФІС
========================================================= */

#office{
    position:absolute;
    inset:0;
    overflow:hidden;

    /*
        office.png повинен лежати
        поруч із index.html
    */

    background-image:
        linear-gradient(
            rgba(0,0,0,.04),
            rgba(0,0,0,.08)
        ),
        url("office.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    background-color:#080808;
}

/* =========================================================
   СТАТУС
========================================================= */

#statusBox{
    position:absolute;
    top:25%;
    left:50%;
    transform:translateX(-50%);

    z-index:500;

    width:min(620px,56%);
    padding:9px 16px;

    background:rgba(0,0,0,.70);

    border:1px solid rgba(255,255,255,.16);
    border-radius:10px;

    text-align:center;
    color:#ddd;

    font-size:16px;

    box-shadow:0 0 18px #000;
}

/* =========================================================
   ДВЕРНІ ЗОНИ

   Підігнані під office.png.
========================================================= */

.doorFrame{
    position:absolute;

    top:24%;

    width:13.5%;
    min-width:125px;
    max-width:210px;

    height:50%;

    z-index:160;

    overflow:hidden;

    /*
        Прозора зона поверх
        намальованого проходу PNG
    */

    background:rgba(0,0,0,.12);

    border-radius:2px;
}

#leftDoorFrame{
    left:9%;
}

#rightDoorFrame{
    right:9%;
}

/* =========================================================
   СВІТЛО ВСЕРЕДИНІ ДВЕРЕЙ
========================================================= */

.doorLight{
    position:absolute;
    inset:0;

    z-index:5;

    opacity:0;

    pointer-events:none;

    transition:opacity .12s;

    background:
        radial-gradient(
            ellipse at 50% 48%,
            rgba(255,255,225,.98) 0%,
            rgba(255,240,150,.85) 22%,
            rgba(255,205,60,.56) 45%,
            rgba(255,165,20,.22) 70%,
            transparent 96%
        );

    box-shadow:
        inset 0 0 45px rgba(255,240,150,.50),
        inset 0 0 100px rgba(255,190,30,.35);
}

.doorFrame.lightOn .doorLight{
    opacity:1;
}

/* =========================================================
   МОБ У ДВЕРЯХ
========================================================= */

.doorEnemy{
    position:absolute;
    left:50%;
    top:52%;

    transform:
        translate(-50%,-50%)
        scale(.72);

    z-index:10;

    opacity:0;

    pointer-events:none;

    font-size:clamp(70px,7vw,120px);

    transition:
        opacity .1s,
        transform .1s;

    filter:
        drop-shadow(0 0 10px #fff)
        drop-shadow(0 0 24px red)
        drop-shadow(0 0 40px #000);
}

.doorEnemy.visible{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

/* =========================================================
   МЕТАЛЕВІ ДВЕРІ
========================================================= */

.door{
    position:absolute;
    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:30;

    background:
        repeating-linear-gradient(
            0deg,
            #111 0px,
            #111 28px,
            #444 29px,
            #777 33px,
            #252525 38px
        );

    border:3px solid #555;

    box-shadow:
        inset 0 0 35px #000,
        0 0 30px #000;

    transform:translateY(-104%);

    transition:transform .34s ease;
}

.door::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 42px,
            rgba(255,255,255,.07) 43px 46px
        );
}

.door::after{
    content:"";

    position:absolute;

    left:50%;
    top:8%;

    transform:translateX(-50%);

    width:62%;
    height:5px;

    background:#888;

    box-shadow:
        0 65px #888,
        0 130px #888,
        0 195px #888,
        0 260px #888,
        0 325px #888,
        0 390px #888;
}

.door.closed{
    transform:translateY(0);
}

/* =========================================================
   СВІТЛО ЗЛІВА / СПРАВА
========================================================= */

.lightEffect{
    position:absolute;
    top:0;

    width:38%;
    height:100%;

    z-index:100;

    opacity:0;

    pointer-events:none;

    transition:opacity .12s;
}

#leftLightEffect{
    left:0;

    background:
        radial-gradient(
            ellipse at left center,
            rgba(255,245,175,.42),
            rgba(255,215,65,.12) 42%,
            transparent 78%
        );
}

#rightLightEffect{
    right:0;

    background:
        radial-gradient(
            ellipse at right center,
            rgba(255,245,175,.42),
            rgba(255,215,65,.12) 42%,
            transparent 78%
        );
}

.lightEffect.on{
    opacity:1;
}

/* =========================================================
   КНОПКИ
========================================================= */

.sideControls{
    position:absolute;

    top:47%;

    z-index:550;

    display:flex;
    flex-direction:column;

    gap:11px;
}

#leftControls{
    left:24%;
}

#rightControls{
    right:24%;
}

.controlBtn{
    width:170px;
    padding:14px 10px;

    border:1px solid #666;
    border-radius:11px;

    background:rgba(8,8,8,.92);

    color:#fff;

    font-size:15px;
    font-weight:700;

    box-shadow:0 0 18px #000;

    transition:.15s;
}

.controlBtn:hover{
    background:#303030;
    transform:scale(1.03);
}

.controlBtn.lightOn{
    background:#ffd84a;
    color:#111;

    border-color:#fff;

    box-shadow:
        0 0 12px white,
        0 0 30px #ffd84a;
}

.controlBtn.doorOn{
    background:#b51414;
    color:#fff;

    border-color:#ff5555;

    box-shadow:
        0 0 15px red,
        0 0 30px rgba(255,0,0,.6);
}

/* =========================================================
   КАМЕРИ — КНОПКА
========================================================= */

#cameraBtn{
    position:absolute;

    left:50%;
    bottom:24px;

    transform:translateX(-50%);

    z-index:600;

    padding:17px 35px;

    border:0;
    border-radius:14px;

    background:#086cff;
    color:#fff;

    font-size:18px;
    font-weight:700;

    box-shadow:0 0 28px rgba(0,100,255,.55);

    transition:.18s;
}

#cameraBtn:hover{
    transform:
        translateX(-50%)
        scale(1.04);

    background:#287fff;
}

/* =========================================================
   ЗВУК
========================================================= */

#soundBtn{
    position:absolute;

    top:88px;
    left:22px;

    z-index:700;

    padding:10px 14px;

    border:1px solid #555;
    border-radius:9px;

    background:rgba(0,0,0,.80);

    color:#fff;

    font-weight:700;
}

/* =========================================================
   ВИКОРИСТАННЯ ЕНЕРГІЇ
========================================================= */

#usage{
    position:absolute;

    top:88px;
    right:22px;

    z-index:700;

    padding:10px 13px;

    border:1px solid #444;
    border-radius:8px;

    background:rgba(0,0,0,.80);

    font-size:14px;
}

.usageBar{
    display:inline-block;

    width:17px;
    height:11px;

    margin-left:3px;

    border:1px solid #555;

    background:#111;
}

.usageBar.on{
    background:#63ff4d;
    box-shadow:0 0 8px #63ff4d;
}

/* =========================================================
   CAMERA PANEL
========================================================= */

#cameraPanel{
    position:absolute;
    inset:0;

    z-index:1500;

    padding:20px;

    background:#020202;
}

.cameraHeader{
    height:65px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid #333;
}

.cameraHeader h2{
    letter-spacing:2px;
}

#closeCameraBtn{
    padding:12px 18px;

    border:0;
    border-radius:10px;

    background:#a00;
    color:#fff;

    font-weight:700;
}

/* =========================================================
   CAMERA VIEW
========================================================= */

#cameraView{
    position:relative;

    height:calc(100vh - 105px);

    margin-top:14px;

    overflow:hidden;

    border:3px solid #333;
    border-radius:10px;

    background:
        radial-gradient(
            circle at center,
            #3d4143 0%,
            #161819 55%,
            #020202 100%
        );
}

/* CCTV NOISE */

#cameraView::before{
    content:"";

    position:absolute;
    inset:0;

    z-index:40;

    pointer-events:none;

    opacity:.35;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 7px,
            rgba(255,255,255,.025) 8px
        );

    animation:noiseMove .18s infinite;
}

#cameraView::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:41;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            rgba(255,255,255,.05) 4px
        );
}

@keyframes noiseMove{
    0%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(2px,-2px);
    }

    100%{
        transform:translate(-2px,1px);
    }
}

/* =========================================================
   CAMERA SCENE
========================================================= */

#cameraScene{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding-bottom:130px;

    color:#acb4b8;

    opacity:.40;

    text-align:center;

    font-size:clamp(24px,4vw,55px);
    letter-spacing:7px;
}

#cameraRoomIcon{
    position:absolute;

    top:43%;
    left:50%;

    transform:translate(-50%,-50%);

    font-size:155px;

    opacity:.18;
}

/* =========================================================
   МОБИ НА КАМЕРАХ
========================================================= */

.enemy{
    position:absolute;

    top:46%;

    z-index:25;

    font-size:135px;

    opacity:0;

    filter:
        drop-shadow(0 0 20px red)
        drop-shadow(0 0 35px #000);
}

.enemy.visible{
    opacity:1;
}

#enemy1{
    left:22%;
}

#enemy2{
    right:22%;
}

#enemy3{
    left:50%;
    transform:translateX(-50%);
}

/* =========================================================
   CAMERA INFO
========================================================= */

#cameraInfo{
    position:absolute;

    left:25px;
    bottom:25px;

    z-index:80;

    min-width:290px;

    padding:15px;

    background:rgba(0,0,0,.84);

    border:1px solid #444;
    border-radius:10px;
}

#cameraInfo p{
    margin-top:8px;
    color:#aaa;
}

/* =========================================================
   CAMERA MAP
========================================================= */

#cameraMap{
    position:absolute;

    right:25px;
    bottom:25px;

    z-index:80;

    width:290px;
    height:230px;

    background:rgba(0,0,0,.92);

    border:1px solid #555;
    border-radius:12px;

    box-shadow:0 0 30px #000;
}

.camBtn{
    position:absolute;

    width:78px;

    padding:9px;

    border:1px solid #666;
    border-radius:7px;

    background:#151515;
    color:#fff;

    font-weight:700;

    transition:.12s;
}

.camBtn:hover{
    background:#333;
}

.camBtn.active{
    background:#086cff;
    box-shadow:0 0 15px #086cff;
}

.camBtn[data-cam="0"]{
    top:25px;
    left:106px;
}

.camBtn[data-cam="1"]{
    top:78px;
    left:20px;
}

.camBtn[data-cam="2"]{
    top:78px;
    right:20px;
}

.camBtn[data-cam="3"]{
    top:132px;
    left:20px;
}

.camBtn[data-cam="4"]{
    top:132px;
    right:20px;
}

.camBtn[data-cam="5"]{
    bottom:15px;
    left:106px;
}

/* =========================================================
   СКРИМЕР
========================================================= */

#jumpscare{
    position:fixed;
    inset:0;

    z-index:99999;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #5e0000 0%,
            #170000 45%,
            #000 85%
        );
}

#jumpscare.active{
    display:flex;

    animation:
        scareFlash .07s infinite,
        scareShake .055s infinite;
}

#jumpscareFace{
    font-size:min(52vw,500px);

    line-height:1;

    filter:
        drop-shadow(0 0 30px red)
        drop-shadow(0 0 60px white);

    animation:scareZoom .55s forwards;
}

#jumpscareText{
    position:absolute;

    bottom:7%;

    font-size:clamp(35px,7vw,90px);

    font-weight:900;
    letter-spacing:8px;

    text-shadow:
        0 0 15px red,
        0 0 40px red;
}

@keyframes scareZoom{
    0%{
        transform:scale(.12) rotate(-8deg);
    }

    40%{
        transform:scale(1.5) rotate(7deg);
    }

    65%{
        transform:scale(.9) rotate(-4deg);
    }

    100%{
        transform:scale(1.18) rotate(0);
    }
}

@keyframes scareShake{
    0%{
        transform:translate(0,0);
    }

    25%{
        transform:translate(-12px,6px);
    }

    50%{
        transform:translate(11px,-8px);
    }

    75%{
        transform:translate(-8px,-5px);
    }

    100%{
        transform:translate(0,0);
    }
}

@keyframes scareFlash{
    0%{
        filter:brightness(.7);
    }

    50%{
        filter:brightness(2.3);
    }

    100%{
        filter:brightness(.5);
    }
}

/* =========================================================
   GAME OVER / 6 AM
========================================================= */

#endScreen{
    position:absolute;
    inset:0;

    z-index:3000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:#000;
}

#endTitle{
    font-size:clamp(60px,10vw,135px);

    text-shadow:
        0 0 20px red,
        0 0 50px red;
}

#endText{
    margin-top:18px;

    color:#aaa;

    font-size:21px;
}

.endButtons{
    display:flex;
    gap:12px;

    margin-top:30px;
}

.endBtn{
    padding:16px 24px;

    border:0;
    border-radius:10px;

    background:#086cff;
    color:#fff;

    font-size:16px;
    font-weight:700;
}

.endBtn.gray{
    background:#222;
    border:1px solid #555;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    #leftDoorFrame{
        left:4%;
        width:16%;
    }

    #rightDoorFrame{
        right:4%;
        width:16%;
    }

    #leftControls{
        left:21%;
    }

    #rightControls{
        right:21%;
    }

    .controlBtn{
        width:140px;
        padding:11px;
        font-size:13px;
    }
}

@media(max-width:750px){

    #topbar{
        font-size:13px;
    }

    #usage{
        display:none;
    }

    #statusBox{
        top:29%;
        width:50%;
        font-size:12px;
    }

    #leftDoorFrame{
        left:0;
        width:22%;
    }

    #rightDoorFrame{
        right:0;
        width:22%;
    }

    #leftControls{
        left:23%;
    }

    #rightControls{
        right:23%;
    }

    .controlBtn{
        width:105px;
        padding:9px 5px;
        font-size:10px;
    }
}
</style>
</head>

<body>

<!-- ======================================================
     МЕНЮ
====================================================== -->

<section id="menu">

    <h1>П'ЯТЬ НОЧЕЙ В АТБ</h1>

    <p>Переживи п'ять нічних змін</p>

    <button
        id="playBtn"
        class="menuBtn"
    >
        ▶ ГРАТИ
    </button>

    <button
        id="resetProgressBtn"
        class="menuBtn"
    >
        ♻ СКИНУТИ ПРОГРЕС
    </button>

</section>

<!-- ======================================================
     ВИБІР НОЧІ
====================================================== -->

<section
    id="nightMenu"
    class="hidden"
>

    <h2>ОБЕРИ НІЧ</h2>

    <div class="nightButtons">

        <button class="nightBtn" data-night="1">
            🌙 Ніч 1
        </button>

        <button class="nightBtn" data-night="2">
            🌙 Ніч 2
        </button>

        <button class="nightBtn" data-night="3">
            🌙 Ніч 3
        </button>

        <button class="nightBtn" data-night="4">
            🌙 Ніч 4
        </button>

        <button class="nightBtn" data-night="5">
            🌙 Ніч 5
        </button>

    </div>

    <button
        id="backBtn"
        class="menuBtn"
    >
        ← НАЗАД
    </button>

</section>

<!-- ======================================================
     ГРА
====================================================== -->

<section
    id="game"
    class="hidden"
>

    <!-- TOP BAR -->

    <div id="topbar">

        <div>
            🌙 Ніч:
            <span id="nightLabel">1</span>
        </div>

        <div>
            🕛
            <span id="timeLabel">12 AM</span>
        </div>

        <div>
            ⚡
            <span id="powerLabel">100</span>%
        </div>

    </div>

    <button id="soundBtn">
        🔊 ЗВУК
    </button>

    <div id="usage">

        Використання:

        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>
        <span class="usageBar"></span>

    </div>

    <!-- ==================================================
         ОФІС
    ================================================== -->

    <main id="office">

        <div id="statusBox">
            <span id="status">
                Перевіряй камери та бережи енергію...
            </span>
        </div>

        <!-- ЗАГАЛЬНЕ СВІТЛО -->

        <div
            id="leftLightEffect"
            class="lightEffect"
        ></div>

        <div
            id="rightLightEffect"
            class="lightEffect"
        ></div>

        <!-- ==================================================
             ЛІВІ ДВЕРІ
        ================================================== -->

        <div
            id="leftDoorFrame"
            class="doorFrame"
        >

            <div class="doorLight"></div>

            <div
                id="leftDoorEnemy"
                class="doorEnemy"
            >
                👀
            </div>

            <div
                id="leftDoor"
                class="door"
            ></div>

        </div>

        <!-- ==================================================
             ПРАВІ ДВЕРІ
        ================================================== -->

        <div
            id="rightDoorFrame"
            class="doorFrame"
        >

            <div class="doorLight"></div>

            <div
                id="rightDoorEnemy"
                class="doorEnemy"
            >

let soundEnabled = true;
let audioContext = null;

function getAudioContext(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        audioContext =
            new AudioCtx();
    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

    return audioContext;
}

function beep(
    frequency = 400,
    duration = 100,
    volume = .07,
    type = "square"
){

    if(!soundEnabled){
        return;
    }

    try{

        const ctx =
            getAudioContext();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        osc.type = type;
        osc.frequency.value = frequency;

        gain.gain.value = volume;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime +
            duration / 1000
        );

        osc.stop(
            ctx.currentTime +
            duration / 1000
        );

    }catch(error){

        console.log(
            "Audio:",
            error
        );
    }
}

function moveEnemies(){

    if(
        !running ||
        powerOutActive
    ){
        return;
    }

    const chance =
        .17 +
        currentNight *
        .05;

    if(
        Math.random() < chance &&
        enemy1Step <
        enemy1Route.length - 1
    ){

        enemy1Step++;
    }

    if(
        Math.random() < chance &&
        enemy2Step <
        enemy2Route.length - 1
    ){

        enemy2Step++;
    }

    if(
        Math.random() <
        chance * .80 &&

        enemy3Step <
        enemy3Route.length - 1
    ){

        enemy3Step++;
    }

    updateDoorEnemies();

    checkEnemyAttack();

    if(camerasOpen){
        renderCamera();
    }
}

========================================================= */

    if(
        !running ||
        powerOutActive
    ){
        return;
    }

    /*

    */

        !enemy1AttackTimer
    ){

        statusText.textContent =
            "⚠️ Щось підійшло до лівих дверей...";

        enemy1AttackTimer =
            setTimeout(
                function(){

                    enemy1AttackTimer =
                        null;

                    if(
                        running &&
                        !powerOutActive &&
                        enemy1Position() === "left"
                    ){

                        attemptAttack(
                            "left",
                            "👀",
                            1
                        );
                    }

                },
                3500
            );
    }

    /*
        🐺 ПРАВИЙ МОБ
    */

    if(
        enemy2Position() === "right" &&
        !enemy2AttackTimer
    ){

        statusText.textContent =
            "⚠️ Щось підійшло до правих дверей...";

        enemy2AttackTimer =
            setTimeout(
                function(){

                    enemy2AttackTimer =
                        null;

                    if(
                        running &&
                        !powerOutActive &&
                        enemy2Position() === "right"
                    ){

                        attemptAttack(
                            "right",
                            "🐺",
                            2
                        );
                    }

                },
                3500
            );
    }

    /*
        🦆 КАЧКА
    */

    if(
        enemy3Position() ===
        enemy3Side &&

        !enemy3AttackTimer
    ){

        statusText.textContent =
            enemy3Side === "left"
                ? "⚠️ Щось підійшло до лівих дверей..."
                : "⚠️ Щось підійшло до правих дверей...";

        enemy3AttackTimer =
            setTimeout(
                function(){

                    enemy3AttackTimer =
                        null;

                    if(
                        running &&
                        !powerOutActive &&
                        enemy3Position() ===
                        enemy3Side
                    ){

                        attemptAttack(
                            enemy3Side,
                            "🦆",
                            3
                        );
                    }

                },
                3500
            );
    }
}

/* =========================================================
   ATTACK
========================================================= */

function attemptAttack(
    side,
    icon,
    enemyNumber
){

    if(
        !running ||
        powerOutActive
    ){
        return;
    }

    const closed =
        side === "left"
            ? leftDoorClosed
            : rightDoorClosed;

    /*
        ДВЕРІ ЗАКРИТІ
    */

    if(closed){

        hitSound();

        statusText.textContent =
            side === "left"
                ? "💥 Ворог ударив у ліві двері!"
                : "💥 Ворог ударив у праві двері!";

        resetEnemy(
            enemyNumber
        );

        return;
    }

    /*
        ДВЕРІ ВІДКРИТІ
    */

    showJumpscare(
        icon,
        side
    );
}

/* =========================================================
   RESET ENEMY
========================================================= */

function resetEnemy(number){

    if(number === 1){

        enemy1Step = 0;

        clearTimeout(
            enemy1AttackTimer
        );

        enemy1AttackTimer = null;
    }

    if(number === 2){

        enemy2Step = 0;

        clearTimeout(
            enemy2AttackTimer
        );

        enemy2AttackTimer = null;
    }

    if(number === 3){

        enemy3Step = 0;

        clearTimeout(
            enemy3AttackTimer
        );

        enemy3AttackTimer = null;

        enemy3Side =
            Math.random() < .5
                ? "left"
                : "right";

        createDuckRoute();
    }

    updateDoorEnemies();

    if(camerasOpen){
        renderCamera();
    }
}

/* =========================================================
   JUMPSCARE
========================================================= */

function showJumpscare(
    icon,
    side
){

    if(scareRunning){
        return;
    }

    scareRunning = true;
    running = false;

    stopTimers();

    camerasOpen = false;

    cameraPanel.classList.add(
        "hidden"
    );

    jumpscareFace.textContent =
        icon;

    jumpscare.classList.add(
        "active"
    );

    jumpscareSound();

    setTimeout(
        function(){

            jumpscare.classList.remove(
                "active"
            );

            showGameOver(
                side === "left"
                    ? "Ти не закрив ліві двері."
                    : "Ти не закрив праві двері."
            );

            scareRunning = false;

        },
        1200
    );
}

/* =========================================================
   USAGE
========================================================= */

function updateUsage(){

    let usage = 1;

    if(leftDoorClosed){
        usage++;
    }

    if(rightDoorClosed){
        usage++;
    }

    if(leftLightOn){
        usage++;
    }

    if(rightLightOn){
        usage++;
    }

    if(camerasOpen){
        usage++;
    }

    usageBars.forEach(
        function(bar,index){

            bar.classList.toggle(
                "on",

                index < usage
            );
        }
    );
}

/* =========================================================
   ⚡ ЕНЕРГІЯ

   ОНОВЛЮЄТЬСЯ КОЖНІ 100 МС.
========================================================= */

function updatePower(){

    if(
        !running ||
        powerOutActive
    ){
        return;
    }

    /*
        БАЗОВА ВИТРАТА

        0.045 * 10 разів/секунду
        = 0.45% за секунду.
    */

    let drain = 0.045;

    /*
        ДВЕРІ
    */

    if(leftDoorClosed){
        drain += 0.020;
    }

    if(rightDoorClosed){
        drain += 0.020;
    }

    /*
        СВІТЛО
    */

    if(leftLightOn){
        drain += 0.014;
    }

    if(rightLightOn){
        drain += 0.014;
    }

    /*
        КАМЕРИ
    */

    if(camerasOpen){
        drain += 0.018;
    }

    power -= drain;

    if(power <= 0){

        power = 0;

        powerLabel.textContent =
            "0";

        powerOut();

        return;
    }

    powerLabel.textContent =
        Math.floor(power);

    powerLabel.classList.remove(
        "low",
        "medium"
    );

    if(power <= 20){

        powerLabel.classList.add(
            "low"
        );

    }else if(power <= 40){

        powerLabel.classList.add(
            "medium"
        );
    }
}

/* =========================================================
   0% POWER
========================================================= */

function powerOut(){

    if(powerOutActive){
        return;
    }

    powerOutActive = true;

    clearInterval(
        powerTimer
    );

    clearInterval(
        enemyTimer
    );

    clearTimeout(
        enemy1AttackTimer
    );

    clearTimeout(
        enemy2AttackTimer
    );

    clearTimeout(
        enemy3AttackTimer
    );

    enemy1AttackTimer = null;
    enemy2AttackTimer = null;
    enemy3AttackTimer = null;

    leftDoorClosed = false;
    rightDoorClosed = false;

    leftLightOn = false;
    rightLightOn = false;

    leftDoor.classList.remove(
        "closed"
    );

    rightDoor.classList.remove(
        "closed"
    );

    leftDoorBtn.classList.remove(
        "doorOn"
    );

    rightDoorBtn.classList.remove(
        "doorOn"
    );

    leftLightBtn.classList.remove(
        "lightOn"
    );

    rightLightBtn.classList.remove(
        "lightOn"
    );

    leftLightEffect.classList.remove(
        "on"
    );

    rightLightEffect.classList.remove(
        "on"
    );

    leftDoorFrame.classList.remove(
        "lightOn"
    );

    rightDoorFrame.classList.remove(
        "lightOn"
    );

    leftDoorEnemy.classList.remove(
        "visible"
    );

    rightDoorEnemy.classList.remove(
        "visible"
    );

    camerasOpen = false;

    cameraPanel.classList.add(
        "hidden"
    );

    updateUsage();

    statusText.textContent =
        "⚡ ЕНЕРГІЯ ЗАКІНЧИЛАСЯ...";

    setTimeout(
        function(){

            if(
                running &&
                powerOutActive
            ){

                showPowerOutJumpscare();
            }

        },
        2800
    );
}

/* =========================================================
   POWER OUT JUMPSCARE
========================================================= */

function showPowerOutJumpscare(){

    if(scareRunning){
        return;
    }

    scareRunning = true;

    running = false;

    stopTimers();

    jumpscareFace.textContent =
        "👀";

    jumpscare.classList.add(
        "active"
    );

    jumpscareSound();

    setTimeout(
        function(){

            jumpscare.classList.remove(
                "active"
            );

            showGameOver(
                "Енергія закінчилася."
            );

            scareRunning = false;

        },
        1200
    );
}

/* =========================================================
   TIME
========================================================= */

function advanceTime(){

    if(!running){
        return;
    }

    hour++;

    if(hour >= 6){

        hour = 6;

        timeLabel.textContent =
            "6 AM";

        winGame();

        return;
    }

    timeLabel.textContent =
        hour +
        " AM";

    if(hour === 5){

        statusText.textContent =
            "🕔 МАЙЖЕ 6 AM!";
    }
}

/* =========================================================
   WIN
========================================================= */

function winGame(){

    if(!running){
        return;
    }

    running = false;

    stopTimers();

    camerasOpen = false;

    cameraPanel.classList.add(
        "hidden"
    );

    winSound();

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "🎉 6 AM";

    if(currentNight < 5){

        const nextNight =
            currentNight + 1;

        if(nextNight > unlockedNight){

            unlockedNight =
                nextNight;

            localStorage.setItem(
                "atbNight",
                String(
                    unlockedNight
                )
            );
        }

        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! Відкрито Ніч " +
            nextNight +
            ".";

    }else{

        endText.textContent =
            "🏆 ТИ ПЕРЕЖИВ УСІ П'ЯТЬ НОЧЕЙ В АТБ!";
    }

    updateNightButtons();
}

/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(reason){

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "GAME OVER";

    endText.textContent =
        reason;
}

/* =========================================================
   RESTART
========================================================= */

restartBtn.onclick =
function(){

    startGame(
        currentNight
    );
};

/* =========================================================
   MENU BUTTON
========================================================= */

menuBtn.onclick =
function(){

    stopTimers();

    running = false;
    scareRunning = false;
    powerOutActive = false;

    jumpscare.classList.remove(
        "active"
    );

    game.classList.add(
        "hidden"
    );

    endScreen.classList.add(
        "hidden"
    );

    cameraPanel.classList.add(
        "hidden"
    );

    menu.classList.remove(
        "hidden"
    );
};

/* =========================================================
   TIMERS
========================================================= */

function startTimers(){

    /*
        POWER:
        кожні 100 мс
    */

    powerTimer =
        setInterval(
            updatePower,
            100
        );

    /*
        1 ГОДИНА:
        20 секунд

        12 AM -> 6 AM
        приблизно 2 хвилини
    */

    timeTimer =
        setInterval(
            advanceTime,
            20000
        );

    /*
        РУХ МОБІВ
    */

    enemyTimer =
        setInterval(
            moveEnemies,

            Math.max(
                2400,

                6200 -
                currentNight *
                500
            )
        );
}

/* =========================================================
   STOP TIMERS
========================================================= */

function stopTimers(){

    clearInterval(
        powerTimer
    );

    clearInterval(
        timeTimer
    );

    clearInterval(
        enemyTimer
    );

    clearTimeout(
        enemy1AttackTimer
    );

    clearTimeout(
        enemy2AttackTimer
    );

    clearTimeout(
        enemy3AttackTimer
    );

    powerTimer = null;
    timeTimer = null;
    enemyTimer = null;

    enemy1AttackTimer = null;
    enemy2AttackTimer = null;
    enemy3AttackTimer = null;
}

/* =========================================================
   КЛАВІАТУРА
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            !running ||
            powerOutActive
        ){
            return;
        }

        const key =
            event.key.toLowerCase();

        /*
            A = ЛІВЕ СВІТЛО
            D = ПРАВЕ СВІТЛО

            Q = ЛІВІ ДВЕРІ
            E = ПРАВІ ДВЕРІ

            C = КАМЕРИ
            ESC = ЗАКРИТИ КАМЕРИ
        */

        if(key === "a"){

            leftLightBtn.click();
        }

        if(key === "d"){

            rightLightBtn.click();
        }

        if(key === "q"){

            leftDoorBtn.click();
        }

        if(key === "e"){

            rightDoorBtn.click();
        }

        if(key === "c"){

            if(camerasOpen){

                closeCamera();

            }else{

                cameraBtn.click();
            }
        }

        if(
            event.key === "Escape" &&
            camerasOpen
        ){

            closeCamera();
        }
    }
);

/* =========================================================
   START
========================================================= */

updateNightButtons();

console.log(
    "П'ЯТЬ НОЧЕЙ В АТБ — FULL PNG OFFICE VERSION"
);

</script>
