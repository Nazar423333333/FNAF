<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>П'ЯТЬ НОЧЕЙ В АТБ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
    font-family:inherit;
}

/* =========================
   MENU
========================= */

.screen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:
        radial-gradient(circle,#222,#050505 65%,#000);
}

#menu{
    z-index:5000;
}

#nightMenu{
    z-index:5000;
}

.title{
    font-size:clamp(40px,7vw,90px);
    letter-spacing:4px;
    text-shadow:
        0 0 10px white,
        0 0 30px red,
        0 0 70px red;
}

.subtitle{
    margin-top:15px;
    color:#aaa;
    font-size:18px;
}

.menuBtn{
    min-width:280px;
    margin-top:20px;
    padding:16px 25px;
    border:1px solid #555;
    border-radius:12px;
    background:#151515;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.menuBtn:hover{
    background:#292929;
}

#playBtn{
    background:#0874ff;
}

.nightButtons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-top:25px;
}

.nightBtn{
    width:130px;
    height:100px;
    border:1px solid #555;
    border-radius:12px;
    background:#151515;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.nightBtn span{
    display:block;
    margin-top:8px;
    font-size:12px;
    color:#aaa;
}

.nightBtn:disabled{
    opacity:.3;
}

/* =========================
   GAME
========================= */

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

/* =========================
   OFFICE
========================= */

#office{
    position:absolute;
    inset:0;
    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(0,0,0,.02),
            rgba(0,0,0,.06)
        ),
        url("office.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-color:#050505;
}

/* =========================
   TOP
========================= */

#topbar{
    position:absolute;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:800;

    width:min(900px,94%);
    padding:14px 20px;

    display:flex;
    justify-content:space-between;

    background:rgba(0,0,0,.88);
    border:1px solid #555;
    border-radius:12px;

    font-size:18px;
    font-weight:bold;
}

#power.low{
    color:#ff3333;
}

#power.medium{
    color:#ffd93b;
}

/* =========================
   STATUS
========================= */

#statusBox{
    position:absolute;
    top:25%;
    left:50%;
    transform:translateX(-50%);
    z-index:550;

    width:min(600px,55%);
    padding:9px 14px;

    text-align:center;

    background:rgba(0,0,0,.72);
    border:1px solid #444;
    border-radius:9px;
}

/* =========================
   DOOR AREA
========================= */

.doorFrame{
    position:absolute;
    top:21%;
    width:11.5%;
    height:56%;
    overflow:hidden;
    z-index:200;
}

#leftDoorFrame{
    left:7.2%;
}

#rightDoorFrame{
    right:7.5%;
}

.doorLight{
    position:absolute;
    inset:0;
    z-index:5;
    opacity:0;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,220,.98),
            rgba(255,215,80,.68) 35%,
            rgba(255,170,20,.2) 68%,
            transparent 95%
        );
}

.doorFrame.lightOn .doorLight{
    opacity:1;
}

.doorEnemy{
    position:absolute;
    left:50%;
    top:52%;
    transform:translate(-50%,-50%);
    z-index:10;

    opacity:0;

    font-size:clamp(65px,7vw,115px);

    filter:
        drop-shadow(0 0 10px white)
        drop-shadow(0 0 25px red);
}

.doorEnemy.visible{
    opacity:1;
}

.door{
    position:absolute;
    inset:0;
    z-index:30;

    transform:translateY(-105%);
    transition:transform .35s;

    background:
        repeating-linear-gradient(
            0deg,
            #111 0 25px,
            #555 26px 29px,
            #222 30px 35px
        );

    border:2px solid #777;

    box-shadow:
        inset 0 0 30px black;
}

.door.closed{
    transform:translateY(0);
}

/* =========================
   LIGHT
========================= */

.lightEffect{
    position:absolute;
    top:0;
    width:35%;
    height:100%;
    opacity:0;
    z-index:100;
    pointer-events:none;
}

#leftLightEffect{
    left:0;
    background:
        radial-gradient(
            ellipse at left center,
            rgba(255,245,170,.38),
            transparent 70%
        );
}

#rightLightEffect{
    right:0;
    background:
        radial-gradient(
            ellipse at right center,
            rgba(255,245,170,.38),
            transparent 70%
        );
}

.lightEffect.on{
    opacity:1;
}

/* =========================
   BUTTONS
========================= */

.sideControls{
    position:absolute;
    top:47%;
    z-index:700;
    display:flex;
    flex-direction:column;
    gap:10px;
}

#leftControls{
    left:22%;
}

#rightControls{
    right:22%;
}

.controlBtn{
    width:170px;
    padding:13px 8px;
    border:1px solid #666;
    border-radius:10px;

    background:rgba(5,5,5,.92);
    color:white;

    font-weight:bold;
}

.controlBtn.lightActive{
    background:#ffd63a;
    color:#111;
    box-shadow:0 0 20px #ffd63a;
}

.controlBtn.doorActive{
    background:#a40000;
    box-shadow:0 0 20px red;
}

#cameraBtn{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:700;

    padding:15px 30px;
    border:0;
    border-radius:12px;

    background:#0874ff;
    color:white;

    font-size:17px;
    font-weight:bold;
}

#soundBtn{
    position:absolute;
    top:85px;
    left:20px;
    z-index:800;

    padding:9px 12px;

    border:1px solid #555;
    border-radius:8px;

    background:rgba(0,0,0,.85);
    color:white;
}

/* =========================================================
   📞 PHONE — ЗАВЖДИ ПОВЕРХ ГРИ
========================================================= */

#phone{
    position:fixed;
    top:85px;
    left:50%;
    transform:translateX(-50%);
    z-index:99990;

    width:min(590px,95vw);

    padding:18px;

    background:#050805;

    border:3px solid #42ff79;
    border-radius:18px;

    box-shadow:
        0 0 25px #42ff7966,
        0 0 80px black;
}

#phone.ringing{
    animation:ring .16s infinite alternate;
}

@keyframes ring{
    from{
        transform:
            translateX(-50%)
            rotate(-1deg);
    }

    to{
        transform:
            translateX(-50%)
            rotate(1deg);
    }
}

.phoneHeader{
    display:flex;
    gap:14px;
    align-items:center;
}

.phoneIcon{
    width:65px;
    height:65px;

    display:flex;
    justify-content:center;
    align-items:center;

    flex-shrink:0;

    background:#149b49;
    border-radius:50%;

    font-size:36px;

    box-shadow:0 0 20px #32ff70;
}

#callerName{
    font-size:21px;
    font-weight:900;
}

#phoneState{
    margin-top:5px;
    color:#74ff9a;
}

#phoneText{
    margin-top:14px;
    max-height:180px;
    overflow:auto;

    padding:12px;

    background:#090909;
    border:1px solid #333;
    border-radius:9px;

    white-space:pre-line;
    line-height:1.45;

    color:#ddd;
}

.phoneButtons{
    display:flex;
    gap:10px;
    margin-top:14px;
}

.phoneBtn{
    flex:1;
    padding:13px 6px;
    border:0;
    border-radius:9px;
    color:white;
    font-weight:bold;
}

#answerBtn{
    background:#159447;
}

#hangBtn{
    background:#a31313;
}

#skipBtn{
    background:#333;
}

/* =========================
   CAMERAS
========================= */

#cameraPanel{
    position:fixed;
    inset:0;
    z-index:3000;

    background:#020202;
    padding:18px;
}

.cameraHeader{
    height:55px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #444;
}

#closeCamera{
    padding:10px 15px;
    border:0;
    border-radius:8px;
    background:#a00;
    color:white;
    font-weight:bold;
}

#cameraView{
    position:relative;
    height:calc(100vh - 90px);
    margin-top:12px;

    overflow:hidden;

    border:3px solid #333;

    background:
        radial-gradient(
            circle,
            #3b4042,
            #111 65%,
            #000
        );
}

#cameraView::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:60;
    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0 3px,
            rgba(255,255,255,.06) 4px
        );
}

#cameraScene{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding-bottom:130px;

    font-size:clamp(25px,4vw,55px);
    opacity:.4;
}

.camEnemy{
    position:absolute;
    top:42%;
    font-size:130px;
    opacity:0;
    z-index:30;
}

.camEnemy.visible{
    opacity:1;
}

#camEnemy1{
    left:20%;
}

#camEnemy2{
    right:20%;
}

#camEnemy3{
    left:50%;
    transform:translateX(-50%);
}

#cameraInfo{
    position:absolute;
    left:20px;
    bottom:20px;
    z-index:100;

    padding:14px;

    background:rgba(0,0,0,.9);
    border:1px solid #555;
    border-radius:9px;
}

#cameraMap{
    position:absolute;
    right:20px;
    bottom:20px;
    z-index:100;

    width:290px;
    height:215px;

    background:rgba(0,0,0,.9);
    border:1px solid #555;
    border-radius:10px;
}

.camBtn{
    position:absolute;
    width:78px;
    padding:8px;

    background:#151515;
    color:white;

    border:1px solid #555;
    border-radius:6px;
}

.camBtn.active{
    background:#0874ff;
}

.camBtn[data-cam="0"]{
    top:18px;
    left:106px;
}

.camBtn[data-cam="1"]{
    top:65px;
    left:20px;
}

.camBtn[data-cam="2"]{
    top:65px;
    right:20px;
}

.camBtn[data-cam="3"]{
    top:115px;
    left:20px;
}

.camBtn[data-cam="4"]{
    top:115px;
    right:20px;
}

.camBtn[data-cam="5"]{
    bottom:12px;
    left:106px;
}

/* =========================
   JUMPSCARE
========================= */

#jumpscare{
    position:fixed;
    inset:0;
    z-index:100000;

    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle,
            #620000,
            #180000 45%,
            black
        );
}

#jumpscare.active{
    display:flex;
    animation:flash .08s infinite;
}

#jumpscareFace{
    font-size:min(50vw,480px);
    animation:zoom .5s forwards;
}

@keyframes zoom{
    from{transform:scale(.15);}
    to{transform:scale(1.25);}
}

@keyframes flash{
    0%{filter:brightness(.6);}
    50%{filter:brightness(2);}
    100%{filter:brightness(.8);}
}

/* =========================
   END
========================= */

#endScreen{
    position:fixed;
    inset:0;
    z-index:5000;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    text-align:center;
    background:#000;
}

#endTitle{
    font-size:clamp(55px,10vw,120px);
}

#endText{
    color:#aaa;
    margin-top:15px;
}

.endBtns{
    display:flex;
    gap:10px;
    margin-top:25px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    #topbar{
        top:5px;
        padding:9px;
        font-size:12px;
    }

    #soundBtn{
        top:57px;
        left:5px;
        font-size:10px;
    }

    #phone{
        top:53px;
        width:96vw;
        padding:11px;
    }

    .phoneIcon{
        width:43px;
        height:43px;
        font-size:25px;
    }

    #callerName{
        font-size:15px;
    }

    #phoneState{
        font-size:11px;
    }

    #phoneText{
        max-height:105px;
        font-size:12px;
    }

    .phoneBtn{
        padding:10px 4px;
        font-size:10px;
    }

    #statusBox{
        width:45%;
        font-size:11px;
    }

    .doorFrame{
        width:18%;
    }

    #leftDoorFrame{
        left:1%;
    }

    #rightDoorFrame{
        right:1%;
    }

    #leftControls{
        left:20%;
    }

    #rightControls{
        right:20%;
    }

    .controlBtn{
        width:102px;
        padding:9px 4px;
        font-size:10px;
    }

    #cameraBtn{
        bottom:8px;
        padding:11px 15px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<!-- MENU -->

<section id="menu" class="screen">

    <h1 class="title">
        П'ЯТЬ НОЧЕЙ В АТБ
    </h1>

    <div class="subtitle">
        Переживи п'ять нічних змін
    </div>

    <button id="playBtn" class="menuBtn">
        ▶ ГРАТИ
    </button>

    <button id="resetBtn" class="menuBtn">
        ♻ СКИНУТИ ПРОГРЕС
    </button>

</section>

<!-- NIGHT MENU -->

<section id="nightMenu" class="screen hidden">

    <h2 class="title">
        ОБЕРИ НІЧ
    </h2>

    <div class="subtitle">
        📞 На початку ночі дзвонить охоронець
    </div>

    <div class="nightButtons">

        <button class="nightBtn" data-night="1"></button>
        <button class="nightBtn" data-night="2"></button>
        <button class="nightBtn" data-night="3"></button>
        <button class="nightBtn" data-night="4"></button>
        <button class="nightBtn" data-night="5"></button>

    </div>

    <button id="backBtn" class="menuBtn">
        ← НАЗАД
    </button>

</section>

<!-- GAME -->

<section id="game" class="hidden">

    <div id="topbar">

        <div>
            🌙 Ніч <span id="night">1</span>
        </div>

        <div>
            🕛 <span id="clock">12 AM</span>
        </div>

        <div>
            ⚡ <span id="power">100</span>%
        </div>

    </div>

    <button id="soundBtn">
        🔊 ЗВУК
    </button>

    <main id="office">

        <div id="statusBox">
            <span id="status">
                Ніч почалася...
            </span>
        </div>

        <div
            id="leftLightEffect"
            class="lightEffect"
        ></div>

        <div
            id="rightLightEffect"
            class="lightEffect"
        ></div>

        <!-- LEFT DOOR -->

        <div
            id="leftDoorFrame"
            class="doorFrame"
        >

            <div class="doorLight"></div>

            <div
                id="leftDoorEnemy"
                class="doorEnemy"
            >
                👀
            </div>

            <div
                id="leftDoor"
                class="door"
            ></div>

        </div>

        <!-- RIGHT DOOR -->

        <div
            id="rightDoorFrame"
            class="doorFrame"
        >

            <div class="doorLight"></div>

            <div
                id="rightDoorEnemy"
                class="doorEnemy"
            >
                🐺
            </div>

            <div
                id="rightDoor"
                class="door"
            ></div>

        </div>

        <div
            id="leftControls"
            class="sideControls"
        >

            <button
                id="leftLightBtn"
                class="controlBtn"
            >
                💡 Ліве світло
            </button>

            <button
                id="leftDoorBtn"
                class="controlBtn"
            >
                🚪 Ліві двері
            </button>

        </div>

        <div
            id="rightControls"
            class="sideControls"
        >

            <button
                id="rightLightBtn"
                class="controlBtn"
            >
                💡 Праве світло
            </button>

            <button
                id="rightDoorBtn"
                class="controlBtn"
            >
                🚪 Праві двері
            </button>

        </div>

        <button id="cameraBtn">
            📹 ВІДКРИТИ КАМЕРИ
        </button>

    </main>

</section>

<!-- =====================================================
     PHONE
===================================================== -->

<div id="phone" class="hidden">

    <div class="phoneHeader">

        <div class="phoneIcon">
            📞
        </div>

        <div>

            <div id="callerName">
                ОХОРОНЕЦЬ АТБ
            </div>

            <div id="phoneState">
                📳 ВХІДНИЙ ДЗВІНОК
            </div>

        </div>

    </div>

    <div
        id="phoneText"
        class="hidden"
    ></div>

    <div class="phoneButtons">

        <button
            id="answerBtn"
            class="phoneBtn"
        >
            📞 ВІДПОВІСТИ
        </button>

        <button
            id="skipBtn"
            class="phoneBtn hidden"
        >
            ⏭ ПРОПУСТИТИ
        </button>

        <button
            id="hangBtn"
            class="phoneBtn"
        >
            ❌ СКИНУТИ
        </button>

    </div>

</div>

<!-- CAMERAS -->

<section id="cameraPanel" class="hidden">

    <div class="cameraHeader">

        <h2>
            🔴 SECURITY CAMERAS
        </h2>

        <button id="closeCamera">
            ✖ ЗАКРИТИ
        </button>

    </div>

    <div id="cameraView">

        <div id="cameraScene">
            CAM
        </div>

        <div
            id="camEnemy1"
            class="camEnemy"
        >
            👀
        </div>

        <div
            id="camEnemy2"
            class="camEnemy"
        >
            🐺
        </div>

        <div
            id="camEnemy3"
            class="camEnemy"
        >
            🦆
        </div>

        <div id="cameraInfo">

            <h2 id="cameraName">
                CAM 1
            </h2>

            <p id="cameraMessage">
                Нікого не видно...
            </p>

        </div>

        <div id="cameraMap">

            <button class="camBtn active" data-cam="0">
                CAM 1
            </button>

            <button class="camBtn" data-cam="1">
                CAM 2
            </button>

            <button class="camBtn" data-cam="2">
                CAM 3
            </button>

            <button class="camBtn" data-cam="3">
                CAM 4
            </button>

            <button class="camBtn" data-cam="4">
                CAM 5
            </button>

            <button class="camBtn" data-cam="5">
                CAM 6
            </button>

        </div>

    </div>

</section>

<!-- JUMPSCARE -->

<div id="jumpscare">

    <div id="jumpscareFace">
        👀
    </div>

    <h1>ААА!</h1>

</div>

<!-- END -->

<section id="endScreen" class="hidden">

    <h1 id="endTitle">
        GAME OVER
    </h1>

    <p id="endText"></p>

    <div class="endBtns">

        <button
            id="restartBtn"
            class="menuBtn"
        >
            🔄 ЩЕ РАЗ
        </button>

        <button
            id="menuBtn"
            class="menuBtn"
        >
            🏠 МЕНЮ
        </button>

    </div>

</section>

<script>
const $ = id => document.getElementById(id);

/* ==============================
   CONFIG
============================== */

const NIGHT_MINUTES = {
    1:6,
    2:9,
    3:12,
    4:16,
    5:20
};

const MOVE_TIME = {
    1:12000,
    2:10500,
    3:9000,
    4:8000,
    5:7000
};

const ATTACK_DELAY = {
    1:15000,
    2:14000,
    3:12000,
    4:10000,
    5:9000
};

/* ==============================
   PHONE TEXT
============================== */

const PHONE_TEXT = {

1:
`Алло! Привіт.

Вітаю на першій нічній зміні.

У тебе є камери, світло і двоє дверей.

Перевіряй камери.
Якщо хтось підійшов до офісу — увімкни світло.

Побачив когось біля дверей — закривай їх.

Але не залишай двері закритими постійно.
Вони витрачають енергію.

Тобі треба протриматися до шостої ранку.

Удачі, охоронцю.`,

2:
`Алло. Знову привіт.

Бачу, першу ніч ти пережив.

Сьогодні вони активніші.

Регулярно перевіряй камери та коридори.

Не витрачай світло і двері без потреби.

Удачі.`,

3:
`Привіт.

Це третя ніч.

Сьогодні будь уважнішим.

Якщо ворог зник із камери,
перевір обидва проходи.

Бережи енергію.

/* ==============================
   ELEMENTS
============================== */

const menu = $("menu");
const nightMenu = $("nightMenu");
const game = $("game");

const playBtn = $("playBtn");
const resetBtn = $("resetBtn");
const backBtn = $("backBtn");

const nightButtons =
    document.querySelectorAll(".nightBtn");

const nightLabel = $("night");
const clockLabel = $("clock");
const powerLabel = $("power");

const statusText = $("status");

const leftDoor = $("leftDoor");
const rightDoor = $("rightDoor");

const leftDoorFrame = $("leftDoorFrame");
const rightDoorFrame = $("rightDoorFrame");

const leftDoorEnemy = $("leftDoorEnemy");
const rightDoorEnemy = $("rightDoorEnemy");

const leftLightEffect = $("leftLightEffect");
const rightLightEffect = $("rightLightEffect");

const leftLightBtn = $("leftLightBtn");
const rightLightBtn = $("rightLightBtn");

const leftDoorBtn = $("leftDoorBtn");
const rightDoorBtn = $("rightDoorBtn");

const cameraBtn = $("cameraBtn");

const cameraPanel = $("cameraPanel");
const closeCamera = $("closeCamera");

const cameraButtons =
    document.querySelectorAll(".camBtn");

const cameraName = $("cameraName");
const cameraScene = $("cameraScene");
const cameraMessage = $("cameraMessage");

const camEnemy1 = $("camEnemy1");
const camEnemy2 = $("camEnemy2");
const camEnemy3 = $("camEnemy3");

const phone = $("phone");
const phoneState = $("phoneState");
const phoneText = $("phoneText");

const answerBtn = $("answerBtn");
const hangBtn = $("hangBtn");
const skipBtn = $("skipBtn");

const soundBtn = $("soundBtn");

const jumpscare = $("jumpscare");
const jumpscareFace = $("jumpscareFace");

const endScreen = $("endScreen");
const endTitle = $("endTitle");
const endText = $("endText");

const restartBtn = $("restartBtn");
const menuBtn = $("menuBtn");

/* ==============================
   VARIABLES
============================== */

let currentNight = 1;

let unlockedNight =
    Number(
        localStorage.getItem("atbNight") || 1
    );

let running = false;

let power = 100;
let hour = 0;

let leftDoorClosed = false;
let rightDoorClosed = false;

let leftLightOn = false;
let rightLightOn = false;

let camerasOpen = false;

let selectedCamera = 0;

let e1 = 0;
let e2 = 0;
let e3 = 0;

let duckSide = "left";

let powerTimer = null;
let clockTimer = null;
let enemyTimer = null;

let attack1 = null;
let attack2 = null;
let attack3 = null;

let soundEnabled = true;
let speaking = false;

/* ==============================
   ROUTES
============================== */

const route1 = [
    0,1,3,5,"left"
];

const route2 = [
    2,1,4,5,"right"
];

let route3 = [];

function createDuckRoute(){

    route3 =
        duckSide === "left"
        ? [0,2,3,5,"left"]
        : [0,2,4,5,"right"];
}

function position1(){
    return route1[e1];
}

function position2(){
    return route2[e2];
}

function position3(){
    return route3[e3];
}

/* ==============================
   MENU
============================== */

function updateNightButtons(){

    nightButtons.forEach(button=>{

        const n =
            Number(button.dataset.night);

        button.innerHTML =
            (
                n <= unlockedNight
                ? "🌙 "
                : "🔒 "
            ) +
            "Ніч " +
            n +
            "<span>" +
            NIGHT_MINUTES[n] +
            " хв</span>";

        button.disabled =
            n > unlockedNight;
    });
}

playBtn.onclick = ()=>{

    menu.classList.add("hidden");

    nightMenu.classList.remove("hidden");

    updateNightButtons();
};

backBtn.onclick = ()=>{

    nightMenu.classList.add("hidden");

    menu.classList.remove("hidden");
};

resetBtn.onclick = ()=>{

    unlockedNight = 1;

    localStorage.setItem(
        "atbNight",
        "1"
    );

    updateNightButtons();

    alert("Прогрес скинуто!");
};

nightButtons.forEach(button=>{

    button.onclick = ()=>{

        const n =
            Number(button.dataset.night);

        if(n <= unlockedNight){

            startGame(n);
        }
    };
});

/* ==============================
   NIGHT TIME
============================== */

function nightMs(){

    return (
        NIGHT_MINUTES[currentNight] *
        60 *
        1000
    );
}

function hourMs(){

    return nightMs() / 6;
}

/* ==============================
   START
============================== */

function startGame(n){

    stopTimers();

    stopSpeech();

    currentNight = n;

    running = true;

    power = 100;
    hour = 0;

    leftDoorClosed = false;
    rightDoorClosed = false;

    leftLightOn = false;
    rightLightOn = false;

    camerasOpen = false;

    selectedCamera = 0;

    e1 = 0;
    e2 = 0;
    e3 = 0;

    duckSide =
        Math.random() < .5
        ? "left"
        : "right";

    createDuckRoute();

    menu.classList.add("hidden");
    nightMenu.classList.add("hidden");

    game.classList.remove("hidden");
    cameraPanel.classList.add("hidden");
    endScreen.classList.add("hidden");

    jumpscare.classList.remove("active");

    nightLabel.textContent =
        currentNight;

    clockLabel.textContent =
        "12 AM";

    powerLabel.textContent =
        "100";

    resetOffice();

    renderCamera();

    startTimers();

    /*
       📞 ГОЛОВНЕ ВИПРАВЛЕННЯ:
       ДЗВІНОК ПОКАЗУЄМО ОДРАЗУ.
    */

    showPhoneCall();
}

/* ==============================
   📞 PHONE
============================== */

function showPhoneCall(){

    if(!running){
        return;
    }

    stopSpeech();

    phone.classList.remove("hidden");

    phone.classList.add("ringing");

    phoneState.textContent =
        "📳 ВХІДНИЙ ДЗВІНОК — НІЧ " +
        currentNight;

    phoneText.classList.add("hidden");

    phoneText.textContent = "";

    answerBtn.classList.remove("hidden");

    skipBtn.classList.add("hidden");

    statusText.textContent =
        "📞 ДЗВОНИТЬ ОХОРОНЕЦЬ АТБ!";
}

answerBtn.onclick = ()=>{

    phone.classList.remove("ringing");

    phoneState.textContent =
        "🟢 РОЗМОВА";

    phoneText.textContent =
        PHONE_TEXT[currentNight];

    phoneText.classList.remove("hidden");

    answerBtn.classList.add("hidden");

    skipBtn.classList.remove("hidden");

    speakPhone();
};

hangBtn.onclick = ()=>{
    closePhone();
};

skipBtn.onclick = ()=>{
    closePhone();
};

function speakPhone(){

    if(
        !("speechSynthesis" in window)
    ){

        phoneState.textContent =
            "🔇 Читай текст — голос недоступний";

        return;
    }

    stopSpeech();

    const utterance =
        new SpeechSynthesisUtterance(
            PHONE_TEXT[currentNight]
        );

    utterance.lang =
        "uk-UA";

    utterance.rate =
        .88;

    utterance.pitch =
        .82;

    utterance.volume =
        soundEnabled ? 1 : 0;

    const voices =
        speechSynthesis.getVoices();

    const ukrainian =
        voices.find(
            v =>
                v.lang
                .toLowerCase()
                .startsWith("uk")
        );

    if(ukrainian){
        utterance.voice = ukrainian;
    }

    speaking = true;

    utterance.onend = ()=>{

        speaking = false;

        phoneState.textContent =
            "✅ РОЗМОВУ ЗАВЕРШЕНО";

        setTimeout(
            closePhone,
            1200
        );
    };

    /*
       ЦЕ ЗАПУСКАЄТЬСЯ ПІСЛЯ
       НАТИСКАННЯ "ВІДПОВІСТИ",
       ТОМУ НА ТЕЛЕФОНІ НАДІЙНІШЕ.
    */

    speechSynthesis.speak(
        utterance
    );
}

function stopSpeech(){

    if(
        "speechSynthesis" in window
    ){

        speechSynthesis.cancel();
    }

    speaking = false;
}

function closePhone(){

    stopSpeech();

    phone.classList.add("hidden");

    phone.classList.remove("ringing");
}

/* ==============================
   SOUND
============================== */

soundBtn.onclick = ()=>{

    soundEnabled =
        !soundEnabled;

    soundBtn.textContent =
        soundEnabled
        ? "🔊 ЗВУК"
        : "🔇 БЕЗ ЗВУКУ";
};

/* ==============================
   OFFICE RESET
============================== */

function resetOffice(){

    leftDoor.classList.remove("closed");
    rightDoor.classList.remove("closed");

    leftDoorFrame.classList.remove("lightOn");
    rightDoorFrame.classList.remove("lightOn");

    leftLightEffect.classList.remove("on");
    rightLightEffect.classList.remove("on");

    leftLightBtn.classList.remove("lightActive");
    rightLightBtn.classList.remove("lightActive");

    leftDoorBtn.classList.remove("doorActive");
    rightDoorBtn.classList.remove("doorActive");

    leftDoorEnemy.classList.remove("visible");
    rightDoorEnemy.classList.remove("visible");
}

/* ==============================
   DOORS
============================== */

leftDoorBtn.onclick = ()=>{

    if(!running || power <= 0){
        return;
    }

    leftDoorClosed =
        !leftDoorClosed;

    leftDoor.classList.toggle(
        "closed",
        leftDoorClosed
    );

    leftDoorBtn.classList.toggle(
        "doorActive",
        leftDoorClosed
    );

    updateDoorEnemies();
};

rightDoorBtn.onclick = ()=>{

    if(!running || power <= 0){
        return;
    }

    rightDoorClosed =
        !rightDoorClosed;

    rightDoor.classList.toggle(
        "closed",
        rightDoorClosed
    );

    rightDoorBtn.classList.toggle(
        "doorActive",
        rightDoorClosed
    );

    updateDoorEnemies();
};

/* ==============================
   LIGHT
============================== */

leftLightBtn.onclick = ()=>{

    if(!running || power <= 0){
        return;
    }

    leftLightOn =
        !leftLightOn;

    leftDoorFrame.classList.toggle(
        "lightOn",
        leftLightOn
    );

    leftLightEffect.classList.toggle(
        "on",
        leftLightOn
    );

    leftLightBtn.classList.toggle(
        "lightActive",
        leftLightOn
    );

    updateDoorEnemies();
};

rightLightBtn.onclick = ()=>{

    if(!running || power <= 0){
        return;
    }

    rightLightOn =
        !rightLightOn;

    rightDoorFrame.classList.toggle(
        "lightOn",
        rightLightOn
    );

    rightLightEffect.classList.toggle(
        "on",
        rightLightOn
    );

    rightLightBtn.classList.toggle(
        "lightActive",
        rightLightOn
    );

    updateDoorEnemies();
};

/* ==============================
   ENEMY IN DOOR
============================== */

function updateDoorEnemies(){

    const p1 = position1();
    const p2 = position2();
    const p3 = position3();

    const leftEnemy =
        p1 === "left" ||
        p3 === "left";

    const rightEnemy =
        p2 === "right" ||
        p3 === "right";

    leftDoorEnemy.textContent =
        p3 === "left"
        ? "🦆"
        : "👀";

    rightDoorEnemy.textContent =
        p3 === "right"
        ? "🦆"
        : "🐺";

    leftDoorEnemy.classList.toggle(
        "visible",
        leftEnemy &&
        leftLightOn &&
        !leftDoorClosed
    );

    rightDoorEnemy.classList.toggle(
        "visible",
        rightEnemy &&
        rightLightOn &&
        !rightDoorClosed
    );

    if(
        leftLightOn &&
        leftEnemy &&
        !leftDoorClosed
    ){

        statusText.textContent =
            "🚨 МОБ У ЛІВИХ ДВЕРЯХ!";
    }

    if(
        rightLightOn &&
        rightEnemy &&
        !rightDoorClosed
    ){

        statusText.textContent =
            "🚨 МОБ У ПРАВИХ ДВЕРЯХ!";
    }
}

/* ==============================
   CAMERAS
============================== */

const CAMERA_NAMES = [
    "CAM 1 — Вхід",
    "CAM 2 — Торговий зал",
    "CAM 3 — Склад",
    "CAM 4 — Лівий коридор",
    "CAM 5 — Правий коридор",
    "CAM 6 — Біля офісу"
];

cameraBtn.onclick = ()=>{

    if(!running){
        return;
    }

    camerasOpen = true;

    cameraPanel.classList.remove(
        "hidden"
    );

    renderCamera();
};

closeCamera.onclick = ()=>{

    camerasOpen = false;

    cameraPanel.classList.add(
        "hidden"
    );
};

cameraButtons.forEach(button=>{

    button.onclick = ()=>{

        selectedCamera =
            Number(
                button.dataset.cam
            );

        renderCamera();
    };
});

function renderCamera(){

    cameraButtons.forEach(button=>{

        button.classList.toggle(
            "active",
            Number(
                button.dataset.cam
            ) === selectedCamera
        );
    });

    cameraName.textContent =
        CAMERA_NAMES[selectedCamera];

    cameraScene.textContent =
        CAMERA_NAMES[selectedCamera];

    camEnemy1.classList.remove("visible");
    camEnemy2.classList.remove("visible");
    camEnemy3.classList.remove("visible");

    let found = 0;

    if(position1() === selectedCamera){

        camEnemy1.classList.add("visible");
        found++;
    }

    if(position2() === selectedCamera){

        camEnemy2.classList.add("visible");
        found++;
    }

    if(position3() === selectedCamera){

        camEnemy3.classList.add("visible");
        found++;
    }

    cameraMessage.textContent =
        found
        ? "⚠️ ВОРОГ НА КАМЕРІ!"
        : "Нікого не видно...";
}

/* ==============================
   MOVE ENEMIES
============================== */

function moveEnemies(){

    if(!running){
        return;
    }

    const chance =
        .16 +
        currentNight * .04;

    if(
        Math.random() < chance &&
        e1 < route1.length - 1
    ){
        e1++;
    }

    if(
        Math.random() < chance &&
        e2 < route2.length - 1
    ){
        e2++;
    }

    if(
        Math.random() < chance * .75 &&
        e3 < route3.length - 1
    ){
        e3++;
    }

    updateDoorEnemies();

    checkAttacks();

    if(camerasOpen){
        renderCamera();
    }
}

/* ==============================
   ATTACK DELAY
============================== */

function checkAttacks(){

    if(
        position1() === "left" &&
        !attack1
    ){

        attack1 =
            setTimeout(()=>{

                attack1 = null;

                if(
                    running &&
                    position1() === "left"
                ){

                    attackEnemy(
                        "left",
                        "👀",
                        1
                    );
                }

            },ATTACK_DELAY[currentNight]);
    }

    if(
        position2() === "right" &&
        !attack2
    ){

        attack2 =
            setTimeout(()=>{

                attack2 = null;

                if(
                    running &&
                    position2() === "right"
                ){

                    attackEnemy(
                        "right",
                        "🐺",
                        2
                    );
                }

            },ATTACK_DELAY[currentNight]);
    }

    if(
        position3() === duckSide &&
        !attack3
    ){

        attack3 =
            setTimeout(()=>{

                attack3 = null;

                if(
                    running &&
                    position3() === duckSide
                ){

                    attackEnemy(
                        duckSide,
                        "🦆",
                        3
                    );
                }

            },ATTACK_DELAY[currentNight]);
    }
}

function attackEnemy(
    side,
    icon,
    number
){

    const closed =
        side === "left"
        ? leftDoorClosed
        : rightDoorClosed;

    if(closed){

        resetEnemy(number);

    }else{

        showJumpscare(
            icon,
            side
        );
    }
}

function resetEnemy(number){

    if(number === 1){
        e1 = 0;
    }

    if(number === 2){
        e2 = 0;
    }

    if(number === 3){

        e3 = 0;

        duckSide =
            Math.random() < .5
            ? "left"
            : "right";

        createDuckRoute();
    }

    updateDoorEnemies();
}

/* ==============================
   POWER
============================== */

function drainForNight(percent){

    return (
        percent /
        (nightMs() / 100)
    );
}

function updatePower(){

    if(!running){
        return;
    }

    let drain =
        drainForNight(40);

    if(leftDoorClosed){
        drain += drainForNight(34);
    }

    if(rightDoorClosed){
        drain += drainForNight(34);
    }

    if(leftLightOn){
        drain += drainForNight(21);
    }

    if(rightLightOn){
        drain += drainForNight(21);
    }

    if(camerasOpen){
        drain += drainForNight(20);
    }

    power -= drain;

    if(power <= 0){

        power = 0;

        powerLabel.textContent = "0";

        showJumpscare(
            "👀",
            "left"
        );

        return;
    }

    powerLabel.textContent =
        Math.floor(power);

    powerLabel.classList.remove(
        "low",
        "medium"
    );

    if(power <= 20){

        powerLabel.classList.add(
            "low"
        );

    }else if(power <= 40){

        powerLabel.classList.add(
            "medium"
        );
    }
}

/* ==============================
   CLOCK
============================== */

function advanceHour(){

    if(!running){
        return;
    }

    hour++;

    if(hour >= 6){

        hour = 6;

        clockLabel.textContent =
            "6 AM";

        winGame();

        return;
    }

    clockLabel.textContent =
        hour + " AM";
}

/* ==============================
   JUMPSCARE
============================== */

function showJumpscare(
    icon,
    side
){

    if(!running){
        return;
    }

    running = false;

    stopTimers();
    closePhone();

    cameraPanel.classList.add(
        "hidden"
    );

    jumpscareFace.textContent =
        icon;

    jumpscare.classList.add(
        "active"
    );

    setTimeout(()=>{

        jumpscare.classList.remove(
            "active"
        );

        showGameOver(
            side === "left"
            ? "Ти не закрив ліві двері."
            : "Ти не закрив праві двері."
        );

    },1200);
}

/* ==============================
   WIN
============================== */

function winGame(){

    running = false;

    stopTimers();
    closePhone();

    cameraPanel.classList.add(
        "hidden"
    );

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "🎉 6 AM";

    if(currentNight < 5){

        const next =
            currentNight + 1;

        if(next > unlockedNight){

            unlockedNight = next;

            localStorage.setItem(
                "atbNight",
                String(next)
            );
        }

        endText.textContent =
            "Ніч " +
            currentNight +
            " пройдена! Відкрито ніч " +
            next +
            ".";

    }else{

        endText.textContent =
            "🏆 ТИ ПРОЙШОВ УСІ 5 НОЧЕЙ!";
    }

    updateNightButtons();
}

function showGameOver(reason){

    endScreen.classList.remove(
        "hidden"
    );

    endTitle.textContent =
        "GAME OVER";

    endText.textContent =
        reason;
}

/* ==============================
   END BUTTONS
============================== */

restartBtn.onclick = ()=>{

    startGame(currentNight);
};

menuBtn.onclick = ()=>{

    running = false;

    stopTimers();
    closePhone();

    game.classList.add("hidden");

    endScreen.classList.add("hidden");

    menu.classList.remove("hidden");
};

/* ==============================
   TIMERS
============================== */

function startTimers(){

    powerTimer =
        setInterval(
            updatePower,
            100
        );

    clockTimer =
        setInterval(
            advanceHour,
            hourMs()
        );

    enemyTimer =
        setInterval(
            moveEnemies,
            MOVE_TIME[currentNight]
        );
}

function stopTimers(){

    clearInterval(powerTimer);
    clearInterval(clockTimer);
    clearInterval(enemyTimer);

    clearTimeout(attack1);
    clearTimeout(attack2);
    clearTimeout(attack3);

    powerTimer = null;
    clockTimer = null;
    enemyTimer = null;

    attack1 = null;
    attack2 = null;
    attack3 = null;
}

/* ==============================
   KEYBOARD
============================== */

document.addEventListener(
    "keydown",
    event=>{

        if(!running){
            return;
        }

        const key =
            event.key.toLowerCase();

        if(key === "a"){
            leftLightBtn.click();
        }

        if(key === "d"){
            rightLightBtn.click();
        }

        if(key === "q"){
            leftDoorBtn.click();
        }

        if(key === "e"){
            rightDoorBtn.click();
        }

        if(key === "c"){

            if(camerasOpen){
                closeCamera.click();
            }else{
                cameraBtn.click();
            }
        }

        if(event.key === "Escape"){

            cameraPanel.classList.add(
                "hidden"
            );

            camerasOpen = false;
        }
    }
);

/* ==============================
   INIT
============================== */

updateNightButtons();

console.log(
    "П'ЯТЬ НОЧЕЙ В АТБ — PHONE FIX 3"
);
</script>
